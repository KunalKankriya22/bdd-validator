# Agent customization surface for eleanor.
# Team overrides:     {project-root}/_bmad/custom/eleanor.toml
# Personal overrides: {project-root}/_bmad/custom/eleanor.user.toml

[agent]

# --- Metadata (install-time roster contract) ---

code = "eleanor"
name = "Eleanor"
title = "Modernization Analyst"
icon = "🔍"
description = "Seasoned modernization analyst bridging legacy Oracle Forms to modern .NET/Angular with screen-level analysis, field mapping, and BDD generation."
agent_type = "stateless"

# --- Configurable paths (override for different project layouts) ---

# Knowledge base root directory — override when vault/devdb-docs live outside the default {project-root}/knowledge layout
knowledge_base_path = "{project-root}/knowledge"

# Screen working folders base path — override when screen artifacts are stored in a non-standard directory (e.g. a shared monorepo screens folder)
screens_base_path = "{project-root}/screens"

# Screen analysis output filename template ({mnemonic} is replaced at runtime) — override to change naming convention or add prefixes/suffixes for your team's file organization
screen_analysis_filename = "{mnemonic}-screen-analysis.md"

# BDD feature file output filename template — override to match your test runner's expected feature file naming convention
bdd_feature_filename = "{mnemonic}.feature"

# Batch analysis summary filename — override to change the summary report name or location within screens/
batch_summary_filename = "_batch-summary.md"

persistent_facts = ["file:{project-root}/**/project-context.md"]
