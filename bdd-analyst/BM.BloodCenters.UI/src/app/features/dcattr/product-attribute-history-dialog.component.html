<div class="history-dialog-container" [attr.aria-labelledby]="elementId('title')">
  <!-- Dialog Header -->
  <div class="dialog-header">
    <h2 [id]="elementId('title')" mat-dialog-title>Product History</h2>
    <button
      mat-icon-button
      [mat-dialog-close]="null"
      [id]="elementId('close-btn')"
      aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Dialog Content -->
  <mat-dialog-content>
    @if (loading()) {
      <div class="loading-container" role="status" aria-live="polite" aria-busy="true">
        <mat-spinner diameter="40" aria-label="Loading"></mat-spinner>
        <span>Loading attribute history...</span>
      </div>
    } @else if (error()) {
      <div class="error-container" role="alert" aria-live="assertive">
        <mat-icon>error</mat-icon>
        <p>{{ error() }}</p>
      </div>
    } @else {
      <div class="table-scroll-container">
        <app-data-table
          [config]="tableConfig"
          [data]="historyData"
          aria-label="Product attribute history" />
      </div>
    }
  </mat-dialog-content>

  <!-- Dialog Actions -->
  <mat-dialog-actions align="end">
    <button
      mat-stroked-button
      color="primary"
      [mat-dialog-close]="null"
      [id]="elementId('cancel-btn')">
      Close
    </button>
  </mat-dialog-actions>
</div>
