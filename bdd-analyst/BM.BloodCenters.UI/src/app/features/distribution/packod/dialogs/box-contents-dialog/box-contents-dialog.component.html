<div class="box-contents-dialog">

  <div class="dialog-header">
    <h2 mat-dialog-title>View Box Contents</h2>
    <button mat-icon-button (click)="onClose()" class="header-close-btn" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="dialog-content">
    @if (products().length === 0) {
      <div class="empty-state" role="status">
        <mat-icon aria-hidden="true">inbox</mat-icon>
        <p>No products in this box</p>
      </div>
    } @else {
      <div class="table-container">
        <table mat-table [dataSource]="products()" class="products-table">

          <ng-container matColumnDef="unitId">
            <th mat-header-cell *matHeaderCellDef class="col-sep">
              <span class="header-content">
                Unit ID ({{ products().length }})
                <mat-icon class="sort-icon">arrow_downward</mat-icon>
              </span>
            </th>
            <td mat-cell *matCellDef="let p">{{ p.unitId }}</td>
          </ng-container>

          <ng-container matColumnDef="expDate">
            <th mat-header-cell *matHeaderCellDef class="col-sep">Expiration Date</th>
            <td mat-cell *matCellDef="let p">{{ formatDateTime(p.expDate) }}</td>
          </ng-container>

          <ng-container matColumnDef="productType">
            <th mat-header-cell *matHeaderCellDef class="col-sep">Product Type</th>
            <td mat-cell *matCellDef="let p">{{ p.productType }}</td>
          </ng-container>

          <ng-container matColumnDef="productCode">
            <th mat-header-cell *matHeaderCellDef class="col-sep">Product Code</th>
            <td mat-cell *matCellDef="let p">{{ p.productCode }}</td>
          </ng-container>

          <ng-container matColumnDef="aboDesc">
            <th mat-header-cell *matHeaderCellDef>ABORh</th>
            <td mat-cell *matCellDef="let p">{{ p.aboDesc }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>
      </div>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-stroked-button (click)="onClose()" class="close-btn">
      CLOSE
    </button>
  </mat-dialog-actions>

</div>
