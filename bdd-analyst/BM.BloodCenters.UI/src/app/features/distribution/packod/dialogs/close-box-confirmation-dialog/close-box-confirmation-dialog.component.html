<div class="close-box-dialog">
  <h2 mat-dialog-title>Close Box</h2>

  <mat-dialog-content class="dialog-content">

    <!-- Close Current Box? -->
    <div class="question-group">
      <p class="question-label">Close Current Box?</p>
      <mat-radio-group [(ngModel)]="closeCurrentBox" class="radio-group" aria-label="Close current box">
        <mat-radio-button [value]="true">Yes</mat-radio-button>
        <mat-radio-button [value]="false">No</mat-radio-button>
      </mat-radio-group>
    </div>

    <!-- All products properly packed? -->
    <div class="question-group">
      <p class="question-label">All products properly packed?</p>
      <mat-radio-group [(ngModel)]="allProductsPacked" class="radio-group" aria-label="All products properly packed">
        <mat-radio-button [value]="true">Yes</mat-radio-button>
        <mat-radio-button [value]="false">No</mat-radio-button>
      </mat-radio-group>
    </div>

  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-stroked-button color="primary" (click)="onCancel()" class="cancel-btn">
      CANCEL
    </button>
    <button mat-raised-button color="primary" (click)="onConfirm()"
      [disabled]="!canConfirm"
      class="confirm-btn">
      CLOSE BOX
    </button>
  </mat-dialog-actions>
</div>
