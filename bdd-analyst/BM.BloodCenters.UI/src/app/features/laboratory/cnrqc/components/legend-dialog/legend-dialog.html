<div class="legend-dialog-container">
  <h2 mat-dialog-title id="legend-dialog-title">Legend for Collection Days</h2>

  <mat-dialog-content>
    <table
      class="legend-table"
      role="table"
      aria-labelledby="legend-dialog-title">
      <thead>
        <tr role="row">
          <th role="columnheader" scope="col">Code</th>
          <th role="columnheader" scope="col">Description</th>
        </tr>
      </thead>
      <tbody>
        @for (entry of legendEntries; track entry.color) {
          <tr role="row" [class]="entry.cssClass">
            <td role="cell">{{ entry.color }}</td>
            <td role="cell">{{ entry.description }}</td>
          </tr>
        }
      </tbody>
    </table>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-raised-button
      color="primary"
      [mat-dialog-close]="true"
      cdkFocusInitial>
      GOT IT
    </button>
  </mat-dialog-actions>
</div>
