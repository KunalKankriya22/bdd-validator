<app-filter-panel-base
  [title]="'Filters'"
  [width]="380"
  [applyDisabled]="isApplyDisabled"
  [clearDisabled]="isClearDisabled"
  (apply)="onApply()"
  (clear)="onClearAll()"
  (close)="onClose()">

  <form [formGroup]="filterForm" class="filter-form" aria-label="Filter options form">

    <!-- Anticoagulant Code -->
    <mat-form-field appearance="fill">
      <mat-label>Anticoagulant Code</mat-label>
      <mat-select
        formControlName="anticoagulantCode"
        aria-label="Filter by anticoagulant code"
        (selectionChange)="blurField()">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="anticoagulantSearchControl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No matches found"
            aria-label="Search anticoagulant codes">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option
          *ngFor="let option of filteredAnticoagulantOptions"
          [value]="option.code">
          {{ option.code }} - {{ option.description }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Product Type -->
    <mat-form-field appearance="fill">
      <mat-label>Product Type</mat-label>
      <mat-select
        formControlName="productType"
        aria-label="Filter by product type"
        (selectionChange)="blurField()">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="productTypeSearchControl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No matches found"
            aria-label="Search product types">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option
          *ngFor="let option of filteredProductTypeOptions"
          [value]="option.code">
          {{ option.code }} - {{ option.description }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Attribute -->
    <mat-form-field appearance="fill">
      <mat-label>Attribute</mat-label>
      <mat-select
        formControlName="attribute"
        aria-label="Filter by attribute"
        (selectionChange)="blurField()">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="attributeSearchControl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No matches found"
            aria-label="Search attributes">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option
          *ngFor="let option of filteredAttributeOptions"
          [value]="option.code">
          {{ option.code }} - {{ option.description }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Effective Date Row -->
    <div class="filter-panel__date-row" role="group" aria-label="Effective date filter">
      <mat-form-field appearance="fill" class="filter-panel__period-field">
        <mat-label [ngStyle]="{ color: getEffectiveDatePeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
        <mat-select formControlName="effectiveDatePeriod" (selectionChange)="blurField()">
          <mat-option *ngFor="let period of periodOptions" [value]="period">
            {{ period }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="getEffectiveDatePeriodError() as error">
          {{ error }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="filter-panel__date-field">
        <mat-label>Effective Date</mat-label>
        <input
          matInput
          [matDatepicker]="effectivePicker"
          formControlName="effectiveDate"
          (input)="onEffectiveDateInput($event)"
          (blur)="onEffectiveDateBlur()"
          (dateChange)="onEffectiveDateChange()"
          (keydown.enter)="$event.target.blur()"
          aria-label="Select effective date">
        <mat-datepicker-toggle matIconSuffix [for]="effectivePicker"></mat-datepicker-toggle>
        <mat-datepicker #effectivePicker></mat-datepicker>
        <mat-error *ngIf="getEffectiveDateError() as error">
          {{ error }}
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Termination Date Row -->
    <div class="filter-panel__date-row" role="group" aria-label="Termination date filter">
      <mat-form-field appearance="fill" class="filter-panel__period-field">
        <mat-label [ngStyle]="{ color: getTerminationDatePeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
        <mat-select formControlName="terminationDatePeriod" (selectionChange)="blurField()">
          <mat-option *ngFor="let period of periodOptions" [value]="period">
            {{ period }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="getTerminationDatePeriodError() as error">
          {{ error }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="filter-panel__date-field">
        <mat-label>Termination Date</mat-label>
        <input
          matInput
          [matDatepicker]="terminationPicker"
          formControlName="terminationDate"
          (input)="onTerminationDateInput($event)"
          (blur)="onTerminationDateBlur()"
          (dateChange)="onTerminationDateChange()"
          (keydown.enter)="$event.target.blur()"
          aria-label="Select termination date">
        <mat-datepicker-toggle matIconSuffix [for]="terminationPicker"></mat-datepicker-toggle>
        <mat-datepicker #terminationPicker></mat-datepicker>
        <mat-error *ngIf="getTerminationDateError() as error">
          {{ error }}
        </mat-error>
      </mat-form-field>
    </div>

  </form>

</app-filter-panel-base>
