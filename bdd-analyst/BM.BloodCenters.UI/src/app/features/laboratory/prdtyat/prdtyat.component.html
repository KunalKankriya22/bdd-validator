<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="prdtyat main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Product Type Attributes content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="prdtyat__card" #tableCard>

      <!-- Table Controls with Inline Filter Chips -->
      <div class="prdtyat__controls">
        <!-- Left section: Filter button and chips -->
        <div class="prdtyat__controls-left">
          <button
            #filterBtn
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            aria-label="Open filter options"
            (click)="openFilter()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips
            *ngIf="hasActiveFilters()"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right section: Search bar -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)" />
      </div>

      <!-- Error State -->
      <div
        *ngIf="hasError && !isLoading"
        class="prdtyat__error"
        role="status"
        aria-label="No data available">
        <mat-icon class="empty-icon" aria-hidden="true">inbox</mat-icon>
        <p class="error-message">{{ errorMessage }}</p>
      </div>

      <!-- Data Table -->
      <div class="prdtyat__table-wrapper">
        <app-data-table
          *ngIf="!hasError"
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          [highlightedRow]="sidePanelMode === 'edit' ? sidePanelData : null"
          (pageChange)="onPageChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-prdtyat-drawer
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      [existingRecords]="dataSource"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess($event)"
      (modeChange)="onModeChange($event)">
    </app-prdtyat-drawer>
  </div>

</div>
