<div class="legend-dialog-container" [attr.aria-labelledby]="componentId + '-title'">
  <div class="dialog-header">
    <h2 mat-dialog-title [id]="componentId + '-title'">Legend for Collection Days</h2>
    <button
      mat-icon-button
      class="close-button"
      (click)="onClose()"
      [attr.aria-label]="'Close legend dialog'">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <table class="legend-table" role="table" [attr.aria-label]="'Collection date color coding legend'">
      <thead>
        <tr role="row">
          <th role="columnheader" scope="col">Code</th>
          <th role="columnheader" scope="col">Description</th>
        </tr>
      </thead>
      <tbody>
        @for (item of legendItems; track item.code) {
          <tr role="row" [ngClass]="getColorClass(item.code)">
            <td role="cell">{{ item.code }}</td>
            <td role="cell">{{ item.description }}</td>
          </tr>
        }
      </tbody>
    </table>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-raised-button
      color="primary"
      (click)="onClose()"
      [id]="componentId + '-close-btn'">
      GOT IT
    </button>
  </mat-dialog-actions>
</div>
