<div class="antigen-filter-panel" role="dialog" aria-modal="true" aria-labelledby="antigen-filter-dialog-title">
  <div class="panel-header">
    <h3 id="antigen-filter-dialog-title">Antigen Filter</h3>
    <button mat-icon-button (click)="onCancel()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="panel-content">
    <form [formGroup]="filterForm">
      <div formArrayName="criteria" class="criteria-list">
        @for (control of criteriaArray.controls; track $index; let i = $index) {
          <div [formGroupName]="i" class="criteria-row">
            <mat-form-field appearance="fill" class="antigen-field">
              <mat-label>Antigen</mat-label>
              <mat-select formControlName="antigenId">
                <mat-option>
                  <ngx-mat-select-search
                    [formControl]="antigenSearchCtrl"
                    placeholderLabel="Search antigen..."
                    noEntriesFoundLabel="No antigens found">
                  </ngx-mat-select-search>
                </mat-option>
                @for (antigen of filteredAntigens(); track antigen.testId) {
                  <mat-option [value]="antigen.testId">
                    {{ antigen.testId }} - {{ antigen.testDescription }}
                  </mat-option>
                }
              </mat-select>
            </mat-form-field>

            <mat-form-field appearance="fill" class="result-field">
              <mat-label>Result</mat-label>
              <mat-select formControlName="result">
                <mat-option>
                  <ngx-mat-select-search
                    [formControl]="resultSearchCtrl"
                    placeholderLabel="Search result..."
                    noEntriesFoundLabel="No results found">
                  </ngx-mat-select-search>
                </mat-option>
                @for (result of filteredResults(); track result.value) {
                  <mat-option [value]="result.value">
                    {{ result.label }}
                  </mat-option>
                }
              </mat-select>
            </mat-form-field>
          </div>
        }
      </div>
    </form>
  </div>

  <div class="panel-actions">
    <button type="button" class="btn-cancel" (click)="onCancel()">CANCEL</button>
    <button type="button" class="btn-select" (click)="onSelectAndRetrieve()">SELECT & RETRIEVE</button>
  </div>
</div>
