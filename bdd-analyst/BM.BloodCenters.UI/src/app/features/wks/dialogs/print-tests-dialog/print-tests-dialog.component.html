<div class="dialog-container" role="dialog" [attr.aria-labelledby]="elementId('title')">
  <div class="dialog-header">
    <h2 [id]="elementId('title')" mat-dialog-title>Print Tests</h2>
    <button
      mat-icon-button
      mat-dialog-close
      [id]="elementId('close-btn')"
      aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <div class="search-container">
      <mat-form-field appearance="outline" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <input
          matInput
          [formControl]="searchControl"
          [id]="elementId('search-input')"
          placeholder="Search by column 1, Column 2 etc"
          aria-label="Search tests by Test ID, Description, or Test Kit" />
      </mat-form-field>
    </div>

    <div class="table-container">
      @if (isEmpty()) {
        <div class="empty-state" role="status">
          <mat-icon aria-hidden="true">search_off</mat-icon>
          <p>No tests match your search.</p>
        </div>
      } @else {
        <table
          mat-table
          [dataSource]="filteredTests()"
          class="tests-table"
          [attr.aria-label]="'Tests available for printing'">
          <!-- Checkbox Column -->
          <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef>
              <mat-checkbox
                (change)="$event ? toggleAllRows() : null"
                [checked]="selection.hasValue() && isAllSelected()"
                [indeterminate]="selection.hasValue() && !isAllSelected()"
                [aria-label]="checkboxLabel()"
                color="primary">
              </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let row">
              <mat-checkbox
                (click)="$event.stopPropagation()"
                (change)="$event ? selection.toggle(row) : null"
                [checked]="selection.isSelected(row)"
                [aria-label]="checkboxLabel(row)"
                color="primary">
              </mat-checkbox>
            </td>
          </ng-container>

          <!-- Test ID Column -->
          <ng-container matColumnDef="testId">
            <th mat-header-cell *matHeaderCellDef>Test ID</th>
            <td mat-cell *matCellDef="let row">{{ row.testId }}</td>
          </ng-container>

          <!-- Description Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Description</th>
            <td mat-cell *matCellDef="let row">{{ row.description }}</td>
          </ng-container>

          <!-- Test Kit Column -->
          <ng-container matColumnDef="testKit">
            <th mat-header-cell *matHeaderCellDef>Test Kit</th>
            <td mat-cell *matCellDef="let row">{{ row.testKit }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr
            mat-row
            *matRowDef="let row; columns: displayedColumns"
            (click)="selection.toggle(row)"
            [class.selected]="selection.isSelected(row)"></tr>
        </table>
      }
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-button
      (click)="onCancel()"
      [id]="elementId('cancel-btn')"
      type="button">
      CANCEL
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="onPrint()"
      [id]="elementId('print-btn')"
      [disabled]="!hasSelection()"
      type="button">
      PRINT
    </button>
  </mat-dialog-actions>
</div>
