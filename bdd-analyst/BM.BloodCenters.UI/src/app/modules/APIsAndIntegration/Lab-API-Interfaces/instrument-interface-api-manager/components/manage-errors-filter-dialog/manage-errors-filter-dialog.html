<div class="filter-container" role="dialog" aria-modal="true" aria-labelledby="filter-dialog-title">
  <!-- Header -->
  <div class="filter-header">
    <span class="title" id="filter-dialog-title">Filters</span>
    <button mat-icon-button class="close-btn" (click)="close()" aria-label="Close filter dialog">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="filter-body">
    <!-- Machine Test ID -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Machine Test ID</mat-label>
      <mat-select [(ngModel)]="machineTestId">
        @for (testId of data.machineTestIds; track testId) {
          <mat-option [value]="testId">{{ testId }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Effective Date -->
    <div class="date-row" role="group" aria-label="Effective date filter">
      <mat-form-field appearance="fill">
        <mat-label>Period</mat-label>
        <mat-select [(ngModel)]="effDatePeriod">
          <mat-option value="after">After</mat-option>
          <mat-option value="before">Before</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Effective Date</mat-label>
        <input matInput [(ngModel)]="effDate" [matDatepicker]="effDatePicker" [min]="minDate" aria-label="Effective date" />
        <mat-datepicker-toggle matSuffix [for]="effDatePicker" aria-label="Open effective date picker"></mat-datepicker-toggle>
        <mat-datepicker #effDatePicker></mat-datepicker>
      </mat-form-field>
    </div>

    <!-- Termination Date -->
    <div class="date-row" role="group" aria-label="Termination date filter">
      <mat-form-field appearance="fill">
        <mat-label>Period</mat-label>
        <mat-select [(ngModel)]="termDatePeriod">
          <mat-option value="after">After</mat-option>
          <mat-option value="before">Before</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Termination Date</mat-label>
        <input matInput [(ngModel)]="termDate" [matDatepicker]="termDatePicker" [min]="minDate" aria-label="Termination date" />
        <mat-datepicker-toggle matSuffix [for]="termDatePicker" aria-label="Open termination date picker"></mat-datepicker-toggle>
        <mat-datepicker #termDatePicker></mat-datepicker>
      </mat-form-field>
    </div>

    @if (dateInvalid) {
      <mat-error role="alert">Period & date required</mat-error>
    }
  </div>

  <!-- Footer -->
  <div class="filter-footer">
    <button mat-stroked-button class="clear-btn" (click)="clearAll()" aria-label="Clear all filters">CLEAR ALL</button>
    <button mat-raised-button class="apply-btn" (click)="apply()" aria-label="Apply filters">APPLY</button>
  </div>
</div>
