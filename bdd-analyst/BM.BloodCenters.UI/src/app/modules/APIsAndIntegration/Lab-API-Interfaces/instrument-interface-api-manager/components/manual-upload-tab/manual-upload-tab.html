<div class="manual-upload-tab">
  <div class="upload-container">
    <mat-form-field appearance="fill" class="file-field">
      <mat-label>File ID</mat-label>
      <mat-select
        #fileSelect
        [(ngModel)]="selectedFileId"
        [disabled]="uploading() || loading()"
        aria-label="Select File ID">
        @if (loading()) {
          <mat-option disabled>Loading...</mat-option>
        } @else if (fileIds().length === 0) {
          <mat-option disabled>No pending files available</mat-option>
        } @else {
          @for (fileId of fileIds(); track fileId) {
            <mat-option [value]="fileId">{{ fileId }}</mat-option>
          }
        }
      </mat-select>
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      (click)="onUpload()"
      [disabled]="!selectedFileId() || uploading() || loading()"
      class="upload-button"
      aria-label="Upload file">
      @if (uploading()) {
        <mat-spinner diameter="20" class="button-spinner" aria-label="Uploading file"></mat-spinner>
        UPLOADING...
      } @else {
        UPLOAD
      }
    </button>
  </div>

  @if (uploading()) {
    <div class="info-banner" role="status">
      <mat-icon class="info-icon" aria-hidden="true">info</mat-icon>
      <span>Upload is in progress...</span>
    </div>
  }

  @if (errorMessage()) {
    <div class="error-banner" role="alert">
      <div class="error-content">
        <mat-icon class="error-icon" aria-hidden="true">warning</mat-icon>
        <div class="error-text">
          <div class="error-title">{{ errorTitle() }}</div>
          <div class="error-detail">{{ errorMessage() }}</div>
        </div>
      </div>
      <button
        mat-icon-button
        class="close-button"
        (click)="clearError()"
        aria-label="Close error message">
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </div>
  }
</div>
