<div class="filter-container" role="dialog" aria-modal="true" aria-labelledby="filter-dialog-title">
  <!-- Header -->
  <div class="filter-header">
    <span class="title" id="filter-dialog-title">Filters</span>
    <button mat-icon-button class="close-btn" (click)="close()" aria-label="Close filter dialog">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="filter-body">
    <!-- File ID -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>File ID</mat-label>
      @if (loadingFileIds) {
        <mat-select [(ngModel)]="fileId" [disabled]="true">
          <mat-option [value]="null">Loading...</mat-option>
        </mat-select>
        <mat-spinner matSuffix diameter="20" aria-label="Loading file IDs"></mat-spinner>
      } @else {
        <mat-select [(ngModel)]="fileId" [disabled]="loadingFileIds">
          @for (option of fileIdOptions; track option) {
            <mat-option [value]="option">{{ option }}</mat-option>
          }
        </mat-select>
      }
    </mat-form-field>
  </div>

  <!-- Footer -->
  <div class="filter-footer">
    <button mat-stroked-button class="clear-btn" (click)="clearAll()" aria-label="Clear all filters">CLEAR ALL</button>
    <button mat-raised-button class="apply-btn" (click)="apply()" aria-label="Apply filters">APPLY</button>
  </div>
</div>
