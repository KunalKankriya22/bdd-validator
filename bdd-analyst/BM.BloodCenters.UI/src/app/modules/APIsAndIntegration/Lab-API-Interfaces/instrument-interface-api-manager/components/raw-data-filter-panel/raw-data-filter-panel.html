<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- File ID -->
    <mat-form-field appearance="fill">
      <mat-label>File ID</mat-label>
      @if (loadingFileIds) {
        <mat-select formControlName="fileId" [disabled]="true">
          <mat-option [value]="null">Loading...</mat-option>
        </mat-select>
        <mat-spinner matSuffix diameter="20"></mat-spinner>
      } @else {
        <mat-select formControlName="fileId">
          <mat-option>
            <ngx-mat-select-search
              [formControl]="fileIdSearchControl"
              placeholderLabel="Search File ID..."
              noEntriesFoundLabel="No matching File IDs"
              [enableClearOnEscapePressed]="true"
              [attr.aria-label]="'Search file IDs'">
            </ngx-mat-select-search>
          </mat-option>
          @for (option of filteredFileIdOptions; track option) {
            <mat-option [value]="option">{{ option }}</mat-option>
          }
        </mat-select>
      }
    </mat-form-field>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()" aria-label="Clear all filters">
      CLEAR ALL
    </button>
    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="!hasChanges || !hasActiveFilters" aria-label="Apply filters">
      APPLY
    </button>
  </footer>

</section>
