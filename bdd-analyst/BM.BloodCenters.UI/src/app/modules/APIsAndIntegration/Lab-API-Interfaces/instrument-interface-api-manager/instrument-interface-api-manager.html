<app-page-header-with-breadcrumb [config]="pageHeaderConfig" />

<div class="instrument-interface-container">
  <!-- Filter Section -->
  <div class="filter-section">
      <mat-form-field appearance="fill" class="filter-field">
        <mat-label>Chapter ID <span class="required" aria-hidden="true">*</span></mat-label>
        <mat-select
          [ngModel]="selectedChapterId()"
          (ngModelChange)="onChapterChange($event)"
          [disabled]="loading()"
          [attr.aria-required]="true">
          <!-- Search Component -->
          <mat-option>
            <ngx-mat-select-search
              [formControl]="chapterIdSearchControl"
              placeholderLabel="Search..."
              noEntriesFoundLabel="No results found"
              [attr.aria-label]="'Search chapters'">
            </ngx-mat-select-search>
          </mat-option>
          <!-- Options -->
          @for (chapter of filteredChapters(); track chapter.id) {
            <mat-option [value]="chapter.id">{{ chapter.id }} - {{ chapter.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="filter-field">
        <mat-label>Instrument ID <span class="required" aria-hidden="true">*</span></mat-label>
        <mat-select
          [ngModel]="selectedInstrumentId()"
          (ngModelChange)="onInstrumentChange($event)"
          [disabled]="loading()"
          [attr.aria-required]="true">
          <!-- Search Component -->
          <mat-option>
            <ngx-mat-select-search
              [formControl]="instrumentIdSearchControl"
              placeholderLabel="Search..."
              noEntriesFoundLabel="No results found"
              [attr.aria-label]="'Search instruments'">
            </ngx-mat-select-search>
          </mat-option>
          <!-- Options -->
          @for (instrument of filteredInstruments(); track instrument.id) {
            <mat-option [value]="instrument.id">{{ instrument.id }} - {{ instrument.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <button
        mat-stroked-button
        class="retrieve-btn"
        (click)="onRetrieve()"
        [disabled]="!isRetrieveEnabled() || loading()"
        aria-label="Retrieve instrument data">
        RETRIEVE
      </button>
    </div>

    <!-- Tabs Section -->
    <mat-tab-group
      [selectedIndex]="activeTabIndex()"
      (selectedIndexChange)="activeTabIndex.set($event)"
      animationDuration="300ms"
      class="instrument-tabs">
      <mat-tab label="Raw Data">
        <app-raw-data-tab
          [chapterId]="selectedChapterId()"
          [instrumentId]="selectedInstrumentId()" />
      </mat-tab>

      <mat-tab label="Upload Status">
        <app-upload-status-tab
          [chapterId]="selectedChapterId()"
          [instrumentId]="selectedInstrumentId()" />
      </mat-tab>

      <mat-tab label="Manual Upload">
        <app-manual-upload-tab
          [chapterId]="selectedChapterId()"
          [instrumentId]="selectedInstrumentId()" />
      </mat-tab>

      <mat-tab label="View Log & Print">
        <app-view-log-print-tab
          [chapterId]="selectedChapterId()"
          [instrumentId]="selectedInstrumentId()" />
      </mat-tab>

      @if (isSuperUser()) {
        <mat-tab label="Manage Errors">
          <app-manage-errors-tab
            [chapterId]="selectedChapterId()"
            [instrumentId]="selectedInstrumentId()" />
        </mat-tab>
      }
  </mat-tab-group>
</div>
