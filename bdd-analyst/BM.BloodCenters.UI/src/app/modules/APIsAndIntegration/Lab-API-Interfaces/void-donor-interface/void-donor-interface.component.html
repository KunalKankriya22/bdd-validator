<app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>

<div class="void-interface-container">
  <div class="form-card">
    <div class="form-body">

      <!-- Unit ID — shared component handles validate-unit (1st API), Codabar double-entry,
           and CODE128 formatting. postValidate chains getUnitDetails (2nd API). -->
      <app-unit-id-field
        [validateFfValue]="'DONOR'"
        [placeholder]="'Scan or type'"
        (postValidate)="onUnitPostValidate($event)"
        (validated)="onUnitValidated()"
        (cleared)="onUnitCleared()"
        class="full-width"
      />

      <!-- Collection Date (read-only) -->
      <div class="field-display-card field-display-card--divided">
        <label class="field-label">Collection Date</label>
        <div
          class="field-value"
          [attr.aria-label]="'Collection date: ' + (collectionDate || 'not available')"
        >
          {{ collectionDate || '---' }}
        </div>
      </div>

      <!-- Donor to Lab Interface Timestamp (read-only) -->
      <div class="field-display-card--inner-padding">
        <label class="field-label">Donor to Lab Interface performed on</label>
        <div
          class="field-value"
          [attr.aria-label]="'Interface timestamp: ' + (interfaceTimestamp || 'not performed')"
        >
          {{ interfaceTimestamp || '---' }}
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="form-footer">
      <button
        mat-button
        type="button"
        (click)="onClearAll()"
        aria-label="Clear fields"
      >
        CLEAR
      </button>

      <button
        mat-raised-button
        color="primary"
        type="button"
        [disabled]="!canVoid || isVoidLoading"
        (click)="onVoidInterface()"
        [attr.aria-label]="
          canVoid
            ? 'Void interface - click to proceed'
            : 'Void interface - disabled until valid unit is entered'
        "
      >
        @if (isVoidLoading) {
          <mat-icon><span class="spinner"></span></mat-icon>
          <span>PROCESSING...</span>
        } @else {
          <span>VOID INTERFACE</span>
        }
      </button>
    </div>
  </div>
</div>
