<div class="dialog-container">

  <div class="dialog-body">
    <h2 mat-dialog-title class="dialog-title">Delete Chapter</h2>
    <p class="dialog-message">
      Are you sure you want to delete this chapter? Deleting it will permanently
      remove it from the database and it cannot be recovered.
    </p>
  </div>

  <div class="dialog-actions">
    <button
      mat-button
      class="cancel-button"
      (click)="onCancel()"
      type="button">
      CANCEL
    </button>

    <button
      mat-button
      class="delete-button"
      (click)="onDelete()"
      type="button">
      DELETE
    </button>
  </div>

</div>
