<app-filter-panel-base
  [maxContentHeight]="351"
  [applyDisabled]="isApplyDisabled"
  (apply)="onApply()"
  (clear)="onClear()"
  (close)="onClose()">

  <form [formGroup]="filterForm">
    <!-- City -->
    <mat-form-field appearance="fill">
      <mat-label>City</mat-label>
      <input
        matInput
        formControlName="city"
        maxlength="40"
        autocomplete="off">
    </mat-form-field>

    <!-- Zip Code -->
    <mat-form-field appearance="fill">
      <mat-label>Zip Code</mat-label>
      <input
        matInput
        formControlName="zip"
        maxlength="5"
        inputmode="numeric"
        (keypress)="onlyNumbers($event)"
        (paste)="onPasteNumbers($event)"
        autocomplete="off">
    </mat-form-field>

    <!-- County -->
    <mat-form-field appearance="fill">
      <mat-label>County</mat-label>
      <input
        matInput
        formControlName="county"
        maxlength="40"
        autocomplete="off">
    </mat-form-field>

    <!-- State -->
    <mat-form-field appearance="fill">
      <mat-label>State</mat-label>
      <mat-select formControlName="state">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="stateSearchControl"
            placeholderLabel="Search states..."
            noEntriesFoundLabel="No matching states"></ngx-mat-select-search>
        </mat-option>
        <mat-option [value]="''">-- Select State --</mat-option>
        @for (state of filteredStateOptions; track state.code) {
          <mat-option [value]="state.code">
            {{ state.code }} - {{ state.description }}
          </mat-option>
        }
      </mat-select>
      @if (isLoadingStates) {
        <mat-hint>Loading states...</mat-hint>
      }
    </mat-form-field>
  </form>

</app-filter-panel-base>
