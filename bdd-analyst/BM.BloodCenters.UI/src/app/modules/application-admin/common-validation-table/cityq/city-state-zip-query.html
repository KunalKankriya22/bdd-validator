<div class="city-state-zip-query-container">
  <!-- Page Header -->
  <app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>

  <!-- Table Card -->
  <div #tableCard class="table-card">
    <!-- Filter and Search Row -->
    <div class="filter-search-row">
      <button
        mat-button
        type="button"
        (click)="openFilter()"
        [class.filter-button--active]="isFilterOpen"
        class="filter-button"
        aria-label="Open filter panel">
        <mat-icon aria-hidden="true">filter_list</mat-icon>
        FILTER
      </button>

      @if (hasActiveFilters()) {
        <app-filter-chips
          [chips]="filterChips"
          [maxVisible]="3"
          (removeChip)="onRemoveFilterChip($event)"
          (clearAll)="clearAllFilters()">
        </app-filter-chips>
      }

      <app-search-bar
        [config]="searchConfig"
        (search)="onSearch($event)">
      </app-search-bar>
    </div>

    <!-- Data Table -->
    <app-data-table
      [config]="tableConfig"
      [data]="dataSource"
      [loading]="isLoading"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (rowAction)="onRowAction($event)">
    </app-data-table>

    <!-- Error State -->
    @if (hasError) {
      <div class="error-container" role="alert" aria-live="assertive">
        <mat-icon aria-hidden="true">error</mat-icon>
        <p>{{ errorMessage }}</p>
        <button type="button" mat-button color="primary" (click)="loadData()">
          Retry
        </button>
      </div>
    }
  </div>
</div>
