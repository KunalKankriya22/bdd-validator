<section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content" aria-describedby="filter-desc">

    <mat-form-field appearance="fill">
      <mat-label>Chapter ID</mat-label>
      <mat-select formControlName="chapterId">
        <!-- Searchable dropdown (Donor User Access pattern) - shows when options > 20 -->
        <mat-option>
          <ngx-mat-select-search
            [formControl]="chapterIdSearchControl"
            placeholderLabel="Search chapters..."
            noEntriesFoundLabel="No matching chapters"></ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let chapterId of filteredChapterIdOptions" [value]="chapterId">
          {{ chapterId }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Chapter Name</mat-label>
      <mat-select formControlName="chapterName">
        <!-- Searchable dropdown (Donor User Access pattern) - shows when options > 20 -->
        <mat-option>
          <ngx-mat-select-search
            [formControl]="chapterNameSearchControl"
            placeholderLabel="Search chapter names..."
            noEntriesFoundLabel="No matching chapters"></ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let chapterName of filteredChapterNameOptions" [value]="chapterName">
          {{ chapterName }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Time Zone</mat-label>
      <mat-select formControlName="timeZone">
        <!-- Searchable dropdown (Donor User Access pattern) - shows when options > 20 -->
        <mat-option>
          <ngx-mat-select-search
            [formControl]="timeZoneSearchControl"
            placeholderLabel="Search time zones..."
            noEntriesFoundLabel="No matching time zones"></ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let timeZone of filteredTimeZoneOptions" [value]="timeZone">
          {{ timeZone }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>DST Offset</mat-label>
      <input matInput type="number" formControlName="dstOffSet"             (input)="onDstOffsetInput()"
             (keydown)="preventInvalidNumberInput($event)">
      <mat-error *ngIf="getDstOffsetError()">{{ getDstOffsetError() }}</mat-error>
    </mat-form-field>
  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
