<div class="add-step-dialog" role="dialog" aria-modal="true" aria-labelledby="add-step-dialog-title">
  <div class="add-step-dialog__header">
    <h2 class="add-step-dialog__title" id="add-step-dialog-title">Add New Step</h2>
    <button
      type="button"
      class="add-step-dialog__close"
      (click)="onCancel()"
      aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="add-step-dialog__content">
    <mat-form-field class="add-step-dialog__select" appearance="fill"
      [class.mat-form-field-invalid]="duplicateError">
      <mat-label>Looking For</mat-label>
      <mat-select [(ngModel)]="selectedStep" (selectionChange)="onSelectionChange()" panelClass="no-check-select">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="searchControl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No matching options">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let step of filteredSteps" [value]="step.id">
          {{ step.name }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="duplicateError">{{ duplicateError }}</mat-error>
    </mat-form-field>
    <div *ngIf="duplicateError" class="add-step-dialog__error">
      {{ duplicateError }}
    </div>
  </div>

  <div class="add-step-dialog__actions">
    <button
      type="button"
      mat-button
      class="add-step-dialog__cancel-btn"
      (click)="onCancel()">
      CANCEL
    </button>
    <button
      type="button"
      mat-raised-button
      color="primary"
      class="add-step-dialog__add-btn"
      [disabled]="isAddDisabled"
      (click)="onAdd()">
      ADD
    </button>
  </div>
</div>
