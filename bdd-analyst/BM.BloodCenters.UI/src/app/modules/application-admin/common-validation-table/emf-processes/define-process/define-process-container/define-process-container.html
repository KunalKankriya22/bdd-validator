<div class="define-process-container" role="main" aria-label="Define Process">
  <app-page-header-with-breadcrumb [config]="headerConfig" />

  <div class="define-process-container__tabs">
    <mat-tab-group
      class="define-process-tabs"
      [selectedIndex]="activeTab === 'process-steps' ? 0 : 1"
      (selectedIndexChange)="onTabChange($event === 0 ? 'process-steps' : 'reflexive-actions')"
      animationDuration="0ms">

      <!-- Process Steps Tab -->
      <mat-tab>
        <ng-template mat-tab-label>
          <img src="/assets/images/navigation/sort%20desc.svg" class="custom-tabs__icon" alt="" />
          Process Steps
        </ng-template>
        <div class="define-process-container__content">
          <div class="content-split">
            <div class="content-split__left">
              <app-process-steps-list
                [steps]="processSteps"
                [selectedStepId]="selectedStepId"
                [isLoading]="isLoading"
                (stepSelect)="onStepSelect($event)"
                (addNewStep)="onAddNewStep()">
              </app-process-steps-list>
            </div>
            <div class="content-split__right">
              <app-process-step-form
                [stepData]="selectedStepData"
                [stepSequence]="getSelectedStepSequence()"
                [operatorOptions]="operatorOptions"
                [mappingLookups]="mappingLookups"
                [isSaving]="isSavingStep"
                (save)="onSaveStep($event)"
                (cancel)="onCancelStep()">
              </app-process-step-form>
            </div>
          </div>
        </div>
      </mat-tab>

      <!-- Reflexive Actions Tab -->
      <mat-tab>
        <ng-template mat-tab-label>
          <img src="/assets/images/navigation/powerstation.svg" class="custom-tabs__icon" alt="" />
          Reflexive Actions
        </ng-template>
        <div class="define-process-container__content">
          <div class="content-full">
            <div class="content-split">
              <div class="content-split__left">
                <app-reflexive-actions-list
                  [actions]="reflexiveActions"
                  [selectedActionId]="selectedActionId"
                  [isLoading]="isLoading"
                  (actionSelect)="onActionSelect($event)"
                  (addNewAction)="onAddNewAction()">
                </app-reflexive-actions-list>
              </div>
              <div class="content-split__right">
                <div class="action-tabs-container">
                  <mat-tab-group
                    class="action-tabs-group"
                    [selectedIndex]="activeActionTab === 'details' ? 0 : 1"
                    (selectedIndexChange)="onActionTabChange($event === 0 ? 'details' : 'visual-flow')"
                    animationDuration="0ms">
                    <mat-tab label="Details">
                      <app-reflexive-action-details
                        [actionData]="selectedActionData"
                        [processCode]="processCode"
                        [operatorOptions]="operatorOptions"
                        [actionOptions]="actionCodeOptions"
                        [isSaving]="isSavingAction"
                        (save)="onSaveAction($event)"
                        (cancel)="onCancelAction()">
                      </app-reflexive-action-details>
                    </mat-tab>
                    <mat-tab label="Visual Flow">
                      <app-reflexive-action-visual-flow
                        [actionData]="selectedActionData"
                        [processSteps]="processSteps"
                        [reflexiveActions]="reflexiveActions">
                      </app-reflexive-action-visual-flow>
                    </mat-tab>
                  </mat-tab-group>
                </div>
              </div>
            </div>
          </div>
        </div>
      </mat-tab>

    </mat-tab-group>
  </div>
</div>
