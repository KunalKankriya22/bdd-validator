<div class="process-steps-list">
  <div class="process-steps-list__header">
    <h3 class="process-steps-list__title">Process Steps ({{ steps.length }})</h3>
    <button 
      type="button" 
      class="process-steps-list__add-btn"
      (click)="onAddNewStep()"
      aria-label="Add new step">
      <mat-icon>add</mat-icon>
      ADD NEW STEP
    </button>
  </div>

  <div class="process-steps-list__body">
    <div *ngIf="isLoading" class="process-steps-list__loading" role="status" aria-live="polite">
      <mat-spinner diameter="36" aria-label="Loading process steps"></mat-spinner>
    </div>

    <ng-container *ngIf="!isLoading">
      <div
        *ngFor="let step of steps"
        class="step-item"
        [class.step-item--selected]="isSelected(step)"
        (click)="onStepClick(step)"
        role="button"
        tabindex="0"
        [attr.aria-selected]="isSelected(step)"
        (keydown.enter)="onStepClick(step)"
        (keydown.space)="onStepClick(step)">

        <div class="step-item__header">
          <span class="step-item__sequence">{{ step.sequence }}</span>
          <span class="step-item__name">{{ step.name }}</span>
        </div>

        <div class="step-item__conditions">
          <div
            *ngFor="let condition of step.conditions"
            class="condition-item">
            <span class="condition-item__sequence">{{ condition.sequence }}</span>
            <span class="condition-item__description">{{ getDisplayDescription(condition.description) }}</span>
          </div>
        </div>
      </div>

      <div *ngIf="steps.length === 0" class="process-steps-list__empty">
        <mat-icon>inbox</mat-icon>
        <p>No Process Steps data found</p>
      </div>
    </ng-container>
  </div>
</div>
