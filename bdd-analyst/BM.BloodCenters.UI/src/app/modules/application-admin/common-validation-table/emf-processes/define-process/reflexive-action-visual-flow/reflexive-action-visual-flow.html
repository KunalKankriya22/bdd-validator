<div class="vf-host" #canvas role="region" aria-label="Reflexive action visual flow diagram">

  <div *ngIf="layout.nodes.length === 0" class="vf-empty" role="status">
    Select a reflexive action to view its flow
  </div>

  <div *ngIf="layout.nodes.length > 0"
       class="vf-canvas"
       role="img"
       aria-label="Visual flow diagram"
       [style.width.px]="layout.canvasWidth"
       [style.height.px]="layout.canvasHeight"
       [style.transform]="'scale(' + scale + ')'"
       [style.transform-origin]="'top left'"
       aria-hidden="true">

    <!-- SVG layer: connectors -->
    <svg class="vf-svg"
         [attr.width]="layout.canvasWidth"
         [attr.height]="layout.canvasHeight"
         role="presentation">
      <defs>
        <!-- single arrow marker, same blue for all, tip at refX -->
        <marker id="arr" markerWidth="8" markerHeight="8"
                refX="8" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#1565c0"/>
        </marker>
      </defs>

      <ng-container *ngFor="let c of layout.connectors">
        <!-- solid: same blue, no dash -->
        <path *ngIf="c.type === 'solid'"
              [attr.d]="c.path"
              stroke="#1565c0" stroke-width="1.5" fill="none"
              marker-end="url(#arr)"/>
        <!-- dashed: same blue, dashed -->
        <path *ngIf="c.type === 'dashed'"
              [attr.d]="c.path"
              stroke="#1565c0" stroke-width="1.5" fill="none"
              stroke-dasharray="5,4"
              marker-end="url(#arr)"/>
      </ng-container>
    </svg>

    <!-- HTML nodes: step & action -->
    <ng-container *ngFor="let node of layout.nodes">
      <div *ngIf="node.type !== 'operator'"
           class="vf-node"
           [class.vf-node--action]="node.type === 'action'"
           [style.left.px]="nodeX(node)"
           [style.top.px]="nodeY(node)"
           [style.width.px]="280">
        <div class="vf-node__header">
          <span class="vf-node__title">{{ node.title }}</span>
          <span *ngIf="node.badge" class="vf-node__badge">{{ node.badge }}</span>
        </div>
        <div *ngFor="let cond of node.conditions" class="vf-node__cond">{{ cond }}</div>
      </div>
    </ng-container>

    <!-- SVG layer: diamonds (on top of nodes) -->
    <svg class="vf-svg vf-svg--top"
         [attr.width]="layout.canvasWidth"
         [attr.height]="layout.canvasHeight"
         role="presentation">
      <ng-container *ngFor="let node of layout.nodes">
        <ng-container *ngIf="node.type === 'operator'">
          <polygon [attr.points]="diamondPoints(node)"
                   fill="#fff9c4" stroke="#e6a817" stroke-width="2"/>
          <text [attr.x]="diamondTextX(node)"
                [attr.y]="diamondTextY(node)"
                text-anchor="middle"
                font-family="Roboto, sans-serif"
                font-size="13"
                font-weight="700"
                fill="#b45309">{{ node.title }}</text>
        </ng-container>
      </ng-container>
    </svg>

  </div>

  <!-- Screen reader summary of the visual flow -->
  <div *ngIf="layout.nodes.length > 0" class="cdk-visually-hidden" role="list" aria-label="Flow steps and actions">
    <div *ngFor="let node of layout.nodes" role="listitem">
      {{ node.title }}
      <span *ngIf="node.badge"> ({{ node.badge }})</span>
      <span *ngIf="node.conditions?.length"> - Conditions: {{ node.conditions.join(', ') }}</span>
    </div>
  </div>
</div>
