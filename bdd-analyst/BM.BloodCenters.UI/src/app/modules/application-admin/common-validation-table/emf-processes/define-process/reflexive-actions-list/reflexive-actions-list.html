<div class="reflexive-actions-list">
  <div class="reflexive-actions-list__header">
    <h3 class="reflexive-actions-list__title">Actions ({{ actions.length }})</h3>
    <button 
      type="button" 
      class="reflexive-actions-list__add-btn"
      (click)="onAddNewAction()"
      aria-label="Add new action">
      <mat-icon>add</mat-icon>
      ADD NEW ACTION
    </button>
  </div>

  <div class="reflexive-actions-list__body">
    <div *ngIf="isLoading" class="reflexive-actions-list__loading" role="status" aria-live="polite">
      <mat-spinner diameter="36" aria-label="Loading reflexive actions"></mat-spinner>
    </div>

    <ng-container *ngIf="!isLoading">
      <div
        *ngFor="let action of actions"
        class="action-item"
        [class.action-item--selected]="isSelected(action)"
        (click)="onActionClick(action)"
        role="button"
        tabindex="0"
        [attr.aria-selected]="isSelected(action)"
        (keydown.enter)="onActionClick(action)"
        (keydown.space)="onActionClick(action)">

        <div class="action-item__header">
          <span class="action-item__code">{{ action.code }} - {{ action.name }}</span>
          <span *ngIf="action.badge" class="action-item__badge">{{ action.badge }}</span>
          <span *ngIf="action.linkedAction" class="action-item__linked">
            <img src="assets/images/navigation/connect-icon.svg" alt="" class="action-item__link-icon" aria-hidden="true">
            {{ action.linkedAction }}
          </span>
        </div>

        <div class="action-item__details">
          <div class="action-item__detail">
            <span class="action-item__label">Action on:</span>
            <span class="action-item__value">{{ action.actionOn }}</span>
          </div>
          <div class="action-item__detail">
            <span class="action-item__label">Action Value:</span>
            <span class="action-item__value">{{ action.actionValue }}</span>
          </div>
        </div>
      </div>

      <div *ngIf="actions.length === 0" class="reflexive-actions-list__empty">
        <mat-icon>inbox</mat-icon>
        <p>No reflexive actions defined</p>
      </div>
    </ng-container>
  </div>
</div>
