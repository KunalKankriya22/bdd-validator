<div class="sql-dialog" role="dialog" aria-modal="true" aria-labelledby="sql-dialog-title">
  <div class="sql-dialog__header">
    <h2 class="sql-dialog__title" id="sql-dialog-title">SQL Statement - {{ data.processCode }}</h2>
    <div class="sql-dialog__header-actions">
      <button type="button" class="btn btn--copy" (click)="onCopy()">
        @if (!copied) {
          <mat-icon>content_copy</mat-icon>
          COPY
        } @else {
          COPIED
        }
      </button>
      <button type="button" class="btn btn--generate" (click)="onGenerateSql()">
        GENERATE SQL
      </button>
      <button type="button" class="btn btn--icon" (click)="onClose()" aria-label="Close">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <div class="sql-dialog__body">
    <div class="sql-dialog__code-card">
      <pre class="sql-dialog__code">{{ sql }}</pre>
    </div>
  </div>
</div>
