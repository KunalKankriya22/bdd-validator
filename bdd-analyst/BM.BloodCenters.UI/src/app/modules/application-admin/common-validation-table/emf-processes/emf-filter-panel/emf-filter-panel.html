<section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Effective Date Row -->
    <div class="date-row" role="group" aria-label="Effective date filter">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label>Period</mat-label>
        <mat-select formControlName="effectiveDatePeriod">
          @for (period of periodOptions; track period) {
            <mat-option [value]="period">{{ period }}</mat-option>
          }
        </mat-select>
        <mat-error *ngIf="getEffDatePeriodError()">{{ getEffDatePeriodError() }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Effective Date</mat-label>
        <input
          #effDateInput
          matInput
          [matDatepicker]="pickerEffective"
          formControlName="effectiveDate"
          (input)="onEffectiveDateInput($event)"
          (blur)="onEffectiveDateBlur(effDateInput)"
          (keydown.enter)="$event.target.blur()"
>
        <mat-datepicker-toggle matIconSuffix [for]="pickerEffective"></mat-datepicker-toggle>
        <mat-datepicker #pickerEffective></mat-datepicker>
        <mat-error *ngIf="filterForm.get('effectiveDate')?.hasError('invalidDate') || filterForm.get('effectiveDate')?.hasError('matDatepickerParse')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Termination Date Row -->
    <div class="date-row" role="group" aria-label="Termination date filter">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label>Period</mat-label>
        <mat-select formControlName="terminationDatePeriod">
          @for (period of periodOptions; track period) {
            <mat-option [value]="period">{{ period }}</mat-option>
          }
        </mat-select>
        <mat-error *ngIf="getTermDatePeriodError()">{{ getTermDatePeriodError() }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Termination Date</mat-label>
        <input
          #termDateInput
          matInput
          [matDatepicker]="pickerTerm"
          formControlName="terminationDate"
          (input)="onTerminationDateInput($event)"
          (blur)="onTerminationDateBlur(termDateInput)"
          (keydown.enter)="$event.target.blur()"
>
        <mat-datepicker-toggle matIconSuffix [for]="pickerTerm"></mat-datepicker-toggle>
        <mat-datepicker #pickerTerm></mat-datepicker>
        <mat-error *ngIf="filterForm.get('terminationDate')?.hasError('invalidDate') || filterForm.get('terminationDate')?.hasError('matDatepickerParse')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>
  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()" aria-label="Clear all filters">
      CLEAR ALL
    </button>
    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled" aria-label="Apply filters">
      APPLY
    </button>
  </footer>

</section>
