<div class="add-param-panel" role="dialog" aria-modal="true" [attr.aria-label]="title">

  <!-- Header -->
  <div class="add-param-panel__header">
    <h2 class="add-param-panel__title">{{ title }}</h2>
    <button type="button" class="add-param-panel__close" aria-label="Close panel" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="add-param-panel__body">
    <form [formGroup]="form">

      <!-- Row 1: CODE + Parameter Type -->
      <div class="add-param-panel__row">
        <mat-form-field appearance="fill" class="add-param-panel__field">
          <mat-label>CODE</mat-label>
          <input
            matInput
            formControlName="parmCode"
            autocomplete="off"
            maxlength="50"
            required
            (keydown)="onFieldKeyDown($event)" />
          <mat-error>{{ getFieldError('parmCode') }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="add-param-panel__field">
          <mat-label>Parameter Type</mat-label>
          <mat-select formControlName="parmType" panelClass="no-check-select" required>
            <mat-option *ngFor="let t of parameterTypes" [value]="t">{{ t }}</mat-option>
          </mat-select>
          <mat-error>{{ getFieldError('parmType') }}</mat-error>
        </mat-form-field>
      </div>

      <!-- Row 2: Reference Table + Reference Column -->
      <div class="add-param-panel__row">
        <mat-form-field appearance="fill" class="add-param-panel__field">
          <mat-label>Reference Table</mat-label>
          <input
            matInput
            formControlName="refTable"
            autocomplete="off"
            maxlength="30"
            placeholder="Table name or comma-separated list"
            (keydown)="onFieldKeyDown($event)" />
          <mat-error>{{ getFieldError('refTable') }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="add-param-panel__field">
          <mat-label>Reference Column</mat-label>
          <input
            matInput
            formControlName="refColumn"
            autocomplete="off"
            maxlength="30"
            (keydown)="onFieldKeyDown($event)" />
          <mat-error>{{ getFieldError('refColumn') }}</mat-error>
        </mat-form-field>
      </div>

      <!-- Default Value (Full Width) -->
      <div class="add-param-panel__row add-param-panel__row--single">
        <mat-form-field appearance="fill" class="add-param-panel__field">
          <mat-label>Default Value</mat-label>
          <input
            matInput
            formControlName="defaultValue"
            autocomplete="off"
            maxlength="30"
            (blur)="onDefaultValueBlur()"
            (keydown)="onFieldKeyDown($event)" />
          <mat-error>{{ getFieldError('defaultValue') }}</mat-error>
        </mat-form-field>
      </div>

    </form>
  </div>

  <!-- Footer -->
  <div class="add-param-panel__footer">
    <button type="button" class="add-param-panel__btn add-param-panel__btn--cancel" (click)="onCancel()">
      CANCEL
    </button>
    <button
      type="button"
      class="add-param-panel__btn add-param-panel__btn--primary"
      [disabled]="isSaveDisabled"
      (click)="onSave()">
      {{ isEdit ? 'SAVE' : 'ADD' }}
    </button>
  </div>

</div>
