<div class="mapping-panel" role="region" aria-label="Mapping Detail">

  <form [formGroup]="form" class="mapping-panel__form">

    <!-- Top Fields Row -->
    <div class="mapping-panel__fields-row">

      <!-- Mapping Name -->
      <mat-form-field appearance="fill" class="mapping-panel__field mapping-panel__field--name">
        <mat-label>Mapping Name <span class="required-star"></span></mat-label>
        <input
          matInput
          formControlName="mappingName"
          autocomplete="off"
          maxlength="100"
          required
          (keydown)="onFieldKeyDown($event)" />
        <mat-error>{{ getFieldError('mappingName') }}</mat-error>
      </mat-form-field>

      <!-- Table Name -->
      <mat-form-field appearance="fill" class="mapping-panel__field mapping-panel__field--table">
        <mat-label>Table Name</mat-label>
        <mat-select
          formControlName="dataTableName"
          panelClass="no-check-select">
          <!-- Search Component -->
          <mat-option disabled>
            <ngx-mat-select-search
              [formControl]="tableSearchControl"
              placeholderLabel="Search tables..."
              noEntriesFoundLabel="No tables found">
            </ngx-mat-select-search>
          </mat-option>
          <!-- Options -->
          <mat-option *ngFor="let t of filteredTableOptions()" [value]="t">{{ t }}</mat-option>
        </mat-select>
        <mat-error>{{ getFieldError('dataTableName') }}</mat-error>
      </mat-form-field>

      <!-- Column Name -->
      <mat-form-field appearance="fill" class="mapping-panel__field mapping-panel__field--column">
        <mat-label>Column Name</mat-label>
        <mat-select
          formControlName="dataColumnName"
          panelClass="no-check-select">
          <!-- Search Component -->
          <mat-option disabled>
            <ngx-mat-select-search
              [formControl]="columnSearchControl"
              placeholderLabel="Search columns..."
              noEntriesFoundLabel="No columns found">
            </ngx-mat-select-search>
          </mat-option>
          <!-- Options -->
          <mat-option *ngFor="let c of filteredColumnOptions()" [value]="c">{{ c }}</mat-option>
        </mat-select>
        <mat-error>{{ getFieldError('dataColumnName') }}</mat-error>
      </mat-form-field>

    </div>

    <!-- Where Clause -->
    <div class="mapping-panel__section">
      <mat-form-field appearance="fill" class="mapping-panel__field mapping-panel__field--full">
        <mat-label>Where Clause</mat-label>
        <textarea
          matInput
          formControlName="whereClause"
          rows="5"
          class="mapping-panel__textarea"
          placeholder="Enter SQL WHERE conditions..."
          maxlength="2000"
          (blur)="form.get('whereClause')?.markAsTouched()"
          (keydown)="onFieldKeyDown($event)">
        </textarea>
        <mat-error>{{ getFieldError('whereClause') }}</mat-error>
      </mat-form-field>
    </div>

    <!-- SQL Statement (Editable) -->
    <div class="mapping-panel__section">
      <mat-form-field appearance="fill" class="mapping-panel__field mapping-panel__field--full mapping-panel__field--sql">
        <mat-label>SQL Statement</mat-label>
        <app-sql-editor
          formControlName="sqlStmt"
          minHeight="180px"
          maxHeight="450px"
          [showLineNumbers]="false">
        </app-sql-editor>
        <mat-error>{{ getFieldError('sqlStmt') }}</mat-error>
      </mat-form-field>
    </div>

  </form>

  <!-- Footer -->
  <div class="mapping-panel__footer">
    <!-- Edit Mode Buttons -->
    <ng-container *ngIf="mode === 'edit'">
      <button type="button" class="mapping-panel__btn mapping-panel__btn--clear" (click)="onCancel()">
        CANCEL
      </button>
      <button type="button" class="mapping-panel__btn mapping-panel__btn--clear" (click)="onClearAll()">
        CLEAR ALL
      </button>
      <button
        type="button"
        class="mapping-panel__btn mapping-panel__btn--primary"
        [disabled]="isSaveDisabled"
        (click)="onAdd()">
        SAVE
      </button>
    </ng-container>

    <!-- Add Mode Buttons -->
    <ng-container *ngIf="mode === 'add'">
      <button type="button" class="mapping-panel__btn mapping-panel__btn--clear" (click)="onClearAll()">
        CLEAR ALL
      </button>
      <button
        type="button"
        class="mapping-panel__btn mapping-panel__btn--secondary"
        [disabled]="isSaveDisabled"
        (click)="onAddAndCreateAnother()">
        ADD AND CREATE ANOTHER
      </button>
      <button
        type="button"
        class="mapping-panel__btn mapping-panel__btn--primary"
        [disabled]="isSaveDisabled"
        (click)="onAdd()">
        ADD
      </button>
    </ng-container>
  </div>

</div>
