<div class="param-def">

  <!-- Header -->
  <div class="param-def__header">
    <span class="param-def__title">Parameter Definitions ({{ count }})</span>
    <button type="button" class="param-def__add-btn" (click)="onAddNew()">
      <mat-icon>add</mat-icon>
      ADD NEW DEFINITION
    </button>
  </div>

  <!-- Mat Table -->
  <div class="param-def__table-wrap">
    <table mat-table [dataSource]="parameters()" class="param-def__table" aria-label="Parameter definitions">

      <!-- Code Column -->
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let p">{{ p.parmCode || '-' }}</td>
      </ng-container>

      <!-- Type Column -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let p">
          <span class="param-def__type-badge">
            <img src="assets/images/Reports/az-icon.svg" class="param-def__type-icon" alt="" aria-hidden="true" />
            {{ p.parmType || '-' }}
          </span>
        </td>
      </ng-container>

      <!-- Reference Table Column -->
      <ng-container matColumnDef="referenceTable">
        <th mat-header-cell *matHeaderCellDef>Reference Table</th>
        <td mat-cell *matCellDef="let p">{{ p.refTable || '-' }}</td>
      </ng-container>

      <!-- Reference Column Column -->
      <ng-container matColumnDef="referenceColumn">
        <th mat-header-cell *matHeaderCellDef>Reference Column</th>
        <td mat-cell *matCellDef="let p">{{ p.refColumn || '-' }}</td>
      </ng-container>

      <!-- Default Value Column -->
      <ng-container matColumnDef="defaultValue">
        <th mat-header-cell *matHeaderCellDef>Default Value</th>
        <td mat-cell *matCellDef="let p">{{ p.defaultValue || '-' }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef><span class="cdk-visually-hidden">Actions</span></th>
        <td mat-cell *matCellDef="let p">
          <div class="param-def__actions-wrap">
            <button type="button" class="param-def__action-btn" aria-label="Edit"
              matTooltip="Edit" (click)="onEdit(p)">
              <mat-icon>edit</mat-icon>
            </button>
            <button type="button" class="param-def__action-btn param-def__action-btn--delete" aria-label="Delete"
              matTooltip="Delete" (click)="onDelete(p)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

</div>
