<div class="mappings-page-wrapper" [class.side-panel-active]="isParamPanelOpen">

  <!-- MAIN CONTENT: header + tabs + content -->
  <div class="mappings-page-wrapper__main" [class.side-panel-active]="isParamPanelOpen && activeTab === 'parameters'">

    <!-- HEADER: always full width of left side -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- TABS -->
    <mat-tab-group
      class="mappings-tabs"
      [selectedIndex]="activeTab === 'mappings' ? 0 : 1"
      (selectedIndexChange)="activeTab = ($event === 0 ? 'mappings' : 'parameters')"
      animationDuration="0ms">

      <!-- Mappings Tab -->
      <mat-tab>
        <ng-template mat-tab-label>
          <img src="assets/images/icons/mappings.svg" class="mappings-page__tab-icon" alt="" />
          Mappings
        </ng-template>

        <main class="mappings-page" role="main" aria-label="Process Code Mappings"
          [class.mappings-page--split]="isDetailPanelOpen">

          <div class="mappings-page__left">
            <div class="mappings-page__card">
              <!-- Toolbar -->
              <div class="mappings-page__toolbar">
                <div class="mappings-page__search">
                  <mat-icon class="mappings-page__search-icon" aria-hidden="true">search</mat-icon>
                  <input
                    type="text"
                    class="mappings-page__search-input"
                    placeholder="Search by question code, question"
                    aria-label="Search mappings"
                    matTooltip="Search by question code, question"
                    [(ngModel)]="searchText"
                    (input)="onSearchInput()"
                    (blur)="onSearchBlur()"
                    (keydown)="onSearchKeyDown($event)" />
                </div>
                <button
                  type="button"
                  class="mappings-page__add-btn"
                  aria-label="Add new mapping"
                  (click)="onAddMapping()">
                  <mat-icon>add</mat-icon>
                </button>
              </div>

              <!-- List -->
              <div class="mappings-page__list" role="list">
                <ng-container *ngFor="let item of filteredMappings; trackBy: trackById">
                  <div
                    class="mappings-page__item"
                    [class.mappings-page__item--selected]="selectedMapping?.mappingName === item.mappingName"
                    role="listitem"
                    tabindex="0"
                    (click)="onSelectMapping(item)"
                    (keydown.enter)="onSelectMapping(item)"
                    (keydown.space)="$event.preventDefault(); onSelectMapping(item)">
                    <span class="mappings-page__item-name">{{ item.mappingName }}</span>
                    <span class="mappings-page__item-path">{{ getDisplayPath(item) }}</span>
                  </div>
                </ng-container>
                <div *ngIf="filteredMappings.length === 0" class="mappings-page__empty" role="status">
                  No mappings found
                </div>
              </div>
            </div>
          </div>

          <!-- RIGHT: mapping detail panel -->
          <div *ngIf="isDetailPanelOpen" class="mappings-page__detail-panel">
            <app-mapping-detail-panel
              [mode]="detailPanelMode"
              [editData]="detailEditData"
              (cancel)="onDetailPanelCancel()"
              (save)="onDetailPanelSave($event)"
              (saveAndCreateAnother)="onDetailPanelSaveAndCreateAnother($event)">
            </app-mapping-detail-panel>
          </div>

        </main>
      </mat-tab>

      <!-- Parameters Tab -->
      <mat-tab>
        <ng-template mat-tab-label>
          <img src="assets/images/icons/parameters.svg" class="mappings-page__tab-icon" alt="" />
          Parameters
        </ng-template>

        <main class="mappings-page" role="main" aria-label="Parameter Definitions">
          <app-parameter-definitions
            class="mappings-page__parameters"
            [processCode]="processCode"
            (addNew)="onParamAddNew()"
            (editParam)="onParamEdit($any($event))">
          </app-parameter-definitions>
        </main>
      </mat-tab>

    </mat-tab-group>
  </div>

  <!-- Backdrop Overlay -->
  <div class="side-panel-backdrop" *ngIf="isParamPanelOpen" aria-hidden="true" (click)="onParamPanelCancel()"></div>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="isParamPanelOpen">
    <app-add-parameter-panel
      [mode]="paramPanelMode"
      [editData]="paramEditData"
      (cancel)="onParamPanelCancel()"
      (save)="onParamPanelSave($event)">
    </app-add-parameter-panel>
  </div>

</div>
