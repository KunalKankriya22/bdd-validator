<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Price Range and Price -->
    <div class="filter-panel__date-row" role="group" [attr.aria-label]="'Price filter'">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label>Range</mat-label>
        <mat-select formControlName="priceRange">
          <mat-option *ngFor="let range of rangeOptions" [value]="range">
            {{ range }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="getPriceRangeError()">{{ getPriceRangeError() }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="price-field">
        <mat-label>Price</mat-label>
        <span matTextPrefix class="price-prefix" *ngIf="hasPriceValue">$&nbsp;</span>
        <input matInput type="number" formControlName="price" step="0.01" min="0" max="99999.99" (input)="onPriceInput($event)" />
      </mat-form-field>
    </div>

    <!-- Effective Date Period and Date -->
    <div class="filter-panel__date-row" role="group" [attr.aria-label]="'Effective date filter'">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label [ngStyle]="{ color: getEffectiveDatePeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
        <mat-select formControlName="effectiveDatePeriod">
          <mat-option *ngFor="let period of periodOptions" [value]="period">
            {{ period }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="getEffectiveDatePeriodError()">{{ getEffectiveDatePeriodError() }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Effective Date</mat-label>
        <input
          #effectiveDateInput
          matInput
          [matDatepicker]="effectivePicker"
          [min]="minDate"
          [errorStateMatcher]="effDateErrorMatcher"
          formControlName="effectiveDate"
          aria-label="Effective Date"
          (input)="onEffectiveDateInput($event)"
          (blur)="onEffectiveDateBlur(effectiveDateInput)"
          (keydown.enter)="$event.target.blur()">
        <mat-datepicker-toggle matIconSuffix [for]="effectivePicker"></mat-datepicker-toggle>
        <mat-datepicker #effectivePicker></mat-datepicker>
        <mat-error *ngIf="getEffectiveDateError()">{{ getEffectiveDateError() }}</mat-error>
      </mat-form-field>
    </div>

    <!-- Termination Date Period and Date -->
    <div class="filter-panel__date-row" role="group" [attr.aria-label]="'Termination date filter'">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label [ngStyle]="{ color: getTerminationDatePeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
        <mat-select formControlName="terminationDatePeriod">
          <mat-option *ngFor="let period of periodOptions" [value]="period">
            {{ period }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="getTerminationDatePeriodError()">{{ getTerminationDatePeriodError() }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Termination Date</mat-label>
        <input
          #terminationDateInput
          matInput
          [matDatepicker]="terminationPicker"
          [min]="minDate"
          [errorStateMatcher]="termDateErrorMatcher"
          formControlName="terminationDate"
          aria-label="Termination Date"
          (input)="onTerminationDateInput($event)"
          (blur)="onTerminationDateBlur(terminationDateInput)"
          (keydown.enter)="$event.target.blur()">
        <mat-datepicker-toggle matIconSuffix [for]="terminationPicker"></mat-datepicker-toggle>
        <mat-datepicker #terminationPicker></mat-datepicker>
        <mat-error *ngIf="getTerminationDateError()">{{ getTerminationDateError() }}</mat-error>
      </mat-form-field>
    </div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
