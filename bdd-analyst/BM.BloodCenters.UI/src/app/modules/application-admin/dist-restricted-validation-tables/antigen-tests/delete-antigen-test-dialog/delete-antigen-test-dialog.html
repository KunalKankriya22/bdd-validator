<div class="dialog-container">

  <div class="dialog-body">
    <h2 class="dialog-title" mat-dialog-title>Delete Antigen Test</h2>
    <p class="dialog-message">
      Are you sure you want to delete this antigen test record? This action cannot be undone.
    </p>
  </div>

  <div class="dialog-actions">
    <button
      mat-button
      class="cancel-button"
      (click)="onCancel()"
      type="button">
      CANCEL
    </button>

    <button
      mat-button
      class="delete-button"
      (click)="onDelete()"
      type="button">
      DELETE
    </button>
  </div>

</div>
