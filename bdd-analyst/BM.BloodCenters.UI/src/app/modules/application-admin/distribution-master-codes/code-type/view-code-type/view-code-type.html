<!-- Main Content Area -->
<main class="view-code-type" aria-label="Code Type detail content" role="main">

  <!-- Page Header with Breadcrumb -->
  <app-page-header-with-breadcrumb [config]="headerConfig" />

  <!-- Table Card Container -->
  <div class="view-code-type__card">

    <!-- Table Controls: Filter + Chips + Search -->
    <div class="view-code-type__controls">
      <!-- Filter button -->
      <button #filterBtn mat-button class="filter-button" [class.filter-button--active]="isFilterPanelOpen" aria-label="Open filter options" [attr.aria-expanded]="isFilterPanelOpen" (click)="openFilter()">
        <span class="filter-icon" aria-hidden="true"></span>
        FILTER
      </button>

      <!-- Filter chips (scrollable with arrows) -->
      <div class="view-code-type__chips-wrapper" *ngIf="filterChips.length > 0">
        <button class="chips-arrow chips-arrow--left" *ngIf="showLeftArrow"
                (click)="scrollChips('left')" aria-label="Scroll chips left">
          <mat-icon aria-hidden="true">chevron_left</mat-icon>
        </button>
        <div class="view-code-type__chips-scroll" #chipsScroll (scroll)="onChipsScroll()">
          <app-filter-chips [chips]="filterChips" [maxVisible]="100"
            (removeChip)="onRemoveFilterChip($event)" (clearAll)="clearFilters()">
          </app-filter-chips>
        </div>
        <button class="chips-arrow chips-arrow--right" *ngIf="showRightArrow"
                (click)="scrollChips('right')" aria-label="Scroll chips right">
          <mat-icon aria-hidden="true">chevron_right</mat-icon>
        </button>
      </div>

      <!-- Right section: Search bar -->
      <app-search-bar [config]="searchConfig" (search)="onSearch($event)" />
    </div>

    <!-- Error State -->
    <div
      *ngIf="hasError && !isLoading"
      class="view-code-type__error"
      role="alert"
      aria-label="Error loading data">
      <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
      <p class="error-message">{{ errorMessage }}</p>
      <button type="button" mat-raised-button color="primary" (click)="loadData()">
        Retry
      </button>
    </div>

    <!-- Data Table -->
    <div class="view-code-type__table-wrapper">
      <app-data-table
        *ngIf="!hasError"
        [config]="tableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        [highlightedRow]="editingRow"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)" />
    </div>
  </div>
</main>
