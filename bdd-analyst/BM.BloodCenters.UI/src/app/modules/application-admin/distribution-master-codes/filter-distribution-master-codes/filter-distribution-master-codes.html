<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content" aria-describedby="filter-desc">

    <div class="filter-panel__date-row">
      <div class="period-wrapper">
        <mat-form-field appearance="fill" class="period-field" [class.has-error]="effectiveDatePeriodError">
          <mat-label [ngStyle]="{ color: effectiveDatePeriodError ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="effectiveDatePeriod" aria-label="Effective date period">
            <mat-option value="AFTER">After</mat-option>
            <mat-option value="BEFORE">Before</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="period-error" role="alert" *ngIf="effectiveDatePeriodError">
          {{ effectiveDatePeriodError }}
        </div>
      </div>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Effective Date</mat-label>
        <input
          #effectiveDateInput
          matInput
          [matDatepicker]="effDatePicker"
          formControlName="effectiveDate"
          (input)="onEffectiveDateInput($event)"
          (blur)="onEffectiveDateBlur(effectiveDateInput)"
          (keydown.enter)="$event.target.blur()">
        <mat-datepicker-toggle matIconSuffix [for]="effDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #effDatePicker></mat-datepicker>
        <mat-error *ngIf="filterForm.get('effectiveDate')?.hasError('invalidDateFormat') || filterForm.get('effectiveDate')?.hasError('matDatepickerParse') || filterForm.get('effectiveDate')?.hasError('invalidDate')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>

    <div class="filter-panel__date-row">
      <div class="period-wrapper">
        <mat-form-field appearance="fill" class="period-field" [class.has-error]="terminationDatePeriodError">
          <mat-label [ngStyle]="{ color: terminationDatePeriodError ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="terminationDatePeriod" aria-label="Termination date period">
            <mat-option value="AFTER">After</mat-option>
            <mat-option value="BEFORE">Before</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="period-error" role="alert" *ngIf="terminationDatePeriodError">
          {{ terminationDatePeriodError }}
        </div>
      </div>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Termination Date</mat-label>
        <input
          #terminationDateInput
          matInput
          [matDatepicker]="termDatePicker"
          formControlName="terminationDate"
          (input)="onTerminationDateInput($event)"
          (blur)="onTerminationDateBlur(terminationDateInput)"
          (keydown.enter)="$event.target.blur()">
        <mat-datepicker-toggle matIconSuffix [for]="termDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #termDatePicker></mat-datepicker>
        <mat-error *ngIf="filterForm.get('terminationDate')?.hasError('invalidDateFormat') || filterForm.get('terminationDate')?.hasError('matDatepickerParse') || filterForm.get('terminationDate')?.hasError('invalidDate')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>
  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <div class="footer-actions">
      <button mat-stroked-button type="button" class="clear-btn" (click)="onClear()">CLEAR ALL</button>
      <button mat-raised-button type="button" class="apply-btn" (click)="onApply()" [disabled]="isApplyDisabled">APPLY</button>
    </div>
  </footer>

</section>
