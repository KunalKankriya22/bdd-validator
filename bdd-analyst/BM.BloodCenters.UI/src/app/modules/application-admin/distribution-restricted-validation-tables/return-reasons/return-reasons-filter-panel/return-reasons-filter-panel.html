<app-filter-panel-base
  [title]="'Filters'"
  [maxContentHeight]="320"
  [width]="380"
  [applyDisabled]="isApplyDisabled()"
  (apply)="onApply()"
  (clear)="onClear()"
  (close)="onClose()">

  <!-- Filter Form Content with Focus Trap -->
  <div cdkTrapFocus cdkTrapFocusAutoCapture class="filter-form">
    <form [formGroup]="filterForm">

      <!-- Location Type -->
      <mat-form-field appearance="fill">
        <mat-label>Location</mat-label>
        <mat-select formControlName="locationType">
          <mat-option>
            <ngx-mat-select-search
              [formControl]="locationTypeSearchCtrl"
              placeholderLabel="Search..."
              noEntriesFoundLabel="No results found">
            </ngx-mat-select-search>
          </mat-option>
          <mat-option *ngFor="let locationType of filteredLocationTypeOptions()" [value]="locationType">
            {{ locationType }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Credit (CR/NCR) -->
      <mat-form-field appearance="fill">
        <mat-label>Credit</mat-label>
        <mat-select formControlName="crNcr">
          <mat-option *ngFor="let option of crNcrOptions" [value]="option">
            {{ option }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Enforce Policy -->
      <mat-form-field appearance="fill">
        <mat-label>Enforce Policy</mat-label>
        <mat-select formControlName="enforce">
          <mat-option *ngFor="let option of enforceOptions" [value]="option">
            {{ option }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Effective Date Row -->
      <div class="date-row">
        <div class="period-wrapper">
          <mat-form-field appearance="fill">
            <mat-label>Period</mat-label>
            <mat-select formControlName="effectiveDatePeriod">
              <mat-option *ngFor="let period of periodOptions" [value]="period">
                {{ period }}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <div class="filter-error" *ngIf="getEffectiveDatePeriodError()" role="alert">
            {{ getEffectiveDatePeriodError() }}
          </div>
        </div>

        <mat-form-field appearance="fill">
          <mat-label>Effective Date</mat-label>
          <input
            #effectiveDateInput
            matInput
            [matDatepicker]="effectiveDatePicker"
            formControlName="effectiveDate"
            [errorStateMatcher]="effDateErrorMatcher"
            (input)="onEffectiveDateInput($event)"
            (blur)="onEffectiveDateBlur(effectiveDateInput)"
            (keydown.enter)="$event.target.blur()">
          <mat-datepicker-toggle matIconSuffix [for]="effectiveDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #effectiveDatePicker></mat-datepicker>
          <mat-error *ngIf="getEffDateError()">
            {{ getEffDateError() }}
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Termination Date Row -->
      <div class="date-row">
        <div class="period-wrapper">
          <mat-form-field appearance="fill">
            <mat-label>Period</mat-label>
            <mat-select formControlName="terminationDatePeriod">
              <mat-option *ngFor="let period of periodOptions" [value]="period">
                {{ period }}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <div class="filter-error" *ngIf="getTerminationDatePeriodError()" role="alert">
            {{ getTerminationDatePeriodError() }}
          </div>
        </div>

        <mat-form-field appearance="fill">
          <mat-label>Termination Date</mat-label>
          <input
            #terminationDateInput
            matInput
            [matDatepicker]="terminationDatePicker"
            formControlName="terminationDate"
            [errorStateMatcher]="termDateErrorMatcher"
            (input)="onTerminationDateInput($event)"
            (blur)="onTerminationDateBlur(terminationDateInput)"
            (keydown.enter)="$event.target.blur()">
          <mat-datepicker-toggle matIconSuffix [for]="terminationDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #terminationDatePicker></mat-datepicker>
          <mat-error *ngIf="getTermDateError()">
            {{ getTermDateError() }}
          </mat-error>
        </mat-form-field>
      </div>

    </form>
  </div>

</app-filter-panel-base>
