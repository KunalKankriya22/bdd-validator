<!-- donor-decision-codes.html -->
<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="donor-decision-codes-table main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Donor Decision Codes content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="donor-decision-codes-table__card" #tableCard>

      <!-- Table Controls with Inline Filter Chips -->
      <div class="donor-decision-codes-table__controls">
        <!-- Left section: Filter button and chips -->
        <div class="donor-decision-codes-table__controls-left">
          <button
            #filterBtn
            type="button"
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            [attr.aria-label]="'Open filter options'"
            [attr.aria-expanded]="isFilterOpen"
            (click)="openFilter()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips
            *ngIf="hasActiveFilters()"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right section: Search bar -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)" />
      </div>

      <!-- Error State -->
      <div
        *ngIf="hasError && !isLoading"
        class="donor-decision-codes-table__error"
        role="alert"
        [attr.aria-label]="'Error loading data'">
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <p class="error-message">{{ errorMessage }}</p>
        <button type="button" mat-raised-button color="primary" (click)="loadTableData()">
          Retry
        </button>
      </div>

      <!-- Data Table -->
      <div class="donor-decision-codes-table__table-wrapper">
        <app-data-table
          *ngIf="!hasError"
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          [highlightedRow]="editingRow"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen" role="complementary" [attr.aria-label]="'Donor decision code details panel'">
    <app-add-edit-donor-decision-code
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()"
      (modeChange)="onModeChange($event)">
    </app-add-edit-donor-decision-code>
  </div>

</div>
