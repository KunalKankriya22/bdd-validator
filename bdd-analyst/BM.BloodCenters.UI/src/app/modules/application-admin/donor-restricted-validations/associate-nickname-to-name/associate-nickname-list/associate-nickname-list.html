<div class="layout-wrapper" [class.side-panel-active]="isSidePanelOpen">
  <div class="main-content associate-nickname-container" [class.side-panel-active]="isSidePanelOpen">
      <!-- Page Header -->
      <app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>

      <!-- Table Section -->
      <div class="table-container" role="region" aria-label="Nickname associations list">
    <!-- Filter + Search Row -->
    <div class="table-actions">
      <!-- Left: Filter + Chips -->
      <div class="define-max-donations__controls-left">
        <button
          #filterBtn
          type="button"
          mat-button
          class="filter-button"
          [class.filter-button--active]="isFilterPanelOpen"
          aria-label="Open filter options"
          (click)="openFilter($event)">
          <span class="filter-icon" aria-hidden="true"></span>
          FILTER
        </button>

        <!-- Filter Chips -->
          <app-filter-chips
            *ngIf="activeFilterChips.length"
            [chips]="activeFilterChips"
            [maxVisible]="3"
            (removeChip)="removeFilter($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
      </div>

      <!-- Right: Search -->
      <app-search-bar
        [config]="searchConfig"
        [searchText]="searchTerm"
        (search)="onSearch($event)" />
    </div>

    <!-- Loading Spinner - outside scroll area -->
    <div class="loader" *ngIf="isLoading" role="alert" aria-live="polite">
      <mat-spinner diameter="48" aria-label="Loading nickname associations"></mat-spinner>
      <p class="loader__text">Loading data...</p>
    </div>

    <!-- Table + Paginator (hidden during load) -->
    <ng-container *ngIf="!isLoading">
    <!-- Table -->
    <div class="table-scroll">
      <table mat-table [dataSource]="dataSource" aria-describedby="page-title">
        <!-- Nick Name Column -->
        <ng-container matColumnDef="nickName">
          <th mat-header-cell *matHeaderCellDef scope="col" class="data-table__header--sortable">
            <button class="data-table__sort-button"
              [class.data-table__sort-button--active]="sortColumn === 'nickName'"
              (click)="onSortClick()"
              [attr.aria-label]="'Sort by Nick Name'">
              <span class="data-table__sort-text">Nick Name</span>
              <mat-icon class="data-table__sort-icon"
                [class.data-table__sort-icon--active]="sortColumn === 'nickName'"
                aria-hidden="true">
                {{ sortColumn === 'nickName' && sortDirection !== 'default' ? (sortDirection === 'A' ? 'arrow_upward' : 'arrow_downward') : 'unfold_more' }}
              </mat-icon>
            </button>
          </th>
          <td mat-cell *matCellDef="let row">{{ row.nickName }}</td>
        </ng-container>

        <!-- First Name Column -->
        <ng-container matColumnDef="firstName">
          <th mat-header-cell *matHeaderCellDef scope="col">First Name</th>
          <td mat-cell *matCellDef="let row">{{ row.firstName }}</td>
        </ng-container>

        <!-- Effective Date Column -->
        <ng-container matColumnDef="effDate">
          <th mat-header-cell *matHeaderCellDef scope="col">Effective Date</th>
          <td mat-cell *matCellDef="let row">{{ formatDate(row.effDate) }}</td>
        </ng-container>

        <!-- Termination Date Column -->
        <ng-container matColumnDef="termDate">
          <th mat-header-cell *matHeaderCellDef scope="col">Termination Date</th>
          <td mat-cell *matCellDef="let row">{{ row.termDate ? formatDate(row.termDate) : '-' }}</td>
        </ng-container>

        <!-- Status Column -->
        <!-- <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef scope="col">Status</th>
          <td mat-cell *matCellDef="let row">
            <span class="status-badge" [ngClass]="getStatusClass(row)">
              {{ getStatusText(row) }}
            </span>
          </td>
        </ng-container> -->

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef scope="col">
            <span class="sr-only">Actions</span>
          </th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button (click)="openEditDialog(row)"
              [attr.aria-label]="'Edit nickname association for ' + row.nickName">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- Header Row -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>

        <!-- Data Rows -->
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="data-row"
          [class.selected-row]="sidePanelData?.nickName === row.nickName && sidePanelData?.firstName === row.firstName"></tr>
      </table>

      <!-- Empty State -->
      <div class="empty-state" *ngIf="dataSource.data.length === 0">
        <p>No nickname associations found.</p>
      </div>
    </div>

      <!-- Paginator -->
      <mat-paginator [pageSize]="pageSize" [pageSizeOptions]="[10, 25, 50, 100]" [length]="totalRecords"
        [pageIndex]="pageIndex" (page)="onPageChange($event)" showFirstLastButtons
        aria-label="Select page of nickname associations">
      </mat-paginator>
    </ng-container>
    </div>
  </div>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="isSidePanelOpen">
    <app-add-update-associate-nickname [mode]="sidePanelMode" [data]="sidePanelData"
      (closePanel)="onPanelClose()" (saveSuccess)="onSaveSuccess($event)" (modeChange)="onModeChange($event)">
    </app-add-update-associate-nickname>
  </div>
</div>
