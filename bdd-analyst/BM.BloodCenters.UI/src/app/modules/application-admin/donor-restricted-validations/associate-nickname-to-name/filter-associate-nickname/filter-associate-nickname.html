<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title" tabindex="-1" #filterTitle>Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()" tabindex="0">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Effective Date: Period (100px) + Date field (180px flex) -->
    <div class="filter-panel__date-row">
      <div class="period-field" [class.error-state]="effDatePeriodRequired">
        <mat-form-field appearance="fill">
          <mat-label [ngStyle]="{ color: effDatePeriodRequired ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="effDateType">
            <mat-option *ngFor="let period of periodOptions" [value]="period.value">
              {{ period.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <div class="period-error" role="alert" *ngIf="effDatePeriodRequired">Period is required</div>
      </div>
      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Effective Date</mat-label>
        <input
          matInput
          [matDatepicker]="picker1"
          formControlName="effDate"
          [errorStateMatcher]="effDateErrorMatcher"
          (input)="onEffectiveDateInput($event)"
          (keydown.enter)="$event.target.blur()">
        <mat-datepicker-toggle matIconSuffix [for]="picker1"></mat-datepicker-toggle>
        <mat-datepicker #picker1></mat-datepicker>
        <mat-error *ngIf="effDateError">{{ effDateError }}</mat-error>
      </mat-form-field>
    </div>

    <div class="filter-panel__error" role="alert" *ngIf="showEffectiveDatePeriodError">
      Period is required
    </div>

    <!-- Termination Date: Period (100px) + Date field (180px flex) -->
    <div class="filter-panel__date-row">
      <div class="period-field" [class.error-state]="termDatePeriodRequired">
        <mat-form-field appearance="fill">
          <mat-label [ngStyle]="{ color: termDatePeriodRequired ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="termDateType">
            <mat-option *ngFor="let period of periodOptions" [value]="period.value">
              {{ period.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <div class="period-error" role="alert" *ngIf="termDatePeriodRequired">Period is required</div>
      </div>
      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Termination Date</mat-label>
        <input
          matInput
          [matDatepicker]="picker2"
          formControlName="termDate"
          [errorStateMatcher]="termDateErrorMatcher"
          (input)="onTerminationDateInput($event)"
          (keydown.enter)="$event.target.blur()">
        <mat-datepicker-toggle matIconSuffix [for]="picker2"></mat-datepicker-toggle>
        <mat-datepicker #picker2></mat-datepicker>
        <mat-error *ngIf="termDateError">{{ termDateError }}</mat-error>
      </mat-form-field>
    </div>

    <div class="filter-panel__error" role="alert" *ngIf="showTerminationDatePeriodError">
      Period is required
    </div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <div class="footer-actions">
      <button mat-stroked-button type="button" class="clear-btn" (click)="onClearAll()">CLEAR ALL</button>
      <button mat-raised-button type="button" class="apply-btn" (click)="onApply()" [disabled]="isApplyDisabled">APPLY</button>
    </div>
  </footer>

</section>
