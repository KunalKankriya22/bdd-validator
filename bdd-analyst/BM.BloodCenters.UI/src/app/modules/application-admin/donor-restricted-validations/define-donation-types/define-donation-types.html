<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="define-donation-types main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Define Donation Types content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="define-donation-types__card" #tableCard>

      <!-- Table Controls with Search -->
      <div class="define-donation-types__controls">
        <!-- Left section: Filter button and chips -->
        <div class="define-donation-types__controls-left">
          <button
            #filterBtn
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            aria-label="Open filter options"
            cdkOverlayOrigin
            #trigger="cdkOverlayOrigin"
            (click)="toggleFilter()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <!-- Filter Chips -->
          <app-filter-chips
            *ngIf="filterChips.length > 0"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="removeFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right section: Search bar -->
        <div class="define-donation-types__controls-right">
          <app-search-bar
            [config]="searchConfig"
            (search)="onSearch($event)" />
        </div>
      </div>

      <!-- Filter Panel Overlay -->
      <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="trigger"
        [cdkConnectedOverlayOpen]="isFilterOpen"
        [cdkConnectedOverlayHasBackdrop]="true"
        [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
        [cdkConnectedOverlayOffsetY]="16"
        cdkConnectedOverlayPanelClass="filter-overlay-panel"
        (backdropClick)="closeFilter()"
        (detach)="closeFilter()">
        <app-define-donation-types-filter-panel
          [currentFilters]="appliedFilters"
          [donationTypeCodes]="donationTypeCodes"
          [sequences]="sequences"
          (apply)="applyFilters($event)"
          (close)="closeFilter()">
        </app-define-donation-types-filter-panel>
      </ng-template>

      <!-- Error State -->
      <div
        *ngIf="hasError && !isLoading"
        class="define-donation-types__error"
        role="alert"
        aria-label="Error loading data">
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <p class="error-message">{{ errorMessage }}</p>
        <button type="button" mat-raised-button color="primary" (click)="loadData()">
          Retry
        </button>
      </div>

      <!-- Data Table -->
      <div class="define-donation-types__table-wrapper">
        <app-data-table
          *ngIf="!hasError"
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          [highlightedRow]="sidePanelMode === 'edit' ? sidePanelData : null"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)"
          (rowClick)="onRowClick($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-add-edit-donation-type
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()">
    </app-add-edit-donation-type>
  </div>

</div>
