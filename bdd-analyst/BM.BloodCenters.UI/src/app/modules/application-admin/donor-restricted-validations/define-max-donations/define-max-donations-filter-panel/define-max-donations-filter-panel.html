<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <div class="filter-panel__content">
    <form [formGroup]="filterForm">

      <mat-form-field appearance="fill">
        <mat-label>Donation Type</mat-label>
        <mat-select formControlName="donationType">
          <mat-option>
            <ngx-mat-select-search
              [formControl]="donationTypeSearchControl"
              placeholderLabel="Search donation types..."
              noEntriesFoundLabel="No matching donation types">
            </ngx-mat-select-search>
          </mat-option>
          <mat-option *ngFor="let type of filteredDonationTypes" [value]="type.donationType">
            {{ type.donationType }}{{ type.donationTypeDescription ? ' — ' + type.donationTypeDescription : '' }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Period and Effective Date -->
      <div class="date-row">
        <div class="period-field">
          <mat-form-field appearance="fill">
            <mat-label>Period</mat-label>
            <mat-select formControlName="periodType1">
              <mat-option value="After">After</mat-option>
              <mat-option value="Before">Before</mat-option>
            </mat-select>
          </mat-form-field>
          <div class="period-error" role="alert" *ngIf="filterForm.get('periodType1')?.hasError('required') && filterForm.get('periodType1')?.touched">Period is required</div>
        </div>

        <div class="date-field">
          <mat-form-field appearance="fill">
            <mat-label>Effective Date</mat-label>
            <input
              #effectiveDateInput
              matInput
              [matDatepicker]="pickerEffective"
              formControlName="effectiveDate"
              placeholder="DD-MMM-YYYY"
              [errorStateMatcher]="effDateErrorMatcher"
              (input)="onEffectiveDateInput($event)"
              (blur)="onEffectiveDateBlur(effectiveDateInput)">
            <mat-datepicker-toggle matIconSuffix [for]="pickerEffective"></mat-datepicker-toggle>
            <mat-datepicker #pickerEffective></mat-datepicker>
          </mat-form-field>
          <div class="period-error" role="alert" *ngIf="(filterForm.get('effectiveDate')?.hasError('invalidDateFormat') || filterForm.get('effectiveDate')?.hasError('matDatepickerParse')) && filterForm.get('effectiveDate')?.touched">Invalid date</div>
        </div>
      </div>

      <!-- Period and Termination Date -->
      <div class="date-row">
        <div class="period-field">
          <mat-form-field appearance="fill">
            <mat-label>Period</mat-label>
            <mat-select formControlName="periodType2">
              <mat-option value="After">After</mat-option>
              <mat-option value="Before">Before</mat-option>
            </mat-select>
          </mat-form-field>
          <div class="period-error" role="alert" *ngIf="filterForm.get('periodType2')?.hasError('required') && filterForm.get('periodType2')?.touched">Period is required</div>
        </div>

        <div class="date-field">
          <mat-form-field appearance="fill">
            <mat-label>Termination Date</mat-label>
            <input
              #terminationDateInput
              matInput
              [matDatepicker]="pickerTerm"
              formControlName="terminationDate"
              placeholder="DD-MMM-YYYY"
              [errorStateMatcher]="termDateErrorMatcher"
              (input)="onTerminationDateInput($event)"
              (blur)="onTerminationDateBlur(terminationDateInput)">
            <mat-datepicker-toggle matIconSuffix [for]="pickerTerm"></mat-datepicker-toggle>
            <mat-datepicker #pickerTerm></mat-datepicker>
          </mat-form-field>
          <div class="period-error" role="alert" *ngIf="(filterForm.get('terminationDate')?.hasError('invalidDateFormat') || filterForm.get('terminationDate')?.hasError('matDatepickerParse')) && filterForm.get('terminationDate')?.touched">Invalid date</div>
        </div>
      </div>

    </form>
  </div>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
