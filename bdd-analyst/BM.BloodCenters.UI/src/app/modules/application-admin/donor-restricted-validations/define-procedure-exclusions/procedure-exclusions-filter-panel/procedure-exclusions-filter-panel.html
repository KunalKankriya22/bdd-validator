<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <mat-form-field appearance="fill">
      <mat-label>Donation Type</mat-label>
      <mat-select formControlName="donationType"
        (openedChange)="onSelectOpenedChange(donationTypeSearchCtrl, $event)">
        <mat-select-trigger>{{ selectedDonationTypeDisplay }}</mat-select-trigger>
        <mat-option>
          <ngx-mat-select-search [formControl]="donationTypeSearchCtrl" placeholderLabel="Search..." noEntriesFoundLabel="No results found"></ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredDonationTypes()" [value]="option.value">
          {{ option.key }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Procedure</mat-label>
      <mat-select formControlName="procedureCode"
        (openedChange)="onSelectOpenedChange(procedureSearchCtrl, $event)">
        <mat-select-trigger>{{ selectedProcedureDisplay }}</mat-select-trigger>
        <mat-option>
          <ngx-mat-select-search [formControl]="procedureSearchCtrl" placeholderLabel="Search..." noEntriesFoundLabel="No results found"></ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredProcedures()" [value]="option.value">
          {{ option.key }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Interdiction</mat-label>
      <mat-select formControlName="interdictionCode"
        (openedChange)="onSelectOpenedChange(interdictionSearchCtrl, $event)">
        <mat-select-trigger>{{ selectedInterdictionDisplay }}</mat-select-trigger>
        <mat-option>
          <ngx-mat-select-search [formControl]="interdictionSearchCtrl" placeholderLabel="Search..." noEntriesFoundLabel="No results found"></ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredInterdictions()" [value]="option.value">
          {{ option.key }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
