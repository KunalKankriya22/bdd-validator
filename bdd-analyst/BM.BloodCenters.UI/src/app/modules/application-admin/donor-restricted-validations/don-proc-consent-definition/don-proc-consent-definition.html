<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="don-proc-consent-definition main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Donation/Procedure Consent Definition content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="don-proc-consent-definition__card" #tableCard>

      <!-- Table Controls with Inline Filter Chips -->
      <div class="don-proc-consent-definition__controls">
        <!-- Left section: Filter button and chips -->
        <div class="don-proc-consent-definition__controls-left">
          <button
            #filterBtn
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            aria-label="Open filter options"
            (click)="openFilter()">
            <mat-icon aria-hidden="true">filter_list</mat-icon>
            FILTER
          </button>

          <!-- Inline Filter Chips - Full view when panel closed -->
          <app-filter-chips
            *ngIf="hasActiveFilters() && !sidePanelOpen"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>

          <!-- Compact Filter Indicator - When panel is open -->
          <div *ngIf="hasActiveFilters() && sidePanelOpen" class="filter-chips-compact">
            <div
              class="filter-count-badge"
              [matTooltip]="getCompactFilterTooltip()"
              matTooltipPosition="above"
              matTooltipClass="compact-filter-tooltip">
              +{{ filterChips.length }}
            </div>
            <button
              type="button"
              class="clear-filters-compact"
              aria-label="Clear all applied filters"
              (click)="clearAllFilters()">
              CLEAR
            </button>
          </div>
        </div>

        <!-- Right section: Search bar -->
        <div class="don-proc-consent-definition__controls-right">
          <app-search-bar
            [config]="searchConfig"
            (search)="onSearch($event)" />
        </div>
      </div>

      <!-- Error State -->
      <div
        *ngIf="hasError && !isLoading"
        class="don-proc-consent-definition__error"
        role="alert"
        aria-label="Error loading data">
        <mat-icon aria-hidden="true">inbox</mat-icon>
        <p class="error-message">{{ errorMessage }}</p>
      </div>

      <!-- Data Table -->
      <div class="don-proc-consent-definition__table-wrapper">
        <app-data-table
          *ngIf="!hasError && dataSource.length > 0"
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          [keepActiveRow]="sidePanelOpen"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-add-edit-consent-mapping
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()"
      (modeChange)="onModeChange($event)">
    </app-add-edit-consent-mapping>
  </div>

</div>
