<section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title"
  [style.max-height.px]="maxHeight">

  <!-- Header -->
  <header class="filter-panel__header">
    <h1 id="filter-title" style="font-size: 16px; font-weight: 400; margin: 0;">
      Filters
    </h1>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Interdiction -->
    <mat-form-field appearance="fill">
      <mat-label>Interdiction</mat-label>
      <mat-select formControlName="interdiction">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="interdictionSearchControl"
            placeholderLabel="Search Interdiction..."
            noEntriesFoundLabel="No matching interdictions"
            [enableClearOnEscapePressed]="true"
            aria-label="Search interdictions">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredInterdictionOptions" [value]="option.value">
          {{ option.display }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Effective Date Row -->
    <div class="date-row" role="group" aria-label="Effective date filter">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label [ngStyle]="{ color: getEffectiveDatePeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
        <mat-select formControlName="effectiveDatePeriod">
          <mat-option *ngFor="let period of periodOptions" [value]="period.value">
            {{ period.display }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="getEffectiveDatePeriodError()">
          {{ getEffectiveDatePeriodError() }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Effective Date</mat-label>
        <input
          matInput
          [matDatepicker]="effectivePicker"
          formControlName="effectiveDate"
          (input)="onEffectiveDateInput($event)"
          (blur)="onEffectiveDateBlur()"
          (keydown.enter)="$event.target.blur()"
          aria-label="Effective Date">
        <mat-datepicker-toggle matIconSuffix [for]="effectivePicker"></mat-datepicker-toggle>
        <mat-datepicker #effectivePicker></mat-datepicker>
        <mat-error *ngIf="getEffectiveDateError()">
          {{ getEffectiveDateError() }}
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Termination Date Row -->
    <div class="date-row" role="group" aria-label="Termination date filter">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label [ngStyle]="{ color: getTerminationDatePeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
        <mat-select formControlName="terminationDatePeriod">
          <mat-option *ngFor="let period of periodOptions" [value]="period.value">
            {{ period.display }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="getTerminationDatePeriodError()">
          {{ getTerminationDatePeriodError() }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Termination Date</mat-label>
        <input
          matInput
          [matDatepicker]="terminationPicker"
          formControlName="terminationDate"
          (input)="onTerminationDateInput($event)"
          (blur)="onTerminationDateBlur()"
          (keydown.enter)="$event.target.blur()"
          aria-label="Termination Date">
        <mat-datepicker-toggle matIconSuffix [for]="terminationPicker"></mat-datepicker-toggle>
        <mat-datepicker #terminationPicker></mat-datepicker>
        <mat-error *ngIf="getTerminationDateError()">
          {{ getTerminationDateError() }}
        </mat-error>
      </mat-form-field>
    </div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()" aria-label="Clear all filters">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled" aria-label="Apply filters">
      APPLY
    </button>
  </footer>

</section>
