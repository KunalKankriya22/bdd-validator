<app-page-header-with-breadcrumb [config]="headerConfig" />

<div class="test-configuration-container">
  <mat-tab-group [(selectedIndex)]="selectedTabIndex" (selectedTabChange)="onTabChange($event)" class="test-configuration-tabs">
    <mat-tab>
      <ng-template mat-tab-label>
        <span class="tab-icon-svg" aria-hidden="true"></span>
        Lab Tests
      </ng-template>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon" aria-hidden="true">person</mat-icon>
        Donor Tests
      </ng-template>
    </mat-tab>

    <mat-tab>
      <ng-template mat-tab-label>
        <span class="tab-icon-svg override-rules-icon" aria-hidden="true"></span>
        Override Rules
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>

<router-outlet></router-outlet>
