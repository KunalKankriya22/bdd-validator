<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="isDialogOpen">

  <!-- Backdrop Overlay -->
  <div class="drawer-backdrop" [class.active]="isDialogOpen" aria-hidden="true"></div>

  <!-- Main Content Area -->
  <main class="valid-facility-identifiers main-content" [class.side-panel-active]="isDialogOpen"
        aria-label="Valid Facility Identifiers content">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

  <!-- Table Card Container -->
  <div class="valid-facility-identifiers__card" #tableCard>

    <!-- Table Controls with Search -->
    <div class="valid-facility-identifiers__controls">
      <!-- Left section: Filter button and chips -->
      <div class="valid-facility-identifiers__controls-left">
        <button
          #filterBtn
          type="button"
          mat-button
          class="filter-button"
          [class.filter-button--active]="isFilterOpen"
          aria-label="Open filter options"
          cdkOverlayOrigin
          #trigger="cdkOverlayOrigin"
          (click)="toggleFilterPanel()">
          <mat-icon aria-hidden="true">filter_list</mat-icon>
          FILTER
        </button>

        <!-- Filter Chips -->
        <app-filter-chips
          *ngIf="filterChips.length > 0"
          [chips]="filterChips"
          (removeChip)="removeFilterChip($event)"
          (clearAll)="clearAllFilters()">
        </app-filter-chips>
      </div>

      <!-- Right section: Search bar -->
      <div class="valid-facility-identifiers__controls-right">
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)" />
      </div>
    </div>

    <!-- Filter Panel Overlay -->
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="trigger"
      [cdkConnectedOverlayOpen]="isFilterOpen"
      [cdkConnectedOverlayHasBackdrop]="true"
      [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
      [cdkConnectedOverlayOffsetY]="4"
      cdkConnectedOverlayPanelClass="filter-overlay-panel"
      (backdropClick)="closeFilterPanel()"
      (detach)="closeFilterPanel()">
      <app-valid-facility-identifiers-filter-panel
        [currentFilters]="appliedFilters"
        (apply)="applyFilters($event)"
        (close)="closeFilterPanel()">
      </app-valid-facility-identifiers-filter-panel>
    </ng-template>

    <!-- Error State -->
    <div
      *ngIf="hasError && !isLoading"
      class="valid-facility-identifiers__error"
      role="alert"
      aria-label="Error loading data">
      <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
      <p class="error-message">Unable to load data. Please try again.</p>
      <button type="button" mat-raised-button color="primary" (click)="loadData()">
        Retry
      </button>
    </div>

    <!-- Data Table -->
    <div class="valid-facility-identifiers__table-wrapper">
      <app-data-table
        *ngIf="!hasError"
        [config]="tableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        [highlightedRow]="editingRow"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)" />
    </div>
  </div>
  </main>

</div>
