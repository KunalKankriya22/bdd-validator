<section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" [attr.aria-label]="'Close filter panel'" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content" [attr.aria-label]="'Filter options'">

    <!-- Requested Inventory Product Type -->
    <mat-form-field appearance="fill">
      <mat-label>Requested Inventory Product Type</mat-label>
      <mat-select formControlName="requestProductType" (selectionChange)="blurField()">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="requestProductTypeSearchCtrl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No results found">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredRequestProductTypeOptions()" [value]="option.code">
          {{ option.code }} - {{ option.description }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Compatible Inventory Product Type -->
    <mat-form-field appearance="fill">
      <mat-label>Compatible Inventory Product Type</mat-label>
      <mat-select formControlName="compatibleProductType" (selectionChange)="blurField()">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="compatibleProductTypeSearchCtrl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No results found">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredCompatibleProductTypeOptions()" [value]="option.code">
          {{ option.code }} - {{ option.description }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Effective Date Row -->
    <div class="filter-panel__date-row" role="group" [attr.aria-label]="'Effective date filter'">
      <mat-form-field appearance="fill" class="filter-panel__period-field">
        <mat-label [ngStyle]="{ color: getEffectiveDatePeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
        <mat-select formControlName="effectiveDatePeriod" (selectionChange)="blurField()">
          <mat-option *ngFor="let period of periodOptions" [value]="period">
            {{ period }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="getEffectiveDatePeriodError() as error">
          {{ error }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="filter-panel__date-field">
        <mat-label>Effective Date</mat-label>
        <input
          matInput
          [matDatepicker]="effectiveDatePicker"
          formControlName="effectiveDate"
          (input)="onEffectiveDateInput($event)"
          (keydown.enter)="$event.target.blur()"
          >
        <mat-datepicker-toggle matIconSuffix [for]="effectiveDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #effectiveDatePicker></mat-datepicker>
        <mat-error *ngIf="getEffectiveDateError() as error">
          {{ error }}
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Termination Date Row -->
    <div class="filter-panel__date-row" role="group" [attr.aria-label]="'Termination date filter'">
      <mat-form-field appearance="fill" class="filter-panel__period-field">
        <mat-label [ngStyle]="{ color: getTerminationDatePeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
        <mat-select formControlName="terminationDatePeriod" (selectionChange)="blurField()">
          <mat-option *ngFor="let period of periodOptions" [value]="period">
            {{ period }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="getTerminationDatePeriodError() as error">
          {{ error }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="filter-panel__date-field">
        <mat-label>Termination Date</mat-label>
        <input
          matInput
          [matDatepicker]="terminationDatePicker"
          formControlName="terminationDate"
          [min]="getTerminationDateMin()"
          (input)="onTerminationDateInput($event)"
          (keydown.enter)="$event.target.blur()"
          >
        <mat-datepicker-toggle matIconSuffix [for]="terminationDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #terminationDatePicker></mat-datepicker>
        <mat-error *ngIf="getTerminationDateError() as error">
          {{ error }}
        </mat-error>
      </mat-form-field>
    </div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()" [attr.aria-label]="'Clear all filters'">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled" [attr.aria-label]="'Apply filters'">
      APPLY
    </button>
  </footer>

</section>
