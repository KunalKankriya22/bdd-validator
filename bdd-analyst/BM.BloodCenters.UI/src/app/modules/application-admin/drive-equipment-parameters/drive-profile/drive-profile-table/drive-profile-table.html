<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen()">
  <!-- Main Content Area -->
  <main class="main-content" [class.side-panel-active]="sidePanelOpen()">
    <div class="drive-profile-table-container">
      <!-- Table Card -->
      <!-- Table Header -->
      <div class="table-header">
        <h2 class="section-title">Drive Profile</h2>
        <button mat-flat-button color="primary" class="add-button" (click)="addRecord()"
          aria-label="Add new drive profile">
          <mat-icon class="add-icon">add</mat-icon>
          ADD NEW DRIVE PROFILE
        </button>
      </div>
      <div class="table-header" #filterAnchor>
        <div class="controls-left">
          <button
            #filterButton
            mat-button
            class="filter-button"
            [class.filter-button--active]="!!overlayRef"
            (click)="openFilter()"
            aria-label="Open filters">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          @if (hasActiveFilters()) {
          <app-filter-chips [chips]="filterChips()" [maxVisible]="10" (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()" />
          }
        </div>
        <div class="controls-right">
          <app-search-bar [config]="searchConfig" (search)="onSearch($event)" />
        </div>
      </div>

      <div class="table-card" #tableCard>

        <!-- Table Controls -->
        <!-- <div class="table-controls">
          <div class="controls-left">
            <button mat-button class="filter-button" (click)="openFilter()" aria-label="Open filters">
              <mat-icon>filter_list</mat-icon>
              FILTER
            </button>

            @if (hasActiveFilters()) {
            <app-filter-chips [chips]="filterChips()" [maxVisible]="3" (removeChip)="onRemoveFilterChip($event)"
              (clearAll)="clearAllFilters()" />
            }
          </div>

          <div class="controls-right">
            <app-search-bar [config]="searchConfig" (search)="onSearch($event)" />
          </div>
        </div> -->

        <!-- Data Table -->
        <app-data-table [config]="tableConfig" [data]="data()" [loading]="loading()" [highlightedRow]="highlightedRecord()"
          (pageChange)="onPageChange($event)" (sortChange)="onSortChange($event)" (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  @if (sidePanelOpen()) {
  <div class="side-panel-container">
    <app-add-edit-drive-profile [mode]="sidePanelMode()" [data]="sidePanelData()" (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()" (refreshData)="onRefreshData()" />
  </div>
  }
</div>
