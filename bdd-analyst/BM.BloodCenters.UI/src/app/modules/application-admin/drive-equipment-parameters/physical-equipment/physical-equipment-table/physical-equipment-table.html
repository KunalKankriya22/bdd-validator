<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen()">
  <!-- Main Content Area -->
  <main class="main-content" [class.side-panel-active]="sidePanelOpen()">
    <div class="physical-equipment-table-container">
      <!-- Table Header with Add Button -->
      <div class="table-header table-header--top">
        <button mat-flat-button color="primary" class="add-button" (click)="addRecord()"
          aria-label="Add new physical equipment">
          <mat-icon class="add-icon" aria-hidden="true">add</mat-icon>
          ADD NEW PHYSICAL EQUIPMENT
        </button>
      </div>

      <!-- Filter Row -->
      <div class="table-header" #filterAnchor>
        <div class="controls-left">
          <button
            #filterButton
            mat-button
            class="filter-button"
            [class.filter-button--active]="!!overlayRef"
            (click)="openFilter()"
            aria-label="Open filters">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          @if (hasActiveFilters()) {
            <app-filter-chips
              [chips]="filterChips()"
              [maxVisible]="10"
              (removeChip)="onRemoveFilterChip($event)"
              (clearAll)="clearAllFilters()" />
          }
        </div>
        <div class="controls-right">
          <app-search-bar [config]="searchConfig" (search)="onSearch($event)" />
        </div>
      </div>

      <div class="table-card" #tableCard>
        <!-- Data Table -->
        <app-data-table
          [config]="tableConfig"
          [data]="data()"
          [loading]="loading()"
          [highlightedRow]="highlightedRecord()"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  @if (sidePanelOpen()) {
    <div class="side-panel-container">
      <app-add-edit-physical-equipment
        [mode]="sidePanelMode()"
        [data]="sidePanelData()"
        (closePanel)="closeSidePanel()"
        (saveSuccess)="onSaveSuccess()"
        (refreshData)="onRefreshData()" />
    </div>
  }
</div>
