<!-- Content Card: Table/Grid Content for Donor -->
<div class="content-card" role="region" aria-label="Donor error codes">
  <!-- Filter and Search Controls -->
  <div class="table-controls">
    <div class="table-controls__left">
      <button
        mat-button
        class="filter-button"
        [class.filter-button--active]="isFilterOpen"
        aria-label="Open filter dialog"
        [attr.aria-expanded]="isFilterOpen"
        aria-haspopup="dialog"
        (click)="openFilter($event)">
        <mat-icon aria-hidden="true">filter_list</mat-icon>
        FILTER
      </button>

      <!-- Inline Filter Chips -->
      <app-filter-chips
        *ngIf="hasActiveFilters()"
        [chips]="filterChips"
        [maxVisible]="3"
        (removeChip)="onRemoveFilterChip($event)"
        (clearAll)="clearAllFilters()">
      </app-filter-chips>
    </div>

    <div class="table-controls__right">
      <app-search-bar
        [config]="searchConfig"
        (search)="onSearch($event)" />
    </div>
  </div>

  <!-- Data Table -->
  <div class="table-wrapper">
    <app-data-table
      [config]="tableConfig"
      [data]="dataSource"
      [loading]="loading$()"
      [highlightedRow]="selectedRow"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (rowAction)="onRowAction($event)" />
  </div>
</div>
