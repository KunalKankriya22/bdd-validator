<div class="filter-container">
  <!-- Header -->
  <div class="filter-header">
    <h2 class="title" id="filter-dialog-title">Filters</h2>
    <button mat-icon-button class="close-btn" (click)="close()" [disableRipple]="true" aria-label="Close filter dialog">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="filter-body">

    <!-- Code range -->
    <div class="code-range">
      <div class="form-field-wrapper">
        <mat-form-field appearance="fill">
          <mat-label>Code From</mat-label>
          <input matInput
                 [(ngModel)]="codeFrom"
                 [placeholder]="isDonorTab() ? 'Enter code (00000-99999)' : 'Enter code (0000-9999)'"
                 [maxlength]="isDonorTab() ? 5 : 4"
                 inputmode="numeric"
                 (input)="onCodeFromInput($event)"
                 (blur)="onCodeFromBlur()">
          <mat-error *ngIf="getCodeFromError()">
            {{ getCodeFromError() }}
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-field-wrapper">
        <mat-form-field appearance="fill">
          <mat-label>Code To</mat-label>
          <input matInput
                 [(ngModel)]="codeTo"
                 [placeholder]="isDonorTab() ? 'Enter code (00000-99999)' : 'Enter code (0000-9999)'"
                 [maxlength]="isDonorTab() ? 5 : 4"
                 inputmode="numeric"
                 (input)="onCodeToInput($event)"
                 (blur)="onCodeToBlur()">
          <mat-error *ngIf="getCodeToError()">
            {{ getCodeToError() }}
          </mat-error>
        </mat-form-field>
      </div>
    </div>

    <!-- Type -->
    <mat-form-field appearance="fill">
      <mat-label>Type</mat-label>
      <mat-select [(ngModel)]="selectedType">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="typeSearchControl"
            placeholderLabel="Search types..."
            noEntriesFoundLabel="No matching types">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredTypeOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Audit -->
    <mat-form-field appearance="fill">
      <mat-label>Audit</mat-label>
      <mat-select [(ngModel)]="selectedAudit">
        <mat-option *ngFor="let option of auditOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Checkbox -->
    <mat-checkbox [(ngModel)]="showEmpty" class="empty-checkbox">
      Show Codes which has empty fields
    </mat-checkbox>
  </div>

  <!-- Footer -->
  <div class="filter-footer">
    <button mat-stroked-button class="clear-btn" (click)="clearAll()">
      CLEAR ALL
    </button>
    <button mat-raised-button class="apply-btn" (click)="apply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </div>
</div>
