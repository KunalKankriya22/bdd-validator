<div class="error-codes-container">
  <!-- Page Header with Breadcrumb -->
  <app-page-header-with-breadcrumb [config]="headerConfig" />

  <!-- Tabs Card -->
  <div class="tabs-card">
    <!-- Tabs -->
    <mat-tab-group class="error-codes-tabs" [selectedIndex]="selectedTabIndex" (selectedTabChange)="onTabChange($event)" aria-label="Error code categories">
      <mat-tab>
        <ng-template mat-tab-label>
          <img [src]="getTabIcon('donor')" class="tab-icon" alt="">
          <span>{{ 'ERROR_CODES.TABS.DONOR' | translate }}</span>
        </ng-template>
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <img [src]="getTabIcon('lab')" class="tab-icon" alt="">
          <span>{{ 'ERROR_CODES.TABS.LAB' | translate }}</span>
        </ng-template>
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <img [src]="getTabIcon('distribution')" class="tab-icon1" alt="">
          <span>{{ 'ERROR_CODES.TABS.DISTRIBUTION' | translate }}</span>
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  </div>

  <!-- Dynamic Component Content -->
  <router-outlet></router-outlet>
</div>
