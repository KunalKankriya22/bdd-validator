<!-- Content Card: Table/Grid Content -->
<div class="content-card">
  <!-- Data Table -->
  <div class="data-table">
    <table mat-table [dataSource]="dataSource" class="error-codes-table">
      <!-- Code Column -->
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>{{ 'ERROR_CODES.TABLE.COLUMNS.CODE' | translate }}</th>
        <td mat-cell *matCellDef="let element">{{ element.code }}</td>
      </ng-container>

      <!-- Type Column -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>{{ 'ERROR_CODES.TABLE.COLUMNS.TYPE' | translate }}</th>
        <td mat-cell *matCellDef="let element">{{ element.type }}</td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>{{ 'ERROR_CODES.TABLE.COLUMNS.DESCRIPTION' | translate }}</th>
        <td mat-cell *matCellDef="let element">{{ element.description }}</td>
      </ng-container>

      <!-- Audit Column -->
      <ng-container matColumnDef="audit">
        <th mat-header-cell *matHeaderCellDef>{{ 'ERROR_CODES.TABLE.COLUMNS.AUDIT' | translate }}</th>
        <td mat-cell *matCellDef="let element">{{ element.audit }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Pagination -->
  <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" 
                 [pageSize]="10"
                 showFirstLastButtons>
  </mat-paginator>
</div>
