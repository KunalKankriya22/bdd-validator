<section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content" aria-describedby="filter-desc">

    <!-- Effective Date Filter -->
    <div class="date-row">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label [ngStyle]="{ color: hasEffectivePeriodError ? '#b02828' : 'inherit' }">Period</mat-label>
        <mat-select formControlName="effectivePeriod">
          <mat-option value="AFTER">After</mat-option>
          <mat-option value="BEFORE">Before</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Effective Date</mat-label>
        <input
          #effectiveDateInput
          matInput
          [matDatepicker]="effPicker"
          formControlName="effectiveDate"
          (input)="onEffectiveDateInput($event)"
          (blur)="onEffectiveDateBlur(effectiveDateInput)"
        >
        <mat-datepicker-toggle matIconSuffix [for]="effPicker"></mat-datepicker-toggle>
        <mat-datepicker #effPicker></mat-datepicker>
        <mat-error *ngIf="filterForm.get('effectiveDate')?.hasError('invalidDateFormat')">
          Invalid date
        </mat-error>
        <mat-error *ngIf="filterForm.get('effectiveDate')?.hasError('matDatepickerParse')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>
    <div class="error-message" *ngIf="hasEffectivePeriodError">Period is required</div>

    <!-- Termination Date Filter -->
    <div class="date-row">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label [ngStyle]="{ color: hasTerminationPeriodError ? '#b02828' : 'inherit' }">Period</mat-label>
        <mat-select formControlName="terminationPeriod">
          <mat-option value="AFTER">After</mat-option>
          <mat-option value="BEFORE">Before</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Termination Date</mat-label>
        <input
          #terminationDateInput
          matInput
          [matDatepicker]="termPicker"
          formControlName="terminationDate"
          (input)="onTerminationDateInput($event)"
          (blur)="onTerminationDateBlur(terminationDateInput)"
        >
        <mat-datepicker-toggle matIconSuffix [for]="termPicker"></mat-datepicker-toggle>
        <mat-datepicker #termPicker></mat-datepicker>
        <mat-error *ngIf="filterForm.get('terminationDate')?.hasError('invalidDateFormat')">
          Invalid date
        </mat-error>
        <mat-error *ngIf="filterForm.get('terminationDate')?.hasError('matDatepickerParse')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>
    <div class="error-message" *ngIf="hasTerminationPeriodError">Period is required</div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
