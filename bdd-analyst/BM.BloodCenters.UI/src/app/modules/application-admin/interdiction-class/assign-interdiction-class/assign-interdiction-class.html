<!-- assign-interdiction-class.html -->
<!-- ARIA Live Region for Screen Reader Announcements -->
<div #announcer id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">
  
  <!-- Main Content Area -->
  <main class="assign-interdiction-class-table main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Assign Interdiction Class">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="assign-interdiction-class-table__card" #tableCard>
      
      <!-- Table Controls with Inline Filter Chips -->
      <div class="assign-interdiction-class-table__controls">
        <!-- Left section: Filter button and chips -->
        <div class="assign-interdiction-class-table__controls-left">
          <button
            #filterBtn
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            [attr.aria-label]="isFilterOpen ? 'Close filter options' : 'Open filter options'"
            [attr.aria-expanded]="isFilterOpen"
            matTooltip="Filter (Alt+F)"
            [matTooltipShowDelay]="800"
            (click)="openFilter()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips 
            *ngIf="hasActiveFilters()"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right section: Search bar -->
        <app-search-bar 
          [config]="searchConfig" 
          (search)="onSearch($event)" />
      </div>

      <!-- Error State -->
      <div
        *ngIf="hasError && !isLoading"
        class="assign-interdiction-class-table__error"
        role="status">
        <mat-icon class="empty-icon" aria-hidden="true">inbox</mat-icon>
        <p class="error-message">{{ errorMessage }}</p>
      </div>

      <!-- Data Table -->
      <div class="assign-interdiction-class-table__table-wrapper">
        <app-data-table
          *ngIf="!hasError"
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          [highlightedRow]="sidePanelMode === 'edit' ? sidePanelData : null"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen" cdkTrapFocus cdkTrapFocusAutoCapture>
    <app-add-edit-interdiction-class
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()"
      (modeChange)="onModeChange($event)">
    </app-add-edit-interdiction-class>
  </div>

</div>
