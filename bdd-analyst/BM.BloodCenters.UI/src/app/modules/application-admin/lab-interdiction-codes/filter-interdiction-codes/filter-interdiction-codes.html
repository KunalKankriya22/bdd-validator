<section class="filter-dialog-wrapper" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-dialog-header">
    <h2 id="filter-title" class="filter-title">Filters</h2>
    <button mat-icon-button type="button" class="close-btn" aria-label="Close filter panel" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-dialog-content">
    <!-- Type -->
    <mat-form-field appearance="fill">
      <mat-label>Type</mat-label>
      <mat-select formControlName="type" aria-label="Type">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="typeSearchControl"
            placeholderLabel="Search types..."
            noEntriesFoundLabel="No matching types">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let opt of filteredTypeOptions" [value]="opt.value">
          {{ opt.label }}
        </mat-option>
        <mat-option *ngIf="filteredTypeOptions.length === 0" disabled>
          No Data Available
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- System -->
    <mat-form-field appearance="fill">
      <mat-label>System</mat-label>
      <mat-select formControlName="system" aria-label="System">
        <mat-option *ngFor="let opt of systemOptions" [value]="opt.value">
          {{ opt.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Effective Date Row -->
    <div class="filter-row">
      <div class="period-field" [class.error-state]="effectivePeriodRequired">
        <mat-form-field appearance="fill">
          <mat-label [ngStyle]="{'color': effectivePeriodRequired ? '#b02828' : 'inherit'}">Period</mat-label>
          <mat-select formControlName="effectivePeriod">
            <mat-option value="After">After</mat-option>
            <mat-option value="Before">Before</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="period-error" *ngIf="effectivePeriodRequired">Period is required</div>
      </div>

      <div class="date-field">
        <mat-form-field appearance="fill">
          <mat-label>Effective Date</mat-label>
          <input
            #effDateNativeInput
            matInput
            [matDatepicker]="effPicker"
            formControlName="effectiveDate"
            (input)="onEffectiveDateInput($event)"
            (blur)="onEffectiveDateBlur(effDateNativeInput)"
            (keydown.enter)="$event.target.blur()"
            (keydown)="preventSpaceInput($event)"
            [errorStateMatcher]="effDateErrorMatcher"
            placeholder="DD-MMM-YYYY"
            aria-label="Effective date">
          <mat-datepicker-toggle matIconSuffix [for]="effPicker"></mat-datepicker-toggle>
          <mat-datepicker #effPicker></mat-datepicker>
        </mat-form-field>
        <div class="period-error" *ngIf="getEffectiveDateError()">{{ getEffectiveDateError() }}</div>
      </div>
    </div>

    <!-- Termination Date Row -->
    <div class="filter-row">
      <div class="period-field" [class.error-state]="terminationPeriodRequired">
        <mat-form-field appearance="fill">
          <mat-label [ngStyle]="{'color': terminationPeriodRequired ? '#b02828' : 'inherit'}">Period</mat-label>
          <mat-select formControlName="terminationPeriod">
            <mat-option value="Before">Before</mat-option>
            <mat-option value="After">After</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="period-error" *ngIf="terminationPeriodRequired">Period is required</div>
      </div>

      <div class="date-field">
        <mat-form-field appearance="fill">
          <mat-label>Termination Date</mat-label>
          <input
            #termDateNativeInput
            matInput
            [matDatepicker]="termPicker"
            formControlName="terminationDate"
            (input)="onTerminationDateInput($event)"
            (blur)="onTerminationDateBlur(termDateNativeInput)"
            (keydown.enter)="$event.target.blur()"
            (keydown)="preventSpaceInput($event)"
            [errorStateMatcher]="termDateErrorMatcher"
            placeholder="DD-MMM-YYYY"
            aria-label="Termination date">
          <mat-datepicker-toggle matIconSuffix [for]="termPicker"></mat-datepicker-toggle>
          <mat-datepicker #termPicker></mat-datepicker>
        </mat-form-field>
        <div class="period-error" *ngIf="getTerminationDateError()">{{ getTerminationDateError() }}</div>
      </div>
    </div>
  </form>

  <!-- Footer -->
  <footer class="filter-dialog-footer">
    <button mat-stroked-button type="button" (click)="clearAll()">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="apply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
