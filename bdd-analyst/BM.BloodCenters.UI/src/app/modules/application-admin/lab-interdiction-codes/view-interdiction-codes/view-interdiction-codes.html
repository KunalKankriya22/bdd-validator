<mat-sidenav-container class="sidenav-container" [class.drawer-active]="isDrawerOpen">
  <!-- Main Content -->
  <mat-sidenav-content class="page-container">
    <main class="main-content">
      <!-- ===== PAGE HEADER ===== -->
      <app-page-header-with-breadcrumb [config]="headerConfig" />

      <!-- Tabs -->
      <mat-tab-group
        class="custom-tabs"
        [(selectedIndex)]="selectedTabIndex"
        (selectedIndexChange)="onTabChange($event)"
      >
        <mat-tab>
          <ng-template mat-tab-label>
            <mat-icon>person</mat-icon>
            <span>Donor</span>
          </ng-template>
        </mat-tab>
        <mat-tab>
          <ng-template mat-tab-label>
            <img src="assets/images/error-codes/lab.svg" alt="" />
            <span>Lab</span>
          </ng-template>
        </mat-tab>
      </mat-tab-group>

      <div class="body-content" [class.drawer-open]="isDrawerOpen">
        <!-- Action Bar -->
        <div class="action-bar">
          <!-- Filter Button and Chips -->
          <div class="filter-section">
            <button
              mat-button
              class="filter-button"
              (click)="onFilter($event)"
              aria-label="Filter results"
            >
              <mat-icon>filter_list</mat-icon>
              FILTER
            </button>
            <app-filter-chips
              [chips]="filterChips"
              [maxVisible]="3"
              (removeChip)="removeFilter($event)"
              (clearAll)="clearAllFilters()"
            ></app-filter-chips>
          </div>
          <app-search-bar
            [config]="searchConfig"
            (search)="onSearch($event)"
            (cleared)="onSearchCleared()" />
        </div>

        <!-- Data Table -->
        <div class="table-container">
          <app-data-table
            *ngIf="dataSource.length > 0 || isLoading"
            [config]="tableConfig"
            [data]="dataSource"
            [loading]="isLoading"
            [keepActiveRow]="isDrawerOpen"
            (pageChange)="onPageChange($event)"
            (sortChange)="onSortChange($event)"
            (rowAction)="onRowAction($event)" />

          <!-- Custom Empty State -->
          <div class="empty-state" *ngIf="dataSource.length === 0 && !isLoading" role="status">
            <mat-icon class="empty-state-icon" aria-hidden="true">edit</mat-icon>
            <p>No interdiction codes available to display</p>
          </div>
        </div>
      </div>
    </main>
  </mat-sidenav-content>

  <!-- Drawer -->
  <mat-sidenav #drawer mode="side" position="end" [opened]="isDrawerOpen" class="drawer-sidenav" role="complementary" [attr.aria-label]="drawerMode === 'add' ? 'Add new interdiction code' : 'Edit interdiction code'">
    <app-add-new-code-interdiction
      *ngIf="isDrawerOpen"
      [mode]="drawerMode"
      [rowData]="drawerData"
      (closeDrawer)="closeDrawer()"
      (saved)="onDrawerSaved()"
    ></app-add-new-code-interdiction>
  </mat-sidenav>
</mat-sidenav-container>
