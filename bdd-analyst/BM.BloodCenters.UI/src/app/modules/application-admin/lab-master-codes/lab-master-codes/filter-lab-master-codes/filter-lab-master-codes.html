<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="closeDialog()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content" aria-describedby="filter-desc">

    <div class="filter-panel__date-row">
      <div class="period-wrapper">
        <mat-form-field appearance="fill" class="period-field" [class.has-error]="getEffectiveDatePeriodError()">
          <mat-label [ngStyle]="{ color: getEffectiveDatePeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="effectiveDatePeriod">
            <mat-option value="AFTER">After</mat-option>
            <mat-option value="BEFORE">Before</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="period-error" role="alert" *ngIf="getEffectiveDatePeriodError()">
          {{ getEffectiveDatePeriodError() }}
        </div>
      </div>

      <mat-form-field appearance="fill" class="date-field" [class.has-error]="getEffectiveDateError()">
        <mat-label>Effective Date</mat-label>
        <input
          matInput
          [matDatepicker]="effectiveDatePicker"
          formControlName="effectiveDate"
          [errorStateMatcher]="effDateErrorMatcher"
          (input)="onEffectiveDateInput($event)"
          (keydown.enter)="$event.target.blur()">
        <mat-datepicker-toggle matIconSuffix [for]="effectiveDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #effectiveDatePicker></mat-datepicker>
        <mat-error *ngIf="getEffectiveDateError()">Invalid date</mat-error>
      </mat-form-field>
    </div>

    <div class="filter-panel__date-row">
      <div class="period-wrapper">
        <mat-form-field appearance="fill" class="period-field" [class.has-error]="getTerminationDatePeriodError()">
          <mat-label [ngStyle]="{ color: getTerminationDatePeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="terminationDatePeriod">
            <mat-option value="AFTER">After</mat-option>
            <mat-option value="BEFORE">Before</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="period-error" role="alert" *ngIf="getTerminationDatePeriodError()">
          {{ getTerminationDatePeriodError() }}
        </div>
      </div>

      <mat-form-field appearance="fill" class="date-field" [class.has-error]="getTerminationDateError()">
        <mat-label>Termination Date</mat-label>
        <input
          matInput
          [matDatepicker]="terminationDatePicker"
          formControlName="terminationDate"
          [errorStateMatcher]="termDateErrorMatcher"
          (input)="onTerminationDateInput($event)"
          (keydown.enter)="$event.target.blur()">
        <mat-datepicker-toggle matIconSuffix [for]="terminationDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #terminationDatePicker></mat-datepicker>
        <mat-error *ngIf="getTerminationDateError()">Invalid date</mat-error>
      </mat-form-field>
    </div>
  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <div class="footer-actions">
      <button mat-stroked-button type="button" class="clear-btn" (click)="onClear()">CLEAR ALL</button>
      <button mat-raised-button type="button" class="apply-btn" (click)="onApply()" [disabled]="isApplyDisabled">APPLY</button>
    </div>
  </footer>

</section>
