<div class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title" cdkTrapFocus cdkTrapFocusAutoCapture>

  <!-- Header -->
  <header class="filter-header">
    <h2 class="title" id="filter-title">Filters</h2>
    <button mat-icon-button type="button" class="close-btn" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Body -->
  <div class="filter-body">
    <form [formGroup]="filterForm">

      <!-- Chapter ID Dropdown - searchable -->
      <mat-form-field appearance="fill">
        <mat-label>Chapter ID</mat-label>
        <mat-select formControlName="chapterId">
          <mat-option>
            <ngx-mat-select-search
              [formControl]="chapterIdSearchControl"
              placeholderLabel="Search..."
              noEntriesFoundLabel="No results found"
              [ariaLabel]="'Search Chapter ID'">
            </ngx-mat-select-search>
          </mat-option>
          @for (chapter of filteredChapterIds(); track chapter.chapterId) {
            <mat-option [value]="chapter.chapterId">
              {{ chapter.chapterId }} - {{ chapter.chapterName }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>

    </form>
  </div>

  <!-- Footer -->
  <div class="filter-footer">
    <button type="button" class="clear-btn" (click)="onClear()">CLEAR ALL</button>
    <button type="button" class="apply-btn" (click)="onApply()" [disabled]="isApplyDisabled">APPLY</button>
  </div>

</div>
