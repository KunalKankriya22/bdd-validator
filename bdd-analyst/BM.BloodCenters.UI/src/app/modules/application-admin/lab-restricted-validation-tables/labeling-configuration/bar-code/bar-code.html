<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="bar-code main-content"
        [class.side-panel-active]="sidePanelOpen"
        [attr.aria-label]="'Barcode Configuration content'">

    <!-- Table Card Container -->
    <div class="bar-code__card" #tableCard>

      <!-- Table Controls with Inline Filter Chips -->
      <div class="bar-code__controls">
        <!-- Left section: Filter button and chips -->
        <div class="bar-code__controls-left">
          <button
            #filterBtn
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            [attr.aria-label]="isFilterOpen ? 'Close filter options' : 'Open filter options'"
            [attr.aria-expanded]="isFilterOpen"
            aria-keyshortcuts="Alt+F"
            (click)="openFilter()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips
            *ngIf="hasActiveFilters()"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right section: Add Button + Search bar -->
        <div class="bar-code__controls-right">
          <button
            type="button"
            mat-raised-button
            class="add-btn"
            (click)="createRecord()"
            [attr.aria-label]="'Create new barcode configuration'">
            <mat-icon aria-hidden="true">add</mat-icon>
            ADD NEW BAR CODE
          </button>

          <app-search-bar
            [config]="searchConfig"
            (search)="onSearchEvent($event)"
            (keydown.enter)="onEnterSearch()" />
        </div>
      </div>

      <!-- Error State -->
      <div
        *ngIf="hasError && !isLoading"
        class="bar-code__error"
        role="alert">
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <p class="error-message">{{ errorMessage }}</p>
        <button type="button" mat-raised-button color="primary" (click)="loadData()">
          Retry
        </button>
      </div>

      <!-- Data Table -->
      <div class="bar-code__table-wrapper">
        <app-data-table
          *ngIf="!hasError"
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          [highlightedRow]="sidePanelData"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen" role="complementary" [attr.aria-label]="'Barcode details panel'">
    <app-add-edit-bar-code
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()"
      (modeChange)="onModeChange($event)">
    </app-add-edit-bar-code>
  </div>

</div>
