<div class="priority-dialog" role="alertdialog" aria-modal="true" aria-labelledby="priority-dialog-title">

  <h2 id="priority-dialog-title" class="priority-dialog__title">Update Priority</h2>

  <div class="priority-dialog__content">
    <p>
      Priority {{ data.prioritySeq }} is already assigned. Would you like to move it to
      Barcode {{ data.barcodeValue }} for the {{ data.productType }} product type?
      Existing and subsequent items will automatically shift down to maintain the sequence.
    </p>
  </div>

  <div class="priority-dialog__actions">
    <button
      mat-button
      type="button"
      class="priority-dialog__cancel-btn"
      (click)="onCancel()"
      aria-label="Cancel priority update">
      CANCEL
    </button>

    <button
      mat-raised-button
      type="button"
      class="priority-dialog__confirm-btn"
      (click)="onConfirm()"
      [attr.aria-label]="confirmButtonLabel">
      {{ confirmButtonLabel }}
    </button>
  </div>

</div>
