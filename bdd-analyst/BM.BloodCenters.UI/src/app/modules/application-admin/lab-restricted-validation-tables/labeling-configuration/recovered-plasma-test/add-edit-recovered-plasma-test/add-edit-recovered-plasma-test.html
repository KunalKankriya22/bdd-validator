<div class="side-panel-wrapper" role="dialog" aria-modal="true" aria-labelledby="plasma-panel-title"
     cdkTrapFocus cdkTrapFocusAutoCapture>

  <!-- Header -->
  <div class="panel-header">
    <h2 id="plasma-panel-title" class="panel-title">{{ panelTitle }}</h2>
    <button #closeBtn type="button" class="close-btn" (click)="onCancel()" aria-label="Close panel">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="panel-body">
    <form [formGroup]="form" class="override-form" [attr.aria-label]="panelTitle + ' form'">

      <!-- FORM GRID -->
      <div class="form-grid">

        <!-- Test ID -->
        <mat-form-field *ngIf="mode === 'add'" appearance="fill" class="full-width">
          <mat-label>Test ID</mat-label>
          <mat-select formControlName="testId">
            <mat-option>
              <ngx-mat-select-search
                [formControl]="testIdSearchControl"
                placeholderLabel="Search..."
                noEntriesFoundLabel="No matching results">
              </ngx-mat-select-search>
            </mat-option>
            <mat-option *ngFor="let option of filteredTestIdOptions" [value]="option.value">
              {{ option.display }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="getTestIdError()">{{ getTestIdError() }}
          </mat-error>
        </mat-form-field>
        <div *ngIf="mode === 'edit'" class="field-display-card field-description-card full-width" role="group" aria-label="Test ID (read-only)">
          <div class="field-label" aria-hidden="true">Test ID</div>
          <div class="field-value">{{ editModeValues.testId || '-' }}</div>
        </div>

        <!-- Effective Date (ADD mode: editable date picker required, EDIT mode: read-only card) -->
        <mat-form-field appearance="fill" *ngIf="mode === 'add'">
          <mat-label>Effective Date</mat-label>
          <input matInput [matDatepicker]="effectivePicker" formControlName="effDate" [min]="minDate" [errorStateMatcher]="effDateErrorMatcher" (input)="onEffectiveDateInput($event)" required aria-required="true">
          <mat-datepicker-toggle matIconSuffix [for]="effectivePicker"></mat-datepicker-toggle>
          <mat-datepicker #effectivePicker [startAt]="terminationMinDate"></mat-datepicker>
          <mat-error *ngIf="getEffDateError()">{{ getEffDateError() }}
          </mat-error>
        </mat-form-field>
        <div class="field-display-card" *ngIf="mode === 'edit'" role="group" aria-label="Effective Date (read-only)">
          <div class="field-label" aria-hidden="true">Effective Date</div>
          <div class="field-value">
            {{ editModeValues.effectiveDate || '-' }}
          </div>
        </div>

        <!-- Termination Date (optional, must be >= effective date and >= today) -->
        <mat-form-field appearance="fill">
          <mat-label>Termination Date</mat-label>
          <input matInput [matDatepicker]="terminationPicker" formControlName="termDate" [min]="terminationMinDate" [errorStateMatcher]="termDateErrorMatcher" (input)="onTerminationDateInput($event)">
          <mat-datepicker-toggle matIconSuffix [for]="terminationPicker"></mat-datepicker-toggle>
          <mat-datepicker #terminationPicker [startAt]="terminationMinDate"></mat-datepicker>
          <mat-error *ngIf="getTermDateError()">{{ getTermDateError() }}
          </mat-error>
        </mat-form-field>

      </div>
      <!-- END FORM GRID -->

    </form>
  </div>

  <!-- Footer -->
  <div class="panel-footer">
    <div class="footer-actions">

      <button type="button" mat-button class="cancel-btn" (click)="onCancel()" [disabled]="isSaving"
        [attr.aria-label]="'Cancel and close panel'">
        CANCEL
      </button>

      <button type="button" *ngIf="mode === 'add'" mat-button class="secondary-btn" (click)="onSaveAndCreateAnother()"
        [disabled]="!isSaveEnabled || isSaving"
        [attr.aria-label]="savingAction === 'saveAndCreate' ? 'Saving plasma test' : 'Add plasma test and create another'">
        {{ savingAction === 'saveAndCreate' ? 'SAVING...' : 'ADD & CREATE ANOTHER' }}
      </button>

      <button type="button" mat-raised-button class="primary-btn" (click)="onSave()"
        [disabled]="!isSaveEnabled || isSaving"
        [attr.aria-label]="savingAction === 'save' ? 'Saving plasma test' : (mode === 'add' ? 'Add plasma test' : 'Save plasma test')">
        {{ savingAction === 'save' ? 'SAVING...' : (mode === 'add' ? 'ADD' : 'SAVE') }}
      </button>

    </div>
  </div>

</div>
