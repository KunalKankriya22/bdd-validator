<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title"
         cdkTrapFocus cdkTrapFocusAutoCapture>

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" [attr.aria-label]="'Close filter panel'" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content" [attr.aria-label]="'Filter options'">

    <!-- Result -->
    <mat-form-field appearance="fill" class="full-width-field">
      <mat-label>Result</mat-label>
      <mat-select formControlName="resultCode">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="resultCodeSearchControl"
            placeholderLabel="Search Result..."
            noEntriesFoundLabel="No matching results">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of resultCodeOptions" [value]="option.value">
          {{ option.display }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Antibody Flag -->
    <mat-form-field appearance="fill" class="full-width-field">
      <mat-label>Antibody Flag</mat-label>
      <mat-select formControlName="antibodyFlag">
        <mat-option *ngFor="let option of antibodyFlagOptions" [value]="option.value">
          {{ option.display }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Effective Date Row -->
    <div class="date-row" role="group" [attr.aria-label]="'Effective date filter'">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label>Period</mat-label>
        <mat-select formControlName="effectiveDatePeriod">
          <mat-option *ngFor="let period of periodOptions" [value]="period.value">
            {{ period.display }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="getEffectiveDatePeriodError()">
          {{ getEffectiveDatePeriodError() }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Effective Date</mat-label>
        <input
          matInput
          [matDatepicker]="effectivePicker"
          formControlName="effectiveDate"
          (input)="onDateInput($event, 'effectiveDate')"
        >
        <mat-datepicker-toggle matIconSuffix [for]="effectivePicker"></mat-datepicker-toggle>
        <mat-datepicker #effectivePicker></mat-datepicker>
        <mat-error *ngIf="getEffectiveDateError()">{{ getEffectiveDateError() }}</mat-error>
      </mat-form-field>
    </div>

    <!-- Termination Date Row -->
    <div class="date-row" role="group" [attr.aria-label]="'Termination date filter'">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label>Period</mat-label>
        <mat-select formControlName="terminationDatePeriod">
          <mat-option *ngFor="let period of periodOptions" [value]="period.value">
            {{ period.display }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="getTerminationDatePeriodError()">
          {{ getTerminationDatePeriodError() }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Termination Date</mat-label>
        <input
          matInput
          [matDatepicker]="terminationPicker"
          formControlName="terminationDate"
          (input)="onDateInput($event, 'terminationDate')"
        >
        <mat-datepicker-toggle matIconSuffix [for]="terminationPicker"></mat-datepicker-toggle>
        <mat-datepicker #terminationPicker></mat-datepicker>
        <mat-error *ngIf="getTerminationDateError()">{{ getTerminationDateError() }}</mat-error>
      </mat-form-field>
    </div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()" [attr.aria-label]="'Clear all filters'">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled" [attr.aria-label]="'Apply filters'">
      APPLY
    </button>
  </footer>

</section>
