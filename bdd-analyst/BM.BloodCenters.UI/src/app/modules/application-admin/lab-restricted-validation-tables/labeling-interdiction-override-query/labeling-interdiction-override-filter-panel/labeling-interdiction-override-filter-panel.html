<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" [attr.aria-label]="'Close filter panel'" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content" [attr.aria-label]="'Filter options'">

    <!-- Cue -->
    <mat-form-field appearance="fill">
      <mat-label>Cue</mat-label>
      <mat-select formControlName="donorDecisionCode">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="cueSearchCtrl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No cues found">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredCueOptions()" [value]="option.value">
          {{ option.display }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Type -->
    <mat-form-field appearance="fill">
      <mat-label>Type</mat-label>
      <mat-select formControlName="interType">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="interTypeSearchCtrl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No types found">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredInterTypeOptions()" [value]="option.value">
          {{ option.display }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Effective Date Row -->
    <div class="date-row" role="group" [attr.aria-label]="'Effective date filter'">
      <div class="period-field" [class.error-state]="effDatePeriodRequired">
        <mat-form-field appearance="fill">
          <mat-label [ngStyle]="{ color: effDatePeriodRequired ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="effectiveDatePeriod"
            [attr.aria-invalid]="effDatePeriodRequired"
            [attr.aria-describedby]="effDatePeriodRequired ? 'eff-period-error' : null">
            <mat-option *ngFor="let period of periodOptions" [value]="period.value">
              {{ period.display }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <div class="period-error" id="eff-period-error" role="alert" *ngIf="effDatePeriodRequired">Period is required</div>
      </div>

      <div class="date-field">
        <mat-form-field appearance="fill">
          <mat-label>Effective Date</mat-label>
          <input
            #effectiveDateInput
            matInput
            [matDatepicker]="effectivePicker"
            formControlName="effectiveDate"
            [errorStateMatcher]="effDateErrorMatcher"
            aria-label="Effective Date"
            [attr.aria-invalid]="!!getEffectiveDateError()"
            [attr.aria-describedby]="getEffectiveDateError() ? 'eff-date-error' : null"
          >
          <mat-datepicker-toggle matIconSuffix [for]="effectivePicker"></mat-datepicker-toggle>
          <mat-datepicker #effectivePicker></mat-datepicker>
        </mat-form-field>
        <div class="period-error" id="eff-date-error" role="alert" *ngIf="getEffectiveDateError()">{{ getEffectiveDateError() }}</div>
      </div>
    </div>

    <!-- Termination Date Row -->
    <div class="date-row" role="group" [attr.aria-label]="'Termination date filter'">
      <div class="period-field" [class.error-state]="termDatePeriodRequired">
        <mat-form-field appearance="fill">
          <mat-label [ngStyle]="{ color: termDatePeriodRequired ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="terminationDatePeriod"
            [attr.aria-invalid]="termDatePeriodRequired"
            [attr.aria-describedby]="termDatePeriodRequired ? 'term-period-error' : null">
            <mat-option *ngFor="let period of periodOptions" [value]="period.value">
              {{ period.display }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <div class="period-error" id="term-period-error" role="alert" *ngIf="termDatePeriodRequired">Period is required</div>
      </div>

      <div class="date-field">
        <mat-form-field appearance="fill">
          <mat-label>Termination Date</mat-label>
          <input
            #terminationDateInput
            matInput
            [matDatepicker]="terminationPicker"
            formControlName="terminationDate"
            [errorStateMatcher]="termDateErrorMatcher"
            aria-label="Termination Date"
            [attr.aria-invalid]="!!getTerminationDateError()"
            [attr.aria-describedby]="getTerminationDateError() ? 'term-date-error' : null"
          >
          <mat-datepicker-toggle matIconSuffix [for]="terminationPicker"></mat-datepicker-toggle>
          <mat-datepicker #terminationPicker></mat-datepicker>
        </mat-form-field>
        <div class="period-error" id="term-date-error" role="alert" *ngIf="getTerminationDateError()">{{ getTerminationDateError() }}</div>
      </div>
    </div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()" [attr.aria-label]="'Clear all filters'">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled" [attr.aria-label]="'Apply filters'">
      APPLY
    </button>
  </footer>

</section>
