<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper -->
<div class="layout-wrapper">

  <!-- Main Content Area -->
  <main class="labeling-interdiction-override-query main-content"
        aria-label="Labeling Interdiction Override Query content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="labeling-interdiction-override-query__card" #tableCard>

      <!-- Table Controls -->
      <div class="labeling-interdiction-override-query__controls">
        <!-- Left: Filter button and chips -->
        <div class="labeling-interdiction-override-query__controls-left">
          <button
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            aria-label="Open filter options"
            [attr.aria-expanded]="isFilterOpen"
            aria-haspopup="dialog"
            (click)="openFilter()">
            <mat-icon aria-hidden="true">filter_list</mat-icon>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips
            *ngIf="hasActiveFilters()"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right: Search bar -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)"
          (keydown.enter)="onEnterSearch()" />
      </div>

      <!-- Error State -->
      <div
        *ngIf="hasError && !isLoading"
        class="labeling-interdiction-override-query__error"
        role="alert"
        aria-label="Error loading data">
        <mat-icon class="error-icon" aria-hidden="true">inbox</mat-icon>
        <p class="error-message">{{ errorMessage }}</p>
      </div>

      <!-- Data Table -->
      <div class="labeling-interdiction-override-query__table-wrapper">
        <app-data-table
          *ngIf="!hasError"
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)" />
      </div>

    </div>
  </main>

</div>
