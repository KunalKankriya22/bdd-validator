<section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title" cdkTrapFocus cdkTrapFocusAutoCapture>

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onCancel()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <mat-form-field appearance="fill">
      <mat-label>Chapter</mat-label>
      <mat-select formControlName="chapter">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="chapterSearchControl"
            placeholderLabel="Search chapters..."
            noEntriesFoundLabel="No matching chapters"
            ariaLabel="Search chapters">
          </ngx-mat-select-search>
        </mat-option>
        @for (chapter of filteredChapters; track chapter.chapterId) {
          <mat-option [value]="chapter.chapterId">{{ chapter.chapterId }} - {{ chapter.chapterName }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" class="clear-btn" (click)="onReset()">
      CLEAR ALL
    </button>

    <button mat-raised-button type="button" class="apply-btn" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
