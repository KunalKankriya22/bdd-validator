<!-- Status Cell Template -->
<ng-template #statusCellTemplate let-row>
  <span class="status-badge" [class.available]="row.trayStatus === 'AV'" [class.in-use]="row.trayStatus !== 'AV'">
    {{ getStatusDescription(row.trayStatus) }}
  </span>
</ng-template>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="tray-definition main-content"
        [class.side-panel-active]="sidePanelOpen"
        [attr.aria-label]="'Tray Definition content'">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="tray-definition__card" #tableCard>

      <!-- Toolbar - Filter, Chips, Search, Add Button -->
      <div class="tray-definition__controls">
        <!-- Left section: Filter button and chips -->
        <div class="tray-definition__controls-left">
          <button
            #filterBtn
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            [attr.aria-label]="isFilterOpen ? 'Close filter options' : 'Open filter options'"
            [attr.aria-expanded]="isFilterOpen"
            (click)="onOpenFilter()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          @if (filterChips.length > 0) {
            <app-filter-chips
              [chips]="filterChips"
              [maxVisible]="3"
              (removeChip)="onRemoveFilterChip($event)"
              (clearAll)="onClearFilters()" />
          }
        </div>

        <!-- Right section: Add button and Search bar -->
        <div class="tray-definition__controls-right">
          <button
            #addNewBtn
            mat-raised-button
            type="button"
            color="primary"
            class="add-btn"
            (click)="onAddNew()">
            <mat-icon aria-hidden="true">add</mat-icon>
            ADD NEW TRAY DETAILS
          </button>

          <app-search-bar
            [config]="searchConfig"
            (search)="onSearch($event)" />
        </div>
      </div>

      <!-- Data Table -->
      <div class="tray-definition__table-wrapper">
        <app-data-table
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSort($event)"
          (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  @if (sidePanelOpen) {
    <div class="side-panel-container">
      <app-add-edit-tray-definition
        [mode]="sidePanelMode"
        [data]="sidePanelData"
        (closePanel)="onSidePanelClose()"
        (saveSuccess)="onSaveSuccess()" />
    </div>
  }

</div>
