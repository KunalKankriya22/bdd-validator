<!-- Status Cell Template -->
<ng-template #statusCellTemplate let-row>
  <span class="status-badge" [class.active]="getStatusClass(row) === 'active'" [class.inactive]="getStatusClass(row) === 'inactive'">
    {{ getStatusText(row) }}
  </span>
</ng-template>

<!-- Main Content Area -->
<main class="system-parameter" aria-label="System Parameters content">

  <!-- Page Header with Breadcrumb -->
  <app-page-header-with-breadcrumb [config]="headerConfig" />

  <!-- Table Card Container -->
  <div class="system-parameter__card">

    <!-- Table Controls: Filter + Chips + Search (flat, same line) -->
    <div class="system-parameter__controls">
      <!-- Filter button (fixed) -->
      <button #filterBtn mat-button class="filter-button" [class.filter-button--active]="isFilterOpen" [attr.aria-expanded]="isFilterOpen" [attr.aria-label]="isFilterOpen ? 'Close filter options' : 'Open filter options'" (click)="toggleFilter()">
        <span class="filter-icon" aria-hidden="true"></span>
        FILTER
      </button>

      <!-- Filter chips (scrollable with arrows) -->
      <div class="system-parameter__chips-wrapper" *ngIf="filterChips.length > 0">
        <button class="chips-arrow chips-arrow--left" *ngIf="showLeftArrow"
                (click)="scrollChips('left')" aria-label="Scroll chips left">
          <mat-icon aria-hidden="true">chevron_left</mat-icon>
        </button>
        <div class="system-parameter__chips-scroll" #chipsScroll (scroll)="onChipsScroll()">
          <app-filter-chips [chips]="filterChips" [maxVisible]="100"
            (removeChip)="removeFilterChip($event)" (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>
        <button class="chips-arrow chips-arrow--right" *ngIf="showRightArrow"
                (click)="scrollChips('right')" aria-label="Scroll chips right">
          <mat-icon aria-hidden="true">chevron_right</mat-icon>
        </button>
      </div>

      <!-- Right section: Search bar -->
      <app-search-bar [config]="searchConfig" (search)="onSearch($event)" />
    </div>

    <!-- Error State -->
    <div
      *ngIf="hasError && !isLoading"
      class="system-parameter__error"
      role="alert"
      aria-label="Error loading data">
      <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
      <p class="error-message">{{ errorMessage }}</p>
      <button type="button" mat-raised-button color="primary" (click)="loadData()">
        Retry
      </button>
    </div>

    <!-- Data Table -->
    <div class="system-parameter__table-wrapper">
      <app-data-table
        *ngIf="!hasError"
        [config]="tableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        [highlightedRow]="editingRow"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)" />
    </div>
  </div>
</main>
