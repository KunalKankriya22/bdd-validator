<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Interdiction Class -->
    <mat-form-field appearance="fill">
      <mat-label>Interdiction Class</mat-label>
      <mat-select formControlName="interClass">
        <!-- Search Option -->
        <mat-option>
          <ngx-mat-select-search
            [formControl]="interdictionClassSearchControl"
            placeholderLabel="Search interdiction classes..."
            noEntriesFoundLabel="No matching classes">
          </ngx-mat-select-search>
        </mat-option>

        <!-- Filtered Options -->
        <mat-option *ngFor="let cls of filteredInterdictionClassOptions" [value]="cls">
          {{ cls }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Effective Date Row -->
    <div class="date-row">
      <div class="period-field">
        <mat-form-field appearance="fill">
          <mat-label>Period</mat-label>
          <mat-select formControlName="effectiveDatePeriod">
            <mat-option *ngFor="let period of periodOptions" [value]="period">
              {{ period }}
            </mat-option>
          </mat-select>
          <mat-error>Period is required</mat-error>
        </mat-form-field>
      </div>

      <div class="date-field">
        <mat-form-field appearance="fill">
          <mat-label>Effective Date</mat-label>
          <input
            #effectiveDateInput
            matInput
            [matDatepicker]="effectivePicker"
            formControlName="effectiveDate"

            aria-label="Effective Date"
            [errorStateMatcher]="effDateErrorMatcher"
            (input)="onEffectiveDateInput($event)"
            (blur)="onEffectiveDateBlur(effectiveDateInput)"
          >
          <mat-datepicker-toggle matIconSuffix [for]="effectivePicker"></mat-datepicker-toggle>
          <mat-datepicker #effectivePicker></mat-datepicker>
          <mat-error>Invalid date</mat-error>
        </mat-form-field>
      </div>
    </div>

    <!-- Termination Date Row -->
    <div class="date-row">
      <div class="period-field">
        <mat-form-field appearance="fill">
          <mat-label>Period</mat-label>
          <mat-select formControlName="terminationDatePeriod">
            <mat-option *ngFor="let period of periodOptions" [value]="period">
              {{ period }}
            </mat-option>
          </mat-select>
          <mat-error>Period is required</mat-error>
        </mat-form-field>
      </div>

      <div class="date-field">
        <mat-form-field appearance="fill">
          <mat-label>Termination Date</mat-label>
          <input
            #terminationDateInput
            matInput
            [matDatepicker]="terminationPicker"
            formControlName="terminationDate"

            aria-label="Termination Date"
            [errorStateMatcher]="termDateErrorMatcher"
            (input)="onTerminationDateInput($event)"
            (blur)="onTerminationDateBlur(terminationDateInput)"
          >
          <mat-datepicker-toggle matIconSuffix [for]="terminationPicker"></mat-datepicker-toggle>
          <mat-datepicker #terminationPicker></mat-datepicker>
          <mat-error>Invalid date</mat-error>
        </mat-form-field>
      </div>
    </div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
