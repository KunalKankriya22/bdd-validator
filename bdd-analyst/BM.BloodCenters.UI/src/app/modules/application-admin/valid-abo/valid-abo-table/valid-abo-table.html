<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Main Content Area -->
<main class="valid-abo-table"
      aria-label="Valid ABO Table content">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="valid-abo-table__card" #tableCard>

      <!-- Table Controls with Inline Filter Chips -->
      <div class="valid-abo-table__controls">
        <!-- Left section: Filter button and chips -->
        <div class="valid-abo-table__controls-left">
          <button #filterBtn mat-button class="filter-button" [class.filter-button--active]="isFilterOpen" aria-label="Open filter options" (click)="openFilter()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips *ngIf="hasActiveFilters()" [chips]="filterChips" [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)" (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right section: Search bar -->
        <app-search-bar [config]="searchConfig" (search)="onSearch($event)" />
      </div>

      <!-- Error State -->
      <div *ngIf="hasError && !isLoading" class="valid-abo-table__error" role="alert" aria-label="Error loading data">
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <p class="error-message">{{ errorMessage }}</p>
        <button mat-raised-button color="primary" (click)="loadValidAboData()">
          Retry
        </button>
      </div>

      <!-- Data Table -->
      <div class="valid-abo-table__table-wrapper">
        <app-data-table *ngIf="!hasError" [config]="tableConfig" [data]="dataSource" [loading]="isLoading"
          (pageChange)="onPageChange($event)" (sortChange)="onSortChange($event)" (rowAction)="onRowAction($event)" [keepActiveRow]="sidePanelOpen" />
      </div>
    </div>
  </main>
