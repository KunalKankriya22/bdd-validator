<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="valid-scan-interfaces-table main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Valid Scan Interfaces content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>

    <!-- Table Card Container -->
    <div class="valid-scan-interfaces-table__card">

      <!-- Data Table -->
      <div class="valid-scan-interfaces-table__table-wrapper">
        <!-- Error State -->
        @if (hasError && !isLoading) {
          <div class="error-message" role="alert">
            <mat-icon aria-hidden="true">error_outline</mat-icon>
            <p>{{ errorMessage }}</p>
            <button mat-raised-button color="primary" (click)="loadTableData()">
              RETRY
            </button>
          </div>
        }

        <!-- Table -->
        @if (!hasError) {
          <app-data-table
            [config]="tableConfig"
            [data]="dataSource"
            [loading]="isLoading"
            [keepActiveRow]="sidePanelOpen"
            (sortChange)="onSortChange($event)"
            (rowAction)="onRowAction($event)"
          ></app-data-table>
        }
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  @if (sidePanelOpen) {
    <div class="side-panel-container"
         role="complementary"
         [attr.aria-label]="sidePanelMode === 'add' ? 'Add new scale configuration' : 'Edit scale configuration'">
      <app-add-edit-valid-scan-interface
        [mode]="sidePanelMode"
        [data]="sidePanelData"
        (closePanel)="closeSidePanel()"
        (saveSuccess)="onSaveSuccess()"
        (modeChange)="onModeChange($event)"
      ></app-add-edit-valid-scan-interface>
    </div>
  }

</div>
