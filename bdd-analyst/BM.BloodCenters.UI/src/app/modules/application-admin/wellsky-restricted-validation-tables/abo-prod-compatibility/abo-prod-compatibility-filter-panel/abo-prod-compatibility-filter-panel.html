<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content" aria-describedby="filter-desc">

    <mat-form-field appearance="fill">
      <mat-label>Inventory Product Type</mat-label>
      <mat-select formControlName="productType">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="productTypeSearchControl"
            placeholderLabel="Search product types..."
            noEntriesFoundLabel="No matching product types">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let type of filteredProductTypes()" [value]="type.productType">
          {{ type.productType }}<ng-container *ngIf="type.description"> - {{ type.description }}</ng-container>
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Effective Date Row -->
    <div class="filter-panel__date-row">
      <mat-form-field appearance="fill" class="filter-panel__period-field">
        <mat-label [ngStyle]="{ color: getEffectiveDatePeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
        <mat-select formControlName="effectiveDatePeriod">
          <mat-option value="After">After</mat-option>
          <mat-option value="Before">Before</mat-option>
        </mat-select>
        <mat-error *ngIf="getEffectiveDatePeriodError() as error">
          {{ error }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="filter-panel__date-field">
        <mat-label>Effective Date</mat-label>
        <input
          matInput
          [matDatepicker]="effectiveDatePicker"
          formControlName="effectiveDate"
          (input)="onEffectiveDateInput($event)"
          (keydown.enter)="$event.target.blur()">
        <mat-datepicker-toggle matIconSuffix [for]="effectiveDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #effectiveDatePicker></mat-datepicker>
        <mat-error *ngIf="getEffectiveDateError() as error">
          {{ error }}
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Termination Date Row -->
    <div class="filter-panel__date-row">
      <mat-form-field appearance="fill" class="filter-panel__period-field">
        <mat-label [ngStyle]="{ color: getTerminationDatePeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
        <mat-select formControlName="terminationDatePeriod">
          <mat-option value="After">After</mat-option>
          <mat-option value="Before">Before</mat-option>
        </mat-select>
        <mat-error *ngIf="getTerminationDatePeriodError() as error">
          {{ error }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="filter-panel__date-field">
        <mat-label>Termination Date</mat-label>
        <input
          matInput
          [matDatepicker]="terminationDatePicker"
          formControlName="terminationDate"
          (input)="onTerminationDateInput($event)"
          (keydown.enter)="$event.target.blur()">
        <mat-datepicker-toggle matIconSuffix [for]="terminationDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #terminationDatePicker></mat-datepicker>
        <mat-error *ngIf="getTerminationDateError() as error">
          {{ error }}
        </mat-error>
      </mat-form-field>
    </div>
  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" [disabled]="isApplyDisabled" (click)="onApply()">
      APPLY
    </button>
  </footer>

</section>
