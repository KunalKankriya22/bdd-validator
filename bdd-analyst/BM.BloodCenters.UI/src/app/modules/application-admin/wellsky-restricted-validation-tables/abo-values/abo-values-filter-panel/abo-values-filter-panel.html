<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" [attr.aria-label]="'Close filter panel'" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content" [attr.aria-label]="'Filter options'">

    <!-- Intended Use -->
    <mat-form-field appearance="fill">
      <mat-label>Intended Use</mat-label>
      <mat-select formControlName="intendedUse">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="intendedUseSearchControl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredIntendedUseOptions()" [value]="option.key">
          {{ option.key }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Unit Scheme -->
    <mat-form-field appearance="fill">
      <mat-label>Unit Scheme</mat-label>
      <mat-select formControlName="unitScheme">
        <mat-option *ngFor="let option of unitSchemeOptions()" [value]="option.key">
          {{ option.key }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Transfusion Status -->
    <mat-form-field appearance="fill">
      <mat-label>Transfusion Status</mat-label>
      <mat-select formControlName="transfusionStatus">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="transfusionStatusSearchControl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredTransfusionStatusOptions()" [value]="option.key">
          {{ option.key }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Effective Date Row -->
    <div class="filter-panel__date-row" role="group" [attr.aria-label]="'Effective date filter'">
      <mat-form-field appearance="fill" class="filter-panel__period-field">
        <mat-label [ngStyle]="{ color: effectivePeriodRequired ? '#b02828' : 'inherit' }">Period</mat-label>
        <mat-select formControlName="effectiveDatePeriod" [attr.aria-describedby]="effectivePeriodRequired ? 'effective-period-error' : null">
          <mat-option *ngFor="let period of periodOptions" [value]="period.value">
            {{ period.display }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="filter-panel__date-field">
        <mat-label>Effective Date</mat-label>
        <input
          #effectiveDateInput
          matInput
          [matDatepicker]="effectivePicker"
          formControlName="effectiveDate"
          (input)="onEffectiveDateInput($event)"
          (blur)="onEffectiveDateBlur(effectiveDateInput)"
        >
        <mat-datepicker-toggle matIconSuffix [for]="effectivePicker" aria-label="Open effective date calendar"></mat-datepicker-toggle>
        <mat-datepicker #effectivePicker></mat-datepicker>
        <mat-error *ngIf="filterForm.get('effectiveDate')?.hasError('invalidDateFormat')">
          Invalid date
        </mat-error>
        <mat-error *ngIf="filterForm.get('effectiveDate')?.hasError('matDatepickerParse')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>
    <div class="error-message" id="effective-period-error" role="alert" *ngIf="effectivePeriodRequired">Period is required</div>

    <!-- Termination Date Row -->
    <div class="filter-panel__date-row" role="group" [attr.aria-label]="'Termination date filter'">
      <mat-form-field appearance="fill" class="filter-panel__period-field">
        <mat-label [ngStyle]="{ color: terminationPeriodRequired ? '#b02828' : 'inherit' }">Period</mat-label>
        <mat-select formControlName="terminationDatePeriod" [attr.aria-describedby]="terminationPeriodRequired ? 'termination-period-error' : null">
          <mat-option *ngFor="let period of periodOptions" [value]="period.value">
            {{ period.display }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="filter-panel__date-field">
        <mat-label>Termination Date</mat-label>
        <input
          #terminationDateInput
          matInput
          [matDatepicker]="terminationPicker"
          formControlName="terminationDate"
          (input)="onTerminationDateInput($event)"
          (blur)="onTerminationDateBlur(terminationDateInput)"
        >
        <mat-datepicker-toggle matIconSuffix [for]="terminationPicker" aria-label="Open termination date calendar"></mat-datepicker-toggle>
        <mat-datepicker #terminationPicker></mat-datepicker>
        <mat-error *ngIf="filterForm.get('terminationDate')?.hasError('invalidDateFormat')">
          Invalid date
        </mat-error>
        <mat-error *ngIf="filterForm.get('terminationDate')?.hasError('matDatepickerParse')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>
    <div class="error-message" id="termination-period-error" role="alert" *ngIf="terminationPeriodRequired">Period is required</div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()" [attr.aria-label]="'Clear all filters'">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled" [attr.aria-label]="'Apply filters'">
      APPLY
    </button>
  </footer>

</section>
