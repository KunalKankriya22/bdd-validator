<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="abo-values main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="ABO Values content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="abo-values__card" #tableCard>

      <!-- Table Controls with Inline Filter Chips -->
      <div class="abo-values__controls">
        <!-- Left section: Filter button and chips -->
        <div class="abo-values__controls-left">
          <button
            #filterBtn
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            aria-label="Open filter options"
            title="Filter (Alt+F)"
            [attr.aria-expanded]="isFilterOpen"
            (click)="openFilter()">
            <mat-icon aria-hidden="true">filter_list</mat-icon>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips
            *ngIf="hasActiveFilters()"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right section: Search bar -->
        <div class="abo-values__controls-right" title="Search (Alt+S)">
          <app-search-bar
            [config]="searchConfig"
            (search)="onSearch($event)"
            (keydown.enter)="onEnterSearch()" />
        </div>
      </div>

      <!-- Error State -->
      <div
        *ngIf="hasError && !isLoading"
        class="abo-values__error"
        role="alert"
        aria-label="Error loading data">
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <p class="error-message">{{ errorMessage }}</p>
        <button type="button" mat-raised-button color="primary" (click)="loadData()">
          Retry
        </button>
      </div>

      <!-- Data Table -->
      <div class="abo-values__table-wrapper">
        <!-- Show table when there's data or loading -->
        <app-data-table
          *ngIf="!hasError && (dataSource.length > 0 || isLoading)"
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          [highlightedRow]="selectedRow"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />

        <!-- Empty State - No Search/Filter Results -->
        <div *ngIf="dataSource.length === 0 && !isLoading && !hasError && (requestState.searchKeyword || hasActiveFilters())"
             class="empty-state empty-state--no-results">
          <div class="empty-state__icon-wrapper">
            <mat-icon aria-hidden="true">inbox</mat-icon>
          </div>
          <p class="empty-state__title">No values found</p>
        </div>

        <!-- Empty State - No Data At All -->
        <div *ngIf="dataSource.length === 0 && !isLoading && !hasError && !requestState.searchKeyword && !hasActiveFilters()"
             class="empty-state">
          <div class="empty-state__icon-wrapper">
            <mat-icon aria-hidden="true">edit</mat-icon>
          </div>
          <p class="empty-state__title">No ABO Values Added Yet</p>
          <p class="empty-state__subtitle">Click on the "ADD NEW ABO RULE" button above to create a new one.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Backdrop Overlay -->
  <div class="backdrop-overlay"
       *ngIf="sidePanelOpen"
       (click)="closeSidePanel()"
       aria-hidden="true">
  </div>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen" #sidePanelContainer>
    <app-add-edit-abo-values
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()"
      (modeChange)="onModeChange($event)">
    </app-add-edit-abo-values>
  </div>

</div>
