<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Main Content Area -->
<main class="define-duration-between-procedures"
      aria-label="Define Duration Between Procedures content"
      role="main">

  <!-- Page Header with Breadcrumb -->
  <app-page-header-with-breadcrumb [config]="headerConfig" />

  <!-- Table Card Container -->
  <div class="define-duration-between-procedures__card" #tableCard>

    <!-- Table Controls with Inline Filter Chips -->
    <div class="define-duration-between-procedures__controls">
      <!-- Left section: Filter button and chips -->
      <div class="define-duration-between-procedures__controls-left">
        <button
          #filterBtn
          type="button"
          mat-button
          class="filter-button"
          [class.filter-button--active]="isFilterOpen"
          aria-label="Open filter options"
          (click)="openFilter()">
          <mat-icon aria-hidden="true">filter_list</mat-icon>
          FILTER
        </button>

        <!-- Inline Filter Chips -->
        <app-filter-chips
          *ngIf="hasActiveFilters()"
          [chips]="filterChips"
          [maxVisible]="3"
          (removeChip)="onRemoveFilterChip($event)"
          (clearAll)="clearAllFilters()">
        </app-filter-chips>
      </div>

      <!-- Right section: Search bar -->
      <app-search-bar
        [config]="searchConfig"
        (search)="onSearch($event)" />
    </div>

    <!-- Error State -->
    <div
      *ngIf="hasError && !isLoading"
      class="define-duration-between-procedures__error"
      role="alert"
      aria-label="Error loading data">
      <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
      <p class="error-message">{{ errorMessage }}</p>
      <button type="button" mat-raised-button color="primary" (click)="loadData()">
        Retry
      </button>
    </div>

    <!-- Data Table -->
    <div class="define-duration-between-procedures__table-wrapper">
      <app-data-table
        *ngIf="!hasError"
        [config]="tableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)" />
    </div>
  </div>
</main>

<!-- Backdrop -->
@if (isSidePanelOpen) {
  <div
    class="side-panel-backdrop"
    (click)="onSidePanelClose()">
  </div>
}

<!-- Side Panel -->
@if (isSidePanelOpen) {
  <app-add-edit-define-duration
    [mode]="sidePanelMode"
    [data]="sidePanelData"
    (close)="onSidePanelClose()"
    (save)="onSidePanelSave($event)" />
}

<!-- Valid Options Reference Panel -->
<app-valid-options-reference
  *ngIf="isReferencePanelOpen"
  (close)="onReferencePanelClose()" />
