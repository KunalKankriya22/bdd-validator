<section class="filter-dialog-wrapper" role="dialog" aria-modal="false" aria-labelledby="filter-title">
  <!-- Header -->
  <header class="filter-dialog-header">
    <h2 id="filter-title" class="filter-title">Filters</h2>
    <button mat-icon-button class="close-btn" type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-dialog-content">
    <!-- Current Donation Type -->
    <mat-form-field appearance="fill">
      <mat-label>Current Donation Type</mat-label>
      <mat-select formControlName="currDonationType">
        <mat-option *ngFor="let donationType of currDonationTypeOptions" [value]="donationType">
          {{ donationType }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Current Procedure -->
    <mat-form-field appearance="fill">
      <mat-label>Current Procedure</mat-label>
      <mat-select formControlName="procedureCode">
        <mat-option *ngFor="let code of procedureCodeOptions" [value]="code">
          {{ code }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Effective Date Filter -->
    <div class="filter-row">
      <mat-form-field appearance="fill" class="period-select">
        <mat-label>Period</mat-label>
        <mat-select formControlName="effectiveDatePeriod">
          <mat-option value="AFTER">After</mat-option>
          <mat-option value="BEFORE">Before</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="fill" class="date-input">
        <mat-label>Effective Date</mat-label>
        <input
          matInput
          [matDatepicker]="effectivePicker"
          formControlName="effectiveDate"
          readonly>
        <mat-datepicker-toggle matIconSuffix [for]="effectivePicker"></mat-datepicker-toggle>
        <mat-datepicker #effectivePicker></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="error-message" *ngIf="effectivePeriodRequired">Period is required</div>

    <!-- Termination Date Filter -->
    <div class="filter-row">
      <mat-form-field appearance="fill" class="period-select">
        <mat-label>Period</mat-label>
        <mat-select formControlName="terminationDatePeriod">
          <mat-option value="AFTER">After</mat-option>
          <mat-option value="BEFORE">Before</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="fill" class="date-input">
        <mat-label>Termination Date</mat-label>
        <input
          matInput
          [matDatepicker]="terminationPicker"
          formControlName="terminationDate"
          readonly>
        <mat-datepicker-toggle matIconSuffix [for]="terminationPicker"></mat-datepicker-toggle>
        <mat-datepicker #terminationPicker></mat-datepicker>
      </mat-form-field>
    </div>
    <div class="error-message" *ngIf="terminationPeriodRequired">Period is required</div>
  </form>

  <!-- Footer -->
  <footer class="filter-dialog-footer">
    
    <button mat-stroked-button type="button" (click)="onClear()">CLEAR ALL</button>
    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled">APPLY</button>
  </footer>
</section>
