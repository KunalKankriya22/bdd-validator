<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="define-eligible-cell-plasma-loss main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Define Eligible Cell Plasma Loss content">
    <!-- Page Header -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Card (Filter + Table + Pagination) -->
    <div class="define-eligible-cell-plasma-loss__card" #tableCard>
      <!-- Controls (Filter + Search) -->
      <div class="define-eligible-cell-plasma-loss__controls">
        <div class="define-eligible-cell-plasma-loss__controls-left">
          <!-- Filter Button -->
          <button
            #filterBtn
            type="button"
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            (click)="openFilter()"
            aria-label="Open filter panel"
          >
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <!-- Responsive Filter Chips -->
          @if (hasActiveFilters()) {
            <app-filter-chips
              [chips]="filterChips"
              [maxVisible]="3"
              (removeChip)="onRemoveFilterChip($event)"
              (clearAll)="clearAllFilters()"
            />
          }
        </div>

        <!-- Search Bar -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)"
        />
      </div>

      <!-- Data Table -->
      <div class="define-eligible-cell-plasma-loss__table-wrapper">
        <app-data-table
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)"
        />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-add-edit-eligible-cell-loss
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()">
    </app-add-edit-eligible-cell-loss>
  </div>

</div>
