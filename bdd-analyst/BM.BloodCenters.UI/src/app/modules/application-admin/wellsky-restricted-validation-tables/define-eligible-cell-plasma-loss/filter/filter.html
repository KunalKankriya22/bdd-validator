<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">
  <!-- Header -->
  <header class="filter-header">
    <h2 id="filter-title" class="filter-title">Filters</h2>
    <button mat-icon-button class="close-btn" type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-content">
    <!-- Cell Type -->
    <mat-form-field appearance="fill">
      <mat-label>Cell Type</mat-label>
      <mat-select formControlName="cellType">
        <mat-option *ngFor="let type of cellTypeOptions" [value]="type.value">
          {{ type.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Show All Records Checkbox -->
    <div class="checkbox-wrapper">
      <mat-checkbox formControlName="showAllRecords">Show Terminated and activated cell type records</mat-checkbox>
    </div>
  </form>

  <!-- Footer -->
  <footer class="filter-footer">
    <button mat-stroked-button type="button" class="clear-button" (click)="onClear()">CLEAR ALL</button>
    <button mat-raised-button color="primary" type="button" class="apply-button" (click)="onApply()" [disabled]="isApplyDisabled">APPLY</button>
  </footer>
</section>
