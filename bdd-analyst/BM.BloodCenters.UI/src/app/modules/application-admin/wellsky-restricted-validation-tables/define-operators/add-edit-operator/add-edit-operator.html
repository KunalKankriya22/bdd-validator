<div class="side-panel-wrapper" role="dialog" aria-modal="true" aria-labelledby="operator-panel-title"
     cdkTrapFocus cdkTrapFocusAutoCapture>

  <!-- Header -->
  <div class="panel-header">
    <div class="header-content">
      <h2 id="operator-panel-title" class="panel-title">{{ panelTitle }}</h2>
    </div>

    <button #closeBtn type="button" mat-icon-button class="close-btn" (click)="onCancel()" aria-label="Close panel">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="panel-body">
    <form [formGroup]="form" class="operator-form">

      <!-- FORM GRID (2-column) -->
      <div class="form-grid">

        <!-- Row 1: Operator + Values -->

        <!-- Operator (editable in both modes per FMB + Figma) -->
        <mat-form-field appearance="fill">
          <mat-label>Operator</mat-label>
          <input matInput formControlName="operator" maxlength="10"
                 (keydown)="preventNonAlphanumeric($event, 'operator')"
                 (paste)="preventNonAlphanumericPaste($event)">
          <mat-error *ngIf="getOperatorError()">
            {{ getOperatorError() }}
          </mat-error>
        </mat-form-field>

        <!-- Values (Value Style) - editable in both modes -->
        <mat-form-field appearance="fill">
          <mat-label>Values</mat-label>
          <mat-select formControlName="valueStyle">
            <mat-option>
              <ngx-mat-select-search
                [formControl]="valueStyleSearchControl"
                placeholderLabel="Search values..."
                noEntriesFoundLabel="No matching values">
              </ngx-mat-select-search>
            </mat-option>
            <mat-option *ngFor="let option of filteredValueStyleOptions" [value]="option.value">
              {{ option.label }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="getValueStyleError()">
            {{ getValueStyleError() }}
          </mat-error>
        </mat-form-field>

        <!-- Row 2: Description (full-width) -->
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Description</mat-label>
          <input matInput formControlName="description" maxlength="100"
                 (keydown)="preventLeadingSpace($event, 'description')">
          <mat-error *ngIf="getDescriptionError()">
            {{ getDescriptionError() }}
          </mat-error>
        </mat-form-field>

        <!-- Row 3: Effective Date + Termination Date -->

        <!-- Effective Date (ADD mode: editable date picker, EDIT mode: read-only card) -->
        <mat-form-field appearance="fill" *ngIf="mode === 'add'" [class.has-error]="getEffectiveDateError()">
          <mat-label>Effective Date</mat-label>
          <input matInput [matDatepicker]="effectivePicker" formControlName="effectiveDate"
                 [min]="minDate" [errorStateMatcher]="effDateErrorMatcher"
                 (input)="onEffectiveDateInput($event)">
          <mat-datepicker-toggle matIconSuffix [for]="effectivePicker"></mat-datepicker-toggle>
          <mat-datepicker #effectivePicker></mat-datepicker>
          <mat-error *ngIf="getEffectiveDateError()">
            {{ getEffectiveDateError() }}
          </mat-error>
        </mat-form-field>
        <div class="field-display-card" *ngIf="mode === 'edit'" role="group" aria-label="Effective Date (read-only)">
          <div class="field-label" aria-hidden="true">Effective Date</div>
          <div class="field-value">{{ editModeValues.effectiveDate || '-' }}</div>
        </div>

        <!-- Termination Date -->
        <mat-form-field appearance="fill" [class.has-error]="getTerminationDateError()">
          <mat-label>Termination Date</mat-label>
          <input matInput [matDatepicker]="terminationPicker" formControlName="terminationDate"
                 [min]="minDate" [matDatepickerFilter]="terminationDateFilter"
                 [errorStateMatcher]="termDateErrorMatcher"
                 (input)="onTerminationDateInput($event)"
                 (blur)="onTerminationDateBlur()">
          <mat-datepicker-toggle matIconSuffix [for]="terminationPicker"></mat-datepicker-toggle>
          <mat-datepicker #terminationPicker></mat-datepicker>
          <mat-error *ngIf="getTerminationDateError()">
            {{ getTerminationDateError() }}
          </mat-error>
        </mat-form-field>

      </div>
      <!-- END FORM GRID -->

    </form>
  </div>

  <!-- Footer -->
  <div class="panel-footer">
    <div class="footer-actions">

      <button type="button" mat-button class="cancel-btn" (click)="onCancel()" [disabled]="isSaving">
        CANCEL
      </button>

      <button type="button" mat-raised-button class="primary-btn" (click)="onSave()"
        [disabled]="isFormActionDisabled"
        [attr.aria-label]="isSaving ? 'Saving, please wait' : (mode === 'add' ? 'Add operator' : 'Save operator')">
        {{ isSaving ? 'SAVING...' : (mode === 'add' ? 'ADD' : 'SAVE') }}
      </button>

    </div>
  </div>

</div>
