<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title"
         cdkTrapFocus cdkTrapFocusAutoCapture>

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Values (Value Style) Dropdown -->
    <mat-form-field appearance="fill">
      <mat-label>Values</mat-label>
      <mat-select formControlName="valueStyle">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="valueStyleSearchControl"
            placeholderLabel="Search values..."
            noEntriesFoundLabel="No matching values">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredValueStyleOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Effective Date group: Period (104px) + Date field (flex) -->
    <div role="group" aria-label="Effective Date filter">
      <div class="filter-panel__date-row">
        <mat-form-field appearance="fill" class="period-field">
          <mat-label>Period</mat-label>
          <mat-select formControlName="effectiveDatePeriod"
                      [attr.aria-describedby]="effectivePeriodRequired ? 'eff-period-error' : null">
            <mat-option *ngFor="let period of periodOptions" [value]="period.value">
              {{ period.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill" class="date-field">
          <mat-label>Effective Date</mat-label>
          <input
            #effectiveDateInput
            matInput
            [matDatepicker]="picker1"
            formControlName="effectiveDate"
            (input)="onEffectiveDateInput($event)"
            (blur)="onEffectiveDateBlur(effectiveDateInput)">
          <mat-datepicker-toggle matIconSuffix [for]="picker1"></mat-datepicker-toggle>
          <mat-datepicker #picker1></mat-datepicker>
          <mat-error *ngIf="filterForm.get('effectiveDate')?.hasError('invalidDateFormat')">
            Invalid date
          </mat-error>
          <mat-error *ngIf="filterForm.get('effectiveDate')?.hasError('matDatepickerParse')">
            Invalid date
          </mat-error>
        </mat-form-field>
      </div>
      <div id="eff-period-error" class="error-message" *ngIf="effectivePeriodRequired" role="alert">Period is required</div>
    </div>

    <!-- Termination Date group: Period (104px) + Date field (flex) -->
    <div role="group" aria-label="Termination Date filter">
      <div class="filter-panel__date-row">
        <mat-form-field appearance="fill" class="period-field">
          <mat-label>Period</mat-label>
          <mat-select formControlName="terminationDatePeriod"
                      [attr.aria-describedby]="terminationPeriodRequired ? 'term-period-error' : null">
            <mat-option *ngFor="let period of periodOptions" [value]="period.value">
              {{ period.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill" class="date-field">
          <mat-label>Termination Date</mat-label>
          <input
            #terminationDateInput
            matInput
            [matDatepicker]="picker2"
            formControlName="termDate"
            (input)="onTerminationDateInput($event)"
            (blur)="onTerminationDateBlur(terminationDateInput)">
          <mat-datepicker-toggle matIconSuffix [for]="picker2"></mat-datepicker-toggle>
          <mat-datepicker #picker2></mat-datepicker>
          <mat-error *ngIf="filterForm.get('termDate')?.hasError('invalidDateFormat')">
            Invalid date
          </mat-error>
          <mat-error *ngIf="filterForm.get('termDate')?.hasError('matDatepickerParse')">
            Invalid date
          </mat-error>
        </mat-form-field>
      </div>
      <div id="term-period-error" class="error-message" *ngIf="terminationPeriodRequired" role="alert">Period is required</div>
    </div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" class="clear-btn" (click)="onClear()">CLEAR ALL</button>
    <button mat-raised-button type="button" class="apply-btn" (click)="onApply()" [disabled]="isApplyDisabled">APPLY</button>
  </footer>

</section>
