<section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title" id="grading-matrix-filter-panel">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <mat-form-field appearance="fill">
      <mat-label>First Name</mat-label>
      <mat-select formControlName="firstnameMatch">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="firstnameSearchControl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No matching options">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredFirstnameOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Last Name</mat-label>
      <mat-select formControlName="lastnameMatch">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="lastnameSearchControl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No matching options">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredLastnameOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>DOB match</mat-label>
      <mat-select formControlName="dobMatch">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="dobSearchControl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No matching options">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredDobOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Gender match</mat-label>
      <mat-select formControlName="genderMatch">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="genderSearchControl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No matching options">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredGenderOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Grade</mat-label>
      <mat-select formControlName="grade">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="gradeSearchControl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No matching options">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredGradeOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" class="clear-btn" (click)="onClear()">CLEAR ALL</button>
    <button mat-raised-button type="button" class="apply-btn" (click)="onApply()" [disabled]="isApplyDisabled">APPLY</button>
  </footer>

</section>
