<app-filter-panel-base
  [title]="'Filters'"
  [maxContentHeight]="380"
  [width]="320"
  [applyDisabled]="isApplyDisabled"
  (apply)="onApply()"
  (clear)="onClear()"
  (close)="onClose()">

  <!-- Filter Form Content -->
  <form [formGroup]="filterForm" aria-describedby="filter-desc">

    <mat-form-field appearance="fill">
      <mat-label>Type</mat-label>
      <mat-select formControlName="type" (closed)="onTypeDropdownClosed()">
        <mat-option>
          <ngx-mat-select-search [formControl]="typeSearchControl"
                                 placeholderLabel="Search types..."
                                 noEntriesFoundLabel="No matching types">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let type of filteredTypeOptions" [value]="type.value">
          {{ type.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Drive</mat-label>
      <mat-select formControlName="drive" (closed)="onDriveDropdownClosed()">
        <mat-option>
          <ngx-mat-select-search [formControl]="driveSearchControl"
                                 placeholderLabel="Search by Drive ID"
                                 noEntriesFoundLabel="No matching drives">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let drive of filteredDriveIdOptions" [value]="drive.value">
          {{ drive.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Site ID</mat-label>
      <mat-select formControlName="siteId" (closed)="onSiteDropdownClosed()">
        <mat-option>
          <ngx-mat-select-search [formControl]="siteSearchControl"
                                 placeholderLabel="Search by Site ID or Description..."
                                 noEntriesFoundLabel="No matching sites">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let site of filteredSiteIdOptions" [value]="site.value">
          {{ site.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Scheduled Date with Period using helper classes -->
    <div class="filter-panel__date-group">
      <!-- <label class="filter-panel__date-label">Scheduled Date</label> -->
      <div class="filter-panel__date-row">
        <mat-form-field appearance="fill" class="filter-panel__period-field">
          <mat-label [ngStyle]="{ color: getPeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="period" (closed)="onPeriodDropdownClosed()">
            <mat-option>
              <ngx-mat-select-search [formControl]="periodSearchControl"
                                     placeholderLabel="Search period..."
                                     noEntriesFoundLabel="No matching periods">
              </ngx-mat-select-search>
            </mat-option>
            <mat-option *ngFor="let period of filteredPeriodOptions" [value]="period">
              {{ period }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="getPeriodError()">
            {{ getPeriodError() }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="filter-panel__date-field">
          <mat-label>Scheduled Date</mat-label>
          <input #scheduledDateInput
                 matInput
                 [matDatepicker]="scheduledPicker"
                 formControlName="scheduledDate"
                 (input)="onScheduledDateInput($event)"
                 (blur)="onScheduledDateBlur(scheduledDateInput)"
                 (keydown.enter)="$event.target.blur()"
                 >
          <mat-datepicker-toggle matIconSuffix [for]="scheduledPicker"></mat-datepicker-toggle>
          <mat-datepicker #scheduledPicker></mat-datepicker>
          <mat-error *ngIf="filterForm.get('scheduledDate')?.hasError('invalidDateFormat')">
            Invalid date
          </mat-error>
          <mat-error *ngIf="filterForm.get('scheduledDate')?.hasError('matDatepickerParse')">
            Invalid date
          </mat-error>
        </mat-form-field>
      </div>
    </div>

  </form>

</app-filter-panel-base>
