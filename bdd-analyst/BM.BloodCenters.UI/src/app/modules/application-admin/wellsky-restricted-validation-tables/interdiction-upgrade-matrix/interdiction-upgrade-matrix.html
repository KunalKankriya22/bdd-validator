<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="interdiction-upgrade-matrix main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Interdiction Upgrade Matrix content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="interdiction-upgrade-matrix__card" #tableCard>

      <!-- Table Controls with Inline Filter Chips -->
      <div class="interdiction-upgrade-matrix__controls">
        <!-- Left section: Filter button and chips -->
        <div class="interdiction-upgrade-matrix__controls-left">
          <!-- Filter button -->
          <button
            #filterBtn
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            aria-label="Open filter options"
            (click)="openFilter()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <!-- Responsive Filter Chips -->
          <app-filter-chips
            *ngIf="hasActiveFilters()"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right section: Search bar -->
        <div class="interdiction-upgrade-matrix__controls-right">
          <app-search-bar
            [config]="searchConfig"
            [searchText]="searchTerm"
            (search)="onSearch($event)"
            (cleared)="onSearchCleared()">
          </app-search-bar>
        </div>
      </div>

      <!-- Data Table -->
      <div class="interdiction-upgrade-matrix__table-wrapper">
        <app-data-table
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen"
       role="complementary"
       [attr.aria-label]="sidePanelMode === 'add' ? 'Add new interdiction upgrade' : 'Edit interdiction upgrade'">
    <app-add-edit-interdiction-upgrade
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      [interdictionCodes]="interdictionCodes"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()"
      (modeChange)="onModeChange($event)">
    </app-add-edit-interdiction-upgrade>
  </div>

</div>
