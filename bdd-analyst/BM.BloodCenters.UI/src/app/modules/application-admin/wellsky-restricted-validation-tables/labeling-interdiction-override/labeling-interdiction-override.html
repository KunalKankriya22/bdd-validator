<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="labeling-interdiction-override main-content"
        [class.side-panel-active]="sidePanelOpen"
        [attr.aria-label]="'Labeling Interdiction Override Tech1 content'"
        role="main">

    <h1 class="cdk-visually-hidden">{{ headerConfig.title }}</h1>

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="labeling-interdiction-override__card" #tableCard>

      <!-- Table Controls with Inline Filter Chips -->
      <div class="labeling-interdiction-override__controls">
        <!-- Left section: Filter button and chips -->
        <div class="labeling-interdiction-override__controls-left">
          <button
            #filterBtn
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            aria-label="Toggle filter options"
            [attr.aria-expanded]="isFilterOpen"
            aria-haspopup="dialog"
            (click)="openFilter()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          @if (hasActiveFilters()) {
            <app-filter-chips
              [chips]="filterChips"
              [maxVisible]="3"
              (removeChip)="onRemoveFilterChip($event)"
              (clearAll)="clearAllFilters()" />
          }
        </div>

        <!-- Right section: Search bar -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearchEvent($event)"
          (keydown.enter)="onEnterSearch()" />
      </div>

      <!-- Error State -->
      @if (hasError && !isLoading) {
        <div class="labeling-interdiction-override__error" role="alert"
             [attr.aria-label]="'Error loading data'">
          <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
          <p class="error-message">{{ errorMessage }}</p>
          <button type="button" mat-raised-button color="primary" (click)="loadData()">
            Retry
          </button>
        </div>
      }

      <!-- Data Table -->
      <div class="labeling-interdiction-override__table-wrapper">
        @if (!hasError) {
        <app-data-table
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          [highlightedRow]="editingRow"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
        }
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  @if (sidePanelOpen) {
    <div class="side-panel-container" role="complementary" [attr.aria-label]="'Override details panel'">
      <app-add-edit-labeling-interdiction-override
        [mode]="sidePanelMode"
        [data]="sidePanelData"
        (closePanel)="closeSidePanel()"
        (saveSuccess)="onSaveSuccess()"
        (modeChange)="onModeChange($event)" />
    </div>
  }

</div>
