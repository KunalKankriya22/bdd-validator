<div class="delete-note-dialog" role="alertdialog" aria-modal="true" aria-labelledby="delete-note-title">

  <h2 id="delete-note-title" class="delete-note-dialog__title">Delete Note</h2>

  <div class="delete-note-dialog__content">
    <p>This action will delete the note permanently. Do you want to continue?</p>
  </div>

  <div class="delete-note-dialog__actions">
    <button
      mat-button
      type="button"
      class="delete-note-dialog__cancel-btn"
      (click)="onCancel()"
      [attr.aria-label]="'Cancel delete'">
      NO, CANCEL
    </button>

    <button
      mat-raised-button
      type="button"
      class="delete-note-dialog__confirm-btn primary-btn"
      (click)="onConfirm()"
      [attr.aria-label]="'Confirm delete'">
      YES
    </button>
  </div>

</div>
