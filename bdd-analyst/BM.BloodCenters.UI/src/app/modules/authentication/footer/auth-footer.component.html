<footer class="auth-footer" role="contentinfo" aria-label="Authentication footer">
  
  <p class="auth-footer__title">
    <strong>{{ 'AUTH.FOOTER.SUPPORT_TITLE' | translate }}</strong>
  </p>

  <div class="auth-footer__contact">
    <span class="auth-footer__contact-item">
      {{ 'AUTH.FOOTER.PHONE_LABEL' | translate }} {{ 'AUTH.FOOTER.PHONE_NUMBER' | translate }}
    </span>
    <span class="auth-footer__separator">|</span>
    <span class="auth-footer__contact-item">
      {{ 'AUTH.FOOTER.HOURS' | translate }}
    </span>
  </div>

  <p class="auth-footer__copyright">
    {{ 'AUTH.FOOTER.COPYRIGHT' | translate }}
  </p>

</footer>
