<header class="auth-header" role="banner" aria-label="Authentication header">
  
  <div class="auth-header__logo-container">
    <img
      alt="WellSky"
      class="auth-header__logo" />
  </div>

  <nav class="auth-header__nav" role="navigation" aria-label="Main navigation">
    <a
      class="auth-header__link"
      [attr.aria-label]="'AUTH.HEADER.HOME' | translate">
      {{ 'AUTH.HEADER.HOME' | translate }}
    </a>
    <a
      class="auth-header__link"
      [attr.aria-label]="'AUTH.HEADER.SOLUTIONS' | translate">
      {{ 'AUTH.HEADER.SOLUTIONS' | translate }}
    </a>
    <a
      class="auth-header__link"
      [attr.aria-label]="'AUTH.HEADER.SUPPORT' | translate">
      {{ 'AUTH.HEADER.SUPPORT' | translate }}
    </a>
  </nav>

</header>
