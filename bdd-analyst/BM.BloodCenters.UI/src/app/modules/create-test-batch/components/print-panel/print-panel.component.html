<div class="panel-wrapper">
  <div class="panel-header">
    <h2 class="panel-title" id="print-panel-title">Print Tests</h2>
    <button type="button" class="close-btn" (click)="onCancel()" aria-label="Close Print Tests panel">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <div class="panel-body">
    <div class="print-table" role="table" aria-label="Printable tests">
      <div role="rowgroup">
        <div class="print-table-header" role="row">
          <span class="col-check" role="columnheader"><span class="cdk-visually-hidden">Select</span></span>
          <span class="col-test-id" role="columnheader">Test ID</span>
          <span class="col-description" role="columnheader">Description</span>
          <span class="col-report" role="columnheader">Test Kit</span>
        </div>
      </div>

      <div class="print-table-body" role="rowgroup">
        @for (test of tests; track test.testId) {
          <div class="print-row" role="row"
            [class.selected]="isSelected(test.testId)"
            (click)="toggleTest(test.testId)"
            (keydown.enter)="toggleTest(test.testId)"
            (keydown.space)="toggleTest(test.testId); $event.preventDefault()"
            tabindex="0">
            <div class="col-check" role="cell">
              <mat-checkbox [checked]="isSelected(test.testId)"
                (click)="$event.stopPropagation()"
                (change)="toggleTest(test.testId)"
                [aria-label]="'Select test ' + test.testId"></mat-checkbox>
            </div>
            <span class="col-test-id" role="cell">{{ test.testId }}</span>
            <span class="col-description" role="cell">{{ test.testDesc }}</span>
            <span class="col-report" role="cell">–</span>
          </div>
        }
      </div>
    </div>
  </div>

  <div class="panel-footer">
    <button class="btn-cancel" (click)="onCancel()">CANCEL</button>
    <button class="btn-print" [disabled]="selectedTestIds.size === 0" (click)="onPrint()">PRINT</button>
  </div>
</div>
