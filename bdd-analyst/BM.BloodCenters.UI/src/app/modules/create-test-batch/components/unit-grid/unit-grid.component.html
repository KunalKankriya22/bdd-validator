<div class="unit-grid-header">
  <div class="scan-row">
    <app-unit-id-field
      #unitField
      [validateFfValue]="'N'"
      label="Unit"
      [required]="true"
      [showBarcodeIcon]="true"
      (validated)="onUnitValidated($event)" />
  </div>
</div>

<div class="unit-table" role="table" aria-label="Units list">
  <div role="rowgroup">
    <div class="unit-table-header" role="row">
      <div class="col-seq header-cell" role="columnheader">
        <span>Sequence</span>
      </div>
      <div class="col-unit-id header-cell" role="columnheader">
        <span>Unit ID</span>
      </div>
      <div class="col-coll-date header-cell" role="columnheader">
        <span>Collection Date</span>
      </div>
      <div class="col-actions header-cell" role="columnheader">
        <span class="cdk-visually-hidden">Actions</span>
      </div>
    </div>
  </div>

  <div class="unit-table-body" role="rowgroup">
    @for (unit of units; track $index; let i = $index) {
      <div class="unit-row" role="row">
        <span class="col-seq" role="cell">{{ unit.seqNo }}</span>
        <span class="col-unit-id" role="cell">{{ unit.unitId }}</span>
        <span class="col-coll-date" role="cell">{{ formatDate(unit.collDate) }}</span>
        <div class="col-actions" role="cell">
          <button class="btn-delete"
            (click)="removeUnit(i)"
            [attr.aria-label]="'Delete unit ' + unit.unitId">
            <mat-icon aria-hidden="true">delete</mat-icon>
          </button>
        </div>
      </div>
    }
  </div>
</div>
