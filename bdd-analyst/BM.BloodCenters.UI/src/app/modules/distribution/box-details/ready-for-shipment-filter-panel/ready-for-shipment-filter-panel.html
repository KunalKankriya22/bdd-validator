<section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title" cdkTrapFocus cdkTrapFocusAutoCapture (keydown.escape)="onClose()">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" [attr.aria-label]="'Close filter panel'" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Priority -->
    <mat-form-field appearance="fill" subscriptSizing="dynamic">
      <mat-label>Priority</mat-label>
      <mat-select formControlName="priority">
        <mat-option>
          <ngx-mat-select-search [formControl]="prioritySearchCtrl"
            placeholderLabel="Search priorities..."
            noEntriesFoundLabel="No matching priorities">
          </ngx-mat-select-search>
        </mat-option>
        @for (p of filteredPriorities; track p) {
          <mat-option [value]="p">{{ p }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Consignee -->
    <mat-form-field appearance="fill" subscriptSizing="dynamic">
      <mat-label>Consignee</mat-label>
      <mat-select formControlName="consignee">
        <mat-option>
          <ngx-mat-select-search [formControl]="consigneeSearchCtrl"
            placeholderLabel="Search consignees..."
            noEntriesFoundLabel="No matching consignees">
          </ngx-mat-select-search>
        </mat-option>
        @for (c of filteredConsignees; track c) {
          <mat-option [value]="c">{{ c }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Packed By -->
    <mat-form-field appearance="fill" subscriptSizing="dynamic">
      <mat-label>Packed By</mat-label>
      <mat-select formControlName="packedBy">
        <mat-option>
          <ngx-mat-select-search [formControl]="packedBySearchCtrl"
            placeholderLabel="Search users..."
            noEntriesFoundLabel="No matching users">
          </ngx-mat-select-search>
        </mat-option>
        @for (u of filteredPackedByUsers; track u) {
          <mat-option [value]="u">{{ u }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" class="clear-btn" (click)="onClear()">
      CLEAR ALL
    </button>

    <button mat-raised-button type="button" class="apply-btn" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
