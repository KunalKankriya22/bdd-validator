<div class="side-panel-wrapper">

  <!-- Header -->
  <div class="side-panel-header">
    <h2 class="panel-title">View Additional Shipment Details</h2>
    <button type="button" mat-icon-button class="close-button" (click)="onClose()" aria-label="Close panel">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="panel-body">
    @if (shipment) {
      <!-- Details Row -->
      <div class="details-row">
        <div class="field-label">
          <span class="label">Receive Date</span>
          <span class="value">{{ formatDateTime(shipment.receiptDate) }}</span>
        </div>
        <div class="field-label">
          <span class="label">Received By</span>
          <span class="value">{{ shipment.receivedBy || '-' }}</span>
        </div>
        <div class="field-label">
          <span class="label">Tracking Number</span>
          <span class="value">{{ shipment.trackingNo || '-' }}</span>
        </div>
        <div class="field-label">
          <span class="label">Flight Number</span>
          <span class="value">{{ shipment.flightNo || '-' }}</span>
        </div>
      </div>

      <!-- Delivery Comments -->
      <div class="comments-section">
        <span class="label">Delivery Comments</span>
        <div class="comments-text">{{ shipment.note || '-' }}</div>
      </div>

      <!-- Pick Slip IDs -->
      <div class="pickslip-section">
        <app-data-table
          [config]="pickSlipTableConfig()"
          [data]="pickSlipData()">
        </app-data-table>
      </div>
    }
  </div>

  <!-- Footer -->
  <div class="side-panel-footer">
    <button mat-stroked-button color="primary" type="button" (click)="onClose()">
      CLOSE
    </button>
  </div>

</div>
