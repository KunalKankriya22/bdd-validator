<section class="dialog-container" role="dialog" aria-labelledby="box-details-title">
  <header class="dialog-header">
    <h2 id="box-details-title" mat-dialog-title>View Box Details</h2>
    <button
      mat-icon-button
      type="button"
      (click)="onClose()"
      aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <mat-dialog-content class="dialog-content">
    @if (loading()) {
      <div class="loading-overlay">
        <app-loading-spinner size="large" message="Loading..." color="#228189"></app-loading-spinner>
      </div>
    }

    <app-data-table
      [config]="tableConfig()"
      [data]="boxes()"
      (sortChange)="onSortChange($event)"
      aria-label="Box details table" />
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions" align="end">
    <button
      mat-stroked-button
      type="button"
      (click)="onClose()">
      CLOSE
    </button>
  </mat-dialog-actions>
</section>
