<section class="dialog-container" role="dialog" aria-labelledby="delivery-notes-title">
  <header class="dialog-header">
    <h2 id="delivery-notes-title" mat-dialog-title>View Delivery Notes</h2>
    <button
      mat-icon-button
      type="button"
      (click)="onClose()"
      aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <mat-dialog-content class="dialog-content">
    @if (loading()) {
      <div class="loading-overlay">
        <app-loading-spinner size="large" message="Loading..." color="#228189"></app-loading-spinner>
      </div>
    }

    <div class="notes-section">
      <span class="notes-label">Delivery Notes</span>
      <p class="notes-text">{{ note() || 'No delivery notes available.' }}</p>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions" align="end">
    <button
      mat-stroked-button
      type="button"
      (click)="onClose()">
      CLOSE
    </button>
  </mat-dialog-actions>
</section>
