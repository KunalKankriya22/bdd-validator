<!-- Layout Wrapper -->
<div class="layout-wrapper">

  <!-- Main Content Area -->
  <main class="xml-error-log-file main-content"
        [attr.aria-label]="'XML Error Log file content'">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="xml-error-log-file__card" #tableCard>

      <!-- Table Controls with Inline Filter Chips -->
      <div class="xml-error-log-file__controls">
        <!-- Left section: Filter button and chips -->
        <div class="xml-error-log-file__controls-left">
          <button
            #filterBtn
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            [attr.aria-label]="isFilterOpen ? 'Close filter options' : 'Open filter options'"
            [attr.aria-expanded]="isFilterOpen"
            (click)="openFilter()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          @if (hasActiveFilters()) {
            <app-filter-chips
              [chips]="filterChips"
              [maxVisible]="3"
              (removeChip)="onRemoveFilterChip($event)"
              (clearAll)="clearAllFilters()">
            </app-filter-chips>
          }
        </div>

        <!-- Right section: Search bar -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)" />
      </div>

      <!-- Error State -->
      @if (hasError && !isLoading) {
        <div class="xml-error-log-file__error">
          <mat-icon class="empty-icon" aria-hidden="true">inbox</mat-icon>
          <p class="error-message">{{ errorMessage }}</p>
        </div>
      }

      <!-- Data Table -->
      <div class="xml-error-log-file__table-wrapper">
        @if (!hasError) {
          <app-data-table
            [config]="tableConfig"
            [data]="dataSource"
            [loading]="isLoading"
            (pageChange)="onPageChange($event)" />
        }
      </div>
    </div>
  </main>

</div>
