<section class="filter-panel" role="region" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" [attr.aria-label]="'Close filter panel'" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Plasma File Type -->
    <mat-form-field appearance="fill">
      <mat-label>Plasma File Type</mat-label>
      <mat-select formControlName="plasmaFileType" cdkFocusInitial>
        <mat-option>
          <ngx-mat-select-search
            [formControl]="plasmaFileTypeSearchCtrl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No types found">
          </ngx-mat-select-search>
        </mat-option>
        @for (type of filteredPlasmaFileTypes(); track type.code) {
          <mat-option [value]="type.code">{{ type.description }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Log Date -->
    <mat-form-field appearance="fill">
      <mat-label>Date</mat-label>
      <input
        #logDateInput
        matInput
        [matDatepicker]="logDatePicker"
        [max]="maxDate"
        formControlName="logDate"
        (input)="onLogDateInput($event)"
        (blur)="onLogDateBlur(logDateInput)"
      >
      <mat-datepicker-toggle matIconSuffix [for]="logDatePicker"></mat-datepicker-toggle>
      <mat-datepicker #logDatePicker></mat-datepicker>
      @if (getLogDateError()) {
        <mat-error>{{ getLogDateError() }}</mat-error>
      }
    </mat-form-field>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" class="clear-btn" (click)="onClear()">
      CLEAR ALL
    </button>

    <button mat-raised-button type="button" class="apply-btn" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
