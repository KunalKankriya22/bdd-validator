<div class="side-panel-container" role="dialog" aria-labelledby="box-contents-title">
  <div class="side-panel-header">
    <h2 class="side-panel-title" id="box-contents-title">View Box Contents</h2>
    <button mat-icon-button type="button" class="btn-close" (click)="close()" aria-label="Close panel">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="side-panel-body">
    <app-data-table
      [config]="tableConfig()"
      [data]="sortedContents()"
      (sortChange)="onSortChange($event)">
    </app-data-table>
  </div>

  <div class="side-panel-footer">
    <button mat-button type="button" class="btn-footer-close" (click)="close()">CLOSE</button>
  </div>
</div>
