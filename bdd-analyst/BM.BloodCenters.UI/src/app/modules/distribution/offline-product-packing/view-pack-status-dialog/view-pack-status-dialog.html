<div class="side-panel-container" role="dialog" aria-labelledby="pack-status-title">
  <div class="side-panel-header">
    <h2 class="side-panel-title" id="pack-status-title">View Pack Status</h2>
    <button mat-icon-button type="button" class="btn-close" (click)="close()" aria-label="Close panel">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="side-panel-body">
    <div class="tables-container">
      <div class="table-section" role="region" aria-labelledby="packed-products-heading">
        <h3 id="packed-products-heading">Packed Products</h3>
        <app-data-table
          [config]="packedTableConfig()"
          [data]="sortedPacked()"
          (sortChange)="onPackedSortChange($event)">
        </app-data-table>
      </div>

      <div class="table-section" role="region" aria-labelledby="allocated-products-heading">
        <h3 id="allocated-products-heading">Allocated Products</h3>
        <app-data-table
          [config]="allocatedTableConfig()"
          [data]="sortedAllocated()"
          (sortChange)="onAllocatedSortChange($event)">
        </app-data-table>
      </div>
    </div>
  </div>

  <div class="side-panel-footer">
    <button mat-button type="button" class="btn-footer-close" (click)="close()">CLOSE</button>
  </div>
</div>
