<h2 mat-dialog-title class="dialog-title">Enter Notes</h2>

<mat-dialog-content class="dialog-body">
  <mat-form-field appearance="fill" class="notes-field">
    <mat-label>Notes</mat-label>
    <textarea
      matInput
      cdkFocusInitial
      [(ngModel)]="noteText"
      placeholder="Type comments here"
      rows="6">
    </textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions" align="end">
  <button mat-stroked-button type="button" class="btn-cancel" (click)="onCancel()">
    CANCEL
  </button>
  <button mat-raised-button type="button" class="btn-add" [disabled]="!canAdd" (click)="onAdd()">
    ADD
  </button>
</mat-dialog-actions>
