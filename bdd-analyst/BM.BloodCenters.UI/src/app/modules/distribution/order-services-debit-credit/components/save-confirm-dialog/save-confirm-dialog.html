<h2 mat-dialog-title class="dialog-title">Save Entry</h2>

<mat-dialog-content class="dialog-body">
  <p class="dialog-message">
    The service will be '{{ data.tranTypeLabel }}' to '{{ data.customerName }}'.<br>
    Are you sure you want to confirm?
  </p>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions" align="end">
  <button mat-button type="button" class="btn-no" (click)="onNoCancel()">
    NO, CANCEL
  </button>
  <button mat-raised-button type="button" class="btn-yes" cdkFocusInitial (click)="onYesConfirm()">
    YES, CONFIRM
  </button>
</mat-dialog-actions>
