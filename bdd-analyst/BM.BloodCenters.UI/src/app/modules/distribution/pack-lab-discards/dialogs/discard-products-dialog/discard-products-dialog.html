<div class="side-panel-container">
  <div class="side-panel-header">
    <h2>Products to be Discarded</h2>
    <button mat-icon-button (click)="onClose()" [attr.aria-label]="'Close discard products panel'">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <div class="side-panel-content">
    @if (loading()) {
      <div class="loading-container" role="status" aria-live="polite" aria-busy="true">
        <mat-spinner diameter="40" aria-hidden="true"></mat-spinner>
        <span class="cdk-visually-hidden">Loading, please wait...</span>
      </div>
    } @else {
      <app-data-table [config]="tableConfig()" [data]="sortedProducts()" [loading]="loading()" (sortChange)="onSortChange($event)"></app-data-table>
    }
  </div>

  <div class="side-panel-actions">
    <button mat-stroked-button (click)="onClose()">CLOSE</button>
  </div>
</div>
