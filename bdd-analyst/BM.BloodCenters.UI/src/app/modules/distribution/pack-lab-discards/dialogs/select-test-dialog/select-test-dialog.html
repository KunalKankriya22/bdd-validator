<div class="side-panel-container">
  <div class="side-panel-header">
    <h2>Select Test</h2>
    <button mat-icon-button (click)="onGoBack()" [attr.aria-label]="'Close select test panel'">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <div class="side-panel-content">
    <!-- Filters Row -->
    <div class="filter-row">
      <mat-form-field appearance="fill" class="filter-field">
        <mat-label>Select By</mat-label>
        <mat-select [value]="selectBy()" (selectionChange)="onSelectByChange($event.value)">
          <mat-option value="ALL">All Test ID</mat-option>
          <mat-option value="GROUP">Group ID</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="filter-field">
        <mat-label>Group ID</mat-label>
        <mat-select [value]="selectedGroupId()" (selectionChange)="onGroupChange($event.value)" [disabled]="selectBy() !== 'GROUP'">
          @for (group of groupIds(); track group) {
            <mat-option [value]="group">{{ group }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <dl class="contract-desc" style="margin: 0;">
        <dt class="field-label">Contract Description</dt>
        <dd class="field-value" style="margin: 0;">{{ contractDescription() }}</dd>
      </dl>
    </div>

    <!-- Test Selection Table -->
    <div class="test-table">
      <div class="test-table-header">
        <mat-checkbox [checked]="isAllSelected()" [indeterminate]="isIndeterminate()"
                      (change)="onToggleAll($event.checked)"
                      [attr.aria-label]="'Select all tests'">
        </mat-checkbox>
        <span class="header-cell" aria-hidden="true">Test ID</span>
        <span class="header-cell" aria-hidden="true">Test Description</span>
      </div>

      <div class="test-table-body"
           role="listbox"
           [attr.aria-label]="'Available tests'"
           aria-multiselectable="true">
        @for (test of filteredTests(); track test.testId) {
          <div class="test-row"
               [class.selected]="isTestSelected(test.testId)"
               (click)="onToggleTest(test.testId, !isTestSelected(test.testId))"
               (keydown.enter)="onToggleTest(test.testId, !isTestSelected(test.testId))"
               (keydown.space)="onToggleTest(test.testId, !isTestSelected(test.testId)); $event.preventDefault()"
               tabindex="0"
               role="option"
               [attr.aria-selected]="isTestSelected(test.testId)"
               [attr.aria-label]="test.testId + ': ' + test.testDesc">
            <mat-checkbox [checked]="isTestSelected(test.testId)"
                          (change)="onToggleTest(test.testId, $event.checked)"
                          (click)="$event.stopPropagation()"
                          [attr.aria-hidden]="'true'"
                          tabindex="-1">
            </mat-checkbox>
            <span class="cell">{{ test.testId }}</span>
            <span class="cell">{{ test.testDesc }}</span>
          </div>
        }
      </div>
    </div>
  </div>

  <div class="side-panel-actions">
    <button mat-stroked-button (click)="onGoBack()">GO BACK</button>
    <button mat-raised-button color="primary" (click)="onProceed()" [disabled]="selectedIds().size === 0"
            [attr.aria-label]="'Proceed with ' + selectedIds().size + ' selected test' + (selectedIds().size === 1 ? '' : 's')">PROCEED</button>
  </div>
</div>
