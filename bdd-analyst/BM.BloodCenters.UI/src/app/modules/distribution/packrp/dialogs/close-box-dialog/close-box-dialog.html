<div class="close-box-dialog" [attr.aria-labelledby]="elementId('title')">
  <h2 mat-dialog-title [id]="elementId('title')">Close Box</h2>

  <mat-dialog-content>
    <!-- Question 1: Close Current Box -->
    <div class="question-group" role="group" [attr.aria-labelledby]="labelId('close-box')">
      <label [id]="labelId('close-box')" class="question-label">
        Close Current Box? <span class="required-marker">*</span>
      </label>

      <mat-radio-group
        [id]="elementId('close-box-group')"
        [value]="closeCurrentBox()"
        (change)="onCloseBoxChange($event.value)"
        aria-required="true">
        <mat-radio-button
          [value]="true"
          [id]="elementId('close-box-yes')"
          class="radio-option">
          Yes
        </mat-radio-button>
        <mat-radio-button
          [value]="false"
          [id]="elementId('close-box-no')"
          class="radio-option">
          No
        </mat-radio-button>
      </mat-radio-group>
    </div>

    <!-- Question 2: All Products Properly Packed -->
    <div class="question-group" role="group" [attr.aria-labelledby]="labelId('properly-packed')">
      <label [id]="labelId('properly-packed')" class="question-label">
        All products properly packed? <span class="required-marker">*</span>
      </label>

      <mat-radio-group
        [id]="elementId('properly-packed-group')"
        [value]="allProperlyPacked()"
        (change)="onProperlyPackedChange($event.value)"
        aria-required="true">
        <mat-radio-button
          [value]="true"
          [id]="elementId('properly-packed-yes')"
          class="radio-option">
          Yes
        </mat-radio-button>
        <mat-radio-button
          [value]="false"
          [id]="elementId('properly-packed-no')"
          class="radio-option">
          No
        </mat-radio-button>
      </mat-radio-group>
    </div>

    <!-- Validation Error Message -->
    @if (validationError()) {
      <div class="validation-error" role="alert" [id]="elementId('error')">
        <mat-icon aria-hidden="true">warning</mat-icon>
        <span>{{ validationError() }}</span>
      </div>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-button
      type="button"
      (click)="onCancel()"
      [id]="elementId('cancel-btn')">
      CANCEL
    </button>
    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="onCreate()"
      [disabled]="!isValid()"
      [id]="elementId('create-btn')">
      CREATE NEW
    </button>
  </mat-dialog-actions>
</div>
