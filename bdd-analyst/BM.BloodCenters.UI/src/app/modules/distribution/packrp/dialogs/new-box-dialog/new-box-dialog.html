<div class="new-box-dialog">
  <h2 mat-dialog-title>Do you want to open a new box?</h2>

  <mat-dialog-content>
    @if (data.warning) {
      <div class="warning-container" role="alert">
        <mat-icon aria-hidden="true">warning</mat-icon>
        <div class="warning-content">
          <strong>Warning</strong>
          <p>{{ data.warning }}</p>
        </div>
      </div>
    } @else {
      <div class="warning-container" role="alert">
        <mat-icon aria-hidden="true">warning</mat-icon>
        <div class="warning-content">
          <strong>Warning</strong>
          <p>The plasma count exceeds the acceptable limit.</p>
        </div>
      </div>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-button
      type="button"
      (click)="onGoBack()"
      color="primary">
      GO BACK
    </button>
    <button
      mat-raised-button
      type="button"
      (click)="onNewBox()"
      color="primary">
      NEW BOX
    </button>
  </mat-dialog-actions>
</div>
