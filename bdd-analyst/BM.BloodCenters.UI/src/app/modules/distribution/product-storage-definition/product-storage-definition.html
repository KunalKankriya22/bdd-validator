<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <div class="main-content">
    <h1 class="cdk-visually-hidden">{{ headerConfig?.title }}</h1>
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <main class="page-main">

      <!-- Table Card -->
      <div class="table-card">
        <!-- Controls Bar -->
        <div class="controls-bar">
          <div class="controls-left">
            <button #filterButton
                    type="button"
                    class="filter-button"
                    [class.filter-button--active]="isFilterPanelOpen"
                    (click)="openFilterPanel()"
                    [attr.aria-label]="'Open filter panel'"
                    [attr.aria-expanded]="isFilterPanelOpen"
                    aria-haspopup="dialog">
              <mat-icon class="filter-icon" aria-hidden="true">tune</mat-icon>
              <span>FILTER</span>
            </button>

            <app-filter-chips
              [chips]="filterChips"
              [maxVisible]="3"
              (removeChip)="onRemoveChip($event)"
              (clearAll)="onClearAllChips()" />
          </div>

          <div class="controls-right">
            <button mat-flat-button color="primary" class="add-button" (click)="openAddPanel()">
              <mat-icon aria-hidden="true">add</mat-icon>
              ADD PRODUCT TYPE
            </button>

            <app-search-bar
              [config]="searchConfig"
              (search)="onSearch($event)" />
          </div>
        </div>

        <!-- Data Table -->
        <div class="table-wrapper">
          <app-data-table
            [config]="tableConfig"
            [data]="dataSource"
            [loading]="isLoading"
            [keepActiveRow]="true"
            (pageChange)="onPageChange($event)"
            (sortChange)="onSortChange($event)"
            (rowAction)="onRowAction($event)">
          </app-data-table>
        </div>
      </div>

    </main>
  </div>

  <!-- Side Panel -->
  @if (sidePanelOpen) {
    <div class="side-panel-container">
      <app-add-edit-product-storage
        [mode]="sidePanelMode"
        [data]="sidePanelData"
        [productTypeLovOptions]="productTypeLovOptions()"
        [warehouseLovOptions]="warehouseLovOptions()"
        [deviceTypeLovOptions]="deviceTypeLovOptions()"
        (closePanel)="closeSidePanel()"
        (saveSuccess)="onSaveSuccess()">
      </app-add-edit-product-storage>
    </div>
  }

</div>
