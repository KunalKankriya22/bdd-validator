<div class="dialog-container">
  <h2 mat-dialog-title>Do you want the Pack List to be Printed?</h2>

  <mat-dialog-content>
    <p class="dialog-subtitle">This action declares that all products are properly packed.</p>

    <mat-form-field appearance="fill" class="printer-field">
      <mat-label>Pack List Printer ID</mat-label>
      <input matInput [formControl]="printerIdCtrl">
    </mat-form-field>

    <p class="dialog-note">
      Selecting YES will finalize the shipment.<br>
      Selecting NO will keep the shipment open.
    </p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onNo()">NO</button>
    <button mat-raised-button color="primary" (click)="onYesShip()">YES, SHIP</button>
  </mat-dialog-actions>
</div>
