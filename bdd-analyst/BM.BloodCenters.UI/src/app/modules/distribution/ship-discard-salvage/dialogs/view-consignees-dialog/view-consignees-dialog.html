<div class="dialog-container">
  <h2 mat-dialog-title>View Consignee in Same Zone</h2>

  <mat-dialog-content>
    <app-data-table
      [config]="tableConfig"
      [data]="consignees()"
      [loading]="loading()"
      (sortChange)="onSortChange($event)">
    </app-data-table>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-raised-button color="primary" (click)="onClose()">CLOSE</button>
  </mat-dialog-actions>
</div>
