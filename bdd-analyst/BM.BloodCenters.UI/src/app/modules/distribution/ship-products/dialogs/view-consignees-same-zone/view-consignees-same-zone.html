<div class="side-panel-dialog">
  <div class="panel-header">
    <h2 mat-dialog-title>View Consignees In Same Zone</h2>
    <button mat-icon-button (click)="onClose()" aria-label="Close">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="panel-content">
    @if (loading()) {
      <div class="loading-container" role="status" aria-live="polite">
        <mat-spinner diameter="40" aria-label="Loading consignees"></mat-spinner>
      </div>
    } @else if (error()) {
      <div class="error-container" role="alert" aria-live="assertive">
        <mat-icon aria-hidden="true">error</mat-icon>
        <p>{{ error() }}</p>
      </div>
    } @else {
      <app-data-table
        [config]="tableConfig()"
        [data]="consignees()"
        [loading]="loading()" />
    }
  </mat-dialog-content>

  <mat-dialog-actions class="panel-actions">
    <button mat-stroked-button color="primary" (click)="onClose()">CLOSE</button>
  </mat-dialog-actions>
</div>
