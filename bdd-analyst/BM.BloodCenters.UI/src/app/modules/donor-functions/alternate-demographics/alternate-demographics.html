<app-page-header-with-breadcrumb [config]="headerConfig" />

<section class="alternate-demographics-container">
  <!-- Search Bar -->
  <section class="search-bar" [formGroup]="searchForm">
    <mat-form-field appearance="fill" class="mode-field">
      <mat-label>Mode</mat-label>
      <mat-select formControlName="mode" aria-label="Select edit or view mode">
        <mat-option value="edit">Edit</mat-option>
        <mat-option value="view">View (Read-Only)</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill" class="donor-id-field">
      <mat-label>Donor ID</mat-label>
      <input
        matInput
        type="text"
        formControlName="donorId"
        placeholder="Enter Donor ID"
        aria-label="Donor ID"
        [attr.aria-invalid]="f['donorId'].invalid && f['donorId'].touched">
      @if (f['donorId'].invalid && f['donorId'].touched) {
        <mat-error>Donor ID is required</mat-error>
      }
    </mat-form-field>

    <button
      mat-stroked-button
      color="primary"
      type="button"
      (click)="onViewAlternateDemographics()"
      class="retrieve-button"
      aria-label="View Alternate Demographics">
      VIEW ALTERNATE DEMOGRAPHICS
    </button>
  </section>
</section>
