<div class="confirm-donor-dialog" role="dialog" [attr.aria-labelledby]="elementId('title')">
  <div class="dialog-content">
    <!-- Warning Icon and Title -->
    <div class="warning-header">
      <mat-icon class="warning-icon" aria-hidden="true">warning</mat-icon>
      <h2 [id]="elementId('title')" class="dialog-title">
        Is the right Donor present in the list?
      </h2>
    </div>

    <!-- Warning Message -->
    <div class="warning-message" role="alert">
      <p>
        <strong>WARNING:</strong> A donor selected from the list will be overwritten
        with the donor information in the Original Key Data block and will no longer
        exist as listed.
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="dialog-actions" role="group" [attr.aria-label]="'Confirmation actions'">
      <button
        mat-button
        type="button"
        (click)="onNo()"
        [id]="elementId('no-btn')"
        class="no-button">
        NO
      </button>
      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="onRightDonor()"
        [id]="elementId('right-donor-btn')"
        class="right-donor-button">
        YES, RIGHT DONOR
      </button>
    </div>
  </div>
</div>
