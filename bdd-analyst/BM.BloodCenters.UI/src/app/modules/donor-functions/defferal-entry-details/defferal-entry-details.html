<app-page-header-with-breadcrumb [config]="headerConfig" />

<section class="deferral-entry-details-container">
  <section class="search-bar" [formGroup]="searchForm">
    <mat-form-field appearance="fill" class="donor-id-field">
      <mat-label>Donor ID</mat-label>
      <input
        matInput
        type="text"
        formControlName="donorId"
        placeholder="Enter Donor ID"
        [attr.aria-invalid]="f['donorId'].invalid && f['donorId'].touched">
      @if (f['donorId'].invalid && f['donorId'].touched) {
        <mat-error>Donor ID is required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="fill" class="drive-date-field">
      <mat-label>Drive Date</mat-label>
      <input
        matInput
        [matDatepicker]="driveDatePicker"
        formControlName="driveDate"
        placeholder="DD-MMM-YYYY">
      <mat-datepicker-toggle matIconSuffix [for]="driveDatePicker"></mat-datepicker-toggle>
      <mat-datepicker #driveDatePicker></mat-datepicker>
    </mat-form-field>

    <button
      mat-stroked-button
      color="primary"
      type="button"
      (click)="openEntryDetailsDialog()"
      class="retrieve-button"
      [attr.aria-label]="'View Deferral Entry Details'">
      VIEW DETAILS
    </button>
  </section>
</section>
