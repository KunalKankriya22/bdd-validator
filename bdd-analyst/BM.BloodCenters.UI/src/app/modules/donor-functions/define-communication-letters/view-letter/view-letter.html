<div class="view-letter-drawer">
  <!-- Header -->
  <div class="drawer-header">
    <h2 class="drawer-title">{{ dialogTitle }}</h2>
    <button mat-icon-button type="button" (click)="onClose()" aria-label="Close letter view" class="close-btn">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Loading -->
  @if (loading()) {
    <div class="loading-container" role="status">
      <mat-spinner diameter="50" aria-hidden="true"></mat-spinner>
      <p>Loading letter details...</p>
    </div>
  }

  <!-- Content -->
  @if (!loading()) {
    <div class="drawer-content">

<!-- Error state -->
      @if (error()) {
        <div class="section error-state" role="alert">
          <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
          <p class="error-tsext">{{ error() }}</p>
        </div>
      }

      <!-- Letter Message -->
      @if (!error()) {
        <div class="section">
          <h3 class="section-title">Letter Message</h3>
          <div class="letter-message-box">
            <pre class="letter-message-text">{{ letterMessage || 'No message content available.' }}</pre>
          </div>
        </div>
      }

    </div>
  }

  <!-- Footer -->
  <div class="drawer-footer">
    <button mat-button type="button" class="close-action-btn" (click)="onClose()">
      CLOSE
    </button>
    <button mat-raised-button type="button" class="preview-btn" (click)="onPreview()">
      PREVIEW LETTER
    </button>
  </div>
</div>
