<div class="dialog-container">
  <!-- Dialog Header -->
  <div class="dialog-header">
    <h2 class="dialog-title">{{ dialogTitle }}</h2>
    <button mat-icon-button class="close-button" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Dialog Content -->
  <div class="dialog-content" [formGroup]="form">
    <!-- Code Type: Add mode = input, Edit mode = read-only label -->
    <div class="field-row" *ngIf="mode === 'add'">
      <mat-form-field appearance="fill">
        <mat-label>Code Type</mat-label>
        <input matInput
          formControlName="codeType"
          maxlength="5"
          placeholder="Enter code type"
          (input)="onCodeTypeInput($event)" />
        <mat-error *ngIf="getCodeTypeError()">{{ getCodeTypeError() }}</mat-error>
      </mat-form-field>
    </div>

    <div class="field-row" *ngIf="mode === 'edit'">
      <div class="field-group">
        <label class="field-label">Code Type</label>
        <span>{{ data.commCode || '-' }}</span>
      </div>
    </div>

    <!-- Description -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Description</mat-label>
      <input
        matInput
        formControlName="description"
        placeholder="Enter description"
        maxlength="50">
      <mat-error *ngIf="form.get('description')?.touched && getDescriptionError()">{{ getDescriptionError() }}</mat-error>
    </mat-form-field>

    <!-- Days -->
    <div class="field-row">
      <mat-form-field appearance="fill">
        <mat-label>Days</mat-label>
        <input matInput
          formControlName="days"
          placeholder="Enter days"
          inputmode="numeric"
          (input)="onDaysInput($event)"
          (keypress)="onDaysKeypress($event)" />
        <mat-error *ngIf="getDaysError()">{{ getDaysError() }}</mat-error>
      </mat-form-field>
    </div>

    <!-- Effective Date and Termination Date -->
    <div class="field-row">
      <!-- ADD mode: Editable effective date -->
      <mat-form-field *ngIf="mode === 'add'" appearance="fill" [class.has-error]="getEffectiveDateError()">
        <mat-label>Effective Date</mat-label>
        <input matInput [matDatepicker]="effectivePicker" formControlName="effectiveDate"
          [min]="minDate" [errorStateMatcher]="effDateErrorMatcher"
          required aria-required="true" (input)="onEffectiveDateInput($event)">
        <mat-datepicker-toggle matSuffix [for]="effectivePicker"></mat-datepicker-toggle>
        <mat-datepicker #effectivePicker [restoreFocus]="false"></mat-datepicker>
        <mat-error *ngIf="getEffectiveDateError()">{{ getEffectiveDateError() }}</mat-error>
      </mat-form-field>

      <!-- EDIT mode: Read-only display card -->
      <div *ngIf="mode === 'edit'" class="field-display-card">
        <div class="field-label">Effective Date</div>
        <div class="field-value">{{ editEffectiveDateDisplay }}</div>
      </div>

      <mat-form-field appearance="fill" [class.has-error]="getTerminationDateError()">
        <mat-label>Termination Date</mat-label>
        <input matInput [matDatepicker]="terminationPicker" formControlName="terminationDate"
          [matDatepickerFilter]="terminationDateFilter" [errorStateMatcher]="termDateErrorMatcher"
          (input)="onTerminationDateInput($event)">
        <mat-datepicker-toggle matSuffix [for]="terminationPicker"></mat-datepicker-toggle>
        <mat-datepicker #terminationPicker [restoreFocus]="false"></mat-datepicker>
        <mat-error *ngIf="getTerminationDateError()">{{ getTerminationDateError() }}</mat-error>
      </mat-form-field>
    </div>
  </div>

  <!-- Dialog Actions -->
  <div class="dialog-actions">
    <button mat-button class="cancel-button" (click)="onCancel()">CANCEL</button>

    <!-- Edit mode: Clear All + Save -->
    <ng-container *ngIf="mode === 'edit'">
      <button mat-button class="clear-all-button" (click)="onClearAll()">CLEAR ALL</button>
      <button
        mat-raised-button
        color="primary"
        class="save-button"
        (click)="onSave()"
        [disabled]="!isFormValid() || isSaving">
        SAVE
      </button>
    </ng-container>

    <!-- Add mode: Add And Create Another + Add -->
    <ng-container *ngIf="mode === 'add'">
      <button
        mat-stroked-button
        class="add-another-button"
        (click)="onSave(true)"
        [disabled]="!isFormValid() || isSaving">
        ADD AND CREATE ANOTHER
      </button>
      <button
        mat-raised-button
        color="primary"
        class="save-button"
        (click)="onSave(false)"
        [disabled]="!isFormValid() || isSaving">
        ADD
      </button>
    </ng-container>
  </div>
</div>
