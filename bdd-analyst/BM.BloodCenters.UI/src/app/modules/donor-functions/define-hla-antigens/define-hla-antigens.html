<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="isDialogOpen">

  <!-- Backdrop Overlay -->
  <div class="drawer-backdrop" [class.active]="isDialogOpen"></div>

  <!-- Main Content Area -->
  <main class="define-hla-antigens main-content" [class.side-panel-active]="isDialogOpen"
        [attr.aria-label]="'Define HLA Antigens content'"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

  <!-- Table Card Container -->
  <div class="define-hla-antigens__card" #tableCard>

    <!-- Table Controls with Search -->
    <div class="define-hla-antigens__controls">
      <!-- Left section: Filter button and chips -->
      <div class="define-hla-antigens__controls-left">
        <button
          #filterBtn
          type="button"
          mat-button
          class="filter-button"
          [class.filter-button--active]="isFilterOpen"
          [disabled]="isSearchAndFilterDisabled"
          [attr.aria-label]="'Open filter options'"
          cdkOverlayOrigin
          #trigger="cdkOverlayOrigin"
          (click)="toggleFilter()">
          <mat-icon aria-hidden="true">filter_list</mat-icon>
          FILTER
        </button>

        <!-- Filter Chips -->
        @if (filterChips.length > 0) {
          <app-filter-chips
            [chips]="filterChips"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="onClearAllFilters()">
          </app-filter-chips>
        }
      </div>

      <!-- Right section: Search bar -->
      <div class="define-hla-antigens__controls-right" [class.disabled]="isSearchAndFilterDisabled">
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)" />
      </div>
    </div>

    <!-- Filter Panel Overlay -->
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="trigger"
      [cdkConnectedOverlayOpen]="isFilterOpen"
      [cdkConnectedOverlayHasBackdrop]="true"
      [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
      [cdkConnectedOverlayOffsetY]="4"
      cdkConnectedOverlayPanelClass="filter-overlay-panel"
      (backdropClick)="toggleFilter()"
      (detach)="isFilterOpen = false">
      <app-hla-antigens-filter-panel
        [currentFilters]="appliedFilters"
        (apply)="onApplyFilters($event)"
        (close)="toggleFilter()">
      </app-hla-antigens-filter-panel>
    </ng-template>

    <!-- Error State -->
    @if (hasError && !isLoading) {
      <div
        class="define-hla-antigens__error"
        role="alert"
        [attr.aria-label]="'Error loading data'">
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <p class="error-message">Unable to load HLA antigens data. Please try again.</p>
        <button type="button" mat-raised-button color="primary" (click)="loadData()">
          Retry
        </button>
      </div>
    }

    <!-- Data Table -->
    <div class="define-hla-antigens__table-wrapper">
      @if (!hasError) {
        <app-data-table
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      }
    </div>
  </div>
  </main>

</div>
