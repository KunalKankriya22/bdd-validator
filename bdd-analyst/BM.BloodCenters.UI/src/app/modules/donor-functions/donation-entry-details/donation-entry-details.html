<app-page-header-with-breadcrumb [config]="headerConfig" />

<section class="donation-entry-details-container">
  <section class="search-bar" [formGroup]="searchForm">
    <mat-form-field appearance="fill" class="unit-id-field">
      <mat-label>Unit ID</mat-label>
      <input
        matInput
        type="text"
        formControlName="unitId"
        placeholder="Enter Unit ID"
        [attr.aria-invalid]="f['unitId'].invalid && f['unitId'].touched">
      @if (f['unitId'].invalid && f['unitId'].touched) {
        <mat-error>Unit ID is required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="fill" class="coll-date-field">
      <mat-label>Collection Date</mat-label>
      <input
        matInput
        [matDatepicker]="collDatePicker"
        formControlName="collDate"
        placeholder="DD-MMM-YYYY">
      <mat-datepicker-toggle matIconSuffix [for]="collDatePicker"></mat-datepicker-toggle>
      <mat-datepicker #collDatePicker></mat-datepicker>
    </mat-form-field>

    <button
      mat-stroked-button
      color="primary"
      type="button"
      (click)="openEntryDetailsDialog()"
      class="retrieve-button"
      [attr.aria-label]="'View Donation Entry Details'">
      VIEW DETAILS
    </button>
  </section>
</section>
