<div class="ytd-loss-dialog">
  <div class="dialog-header">
    <h2 class="dialog-title" mat-dialog-title>Year to Date Loss</h2>
    <button mat-icon-button class="close-btn" (click)="onClose()" [attr.aria-label]="'Close Year to Date Loss dialog'">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>
  <div class="dialog-body">
    <div class="readonly-field">
      <span class="readonly-field__label" id="rbc-label">RBC Loss</span>
      <div class="readonly-field__value" aria-labelledby="rbc-label">{{ rbcLoss }}</div>
    </div>
    <div class="readonly-field">
      <span class="readonly-field__label" id="plasma-label">Plasma Loss</span>
      <div class="readonly-field__value" aria-labelledby="plasma-label">{{ plasmaLoss }}</div>
    </div>
  </div>
  <div class="dialog-footer">
    <button mat-flat-button class="btn-close" (click)="onClose()" [attr.aria-label]="'Close Year to Date Loss dialog'">
      CLOSE
    </button>
  </div>
</div>
