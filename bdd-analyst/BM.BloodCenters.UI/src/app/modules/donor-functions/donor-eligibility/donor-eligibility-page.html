<app-page-header-with-breadcrumb [config]="headerConfig" />

<section class="donor-eligibility-container">
  <section class="search-bar" [formGroup]="searchForm">
    <mat-form-field appearance="fill" class="donor-id-field">
      <mat-label>Donor ID</mat-label>
      <input matInput
             type="text"
             formControlName="donorId"
             placeholder="Enter Donor ID"
             [maxlength]="10"
             aria-label="Donor ID"
             [attr.aria-invalid]="f['donorId'].invalid && f['donorId'].touched">
      @if (f['donorId'].invalid && f['donorId'].touched) {
        <mat-error>Donor ID is required</mat-error>
      }
    </mat-form-field>

    <button mat-stroked-button
            color="primary"
            type="button"
            (click)="openEligibilityPanel()"
            [disabled]="isViewDisabled"
            class="view-details-button"
            aria-label="View donor eligibility details">
      VIEW DETAILS
    </button>
  </section>
</section>
