<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="associate-letter-interdiction main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Associate Letter to Interdiction content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="pageHeaderConfig" />

    <!-- Table Card Container -->
    <div class="associate-letter-interdiction__card" #tableCard>

      <!-- Table Controls with Search -->
      <div class="associate-letter-interdiction__controls">
        <!-- Left section: Filter button and chips -->
        <div class="associate-letter-interdiction__controls-left">
          <button
            #filterBtn
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="filterPanelOpen"
            aria-label="Open filter options"
            cdkOverlayOrigin
            #trigger="cdkOverlayOrigin"
            (click)="toggleFilterPanel()">
            <mat-icon aria-hidden="true">filter_list</mat-icon>
            FILTER
          </button>

          <!-- Filter Chips -->
          <app-filter-chips
            *ngIf="filterChips.length > 0"
            [chips]="filterChips"
            (removeChip)="onRemoveFilter($event)"
            (clearAll)="onClearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right section: Search bar -->
        <div class="associate-letter-interdiction__controls-right">
          <app-search-bar
            [config]="searchBarConfig"
            (search)="onSearch($event)" />
        </div>
      </div>

      <!-- Filter Panel Overlay -->
      <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="trigger"
        [cdkConnectedOverlayOpen]="filterPanelOpen"
        [cdkConnectedOverlayHasBackdrop]="true"
        [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
        [cdkConnectedOverlayOffsetY]="4"
        cdkConnectedOverlayPanelClass="filter-overlay-panel"
        (backdropClick)="closeFilterPanel()"
        (detach)="closeFilterPanel()">
        <app-filter-panel
          [filters]="activeFilters"
          [interdictionCodeOptions]="interdictionCodeOptions"
          [donationTypeOptions]="donationTypeOptions"
          [letterCodeOptions]="letterCodeOptions"
          (apply)="onFilterApply($event)"
          (clear)="onFilterClear()"
          (close)="closeFilterPanel()">
        </app-filter-panel>
      </ng-template>

      <!-- Error State -->
      <div
        *ngIf="hasError && !isLoading"
        class="associate-letter-interdiction__error"
        role="alert"
        aria-label="Error loading data">
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <p class="error-message">Unable to load data. Please try again.</p>
        <button type="button" mat-raised-button color="primary" (click)="loadAssociations()">
          Retry
        </button>
      </div>

      <!-- Data Table -->
      <div class="associate-letter-interdiction__table-wrapper">
        <app-data-table
          *ngIf="!hasError"
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          [highlightedRow]="editingRow"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)"
          (pageChange)="onPageChange($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-link-letter-panel
      *ngIf="sidePanelMode === 'link'"
      [interdictionCodeOptions]="interdictionCodeOptions"
      [donationTypeOptions]="donationTypeOptions"
      [letterCodeOptions]="letterCodeOptions"
      (save)="onLinkLetterSave($event)"
      (close)="closeSidePanel()">
    </app-link-letter-panel>

    <app-edit-rule-panel
      *ngIf="sidePanelMode === 'edit'"
      [association]="editingRow!"
      (save)="onEditRuleSave($event)"
      (close)="closeSidePanel()">
    </app-edit-rule-panel>
  </div>

</div>
