<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="associate-letter-to-interdiction main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Associate Letter to Interdiction content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

  <!-- Table Card Container -->
  <div class="associate-letter-to-interdiction__card" #tableCard>

    <!-- Table Controls with Search -->
    <div class="associate-letter-to-interdiction__controls">
      <!-- Left section: Filter button and chips -->
      <div class="associate-letter-to-interdiction__controls-left">
        <button
          #filterBtn
          type="button"
          mat-button
          class="filter-button"
          [class.filter-button--active]="isFilterOpen"
          aria-label="Open filter options"
          cdkOverlayOrigin
          #trigger="cdkOverlayOrigin"
          (click)="toggleFilterPanel()">
          <mat-icon aria-hidden="true">filter_list</mat-icon>
          FILTER
        </button>

        <!-- Filter Chips -->
        <app-filter-chips
          *ngIf="filterChips.length > 0"
          [chips]="filterChips"
          (removeChip)="removeFilterChip($event)"
          (clearAll)="clearAllFilters()">
        </app-filter-chips>
      </div>

      <!-- Right section: Search bar -->
      <div class="associate-letter-to-interdiction__controls-right">
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)" />
      </div>
    </div>

    <!-- Filter Panel Overlay -->
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="trigger"
      [cdkConnectedOverlayOpen]="isFilterOpen"
      [cdkConnectedOverlayHasBackdrop]="true"
      [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
      [cdkConnectedOverlayOffsetY]="4"
      cdkConnectedOverlayPanelClass="filter-overlay-panel"
      (backdropClick)="closeFilterPanel()"
      (detach)="closeFilterPanel()">
      <app-associate-letter-to-interdiction-filter-panel
        [currentFilters]="appliedFilters"
        [interdictionOptions]="filterInterdictionOptions"
        [donationTypeOptions]="filterDonationTypeOptions"
        [letterOptions]="filterLetterOptions"
        (apply)="applyFilters($event)"
        (close)="closeFilterPanel()">
      </app-associate-letter-to-interdiction-filter-panel>
    </ng-template>

    <!-- Error State -->
    <div
      *ngIf="hasError && !isLoading"
      class="associate-letter-to-interdiction__error"
      role="alert"
      aria-label="Error loading data">
      <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
      <p class="error-message">Unable to load data. Please try again.</p>
      <button type="button" mat-raised-button color="primary" (click)="loadData()">
        Retry
      </button>
    </div>

    <!-- Data Table -->
    <div class="associate-letter-to-interdiction__table-wrapper">
      <app-data-table
        *ngIf="!hasError"
        [config]="tableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        [highlightedRow]="sidePanelMode === 'edit' ? sidePanelData : null"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)" />
    </div>
  </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-add-edit-associate-letter
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()">
    </app-add-edit-associate-letter>
  </div>

</div>
