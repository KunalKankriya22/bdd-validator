<div class="dialog-container">
  <div class="dialog-header">
    <h2>Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter dialog" (click)="onCancel()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <form [formGroup]="filterForm" class="filter-form">
      <mat-form-field appearance="outline">
        <mat-label>Interdiction Code</mat-label>
        <mat-select formControlName="interdictionCode">
          <mat-option value="">All</mat-option>
          <mat-option *ngFor="let option of interdictionCodeOptions" [value]="option.code">
            {{ option.code }} - {{ option.description }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Donation Type</mat-label>
        <mat-select formControlName="donationType">
          <mat-option value="">All</mat-option>
          <mat-option *ngFor="let option of donationTypeOptions" [value]="option.code">
            {{ option.code }} - {{ option.description }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Letter ID</mat-label>
        <mat-select formControlName="letterId">
          <mat-option value="">All</mat-option>
          <mat-option *ngFor="let option of letterCodeOptions" [value]="option.letterId">
            {{ option.code }} - {{ option.description }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button type="button" (click)="onClear()">CLEAR ALL</button>
    <div class="spacer"></div>
    <button mat-flat-button type="button" color="primary" (click)="onApply()">APPLY</button>
  </mat-dialog-actions>
</div>
