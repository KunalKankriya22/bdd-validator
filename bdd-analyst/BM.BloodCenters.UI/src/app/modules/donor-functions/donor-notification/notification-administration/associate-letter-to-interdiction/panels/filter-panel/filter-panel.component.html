<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">
    <mat-form-field appearance="fill">
      <mat-label>Interdiction Code</mat-label>
      <mat-select formControlName="interdictionCode">
        <mat-option value="">All</mat-option>
        <mat-option *ngFor="let option of interdictionCodeOptions" [value]="option.code">
          {{ option.code }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Donation Type</mat-label>
      <mat-select formControlName="donationType">
        <mat-option value="">All</mat-option>
        <mat-option *ngFor="let option of donationTypeOptions" [value]="option.code">
          {{ option.code }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Letter ID</mat-label>
      <mat-select formControlName="letterId">
        <mat-option value="">All</mat-option>
        <mat-option *ngFor="let option of letterCodeOptions" [value]="option.letterId">
          {{ option.code }} - {{ option.description }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>
    <button mat-raised-button color="primary" type="button" (click)="onApply()">
      APPLY
    </button>
  </footer>

</section>
