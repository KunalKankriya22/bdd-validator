<div class="view-letter-drawer">
  <!-- Header -->
  <div class="drawer-header">
    <h2 class="drawer-title">{{ title }}</h2>
    <button
      mat-icon-button
      (click)="onClose()"
      aria-label="Close dialog"
      class="close-button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading()" class="loading-container" role="status" aria-live="polite">
    <mat-spinner diameter="50" aria-label="Loading letter details"></mat-spinner>
    <p>Loading letter details...</p>
  </div>

  <!-- Content -->
  <div *ngIf="!loading()" class="drawer-content">
    <!-- Letter Message Section -->
    <div class="section">
      <h3 class="section-title">Letter Message</h3>
      <div class="letter-message-display">
        <pre class="letter-message-content">{{ letterMessage }}</pre>
      </div>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="drawer-footer" *ngIf="!loading()">
    <button
      mat-button
      type="button"
      class="close-btn"
      (click)="onClose()">
      CLOSE
    </button>
    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="onPreview()">
      PREVIEW LETTER
    </button>
  </div>
</div>
