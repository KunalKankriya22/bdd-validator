<div class="dialog-header" mat-dialog-title>
  <span class="dialog-title">Notification Letter for - {{ data.donorId }}</span>
  <button mat-icon-button class="close-btn" aria-label="Close dialog" (click)="onClose()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-body">
  <!-- Loading State -->
  @if (loading()) {
    <div class="loading-container" role="status" aria-live="polite">
      <mat-spinner diameter="40"></mat-spinner>
      <span class="loading-text">Loading letter details...</span>
    </div>
  }

  <!-- Error State -->
  @if (error() && !loading()) {
    <div class="error-container" role="alert">
      <mat-icon class="error-icon">error</mat-icon>
      <p class="error-message">{{ error() }}</p>
      <button mat-raised-button color="primary" (click)="onRetry()">Retry</button>
    </div>
  }

  <!-- Letter Content -->
  @if (letterDetail() && !loading() && !error()) {
    <div class="letter-content">
      <pre class="letter-text">{{ letterDetail()!.letterText }}</pre>
    </div>
  }
</mat-dialog-content>

<div class="dialog-footer">
  <div class="dialog-footer-actions">
    <button mat-button class="cancel-btn" (click)="onClose()">CANCEL</button>
  </div>
</div>
