<app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>

<div class="donation-details-page">
  <form [formGroup]="searchForm" (ngSubmit)="openDonationDetailsDialog()" class="search-form">
    <mat-form-field appearance="fill" class="search-field">
      <mat-label>Donor ID</mat-label>
      <input
        matInput
        formControlName="donorId"
        placeholder="Enter Donor ID"
        aria-label="Donor ID">
      @if (f['donorId'].hasError('required') && f['donorId'].touched) {
        <mat-error>Donor ID is required</mat-error>
      }
    </mat-form-field>

    <button
      mat-flat-button
      type="submit"
      class="view-details-btn"
      [disabled]="searchForm.invalid">
      VIEW DETAILS
    </button>
  </form>
</div>
