<h2 mat-dialog-title>Verify Key Data</h2>
<mat-dialog-content>
  <p>Please re-enter the following field(s) to confirm your changes:</p>
  <form [formGroup]="verifyForm" class="verify-form" autocomplete="off">
    @if (data.requireLastName) {
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Last Name</mat-label>
        <input matInput formControlName="lastName" autocomplete="off" name="verify-lastname-nc" cdkFocusInitial>
      </mat-form-field>
    }
    @if (data.requireDob) {
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Date of Birth</mat-label>
        <input matInput [matDatepicker]="verifyDobPicker" formControlName="dateOfBirth" autocomplete="off" name="verify-dob-nc" cdkFocusInitial>
        <mat-datepicker-toggle matIconSuffix [for]="verifyDobPicker" [attr.aria-label]="'Open date of birth calendar'"></mat-datepicker-toggle>
        <mat-datepicker #verifyDobPicker></mat-datepicker>
      </mat-form-field>
    }
    @if (errorMessage) {
      <p class="error-text" role="alert">{{ errorMessage }}</p>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" aria-label="Cancel verification">CANCEL</button>
  <button mat-flat-button color="primary" (click)="onVerify()" [disabled]="verifyForm.invalid" aria-label="Verify key data">VERIFY</button>
</mat-dialog-actions>
