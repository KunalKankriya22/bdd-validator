<main class="maintain-group-interdictions" role="main" aria-label="Maintain Group Interdictions">

  <app-page-header-with-breadcrumb [config]="headerConfig" />

  <div class="tabs-container">
    <mat-tab-group
      [selectedIndex]="selectedTabIndex()"
      (selectedIndexChange)="onTabChange($event)"
      animationDuration="200ms"
      class="group-interdiction-tabs">

      <mat-tab>
        <ng-template mat-tab-label>
          <svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M8 0C9.06087 0 10.0783 0.421427 10.8284 1.17157C11.5786 1.92172 12 2.93913 12 4C12 5.06087 11.5786 6.07828 10.8284 6.82843C10.0783 7.57857 9.06087 8 8 8C6.93913 8 5.92172 7.57857 5.17157 6.82843C4.42143 6.07828 4 5.06087 4 4C4 2.93913 4.42143 1.92172 5.17157 1.17157C5.92172 0.421427 6.93913 0 8 0ZM8 10C12.42 10 16 11.79 16 14V16H0V14C0 11.79 3.58 10 8 10Z" fill="currentColor"/>
          </svg>
          Donors
        </ng-template>
      </mat-tab>

      <mat-tab>
        <ng-template mat-tab-label>
          <svg class="tab-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M10.8225 1.35508L11.6064 2.139L1.26308 12.4823C0.4485 13.2969 0 14.3798 0 15.5317C0 16.6836 0.4485 17.7665 1.26308 18.5821C2.07863 19.3957 3.16154 19.8442 4.3125 19.8442C5.46346 19.8442 6.54638 19.3957 7.36192 18.5811L17.7052 8.23783L18.4891 9.02175L19.8442 7.66667L12.1775 0L10.8225 1.35508ZM13.8719 9.361L11.569 7.05717L10.2139 8.41225L12.5168 10.7161L11.1617 12.0721L10.213 11.1234L8.85788 12.4785L9.80663 13.4272L8.45058 14.7832L6.14771 12.4794L4.79167 13.8335L7.09454 16.1374L6.00588 17.226C5.10025 18.1307 3.52379 18.1307 2.61817 17.226C2.16583 16.7727 1.91667 16.1719 1.91667 15.5317C1.91667 14.8915 2.16583 14.2907 2.61817 13.8374L12.9615 3.49408L16.3492 6.88179L13.8719 9.361Z" fill="currentColor"/>
          </svg>
          Donations
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  </div>

  <div class="content-area">
    @if (currentTab() === 'Donors') {
      <app-donors-tab />
    }
    @if (currentTab() === 'Donations') {
      <app-donations-tab />
    }
  </div>

</main>
