<app-side-panel-base
  [title]="'Enter Merge Note'"
  [width]="'100%'"
  [showFooter]="true"
  [footerButtons]="footerButtons"
  (closePanel)="onClose()"
  (buttonClick)="onButtonClick($event)">

  <ng-container panelContent>
    <div class="comments-panel-content">
      <mat-form-field appearance="fill" class="notes-field">
        <mat-label>Notes</mat-label>
        <textarea
          matInput
          [formControl]="noteControl"
          rows="8"
          maxlength="240"
          aria-label="Merge notes"
          placeholder="Enter a note for this merge operation (max 240 characters)">
        </textarea>
        <mat-hint align="end">{{ noteControl.value?.length || 0 }} / 240</mat-hint>
      </mat-form-field>
    </div>
  </ng-container>

</app-side-panel-base>
