<div class="filter-container">
  <!-- Header -->
  <div class="filter-header">
    <h2 class="title">Filters</h2>
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="'Close filter panel'"
      (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="filter-body">
    <form [formGroup]="filterForm">
      <!-- Inserted User Dropdown -->
      <mat-form-field appearance="fill">
        <mat-label>Inserted User</mat-label>
        <mat-select
          formControlName="insertedUser">
          @for (option of insertedUserOptions(); track option.value) {
            <mat-option [value]="option.value">{{ option.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <!-- From Date -->
      <mat-form-field appearance="fill">
        <mat-label>From Date</mat-label>
        <input
          matInput
          #fromDateInput
          [matDatepicker]="fromDatePicker"
          formControlName="fromDate"
          [errorStateMatcher]="fromDateErrorMatcher"
          (blur)="onFromDateBlur()"
          placeholder="Select Date"
          autocomplete="off">
        <mat-datepicker-toggle matSuffix [for]="fromDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #fromDatePicker></mat-datepicker>
        @if (getFromDateError()) {
          <mat-error>{{ getFromDateError() }}</mat-error>
        }
      </mat-form-field>

      <!-- To Date -->
      <mat-form-field appearance="fill">
        <mat-label>To Date</mat-label>
        <input
          matInput
          #toDateInput
          [matDatepicker]="toDatePicker"
          formControlName="toDate"
          [errorStateMatcher]="toDateErrorMatcher"
          (blur)="onToDateBlur()"
          placeholder="Select Date"
          autocomplete="off">
        <mat-datepicker-toggle matSuffix [for]="toDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #toDatePicker></mat-datepicker>
        @if (getToDateError()) {
          <mat-error>{{ getToDateError() }}</mat-error>
        }
      </mat-form-field>
    </form>
  </div>

  <!-- Footer -->
  <div class="filter-footer">
    <button
      mat-stroked-button
      class="clear-btn"
      (click)="onClearAll()"
      type="button">
      CLEAR ALL
    </button>
    <button
      mat-raised-button
      class="apply-btn"
      (click)="onApply()"
      type="button">
      APPLY
    </button>
  </div>
</div>
