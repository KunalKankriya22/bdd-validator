<div class="dialog-container" role="dialog" aria-labelledby="print-dialog-title">
  <div class="dialog-header">
    <h2 id="print-dialog-title" mat-dialog-title>Print Selected</h2>
    <button
      type="button"
      class="close-btn"
      (click)="onCancel()"
      [attr.aria-label]="'Close dialog'">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <form [formGroup]="printForm" novalidate>
      <section class="selection-section" aria-labelledby="selection-heading">
        <h3 id="selection-heading" class="section-heading">Selection items</h3>

        <div class="form-row">
          <mat-form-field appearance="fill" class="form-field">
            <mat-label>Record number from</mat-label>
            <mat-select
              id="fromRecordNumber"
              formControlName="fromRecordNumber">
              @for (recordNumber of recordNumberOptions(); track recordNumber) {
                <mat-option [value]="recordNumber">{{ recordNumber }}</mat-option>
              }
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="fill" class="form-field">
            <mat-label>Record number to</mat-label>
            <mat-select
              id="toRecordNumber"
              formControlName="toRecordNumber">
              @for (recordNumber of recordNumberOptions(); track recordNumber) {
                <mat-option [value]="recordNumber">{{ recordNumber }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </div>
      </section>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">
      CANCEL
    </button>
    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="onPrint()">
      PRINT
    </button>
  </mat-dialog-actions>
</div>
