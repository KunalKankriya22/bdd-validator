<section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title">
  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">
    <!-- Sex Filter -->
    <mat-form-field appearance="fill">
      <mat-label>SEX</mat-label>
      <mat-select formControlName="sex" placeholder="Select sex">
        @for (option of sexOptions; track option) {
          <mat-option [value]="option">{{ option }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Status Filter -->
    <mat-form-field appearance="fill">
      <mat-label>STATUS</mat-label>
      <mat-select formControlName="status" placeholder="Select status">
        @for (option of statusOptions; track option) {
          <mat-option [value]="option">{{ option }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClearAll()">
      CLEAR ALL
    </button>
    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>
</section>
