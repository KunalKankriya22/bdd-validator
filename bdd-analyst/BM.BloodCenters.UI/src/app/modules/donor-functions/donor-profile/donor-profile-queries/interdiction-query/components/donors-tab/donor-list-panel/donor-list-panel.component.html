<div class="donor-list-panel">
  <!-- Search and Filter Bar -->
  <div class="list-toolbar">
    <app-search-bar
      [config]="{
        placeholder: 'Search by Donor ID or Name',
        minLength: 2,
        ariaLabel: 'Search by Donor ID or Name',
        debounceTime: 300,
        searchOnEnterOnly: false
      }"
      [searchText]="searchText()"
      (search)="onSearch($event)">
    </app-search-bar>
    <button
      type="button"
      mat-icon-button
      class="filter-icon-button"
      [class.filter-icon-button--active]="isFilterOpen"
      aria-label="Filter donors"
      cdkOverlayOrigin
      #filterTrigger="cdkOverlayOrigin"
      (click)="toggleFilterPanel()">
      <mat-icon aria-hidden="true">filter_list</mat-icon>
    </button>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="filterTrigger"
      [cdkConnectedOverlayOpen]="isFilterOpen"
      [cdkConnectedOverlayHasBackdrop]="true"
      [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
      [cdkConnectedOverlayPositions]="filterPanelPositions"
      cdkConnectedOverlayPanelClass="filter-overlay-panel"
      (backdropClick)="closeFilterPanel()"
      (detach)="closeFilterPanel()">
      <app-donors-filter-panel
        [currentFilters]="currentFilters()"
        (apply)="onFilterApply($event)"
        (close)="closeFilterPanel()">
      </app-donors-filter-panel>
    </ng-template>
  </div>

  <!-- Donor Cards List -->
  <div class="donor-cards-container" role="listbox" aria-label="Donor list" (keydown)="onListKeydown($event)">
    @if (filteredDonors().length === 0) {
      <div class="empty-list" role="status">
        <p>No donors found.</p>
      </div>
    }

    @for (donor of filteredDonors(); track donor.donorId; let i = $index) {
      <div
        class="donor-card"
        [class.donor-card--selected]="isSelected(donor)"
        role="option"
        [attr.aria-selected]="isSelected(donor)"
        [tabindex]="isSelected(donor) || (!selectedDonor() && i === 0) ? 0 : -1"
        (click)="onSelectDonor(donor)"
        (keydown.enter)="onSelectDonor(donor)"
        (keydown.space)="onSelectDonor(donor); $event.preventDefault()">

        <div class="donor-card__info">
          <span class="donor-card__name">{{ donor.lastName }}, {{ donor.firstName }}</span>
          <span class="donor-card__id">ID: {{ donor.donorId }}</span>
          <span class="donor-card__dob">DOB: {{ donor.dateOfBirth }}</span>
        </div>

        <div class="donor-card__actions">
          <div class="gender-badge" [ngClass]="getGenderClass(donor.gender)">
            <img [src]="getGenderIcon(donor.gender)" [alt]="donor.gender === 'M' ? 'Male' : 'Female'" class="gender-icon">
          </div>

          <button
            type="button"
            mat-icon-button
            class="donor-card__menu-btn"
            [matMenuTriggerFor]="donorMenu"
            (click)="onSelectDonor(donor); $event.stopPropagation()"
            aria-label="Donor actions">
            <mat-icon>more_vert</mat-icon>
          </button>

          <mat-menu #donorMenu="matMenu">
            <button mat-menu-item (click)="onDemographics(donor.donorId)">Demographics</button>
            <button mat-menu-item (click)="onDonations(donor.donorId)">Donations</button>
            <button mat-menu-item (click)="onAttributes(donor.donorId)">Attributes</button>
            <button mat-menu-item (click)="onOtherInterdictions(donor.donorId)">Other Interdictions</button>
          </mat-menu>
        </div>
      </div>
    }
  </div>
</div>
