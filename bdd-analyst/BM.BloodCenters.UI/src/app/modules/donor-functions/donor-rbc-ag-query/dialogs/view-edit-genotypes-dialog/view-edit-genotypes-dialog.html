<div class="dialog-container" role="dialog" [attr.aria-labelledby]="elementId('title')">
  <div class="dialog-header">
    <h2 mat-dialog-title [id]="elementId('title')">View/Edit Genotypes</h2>
    <button
      mat-icon-button
      class="close-button"
      [attr.aria-label]="'Close dialog'"
      (click)="onCancel()"
      type="button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <mat-form-field appearance="fill" class="genotype-field">
      <mat-label [id]="labelId('genotype')">Genotype</mat-label>
      <textarea
        matInput
        [id]="elementId('genotype')"
        [formControl]="genotypeControl"
        rows="10"
        maxlength="500"
        placeholder="Enter genotype information"
        [attr.aria-describedby]="genotypeControl.invalid ? errorId('genotype') : elementId('hint')"
        [attr.aria-invalid]="genotypeControl.invalid">
      </textarea>
      <mat-hint [id]="elementId('hint')" align="start">
        Characters Remaining: {{ charactersRemaining() }}/500
      </mat-hint>
      @if (genotypeControl.invalid && genotypeControl.touched) {
        <mat-error [id]="errorId('genotype')">
          @if (genotypeControl.errors?.['maxlength']) {
            Genotype cannot exceed 500 characters
          }
        </mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-button
      type="button"
      (click)="onCancel()"
      [id]="elementId('cancel-btn')">
      NO, CANCEL
    </button>
    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="onSave()"
      [id]="elementId('save-btn')"
      [disabled]="!isValid()">
      SAVE
    </button>
  </mat-dialog-actions>
</div>
