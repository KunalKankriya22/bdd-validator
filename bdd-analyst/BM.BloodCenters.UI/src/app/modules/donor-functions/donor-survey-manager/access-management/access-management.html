<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="access-management main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Access Management content"
        role="main">

    <!-- Table Card Container -->
    <div class="access-management__card" #tableCard>

      <!-- Header Section -->
      <div class="access-management__header">
        <h2 class="access-management__title">Access Management</h2>
        <button
          type="button"
          mat-raised-button
          color="accent"
          class="define-access-btn"
          aria-label="Define new access"
          (click)="createRecord()">
          <mat-icon>add</mat-icon>
          DEFINE NEW ACCESS
        </button>
      </div>

      <!-- Table Controls with Inline Filter Chips -->
      <div class="access-management__controls">
        <!-- Left section: Filter button and chips -->
        <div class="access-management__controls-left">
          <!-- Filter button -->
          <button
            #filterBtn
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            aria-label="Open filter options"
            (click)="openFilter()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <!-- Responsive Filter Chips -->
          <app-filter-chips
            *ngIf="hasActiveFilters()"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right section: Search bar -->
        <div class="access-management__controls-right">
          <app-search-bar [config]="searchConfig" (search)="onSearch($event)" />
        </div>
      </div>

      <!-- Data Table -->
      <div class="access-management__table-wrapper">
        <app-data-table
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen" cdkTrapFocus cdkTrapFocusAutoCapture role="dialog" aria-modal="true" aria-label="Access management panel">
    <app-add-edit-access-management
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()"
      (modeChange)="onModeChange($event)">
    </app-add-edit-access-management>
  </div>

</div>
