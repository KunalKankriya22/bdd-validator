<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content (shrinks when side panel open — same as Territories) -->
  <main
    class="link-template main-content"
    [class.side-panel-active]="sidePanelOpen"
    aria-label="Link Template content"
    role="main">

    <app-page-header-with-breadcrumb
      [config]="headerConfig">
    </app-page-header-with-breadcrumb>

    <div class="content-area">

      <!-- Table Card Container -->
      <div class="link-template__card" #tableCard>

        <div class="link-template__filter-row table-controls">
          <div class="table-controls-left">
            <button
              #filterBtn
              type="button"
              mat-button
              class="filter-button"
              [disableRipple]="true"
              [class.filter-button--active]="isFilterOpen"
              aria-label="Open filter options"
              (click)="openFilter()">
              <span class="filter-icon" aria-hidden="true"></span>
              FILTER
            </button>

            @if (filterChips.length > 0) {
              <app-filter-chips
                [chips]="filterChips"
                [maxVisible]="3"
                (removeChip)="onRemoveFilterChip($event)"
                (clearAll)="clearAllFilters()">
              </app-filter-chips>
            }
          </div>
        </div>

        <!-- Data Table -->
        <div class="link-template__table-wrapper">
          <app-data-table
            [config]="tableConfig"
            [data]="dataSource"
            [loading]="isLoading"
            [keepActiveRow]="sidePanelOpen"
            (sortChange)="onSortChange($event)"
            (rowAction)="onRowAction($event)">
          </app-data-table>
        </div>
      </div>
    </div>
  </main>

  @if (sidePanelOpen) {
    <div class="side-panel-container" cdkTrapFocus cdkTrapFocusAutoCapture>
      <app-add-edit-link-dialog
        [mode]="sidePanelMode"
        [templateId]="templateId ?? ''"
        [link]="sidePanelLink ?? undefined"
        [resetFormToken]="sidePanelResetToken"
        [isSubmitting]="sidePanelSubmitting"
        (closePanel)="closeSidePanel()"
        (save)="onLinkPanelSave($event)">
      </app-add-edit-link-dialog>
    </div>
  }

</div>
