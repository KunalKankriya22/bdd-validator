<div class="filter-panel">
  <header class="filter-panel__header">
    <h2>Filters</h2>
    <button mat-icon-button class="filter-panel__close" (click)="onClose()" aria-label="Close filters">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="filter-panel__content">
    <form [formGroup]="filterForm">
      <!-- Sex -->
      <mat-form-field appearance="fill">
        <mat-label>Sex</mat-label>
        <mat-select formControlName="sex">
          <mat-option value="MALE">Male</mat-option>
          <mat-option value="FEMALE">Female</mat-option>
          <mat-option value="ALL">All</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Response Type -->
      <mat-form-field appearance="fill">
        <mat-label>Response Type</mat-label>
        <mat-select formControlName="responseType">
          <mat-option value="Single">Single</mat-option>
          <mat-option value="Multiple">Multiple</mat-option>
          <mat-option value="Comment">Comment</mat-option>
          <mat-option value="Ranking">Ranking</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Period and Effective Date -->
      <div class="date-row" role="group" aria-label="Effective date filter">
        <div class="period-field" [class.error-state]="effDatePeriodRequired">
          <mat-form-field appearance="fill">
            <mat-label>Period</mat-label>
            <mat-select formControlName="effectiveDatePeriod" aria-describedby="qa-eff-period-error">
              <mat-option value="After">After</mat-option>
              <mat-option value="Before">Before</mat-option>
            </mat-select>
          </mat-form-field>
          <div id="qa-eff-period-error" class="period-error" *ngIf="effDatePeriodRequired" role="alert">Period is required</div>
        </div>

        <div class="date-field">
          <mat-form-field appearance="fill">
            <mat-label>Effective Date</mat-label>
            <input matInput [matDatepicker]="effDatePicker" formControlName="effectiveDate"
                   #effDateNativeInput placeholder="DD-MMM-YYYY"
                   [errorStateMatcher]="effDateErrorMatcher"
                   aria-describedby="qa-eff-date-error">
            <mat-datepicker-toggle matIconSuffix [for]="effDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #effDatePicker></mat-datepicker>
          </mat-form-field>
          <div id="qa-eff-date-error" class="period-error" *ngIf="getEffectiveDateError()" role="alert">{{ getEffectiveDateError() }}</div>
        </div>
      </div>

      <!-- Period and Termination Date -->
      <div class="date-row" role="group" aria-label="Termination date filter">
        <div class="period-field" [class.error-state]="termDatePeriodRequired">
          <mat-form-field appearance="fill">
            <mat-label>Period</mat-label>
            <mat-select formControlName="terminationDatePeriod" aria-describedby="qa-term-period-error">
              <mat-option value="After">After</mat-option>
              <mat-option value="Before">Before</mat-option>
            </mat-select>
          </mat-form-field>
          <div id="qa-term-period-error" class="period-error" *ngIf="termDatePeriodRequired" role="alert">Period is required</div>
        </div>

        <div class="date-field">
          <mat-form-field appearance="fill">
            <mat-label>Termination Date</mat-label>
            <input matInput [matDatepicker]="termDatePicker" formControlName="terminationDate"
                   #termDateNativeInput placeholder="DD-MMM-YYYY"
                   [errorStateMatcher]="termDateErrorMatcher"
                   aria-describedby="qa-term-date-error">
            <mat-datepicker-toggle matIconSuffix [for]="termDatePicker"></mat-datepicker-toggle>
            <mat-datepicker #termDatePicker></mat-datepicker>
          </mat-form-field>
          <div id="qa-term-date-error" class="period-error" *ngIf="getTerminationDateError()" role="alert">{{ getTerminationDateError() }}</div>
        </div>
      </div>
    </form>
  </div>

  <footer class="filter-panel__footer">
    <div class="footer-actions">
      <button mat-stroked-button type="button" class="clear-btn" (click)="onClear()" aria-label="Clear all filters">CLEAR ALL</button>
      <button mat-raised-button type="button" class="apply-btn" [disabled]="isApplyDisabled" (click)="onApply()" aria-label="Apply filters">APPLY</button>
    </div>
  </footer>
</div>
