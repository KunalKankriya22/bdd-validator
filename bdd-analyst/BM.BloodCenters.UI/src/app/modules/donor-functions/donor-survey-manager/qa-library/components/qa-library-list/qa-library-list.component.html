<!-- DB has no questions yet -->
<div *ngIf="questions.length === 0 && !noResultsFromSearch" class="question-list__empty">
  <div class="empty-icon-wrapper">
    <mat-icon aria-hidden="true">edit</mat-icon>
  </div>
  <p class="empty-title">No Questions Drafted Yet.</p>
  <p class="empty-subtitle">Click below to start adding new questions.</p>
  <button mat-stroked-button class="add-new-btn" (click)="onAddNew()">
    <mat-icon>add</mat-icon>
    ADD NEW QUESTION
  </button>
</div>

<!-- Search or filter returned no results -->
<div *ngIf="questions.length === 0 && noResultsFromSearch" class="question-list__empty">
  <div class="empty-icon-wrapper">
    <img src="/assets/images/donor survey manager/search-result.svg" alt="No results icon">
  </div>
  <p class="empty-title">No Results to Show</p>
  <p class="empty-subtitle">Refine the criteria and Try again.</p>
</div>

<mat-list class="question-list" role="listbox" aria-label="Question list" *ngIf="questions.length > 0">
  <mat-list-item
    *ngFor="let question of questions"
    class="question-item"
    role="option"
    tabindex="0"
    [class.active]="isSelected(question)"
    [attr.aria-selected]="isSelected(question)"
    (click)="onSelectQuestion(question)"
    (keydown.enter)="onSelectQuestion(question)"
    (keydown.space)="$event.preventDefault(); onSelectQuestion(question)">
    <div class="item-row">
      <div class="item-text">
        <div class="question-text">{{ question.questionText }}</div>
        <div class="question-code">{{ question.questionCode }}</div>
      </div>

      <div class="item-icons-container" aria-hidden="true">
        <!-- Response Type Box (decorative — question text already conveys content) -->
        <div class="icon-box response-box" [class.active]="isSelected(question)">
          <img [src]="getResponseTypeIcon(question.responseType)"
               class="response-icon"
               alt="">
        </div>

        <!-- Gender Box -->
        <div class="icon-box gender-box" [class.active]="isSelected(question)">
          <img [src]="getGenderIcon(question.sex)"
               class="gender-icon"
               alt="">
        </div>
      </div>
    </div>
  </mat-list-item>
</mat-list>
