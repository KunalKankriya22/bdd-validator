<div class="qa-library-container">
  <div class="qa-library-content">
    <!-- LEFT PANEL (400px fixed width) -->
    <aside class="qa-library-sidebar" #sidebar>
      <div class="sidebar-header">
        <!-- Search Bar -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)">
        </app-search-bar>

        <!-- Filter Button -->
        <button mat-icon-button
                #filterBtn
                class="filter-btn"
                [class.filter-active]="hasActiveFilters()"
                aria-label="Open filter panel"
                (click)="openFilter()">
          <mat-icon aria-hidden="true">filter_list</mat-icon>
        </button>

        <!-- Add Button -->
        <button mat-icon-button
                aria-label="Add new question"
                (click)="createQuestion()">
          <mat-icon aria-hidden="true">add</mat-icon>
        </button>
      </div>

      <!-- Question List -->
      <app-qa-library-list
        [questions]="questions()"
        [selectedQuestionCode]="selectedQuestion()?.questionCode || null"
        [noResultsFromSearch]="questions().length === 0 && allQuestions().length > 0"
        (questionSelected)="onQuestionSelected($event)"
        (addNew)="createQuestion()">
      </app-qa-library-list>
    </aside>

    <!-- RIGHT PANEL (flex: 1) -->
    <main class="qa-library-main">
      <app-qa-library-detail-form
        *ngIf="selectedQuestion()"
        [question]="selectedQuestion()"
        [mode]="formMode"
        [isSaving]="isSaving()"
        (save)="onSave($event)"
        (cancel)="onCancel()"
        (clearAll)="onClearAll()">
      </app-qa-library-detail-form>

      <div *ngIf="!selectedQuestion() && questions().length > 0" class="empty-state">
        <p>Select a question from the list or create a new one</p>
      </div>

      <!-- Empty white card when no questions exist -->
      <div *ngIf="questions().length === 0" class="empty-right-panel"></div>
    </main>
  </div>
</div>
