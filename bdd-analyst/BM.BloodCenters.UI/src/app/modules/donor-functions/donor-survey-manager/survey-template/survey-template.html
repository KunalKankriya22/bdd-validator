<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<div class="layout-wrapper">

  <!-- Main Content Area -->
  <main class="survey-template main-content"
        aria-label="Survey Template content"
        role="main">

    <!-- Table Card Container -->
    <div class="survey-template__card" #tableCard>

      <!-- Row 1: Title + Add Template -->
      <div class="survey-template__title-row">
        <h1 class="survey-template__title">All Survey Templates</h1>
        <button
          mat-raised-button
          color="accent"
          class="add-button"
          type="button"
          (click)="openAddTemplateDialog()"
          aria-label="Add new template">
          <mat-icon>add</mat-icon>
          ADD NEW TEMPLATE
        </button>
      </div>

      <!-- Row 2: Filter + Search — same pattern as Create and Maintain Territories (table-controls) -->
      <div class="survey-template__filter-row table-controls">
        <div class="table-controls-left">
          <button
            #filterBtn
            type="button"
            mat-button
            class="filter-button"
            [disableRipple]="true"
            [class.filter-button--active]="isFilterOpen"
            aria-label="Open filter options"
            (click)="openFilter()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          @if (filterChips.length > 0) {
            <app-filter-chips
              [chips]="filterChips"
              [maxVisible]="3"
              (removeChip)="onRemoveFilterChip($event)"
              (clearAll)="clearAllFilters()">
            </app-filter-chips>
          }
        </div>

        <div class="table-controls-right">
          <app-search-bar
            [config]="searchConfig"
            (search)="onSearch($event)"
            (cleared)="onSearchCleared()" />
        </div>
      </div>

      <!-- Data Table -->
      <div class="survey-template__table-wrapper">
        <app-data-table
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)">

          <!-- Status Badge Custom Cell Template -->
          <ng-template #statusBadgeTemplate let-row>
            <span class="status-badge"
                  [class.status-active]="row.templateStatus === 'Active'"
                  [class.status-future]="row.templateStatus === 'Future'"
                  [class.status-inactive]="row.templateStatus !== 'Active' && row.templateStatus !== 'Future'">
              <span class="status-badge__icon-wrap" aria-hidden="true">
                <mat-icon class="status-badge__icon-inner">
                  @switch (row.templateStatus) {
                    @case ('Active') { check }
                    @case ('Future') { schedule }
                    @default { close }
                  }
                </mat-icon>
              </span>
              <span class="status-badge__label">{{ row.templateStatus === 'Active' ? 'Active' : row.templateStatus === 'Future' ? 'Future' : 'Inactive' }}</span>
            </span>
          </ng-template>
        </app-data-table>
      </div>
    </div>
  </main>
</div>
