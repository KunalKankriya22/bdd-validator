<app-page-header-with-breadcrumb [config]="headerConfig" />

<section class="drive-statistics-container">
  <section class="search-bar" [formGroup]="searchForm">
    <mat-form-field appearance="fill" class="drive-id-field">
      <mat-label>Drive ID</mat-label>
      <input
        matInput
        type="text"
        formControlName="driveId"
        placeholder="Enter Drive ID"
        [attr.aria-invalid]="f['driveId'].invalid && f['driveId'].touched">
      @if (f['driveId'].invalid && f['driveId'].touched) {
        <mat-error>Drive ID is required</mat-error>
      }
    </mat-form-field>

    <button
      mat-stroked-button
      color="primary"
      type="button"
      (click)="openDriveStatisticsDialog()"
      class="retrieve-button"
      [attr.aria-label]="'View Drive Statistics'">
      VIEW STATISTICS
    </button>
  </section>
</section>
