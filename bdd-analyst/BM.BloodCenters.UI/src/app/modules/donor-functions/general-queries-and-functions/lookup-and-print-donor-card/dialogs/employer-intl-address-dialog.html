<div class="side-panel-wrapper">
  <div class="panel-header">
    <h2 class="panel-title">Employer International Address</h2>
    <button mat-icon-button class="panel-close-btn" (click)="onClose()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="panel-body">
    <div class="form-grid">
      <div class="field-display-card field-display-card--full">
        <span class="field-label">Intl City</span>
        <span class="field-value">{{ data.intlCity || '—' }}</span>
      </div>
      <div class="field-display-card">
        <span class="field-label">Intl State</span>
        <span class="field-value">{{ data.intlState || '—' }}</span>
      </div>
      <div class="field-display-card">
        <span class="field-label">Intl Postal Code</span>
        <span class="field-value">{{ data.intlPostalCode || '—' }}</span>
      </div>
      <div class="field-display-card field-display-card--full">
        <span class="field-label">Intl Country</span>
        <span class="field-value">{{ data.intlCountryName || '—' }}</span>
      </div>
    </div>
  </div>

  <div class="panel-footer">
    <div class="footer-actions">
      <button mat-flat-button class="primary-btn" (click)="onClose()">CLOSE</button>
    </div>
  </div>
</div>
