<div class="ytd-loss-dialog">
  <div class="dialog-header">
    <h2 class="dialog-title">RBC Plasma Loss</h2>
    <button mat-icon-button class="close-btn" (click)="onClose()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div class="dialog-body">
    <div class="readonly-field">
      <span class="readonly-field__label">RBC Loss</span>
      <div class="readonly-field__value">{{ rbcLoss }}</div>
    </div>
    <div class="readonly-field">
      <span class="readonly-field__label">Plasma Loss</span>
      <div class="readonly-field__value">{{ plasmaLoss }}</div>
    </div>
  </div>
  <div class="dialog-footer">
    <button mat-flat-button class="btn-close" (click)="onClose()" aria-label="Close">
      CLOSE
    </button>
  </div>
</div>
