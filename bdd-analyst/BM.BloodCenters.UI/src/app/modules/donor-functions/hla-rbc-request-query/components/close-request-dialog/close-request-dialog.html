<div class="close-request-dialog" role="alertdialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
  <h2 id="dialog-title" mat-dialog-title>Are you sure you want to close this request?</h2>

  <mat-dialog-content>
    <p id="dialog-message">This action cannot be undone. The request will be closed and no longer be available for future searches.</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">CANCEL</button>
    <button mat-raised-button color="primary" (click)="onConfirm()" cdkFocusInitial>CLOSE</button>
  </mat-dialog-actions>
</div>
