<h2 mat-dialog-title>
  Donor ID: {{ donor.donorId }}
  <button mat-icon-button class="close-btn" (click)="onClose()" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content>
  <div class="unit-meta">
    <span><strong>Grade:</strong> {{ donor.grade }}</span>
    <span><strong>Level:</strong> {{ donor.gradeLevel }}</span>
    <span><strong>Pattern:</strong> {{ donor.pattern }}</span>
    <span><strong>ABO:</strong> {{ donor.bloodType }}</span>
  </div>

  <div class="antigen-section">
    <p class="antigen-label"><strong>Antigen</strong></p>
    <p class="antigen-text">{{ donor.antigens }}</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" (click)="onClose()">OK</button>
</mat-dialog-actions>
