<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Backdrop Overlay -->
  <div class="drawer-backdrop" [class.active]="sidePanelOpen"></div>

  <!-- Main Content Area -->
  <main class="define-hla-interim-output main-content" [class.side-panel-active]="sidePanelOpen"
        aria-label="Define HLA Interim Output content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="define-hla-interim-output__card" #tableCard>

      <!-- Table Controls with Search -->
      <div class="define-hla-interim-output__controls">
        <!-- Left section: Filter button and chips -->
        <div class="define-hla-interim-output__controls-left">
          <button
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            aria-label="Open filter options"
            [attr.aria-expanded]="isFilterOpen"
            (click)="openFilter()">
            <mat-icon aria-hidden="true">filter_list</mat-icon>
            FILTER
          </button>

          <!-- Filter Chips -->
          <app-filter-chips
            *ngIf="filterChips.length > 0"
            [chips]="filterChips"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right section: Search bar -->
        <div class="define-hla-interim-output__controls-right">
          <app-search-bar
            [config]="searchConfig"
            (search)="onSearch($event)" />
        </div>
      </div>

      <!-- Data Table -->
      <div class="define-hla-interim-output__table-wrapper">
        <app-data-table
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          [highlightedRow]="highlightedRow"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel for Add/Edit -->
  <aside
    class="side-panel"
    [class.side-panel--open]="sidePanelOpen"
    role="complementary"
    aria-label="Add or edit HLA interim output"
    [attr.aria-hidden]="!sidePanelOpen">
    <app-add-edit-hla-interim-output
      [isOpen]="sidePanelOpen"
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      [interimCodeOptions]="interimCodeLovData"
      (close)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()">
    </app-add-edit-hla-interim-output>
  </aside>

</div>
