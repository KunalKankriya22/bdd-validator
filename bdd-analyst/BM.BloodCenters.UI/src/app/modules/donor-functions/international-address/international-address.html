<app-page-header-with-breadcrumb [config]="headerConfig" />

<section class="international-address-container">
  <p class="info-note">This will only update sponsor contact international address</p>

  <section class="search-bar" [formGroup]="searchForm">
    <mat-form-field appearance="fill" class="sponsor-id-field">
      <mat-label>Sponsor ID</mat-label>
      <input
        matInput
        type="text"
        formControlName="sponsorId"
        placeholder="Enter Sponsor ContactID"
        aria-label="Sponsor Contact ID"
        [attr.aria-invalid]="f['sponsorId'].invalid && f['sponsorId'].touched">
      @if (f['sponsorId'].invalid && f['sponsorId'].touched) {
        <mat-error>Sponsor Contact ID is required</mat-error>
      }
    </mat-form-field>

    <button
      mat-stroked-button
      color="primary"
      type="button"
      (click)="onViewInternationalAddress()"
      class="retrieve-button"
      aria-label="View International Address">
      VIEW INTERNATIONAL ADDRESS
    </button>
  </section>
</section>
