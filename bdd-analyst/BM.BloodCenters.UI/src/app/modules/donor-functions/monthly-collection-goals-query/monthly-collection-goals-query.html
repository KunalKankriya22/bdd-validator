<app-page-header-with-breadcrumb [config]="headerConfig" />

<div class="monthly-collection-goals-container">
  <mat-tab-group
    class="goals-tabs"
    [selectedIndex]="selectedTabIndex()"
    (selectedTabChange)="onTabChange($event)"
    animationDuration="200ms"
    aria-label="Monthly Collection Goals Query tabs">

    @for (tab of tabs; track tab.id) {
      <mat-tab>
        <ng-template mat-tab-label>
          <span class="tab-label">{{ tab.label }}</span>
        </ng-template>
      </mat-tab>
    }
  </mat-tab-group>
</div>

<div class="tab-content-area">
  @switch (tabs[selectedTabIndex()].id) {
    @case ('search') {
      <div class="tab-content">
        <app-search-tab [yearOptions]="yearOptions"></app-search-tab>
      </div>
    }
    @case ('donation-type') {
      <div class="tab-content">
        <app-summary-tab
          tabType="donation-type"
          [yearOptions]="yearOptions"
          [isActive]="isTabActive(1)">
        </app-summary-tab>
      </div>
    }
    @case ('procedure-type') {
      <div class="tab-content">
        <app-summary-tab
          tabType="procedure-type"
          [yearOptions]="yearOptions"
          [isActive]="isTabActive(2)">
        </app-summary-tab>
      </div>
    }
    @case ('territories') {
      <div class="tab-content">
        <app-summary-tab
          tabType="territories"
          [yearOptions]="yearOptions"
          [isActive]="isTabActive(3)">
        </app-summary-tab>
      </div>
    }
    @case ('fixed-sites') {
      <div class="tab-content">
        <app-summary-tab
          tabType="fixed-sites"
          [yearOptions]="yearOptions"
          [isActive]="isTabActive(4)">
        </app-summary-tab>
      </div>
    }
  }
</div>
