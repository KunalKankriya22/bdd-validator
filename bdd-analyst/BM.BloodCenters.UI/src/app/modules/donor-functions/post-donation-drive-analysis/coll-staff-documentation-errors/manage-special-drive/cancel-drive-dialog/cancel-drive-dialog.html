<div class="cancel-drive-dialog">
  <div class="dialog-header">
    <h2 class="dialog-title">Cancel Special Drive</h2>
    <button type="button" class="close-button" (click)="onCancel()" [attr.aria-label]="'Close dialog'">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <form [formGroup]="cancelForm" class="dialog-content">
    <div class="form-row">
      <div class="form-field-wrapper">
        <mat-form-field appearance="fill" class="form-field">
          <mat-label>Cancel Code</mat-label>
          <mat-select formControlName="cancelCode" required>
            <mat-option>
              <ngx-mat-select-search
                [formControl]="cancelCodeSearchCtrl"
                placeholderLabel="Search..."
                noEntriesFoundLabel="No results found">
              </ngx-mat-select-search>
            </mat-option>
            <mat-option *ngFor="let option of filteredCancelCodeOptions()" [value]="option.value">
              {{ option.label }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="cancelForm.get('cancelCode')?.hasError('required')">
            Cancel Code is required
          </mat-error>
        </mat-form-field>
      </div>

      <div class="description-wrapper">
        <label class="description-label">Description</label>
        <div class="description-value">{{ selectedDescription }}</div>
      </div>
    </div>

    <div class="form-field-full">
      <textarea
        class="comments-textarea"
        formControlName="comments"
        rows="3"
        maxlength="100"
        placeholder="Comments"
        [attr.aria-label]="'Comments'"></textarea>
    </div>
  </form>

  <div class="dialog-actions">
    <button type="button" mat-button class="cancel-button" (click)="onCancel()">
      CANCEL
    </button>
    <button
      type="button"
      mat-raised-button
      color="primary"
      class="submit-button"
      [disabled]="cancelForm.invalid"
      (click)="onSubmit()">
      CANCEL DRIVE
    </button>
  </div>
</div>
