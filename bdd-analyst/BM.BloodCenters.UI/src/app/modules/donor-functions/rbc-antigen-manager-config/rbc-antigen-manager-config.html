<app-page-header-with-breadcrumb [config]="headerConfig()" />

<div class="rbc-antigen-manager-config-container">
  <mat-tab-group
    class="config-tabs"
    [selectedIndex]="selectedTabIndex()"
    (selectedTabChange)="onTabChange($event)"
    animationDuration="200ms"
    aria-label="RBC Antigen Manager Configuration tabs">

    @for (tab of tabs; track tab.id) {
      <mat-tab>
        <ng-template mat-tab-label>
          <span class="tab-label">{{ tab.label }}</span>
        </ng-template>
      </mat-tab>
    }
  </mat-tab-group>
</div>

<div class="tab-content-area">
  @switch (activeTabId) {
    @case ('rbc-ag-groups') {
      <div class="tab-content">
        <app-rbc-ag-groups />
      </div>
    }
    @case ('ser-mol-confirmatory-rules') {
      <div class="tab-content">
        <app-ser-mol-confirmatory-rules />
      </div>
    }
    @case ('external-file-mapping') {
      <div class="tab-content">
        <app-define-external-file-mapping />
      </div>
    }
    @case ('transfusion-status-log') {
      <div class="tab-content">
        <app-wellsky-transfusion-status-log />
      </div>
    }
    @case ('donor-rbc-antigen-query') {
      <div class="tab-content">
        <app-donor-rbc-ag-query [embedded]="true" />
      </div>
    }
  }
</div>
