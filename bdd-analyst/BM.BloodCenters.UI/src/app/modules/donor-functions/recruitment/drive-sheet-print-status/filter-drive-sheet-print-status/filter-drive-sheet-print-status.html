<div class="filter-container" role="dialog" aria-labelledby="filter-title" aria-modal="true">
  <!-- Header -->
  <div class="filter-header">
    <h3 id="filter-title">Filters</h3>
    <button mat-icon-button class="close-btn" (click)="onClose()" aria-label="Close filters">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Filter Form -->
  <form [formGroup]="filterForm" class="filter-body">
    <!-- Status -->
    <div class="filter-field">
      <mat-form-field appearance="fill">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status" aria-label="Filter by status">
          <mat-option value="">All</mat-option>
          @for (option of statusOptions; track option.value) {
            <mat-option [value]="option.value">{{ option.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Drive Date -->
    <div class="filter-field">
      <mat-form-field appearance="fill">
        <mat-label>Drive Date</mat-label>
        <input matInput [matDatepicker]="driveDatePicker" formControlName="driveDate"
          aria-label="Drive date filter">
        <mat-datepicker-toggle matSuffix [for]="driveDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #driveDatePicker></mat-datepicker>
      </mat-form-field>
    </div>
  </form>

  <!-- Footer -->
  <div class="filter-footer">
    <button mat-button class="clear-btn" (click)="onClearAll()">CLEAR ALL</button>
    <button mat-raised-button color="primary" class="apply-btn" (click)="onApply()" [disabled]="!hasSelection()">APPLY</button>
  </div>
</div>
