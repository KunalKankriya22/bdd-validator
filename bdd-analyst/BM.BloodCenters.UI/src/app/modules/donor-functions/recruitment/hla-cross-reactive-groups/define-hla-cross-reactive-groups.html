<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Backdrop Overlay -->
  <div class="drawer-backdrop" [class.active]="sidePanelOpen"></div>

  <!-- Main Content Area -->
  <main class="define-hla-cross-reactive-groups main-content" [class.side-panel-active]="sidePanelOpen"
        [attr.aria-label]="'Define HLA Cross-Reactive Groups content'"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

  <!-- Table Card Container -->
  <div class="define-hla-cross-reactive-groups__card" #tableCard>

    <!-- Table Controls with Search -->
    <div class="define-hla-cross-reactive-groups__controls">
      <!-- Left section: Filter button and chips -->
      <div class="define-hla-cross-reactive-groups__controls-left">
        <button
          #filterBtn
          type="button"
          mat-button
          class="filter-button"
          [class.filter-button--active]="isFilterOpen"
          [attr.aria-label]="'Open filter options'"
          cdkOverlayOrigin
          #trigger="cdkOverlayOrigin"
          (click)="openFilter()">
          <mat-icon aria-hidden="true">filter_list</mat-icon>
          FILTER
        </button>

        <!-- Filter Chips -->
        <app-filter-chips
          *ngIf="filterChips.length > 0"
          [chips]="filterChips"
          (removeChip)="onRemoveFilterChip($event)"
          (clearAll)="clearAllFilters()">
        </app-filter-chips>
      </div>

      <!-- Right section: Search bar -->
      <div class="define-hla-cross-reactive-groups__controls-right">
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)"
          (searchCleared)="onSearchCleared()" />
      </div>
    </div>

    <!-- Filter Panel Overlay -->
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="trigger"
      [cdkConnectedOverlayOpen]="isFilterOpen"
      [cdkConnectedOverlayHasBackdrop]="true"
      [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
      [cdkConnectedOverlayOffsetY]="4"
      cdkConnectedOverlayPanelClass="filter-overlay-panel"
      (backdropClick)="closeFilterPanel()"
      (detach)="closeFilterPanel()">
      <app-hla-cross-reactive-groups-filter-panel
        [currentFilters]="appliedFilters"
        [hlaStandardOptions]="hlaStandardOptionsForFilter"
        (apply)="applyFilters($event); closeFilterPanel()"
        (close)="closeFilterPanel()">
      </app-hla-cross-reactive-groups-filter-panel>
    </ng-template>

    <!-- Error State -->
    <div
      *ngIf="hasError && !isLoading"
      class="define-hla-cross-reactive-groups__error"
      role="alert"
      [attr.aria-label]="'Error loading data'">
      <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
      <p class="error-message">{{ errorMessage }}</p>
      <button type="button" mat-raised-button color="primary" (click)="loadData()">
        Retry
      </button>
    </div>

    <!-- Data Table -->
    <div class="define-hla-cross-reactive-groups__table-wrapper">
      <app-data-table
        *ngIf="!hasError"
        [config]="tableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        [highlightedRow]="activeHighlightedRow"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)" />
    </div>
  </div>
  </main>

  <!-- Side Panel for Add/Edit -->
  <div class="side-panel" [class.open]="sidePanelOpen">
    <app-add-edit-hla-cross-reactive-groups
      *ngIf="sidePanelOpen"
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      [hlaStandardOptions]="hlaStandardOptionsForAddEdit"
      [publicEpitopeOptions]="publicEpitopeOptions"
      [associatedEpitopeOptions]="associatedEpitopeOptions"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()">
    </app-add-edit-hla-cross-reactive-groups>
  </div>

</div>
