<!-- Main Content Area -->
<main class="define-hla-matching-grades main-content">
  <h1 class="cdk-visually-hidden">Define HLA Matching Grades</h1>

  <!-- Page Header with Breadcrumb -->
  <app-page-header-with-breadcrumb [config]="headerConfig" />

  <!-- Table Card Container -->
  <div class="define-hla-matching-grades__card"
       cdkOverlayOrigin
       #tableCardOrigin="cdkOverlayOrigin">

    <!-- Table Controls with Search -->
    <div class="define-hla-matching-grades__controls">
      <!-- Left section: Filter button and chips -->
      <div class="define-hla-matching-grades__controls-left">
        <button
          #filterBtn
          type="button"
          mat-button
          class="filter-button"
          [class.filter-button--active]="isFilterOpen"
          [attr.aria-label]="'FILTER — ' + (isFilterOpen ? 'close' : 'open') + ' filter options'"
          [attr.aria-expanded]="isFilterOpen"
          [attr.aria-controls]="'hla-filter-panel'"
          (click)="openFilter()">
          <span class="filter-icon" aria-hidden="true"></span>
          FILTER
        </button>

        <!-- Filter Chips -->
        <app-filter-chips
          *ngIf="filterChips.length > 0"
          [chips]="filterChips"
          [maxVisible]="3"
          (removeChip)="onRemoveFilterChip($event)"
          (clearAll)="clearAllFilters()">
        </app-filter-chips>
      </div>

      <!-- Right section: Search bar -->
      <app-search-bar
        [config]="searchConfig"
        (search)="onSearch($event)"
        (searchCleared)="onSearchCleared()" />
    </div>

    <!-- Filter Panel Overlay -->
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="tableCardOrigin"
      [cdkConnectedOverlayOpen]="isFilterOpen"
      [cdkConnectedOverlayHasBackdrop]="true"
      [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
      [cdkConnectedOverlayPositions]="filterPanelPositions"
      cdkConnectedOverlayPanelClass="filter-overlay-panel"
      (backdropClick)="closeFilterPanel()"
      (detach)="closeFilterPanel()">
      <app-hla-grading-filter-panel
        [currentFilters]="appliedFilters"
        (apply)="applyFilters($event); closeFilterPanel()"
        (close)="closeFilterPanel()">
      </app-hla-grading-filter-panel>
    </ng-template>

    <!-- Error State -->
    <div
      *ngIf="hasError && !isLoading"
      class="define-hla-matching-grades__error"
      role="alert">
      <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
      <p class="error-message">{{ errorMessage }}</p>
      <button type="button" mat-raised-button color="primary"
              [attr.aria-label]="'Retry loading HLA matching grades'"
              (click)="loadData()">
        Retry
      </button>
    </div>

    <!-- Data Table -->
    <div class="define-hla-matching-grades__table-wrapper">
      <app-data-table
        *ngIf="!hasError"
        [config]="tableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        [keepActiveRow]="isDialogOpen"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)" />
    </div>
  </div>
</main>
