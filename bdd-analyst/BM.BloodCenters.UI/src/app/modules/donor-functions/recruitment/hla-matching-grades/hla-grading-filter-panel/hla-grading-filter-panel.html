<section id="hla-filter-panel" class="filter-panel" role="dialog" aria-labelledby="filter-title" cdkTrapFocus cdkTrapFocusAutoCapture (keydown.escape)="onClose()">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" [attr.aria-label]="'Close filter panel'" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Effective Date Period Row -->
    <div class="filter-panel__period-row">
      <div class="period-wrapper">
        <mat-form-field appearance="fill" class="filter-panel__period-type">
          <mat-label>Effective Date Period</mat-label>
          <mat-select formControlName="effectivePeriod"
                      [attr.aria-describedby]="effectiveDatePeriodError ? 'eff-period-error' : null"
                      [attr.aria-invalid]="!!effectiveDatePeriodError">
            <mat-option value="After">After</mat-option>
            <mat-option value="Before">Before</mat-option>
          </mat-select>
        </mat-form-field>
        <div id="eff-period-error"
             class="filter-error"
             role="alert"
             aria-live="assertive"
             *ngIf="effectiveDatePeriodError">
          {{ effectiveDatePeriodError }}
        </div>
      </div>

      <mat-form-field appearance="fill" class="filter-panel__period-date">
        <mat-label>Effective Date</mat-label>
        <input
          #effectiveDateInput
          matInput
          [matDatepicker]="pickerEffective"
          formControlName="effectiveDate"
          placeholder="DD-MMM-YYYY"
          (input)="onEffectiveDateInput($event)"
          (blur)="onEffectiveDateBlur(effectiveDateInput)">
        <mat-datepicker-toggle matIconSuffix [for]="pickerEffective"></mat-datepicker-toggle>
        <mat-datepicker #pickerEffective></mat-datepicker>
        <mat-error *ngIf="filterForm.get('effectiveDate')?.hasError('invalidDate') || filterForm.get('effectiveDate')?.hasError('invalidDateFormat') || filterForm.get('effectiveDate')?.hasError('matDatepickerParse')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Termination Date Period Row -->
    <div class="filter-panel__period-row">
      <div class="period-wrapper">
        <mat-form-field appearance="fill" class="filter-panel__period-type">
          <mat-label>Termination Date Period</mat-label>
          <mat-select formControlName="terminationPeriod"
                      [attr.aria-describedby]="terminationDatePeriodError ? 'term-period-error' : null"
                      [attr.aria-invalid]="!!terminationDatePeriodError">
            <mat-option value="After">After</mat-option>
            <mat-option value="Before">Before</mat-option>
          </mat-select>
        </mat-form-field>
        <div id="term-period-error"
             class="filter-error"
             role="alert"
             aria-live="assertive"
             *ngIf="terminationDatePeriodError">
          {{ terminationDatePeriodError }}
        </div>
      </div>

      <mat-form-field appearance="fill" class="filter-panel__period-date">
        <mat-label>Termination Date</mat-label>
        <input
          #terminationDateInput
          matInput
          [matDatepicker]="pickerTermination"
          formControlName="terminationDate"
          placeholder="DD-MMM-YYYY"
          (input)="onTerminationDateInput($event)"
          (blur)="onTerminationDateBlur(terminationDateInput)">
        <mat-datepicker-toggle matIconSuffix [for]="pickerTermination"></mat-datepicker-toggle>
        <mat-datepicker #pickerTermination></mat-datepicker>
        <mat-error *ngIf="filterForm.get('terminationDate')?.hasError('invalidDate') || filterForm.get('terminationDate')?.hasError('invalidDateFormat') || filterForm.get('terminationDate')?.hasError('matDatepickerParse')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>
  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" [attr.aria-label]="'Clear all filters'" (click)="onClearAll()">
      CLEAR ALL
    </button>
    <button mat-raised-button color="primary" type="button" [attr.aria-label]="'Apply filters'" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
