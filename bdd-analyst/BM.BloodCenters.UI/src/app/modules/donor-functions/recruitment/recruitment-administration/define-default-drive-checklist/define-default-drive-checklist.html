<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="drive-checklist main-content"
        aria-label="Define Default Drive Checklist content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="drive-checklist__card" #tableCard>

      <!-- Table Controls with Inline Filter Chips -->
      <div class="drive-checklist__controls">
        <!-- Left section: Filter button and chips -->
        <div class="drive-checklist__controls-left">
          <button
            #filterBtn
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            aria-label="Open filter options"
            (click)="openFilter()">
            <mat-icon aria-hidden="true">filter_list</mat-icon>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips
            *ngIf="hasActiveFilters()"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right section: Search bar -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)" />
      </div>

      <!-- Data Table -->
      <div class="drive-checklist__table-wrapper">
        <app-data-table
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-add-edit-drive-checklist
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      [chapterId]="currentChapterId"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()">
    </app-add-edit-drive-checklist>
  </div>

</div>
