<section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Condition and No. of Days in same row -->
    <div class="filter-row">
      <mat-form-field appearance="fill">
        <mat-label>Condition</mat-label>
        <mat-select formControlName="condition">
          <mat-option *ngFor="let condition of conditionOptions" [value]="condition.value">
            {{ condition.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>No. of Days</mat-label>
        <input matInput type="number" formControlName="noOfDays" placeholder="0-9999">
        <mat-error *ngIf="getNoOfDaysError()">{{ getNoOfDaysError() }}</mat-error>
      </mat-form-field>
    </div>

    <mat-form-field appearance="fill">
      <mat-label>Timeline</mat-label>
      <mat-select formControlName="timeline" multiple>
        <mat-option *ngFor="let timeline of timelineOptions" [value]="timeline.value">
          {{ timeline.key }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()" [disabled]="isClearDisabled">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
