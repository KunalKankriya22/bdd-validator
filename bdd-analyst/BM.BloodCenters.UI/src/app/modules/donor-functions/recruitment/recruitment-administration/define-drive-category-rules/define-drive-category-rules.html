<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="drive-category-rules main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Define Drive Category Rules content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="drive-category-rules__card" #tableCard>

      <!-- Table Controls with Inline Filter Chips -->
      <div class="drive-category-rules__controls">
        <!-- Left section: Filter button and chips -->
        <div class="drive-category-rules__controls-left">
          <button #filterBtn mat-button class="filter-button" [class.filter-button--active]="isFilterOpen" aria-label="Open filter options" (click)="openFilter()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips *ngIf="hasActiveFilters()" [chips]="filterChips" [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)" (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right section: Search bar -->
        <app-search-bar [config]="searchConfig" (search)="onSearch($event)" />
      </div>

      <!-- Data Table -->
      <div class="drive-category-rules__table-wrapper">
        <app-data-table [config]="tableConfig" [data]="dataSource" [loading]="isLoading"
          (pageChange)="onPageChange($event)" (sortChange)="onSortChange($event)" (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-add-edit-rule
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()">
    </app-add-edit-rule>
  </div>

</div>
