<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content" aria-describedby="filter-desc">

    <mat-form-field appearance="fill">
      <mat-label>Show Termination</mat-label>
      <mat-select formControlName="showTermination">
        <mat-option value="No">No</mat-option>
        <mat-option value="Yes">Yes</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Critical</mat-label>
      <mat-select formControlName="critical">
        <mat-option value="Both (Yes & No)">Both (Yes & No)</mat-option>
        <mat-option value="Yes">Yes</mat-option>
        <mat-option value="No">No</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- First Period Row -->
    <div class="filter-panel__period-row">
      <mat-form-field appearance="fill" class="filter-panel__period-type">
        <mat-label>Period</mat-label>
        <mat-select formControlName="periodType1">
          <mat-option value="After">After</mat-option>
          <mat-option value="Before">Before</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="filter-panel__period-date">
        <mat-label>Effective Date</mat-label>
        <input
          matInput
          [matDatepicker]="pickerEffective"
          formControlName="effectiveDate"
          placeholder="Select date"
          aria-label="Effective date">
        <mat-datepicker-toggle matIconSuffix [for]="pickerEffective"></mat-datepicker-toggle>
        <mat-datepicker #pickerEffective></mat-datepicker>
      </mat-form-field>
    </div>

    <!-- Second Period Row -->
    <div class="filter-panel__period-row">
      <mat-form-field appearance="fill" class="filter-panel__period-type">
        <mat-label>Period</mat-label>
        <mat-select formControlName="periodType2">
          <mat-option value="After">After</mat-option>
          <mat-option value="Before">Before</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="filter-panel__period-date">
        <mat-label>Termination Date</mat-label>
        <input
          matInput
          [matDatepicker]="pickerTerm"
          formControlName="terminationDate"
          placeholder="Select date"
          aria-label="Termination date">
        <mat-datepicker-toggle matIconSuffix [for]="pickerTerm"></mat-datepicker-toggle>
        <mat-datepicker #pickerTerm></mat-datepicker>
      </mat-form-field>
    </div>
  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onApply()">
      APPLY
    </button>
  </footer>

</section>
