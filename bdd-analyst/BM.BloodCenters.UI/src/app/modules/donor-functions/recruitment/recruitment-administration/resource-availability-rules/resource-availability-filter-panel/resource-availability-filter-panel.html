<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content" aria-describedby="filter-desc">

    <mat-form-field appearance="fill">
      <mat-label>Day</mat-label>
      <mat-select formControlName="day">
        <mat-option value="ALL">All Days</mat-option>
        <mat-option *ngFor="let day of weekDays" [value]="day">
          {{ day }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <div class="filter-panel__date-row">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label>Period</mat-label>
        <mat-select formControlName="effectiveDatePeriod">
          <mat-option *ngFor="let option of periodOptions" [value]="option">
            {{ option }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="filterForm.get('effectiveDatePeriod')?.hasError('required')">
          Period is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Effective Date</mat-label>
        <input
          #effectiveDateInput
          matInput
          [matDatepicker]="effectiveDatePicker"
          formControlName="effectiveDate"
          aria-label="Effective Date"
          (input)="onEffectiveDateInput($event)"
          (blur)="onEffectiveDateBlur(effectiveDateInput)">
        <mat-datepicker-toggle matIconSuffix [for]="effectiveDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #effectiveDatePicker></mat-datepicker>
        <mat-error *ngIf="filterForm.get('effectiveDate')?.hasError('invalidDateFormat')">
          Invalid date
        </mat-error>
        <mat-error *ngIf="filterForm.get('effectiveDate')?.hasError('matDatepickerParse')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>

    <div class="filter-panel__date-row">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label>Period</mat-label>
        <mat-select formControlName="terminationDatePeriod">
          <mat-option *ngFor="let option of periodOptions" [value]="option">
            {{ option }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="filterForm.get('terminationDatePeriod')?.hasError('required')">
          Period is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Termination Date</mat-label>
        <input
          #terminationDateInput
          matInput
          [matDatepicker]="terminationDatePicker"
          formControlName="terminationDate"
          aria-label="Termination Date"
          (input)="onTerminationDateInput($event)"
          (blur)="onTerminationDateBlur(terminationDateInput)">
        <mat-datepicker-toggle matIconSuffix [for]="terminationDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #terminationDatePicker></mat-datepicker>
        <mat-error *ngIf="filterForm.get('terminationDate')?.hasError('invalidDateFormat')">
          Invalid date
        </mat-error>
        <mat-error *ngIf="filterForm.get('terminationDate')?.hasError('matDatepickerParse')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>
  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <div class="footer-actions">
      <button mat-stroked-button type="button" class="clear-btn" (click)="onClear()">CLEAR ALL</button>
      <button mat-raised-button type="button" class="apply-btn" (click)="onApply()" [disabled]="isApplyDisabled">APPLY</button>
    </div>
  </footer>

</section>
