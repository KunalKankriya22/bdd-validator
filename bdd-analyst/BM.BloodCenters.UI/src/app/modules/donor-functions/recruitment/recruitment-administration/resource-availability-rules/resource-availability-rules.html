<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="resource-availability-rules main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Resource Availability Rules content"
        role="main">

    <!-- Page Header -->
    <app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>

    <!-- Main Content Card -->
    <div class="resource-availability-rules__card" #tableCard>

      <!-- Filter Section -->
      <div class="filter-section">
        <div class="filter-row">
          <!-- Show Terminated Dropdown -->
          <div class="filter-field show-terminated-field">
            <mat-form-field appearance="fill">
              <mat-label>Show Terminated <span class="required-marker">*</span></mat-label>
              <mat-select
                [(ngModel)]="showTerminated"
                (selectionChange)="onShowTerminatedChange()"
                [disabled]="isLoading">
                <mat-option value="NO">No</mat-option>
                <mat-option value="YES">Yes</mat-option>
              </mat-select>
            </mat-form-field>
          </div>

          <!-- Resource Code Dropdown -->
          <div class="filter-field resource-code-field">
            <mat-form-field appearance="fill">
              <mat-label>Resource Code</mat-label>
              <mat-select
                #resourceCodeSelect="ngModel"
                [(ngModel)]="resourceCode"
                (selectionChange)="onResourceCodeChange()"
                [disabled]="isLoading"
                required>
                <mat-option *ngFor="let resource of validResources()" [value]="resource.resourceCode">
                  {{ resource.resourceCode }}
                </mat-option>
              </mat-select>
              <mat-error *ngIf="resourceCodeSelect.invalid && resourceCodeSelect.touched">
                Resource Code is required
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Resource Description (Label) -->
          <div class="filter-field resource-desc-field">
            <div class="description-label">
              <span class="label-text">Code Description</span>
              <span class="value-text">{{ resourceDescription }}</span>
            </div>
          </div>

          <!-- Retrieve Button -->
          <div class="filter-actions">
            <button
              type="button"
              mat-stroked-button
              color="accent"
              (click)="onRetrieve()"
              [disabled]="retrieveButtonDisabled || isLoading"
              aria-label="Retrieve data">
              RETRIEVE
            </button>
          </div>
        </div>
      </div>

      <!-- Table Controls with Inline Filter Chips -->
      @if (dataSource.length > 0 || hasActiveFilters() || searchText) {
        <div class="resource-availability-rules__controls">
          <!-- Left section: Filter button and chips -->
          <div class="resource-availability-rules__controls-left">
            <button #filterBtn mat-button class="filter-button" [class.filter-button--active]="isFilterOpen" aria-label="Open filter options" (click)="openFilter()">
              <span class="filter-icon" aria-hidden="true"></span>
              FILTER
            </button>

            <!-- Inline Filter Chips -->
            <app-filter-chips *ngIf="hasActiveFilters()" [chips]="filterChips" [maxVisible]="1"
              (removeChip)="onRemoveFilterChip($event)" (clearAll)="clearAllFilters()">
            </app-filter-chips>
          </div>

          <!-- Right section: Add button and Search bar -->
          <div class="resource-availability-rules__controls-right">
            @if (canAddNew()) {
              <button
                type="button"
                mat-stroked-button
                color="accent"
                (click)="addNewRule()"
                [disabled]="isLoading"
                aria-label="Add new availability rule">
                ADD NEW RESOURCE RULE
              </button>
            }
            <app-search-bar [config]="searchConfig" (search)="onSearch($event)" />
          </div>
        </div>
      }

      <!-- Data Table Section -->
      <div class="table-section">
        <!-- Data Table -->
        <app-data-table
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          (rowAction)="onRowAction($event)"
          (sortChange)="onSortChange($event)">
        </app-data-table>
      </div>
    </div>
  </main>

  <!-- Add/Edit Side Panel -->
  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-add-edit-resource-rule
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      [resourceCode]="resourceCode"
      [resourceDescription]="resourceDescription"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()">
    </app-add-edit-resource-rule>
  </div>

  <!-- View Active Resources Side Panel -->
  <ng-container *ngIf="viewPanelOpen">
    <!-- Backdrop -->
    <div class="view-panel-backdrop" (click)="closeViewPanel()"></div>
    <!-- Panel -->
    <div class="side-panel-container view-panel">
      <app-view-resource-availability
        [selectedRow]="viewPanelRow"
        (closePanel)="closeViewPanel()">
      </app-view-resource-availability>
    </div>
  </ng-container>

</div>
