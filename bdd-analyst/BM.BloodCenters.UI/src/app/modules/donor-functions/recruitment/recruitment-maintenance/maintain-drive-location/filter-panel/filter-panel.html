<section class="filter-panel" role="region" aria-labelledby="filter-panel-heading">
  <header class="filter-panel__header">
    <h1 id="filter-panel-heading" class="filter-panel__title">Filters</h1>
    <button mat-icon-button
            (click)="onClose()"
            [attr.aria-label]="'Close filter panel'"
            data-testid="filter-close-btn">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Effective Date -->
    <div class="date-row">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label>Effective Date Period</mat-label>
        <mat-select formControlName="effDatePeriod"
                    data-testid="filter-eff-period">
          <mat-option value="AFTER">After</mat-option>
          <mat-option value="BEFORE">Before</mat-option>
        </mat-select>
        <mat-error *ngIf="getEffDatePeriodError()">
          {{ getEffDatePeriodError() }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Effective Date</mat-label>
        <input matInput
               [matDatepicker]="effDatePicker"
               formControlName="effDate"
               data-testid="filter-eff-date"
               #effDateInput
               (input)="onEffDateInput($event)"
               (blur)="onEffDateBlur(effDateInput)">
        <mat-datepicker-toggle matIconSuffix [for]="effDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #effDatePicker></mat-datepicker>
        <mat-error *ngIf="getEffDateError()">
          {{ getEffDateError() }}
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Termination Date -->
    <div class="date-row">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label>Termination Date Period</mat-label>
        <mat-select formControlName="termDatePeriod"
                    data-testid="filter-term-period">
          <mat-option value="AFTER">After</mat-option>
          <mat-option value="BEFORE">Before</mat-option>
        </mat-select>
        <mat-error *ngIf="getTermDatePeriodError()">
          {{ getTermDatePeriodError() }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Termination Date</mat-label>
        <input matInput
               [matDatepicker]="termDatePicker"
               formControlName="termDate"
               data-testid="filter-term-date"
               #termDateInput
               (input)="onTermDateInput($event)"
               (blur)="onTermDateBlur(termDateInput)">
        <mat-datepicker-toggle matIconSuffix [for]="termDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #termDatePicker></mat-datepicker>
        <mat-error *ngIf="getTermDateError()">
          {{ getTermDateError() }}
        </mat-error>
      </mat-form-field>
    </div>
  </form>

  <footer class="filter-panel__footer">
    <button mat-stroked-button
            (click)="onClear()"
            [attr.aria-label]="'Clear all filters'"
            data-testid="filter-clear-btn">
      CLEAR ALL
    </button>
    <button mat-raised-button
            color="primary"
            [disabled]="isApplyDisabled()"
            (click)="onApply()"
            [attr.aria-label]="'Apply filters'"
            data-testid="filter-apply-btn">
      APPLY
    </button>
  </footer>
</section>
