<!-- Header -->
<div class="dialog-header">
  <h1 id="view-direction-title" mat-dialog-title class="dialog-title">View Direction</h1>
  <button type="button" mat-icon-button class="close-btn" mat-dialog-close [attr.aria-label]="'Close view direction dialog'">
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
</div>

<!-- Content -->
<mat-dialog-content class="dialog-content" [attr.aria-labelledby]="'view-direction-title'">
  <div class="direction-info">
    <dl class="info-row">
      <dt class="info-label">Location ID</dt>
      <dd class="info-value">{{ locationId }}</dd>
    </dl>
    <dl class="info-row">
      <dt class="info-label">Location Name</dt>
      <dd class="info-value">{{ locationName }}</dd>
    </dl>
  </div>

  <div class="direction-notes-section">
    <h2 class="section-label">Direction Notes</h2>
    <div class="direction-notes-text" [class.has-content]="directions">{{ directions || 'No direction notes available' }}</div>
  </div>
</mat-dialog-content>

<!-- Footer -->
<mat-dialog-actions class="dialog-actions">
  <button type="button" mat-button class="cancel-btn" mat-dialog-close [attr.aria-label]="'Close view direction dialog'">
    CANCEL
  </button>
</mat-dialog-actions>
