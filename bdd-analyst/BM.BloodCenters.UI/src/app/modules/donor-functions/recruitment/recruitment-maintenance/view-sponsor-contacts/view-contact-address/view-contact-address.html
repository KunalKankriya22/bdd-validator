<div class="side-panel-wrapper">

  <!-- Header -->
  <div class="panel-header">
    <div class="header-content">
      <h2 class="panel-title">Contact Address</h2>
    </div>
    <button type="button" mat-icon-button class="close-btn" (click)="onClose()" aria-label="Close panel">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="panel-body">
    <div class="address-form" [formGroup]="form">

      <!-- Street -->
      <div class="form-grid form-grid--single">
        <mat-form-field appearance="fill">
          <mat-label>Street</mat-label>
          <input matInput formControlName="street" readonly />
        </mat-form-field>
      </div>

      <!-- Zip Code, City -->
      <div class="form-grid">
        <mat-form-field appearance="fill">
          <mat-label>Zip Code</mat-label>
          <input matInput formControlName="zipCode" readonly />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>City</mat-label>
          <input matInput formControlName="city" readonly />
        </mat-form-field>
      </div>

      <!-- Work Phone, Home Phone -->
      <div class="form-grid">
        <mat-form-field appearance="fill">
          <mat-label>Work Phone</mat-label>
          <input matInput formControlName="workPhone" readonly />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Home Phone</mat-label>
          <input matInput formControlName="homePhone" readonly />
        </mat-form-field>
      </div>

      <!-- Fax, Email -->
      <div class="form-grid">
        <mat-form-field appearance="fill">
          <mat-label>Fax</mat-label>
          <input matInput formControlName="fax" readonly />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" readonly />
        </mat-form-field>
      </div>

      <!-- Website -->
      <div class="form-grid form-grid--single">
        <mat-form-field appearance="fill">
          <mat-label>Website</mat-label>
          <input matInput formControlName="website" readonly />
        </mat-form-field>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div class="panel-footer">
    <div class="footer-actions">
      <button type="button" mat-raised-button class="primary-btn" (click)="onClose()">
        CLOSE
      </button>
    </div>
  </div>

</div>
