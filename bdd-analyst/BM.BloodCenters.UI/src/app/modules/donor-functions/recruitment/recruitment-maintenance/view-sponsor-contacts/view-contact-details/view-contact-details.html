<div class="side-panel-wrapper">

  <!-- Header -->
  <div class="panel-header">
    <div class="header-content">
      <h2 class="panel-title">Contact Details</h2>
    </div>
    <button type="button" mat-icon-button class="close-btn" (click)="onClose()" aria-label="Close panel">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="panel-body">
    <div class="view-contact-form" [formGroup]="form">

      <!-- Row 1: Honorific, First Name, Last Name -->
      <div class="form-grid form-grid--three">
        <mat-form-field appearance="fill">
          <mat-label>Honorific</mat-label>
          <input matInput formControlName="honorific" readonly />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName" readonly />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName" readonly />
        </mat-form-field>
      </div>

      <!-- Row 2: Type, Title, Effective Date -->
      <div class="form-grid form-grid--three">
        <mat-form-field appearance="fill">
          <mat-label>Type</mat-label>
          <input matInput formControlName="type" readonly />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" readonly />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Effective Date</mat-label>
          <input matInput formControlName="effectiveDate" readonly />
        </mat-form-field>
      </div>

      <!-- Row 3: Termination Date -->
      <div class="form-grid form-grid--three">
        <mat-form-field appearance="fill">
          <mat-label>Termination Date</mat-label>
          <input matInput formControlName="terminationDate" readonly />
        </mat-form-field>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div class="panel-footer">
    <div class="footer-actions">
      <button type="button" mat-raised-button class="primary-btn" (click)="onClose()">
        CLOSE
      </button>
    </div>
  </div>

</div>
