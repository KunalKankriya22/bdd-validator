<div class="side-panel-wrapper">

  <!-- Header -->
  <div class="panel-header">
    <div class="header-content">
      <h2 class="panel-title">Notes</h2>
    </div>
    <button type="button" mat-icon-button class="close-btn" (click)="onClose()" aria-label="Close panel">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="panel-body">

    <!-- Notes List (Read-Only) -->
    <div class="notes-list">
      <div *ngFor="let note of notes; let i = index" class="note-card">
        <div class="note-card__header">
          <div class="note-card__avatar" [style.background-color]="'#228189'">
            {{ getInitials(note.createdBy) }}
          </div>
          <div class="note-card__meta">
            <span class="note-card__author">{{ note.createdBy }}</span>
            <span class="note-card__date">{{ note.version || (i + 1) + '.0' }} | {{ formatDate(note.createdDate) }}</span>
          </div>
        </div>
        <div class="note-card__body">
          <p class="note-card__content">{{ note.notes }}</p>
        </div>
      </div>

      <div *ngIf="!isLoading && notes.length === 0" class="notes-empty">
        <p>No notes available for this contact.</p>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="panel-footer">
    <div class="footer-actions">
      <button type="button" mat-raised-button class="primary-btn" (click)="onClose()">
        CLOSE
      </button>
    </div>
  </div>

</div>
