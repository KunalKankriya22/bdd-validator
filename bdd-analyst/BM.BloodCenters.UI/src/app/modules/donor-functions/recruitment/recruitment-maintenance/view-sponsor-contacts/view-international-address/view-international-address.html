<div class="side-panel-wrapper">

  <!-- Header -->
  <div class="panel-header">
    <div class="header-content">
      <h2 class="panel-title">International Address</h2>
    </div>
    <button type="button" mat-icon-button class="close-btn" (click)="onClose()" aria-label="Close panel">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="panel-body">
    <div class="intl-address-form" [formGroup]="form">

      <!-- Address Lines -->
      <div class="form-grid form-grid--single">
        <mat-form-field appearance="fill">
          <mat-label>Address 1</mat-label>
          <input matInput formControlName="address1" readonly />
        </mat-form-field>
      </div>

      <div class="form-grid form-grid--single">
        <mat-form-field appearance="fill">
          <mat-label>Address 2</mat-label>
          <input matInput formControlName="address2" readonly />
        </mat-form-field>
      </div>

      <div class="form-grid form-grid--single">
        <mat-form-field appearance="fill">
          <mat-label>Address 3</mat-label>
          <input matInput formControlName="address3" readonly />
        </mat-form-field>
      </div>

      <div class="form-grid form-grid--single">
        <mat-form-field appearance="fill">
          <mat-label>Address 4</mat-label>
          <input matInput formControlName="address4" readonly />
        </mat-form-field>
      </div>

      <!-- Country, Postal Code -->
      <div class="form-grid">
        <mat-form-field appearance="fill">
          <mat-label>Country</mat-label>
          <input matInput formControlName="country" readonly />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Postal Code</mat-label>
          <input matInput formControlName="postalCode" readonly />
        </mat-form-field>
      </div>

      <!-- Extension, Work Phone -->
      <div class="form-grid">
        <mat-form-field appearance="fill">
          <mat-label>Extension</mat-label>
          <input matInput formControlName="extension" readonly />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Work Phone</mat-label>
          <input matInput formControlName="workPhone" readonly />
        </mat-form-field>
      </div>

      <!-- Home Phone, Mobile Phone -->
      <div class="form-grid">
        <mat-form-field appearance="fill">
          <mat-label>Home Phone</mat-label>
          <input matInput formControlName="homePhone" readonly />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Mobile Phone</mat-label>
          <input matInput formControlName="mobilePhone" readonly />
        </mat-form-field>
      </div>

      <!-- Fax, Email -->
      <div class="form-grid">
        <mat-form-field appearance="fill">
          <mat-label>Fax</mat-label>
          <input matInput formControlName="fax" readonly />
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" readonly />
        </mat-form-field>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <div class="panel-footer">
    <div class="footer-actions">
      <button type="button" mat-raised-button class="primary-btn" (click)="onClose()">
        CLOSE
      </button>
    </div>
  </div>

</div>
