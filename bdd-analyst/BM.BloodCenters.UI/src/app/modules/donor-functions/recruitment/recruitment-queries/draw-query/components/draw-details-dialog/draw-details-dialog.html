<div class="drive-panel">
  <!-- Header -->
  <div class="drive-panel__header">
    <!-- WCAG 4.1.2: mat-dialog-title wires aria-labelledby from dialog surface to this heading -->
    <h2 class="drive-panel__title" mat-dialog-title>Drives</h2>
    <button mat-icon-button class="drive-panel__close" (click)="onClose()" [attr.aria-label]="'Close Drives panel'">
      <!-- WCAG 4.1.2: aria-hidden prevents duplicate announcement alongside button aria-label -->
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <!-- Date -->
  
  <!-- Content -->
  <!-- WCAG 1.3.1/2.4.6: drive-panel__date acts as a visible label for the table below — give it an id
       so the content section can reference it via aria-labelledby for AT orientation -->
  <div class="drive-panel__content" aria-labelledby="drive-panel-date">
    <p id="drive-panel-date" class="drive-panel__date">{{ formattedDate }}</p>
    <app-data-table
      [config]="tableConfig"
      [data]="driveDetails"
      [loading]="isLoading"
      (rowAction)="onRowAction($event)">
    </app-data-table>
  </div>

  <!-- Footer -->
  <div class="drive-panel__footer" *ngIf="!isLoading && driveDetails.length > 0">
    <!-- WCAG 1.3.1: role=presentation removes data-table semantics from this layout table -->
    <table class="drive-panel__footer-table" role="presentation">
      <tr>
        <!-- WCAG 1.3.1: explicit aria-label describes what this summary row represents to AT -->
        <td style="width: 50px;" aria-label="Total drives: {{ driveDetails.length }}">Drives {{ driveDetails.length }}</td>
        <td style="width: 60px;"></td>
        <td style="width: 110px;"></td>
        <td style="min-width: 180px;"></td>
        <td style="width: 110px;"></td>
        <td style="width: 60px; text-align: center;">{{ getTotalProjectedDraw() }}</td>
        <td style="width: 50px; text-align: center;">{{ getTotalStaff() }}</td>
        <td style="width: 50px; text-align: center;">{{ getTotalVan() }}</td>
        <td style="width: 55px; text-align: center;">{{ getTotalCoach() }}</td>
        <td style="width: 60px;"></td>
        <td style="width: 80px;"></td>
        <td style="min-width: 120px;"></td>
      </tr>
    </table>
  </div>
</div>
