<app-side-panel-base
  [title]="panelTitle"
  [width]="'745px'"
  [footerButtons]="footerButtons"
  (closePanel)="onClose()"
  (buttonClick)="onButtonClick($event)">

  <ng-container panelTabs>
    <app-dialog-tabs
      [tabs]="tabs"
      [activeTab]="activeTab"
      (tabChange)="onTabChange($event)">
    </app-dialog-tabs>
  </ng-container>

  <ng-container panelContent>
    <!-- Scheduled Tab -->
    @if (activeTab === 'scheduled') {
      <div class="table-wrapper">
        <app-data-table
          [config]="scheduledTableConfig"
          [data]="scheduledData"
          [loading]="isLoading">
        </app-data-table>
      </div>
    }

    <!-- Actual Tab -->
    @if (activeTab === 'actual') {
      <div class="table-wrapper">
        <app-data-table
          [config]="actualTableConfig"
          [data]="actualData"
          [loading]="isLoading">
        </app-data-table>
      </div>
    }
  </ng-container>

</app-side-panel-base>
