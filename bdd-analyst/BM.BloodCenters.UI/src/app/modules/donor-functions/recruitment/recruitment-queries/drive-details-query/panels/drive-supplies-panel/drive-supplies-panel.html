<app-side-panel-base
  [title]="panelTitle"
  [width]="'745px'"
  [footerButtons]="footerButtons"
  (closePanel)="onClose()"
  (buttonClick)="onButtonClick($event)">

  <ng-container panelHeaderFields>
    <app-dialog-header-fields [fields]="headerFields"></app-dialog-header-fields>
  </ng-container>

  <ng-container panelTabs>
    <app-dialog-tabs
      [tabs]="tabs"
      [activeTab]="activeTab"
      (tabChange)="onTabChange($event)">
    </app-dialog-tabs>
  </ng-container>

  <ng-container panelContent>
    <!-- Campaign Items Tab -->
    @if (activeTab === 'campaign') {
      <div class="table-wrapper">
        <app-data-table
          [config]="campaignTableConfig"
          [data]="campaignData"
          [loading]="isLoading">
        </app-data-table>
      </div>
    }

    <!-- Bags Tab -->
    @if (activeTab === 'bags') {
      <div class="table-wrapper">
        <app-data-table
          [config]="bagsTableConfig"
          [data]="bagsData"
          [loading]="isLoading">
        </app-data-table>
      </div>
    }
  </ng-container>

</app-side-panel-base>
