<app-side-panel-base
  [title]="panelTitle"
  [width]="'745px'"
  [footerButtons]="footerButtons"
  (closePanel)="onClose()"
  (buttonClick)="onButtonClick($event)">

  <ng-container panelContent>
    <div class="table-wrapper">
      <app-data-table
        [config]="tableConfig"
        [data]="pickupData"
        [loading]="isLoading">
      </app-data-table>
    </div>
  </ng-container>

</app-side-panel-base>
