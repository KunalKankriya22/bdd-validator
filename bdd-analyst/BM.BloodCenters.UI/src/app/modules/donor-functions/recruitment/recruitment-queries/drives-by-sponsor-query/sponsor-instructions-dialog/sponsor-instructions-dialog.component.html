<div class="sponsor-instructions-dialog">
  <div class="dialog-header">
    <h2 class="dialog-title">Sponsor Instructions</h2>
    <button mat-icon-button class="close-icon-button" (click)="onClose()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <app-data-table
      [config]="tableConfig"
      [data]="instructions()"
      [loading]="false"
      aria-label="Sponsor instructions table">
    </app-data-table>
  </div>

  <div class="dialog-footer">
    <button mat-raised-button class="close-button" (click)="onClose()">CLOSE</button>
  </div>
</div>
