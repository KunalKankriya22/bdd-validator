<div class="describe-criteria-dialog">
  <div class="dialog-header">
    <h2 class="dialog-title">Search Criteria</h2>
  </div>

  <div class="dialog-content">
    <p class="criteria-description">
      Retrieve Drive Date, Drive ID, Piggyback Status, Sponsor name, Travel Time, Duration, Drive Status, Recruiter, Projected Show, Projected Draw for following criteria.
    </p>
    <ul class="criteria-list">
      <li *ngFor="let criterion of data.criteriaList">{{ criterion }}</li>
    </ul>
  </div>

  <div class="dialog-actions">
    <button mat-raised-button color="primary" (click)="close()">
      CLOSE
    </button>
  </div>
</div>
