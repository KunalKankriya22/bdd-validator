<div class="dialog-header" mat-dialog-title>
  <span class="dialog-title">Consent</span>
  <button mat-icon-button class="close-btn" [attr.aria-label]="'Close dialog'" (click)="onClose()">
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-body">
  <!-- Loading State -->
  @if (loading()) {
    <div class="loading-container" role="status" aria-live="polite">
      <mat-spinner diameter="40"></mat-spinner>
      <span class="loading-text">Loading consent details...</span>
    </div>
  }

  <!-- Error State -->
  @if (error() && !loading()) {
    <div class="error-container" role="alert">
      <mat-icon class="error-icon" aria-hidden="true">error</mat-icon>
      <p class="error-message">{{ error() }}</p>
      <button mat-raised-button color="primary" (click)="onRetry()">Retry</button>
    </div>
  }

  <!-- Consent Content -->
  @if (consentDetail() && !loading() && !error()) {
    <div class="consent-content">
      <pre class="letter-text">{{ consentDetail()!.letterContent }}</pre>

      <div class="signatures-section">
        <div class="signature-block">
          <span class="signature-label">Donor Signature:</span>
          <div class="signature-image-wrapper">
            @if (donorSignatureUrl()) {
              <img [src]="donorSignatureUrl()" alt="Donor Signature" class="signature-image" />
            }
          </div>
        </div>

        <div class="signature-block">
          <span class="signature-label">Witness Signature:</span>
          <div class="signature-image-wrapper">
            @if (witnessSignatureUrl()) {
              <img [src]="witnessSignatureUrl()" alt="Witness Signature" class="signature-image" />
            }
          </div>
        </div>
      </div>
    </div>
  }
</mat-dialog-content>

<div class="dialog-footer">
  <div class="dialog-footer-actions">
    <button mat-button class="close-action-btn" (click)="onClose()">CLOSE</button>
  </div>
</div>
