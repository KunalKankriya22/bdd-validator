<app-side-panel-base
  [title]="'Comment'"
  [width]="'500px'"
  [footerButtons]="footerButtons"
  (closePanel)="onClose()"
  (buttonClick)="onButtonClick($event)">

  <ng-container panelContent>
    <form [formGroup]="commentForm" class="comment-form">
      <mat-form-field appearance="fill" class="comment-field">
        <mat-label>Comment</mat-label>
        <textarea
          matInput
          formControlName="comments"
          rows="4"
          maxlength="240"
          placeholder="Enter comment...">
        </textarea>
        <mat-hint align="end">{{ getCharactersRemaining() }}</mat-hint>
        @if (commentForm.get('comments')?.hasError('maxlength')) {
          <mat-error>Cannot exceed 240 characters</mat-error>
        }
      </mat-form-field>
    </form>
  </ng-container>
</app-side-panel-base>
