<app-page-header-with-breadcrumb [config]="headerConfig" />

<section class="audit-drawer-container">
  <h1 class="cdk-visually-hidden">Donation/Deferral Audit Drawer</h1>
  <section class="search-bar" [formGroup]="searchForm">
    <mat-form-field appearance="fill" class="transaction-id-field">
      <mat-label>Transaction ID</mat-label>
      <input
        matInput
        type="text"
        formControlName="transactionId"
        placeholder="Enter Transaction ID"
        [attr.aria-invalid]="f['transactionId'].invalid && f['transactionId'].touched">
      @if (f['transactionId'].invalid && f['transactionId'].touched) {
        <mat-error>Transaction ID is required</mat-error>
      }
    </mat-form-field>

    <button
      mat-stroked-button
      color="primary"
      type="button"
      (click)="openDrawer()"
      class="retrieve-button"
      [attr.aria-label]="'View Audit Details'">
      VIEW DETAILS
    </button>
  </section>
</section>
