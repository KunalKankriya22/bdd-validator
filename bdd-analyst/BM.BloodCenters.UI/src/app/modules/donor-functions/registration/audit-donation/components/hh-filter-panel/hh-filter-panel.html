<div class="hh-fp" cdkTrapFocus aria-modal="true" (keydown.escape)="onCancel()">

  <!-- Header -->
  <div class="hh-fp__header">
    <h1 class="hh-fp__title">Select Question</h1>
    <button mat-icon-button type="button" class="hh-fp__close" (click)="onCancel()" [attr.aria-label]="'Close filter panel'">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <!-- Search Bar -->
  <div class="hh-fp__search-wrap">
    <app-search-bar
      [config]="searchConfig"
      [searchText]="searchTerm"
      (searchTextChange)="onSearch($event)"
      (search)="onSearch($event)"
      (cleared)="onSearch('')">
    </app-search-bar>
  </div>

  <!-- Data Table -->
  <div class="hh-fp__table-wrap">
    <app-data-table
      [config]="tableConfig"
      [data]="filteredQuestions()"
      [loading]="false"
      (selectionChange)="onSelectionChange($event)">
    </app-data-table>
  </div>

  <!-- Footer (always visible) -->
  <div class="hh-fp__footer">
    <span class="hh-fp__count">{{ selectedCodes.size }} of {{ questions.length }} selected</span>
    <div class="hh-fp__footer-actions">
      <button mat-stroked-button type="button" (click)="onCancel()">CANCEL</button>
      <button mat-raised-button color="primary" type="button" (click)="onApply()">APPLY</button>
    </div>
  </div>

</div>
