<div class="filter-panel" role="dialog" aria-labelledby="filter-panel-title">
  <div class="filter-panel-header">
    <h2 id="filter-panel-title" class="filter-panel-title">Filters</h2>
    <button
      mat-icon-button
      (click)="onClose()"
      aria-label="Close filter panel"
      class="close-button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="filterForm" class="filter-panel-content">
    <!-- Response Code Filter -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Response Code</mat-label>
      <mat-select
        formControlName="responseCode"
        placeholder="Select Response Code">
        <mat-option value="Y">Yes</mat-option>
        <mat-option value="N">No</mat-option>
        <mat-option value="U">Unknown</mat-option>
      </mat-select>
    </mat-form-field>
  </form>

  <div class="filter-panel-actions">
    <button
      mat-stroked-button
      type="button"
      (click)="onClear()"
      aria-label="Clear all filters">
      CLEAR ALL
    </button>
    <button
      mat-flat-button
      color="accent"
      type="button"
      (click)="onApply()"
      [disabled]="!filterForm.get('responseCode')?.value"
      aria-label="Apply filters">
      APPLY
    </button>
  </div>
</div>
