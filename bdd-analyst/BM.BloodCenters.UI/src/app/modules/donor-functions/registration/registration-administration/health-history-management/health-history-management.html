<main class="health-history-management" aria-label="Health History Management" role="main">
  <app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>

  <mat-tab-group
    class="hh-tab-group"
    [selectedIndex]="selectedTabIndex"
    (selectedIndexChange)="onTabChange($event)"
    animationDuration="0ms">
    <mat-tab label="HH Questions">
      <app-hh-questions-tab></app-hh-questions-tab>
    </mat-tab>
    <mat-tab label="HH Responses">
      <app-hh-responses-tab [active]="selectedTabIndex === 1"></app-hh-responses-tab>
    </mat-tab>
    <mat-tab label="HH Templates">
      <app-hh-templates-tab></app-hh-templates-tab>
    </mat-tab>
  </mat-tab-group>
</main>
