<div class="hh-responses-tab">
  <!-- Search Bar -->
  <div class="search-bar-container">
    <form [formGroup]="searchForm" class="search-form">
      <mat-form-field appearance="fill" class="question-code-field">
        <mat-label>Question Code <span class="required-marker">*</span></mat-label>
        <mat-select formControlName="questionCode"
                    (openedChange)="onSelectOpenedChange(questionCodeSearchCtrl, $event)">
          <mat-option>
            <ngx-mat-select-search [formControl]="questionCodeSearchCtrl"
                                   placeholderLabel="Search..."
                                   noEntriesFoundLabel="No results found">
            </ngx-mat-select-search>
          </mat-option>
          @for (opt of filteredQuestionCodes(); track opt.code) {
            <mat-option [value]="opt.code">{{ opt.code }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="search-for-field">
        <mat-label>Search For</mat-label>
        <input matInput formControlName="searchFor" placeholder="Search For">
      </mat-form-field>

      <button mat-stroked-button color="accent" type="button" (click)="onRetrieve()"
              class="retrieve-btn" aria-label="Retrieve responses"
              [disabled]="!searchForm.get('questionCode')?.value">
        RETRIEVE
      </button>
    </form>
  </div>

  @if (hasRetrieved) {
    <!-- Question Description -->
    <div class="question-info">
      <div class="question-label">Question</div>
      <div class="question-text">{{ selectedQuestionDescription }}</div>
      <button mat-stroked-button color="accent" (click)="onAddNew()" class="add-response-btn"
              aria-label="Add new response">
        <mat-icon>add</mat-icon> ADD NEW RESPONSE
      </button>
    </div>
  }

  <!-- Data Table -->
  <div class="table-container">
    <app-data-table
      [config]="tableConfig"
      [data]="dataSource"
      [loading]="isLoading"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (rowAction)="onRowAction($event)">
    </app-data-table>
  </div>

  <!-- Side Panel -->
  @if (sidePanelOpen) {
    <div class="side-panel-overlay" (click)="closeSidePanel()"></div>
    <div class="side-panel-container">
      <app-add-edit-response
        [mode]="sidePanelMode"
        [data]="sidePanelData"
        [questionCode]="searchForm.get('questionCode')?.value || ''"
        [questionDescription]="selectedQuestionDescription"
        (save)="onSaveSuccess($event)"
        (close)="closeSidePanel()">
      </app-add-edit-response>
    </div>
  }
</div>
