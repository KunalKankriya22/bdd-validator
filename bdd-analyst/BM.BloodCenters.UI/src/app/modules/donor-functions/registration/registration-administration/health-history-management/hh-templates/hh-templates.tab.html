<ng-template #statusCellTemplate let-row>
  <span [ngClass]="getStatusClass(row.status)" class="status-badge">
    <mat-icon aria-hidden="true">{{ getStatusIcon(row.status) }}</mat-icon>
    {{ row.status }}
  </span>
</ng-template>

<div class="hh-templates-tab" #headerCard>
  <!-- Header Bar -->
  <div class="templates-header">
    <h2 class="header-title">All Health History Templates</h2>
    <button mat-flat-button color="accent" (click)="onAddNew()" class="add-template-btn"
            aria-label="Add new template">
      <mat-icon>add</mat-icon> ADD NEW TEMPLATE
    </button>
  </div>

  <!-- Filter & Search Row -->
  <div class="filter-search-row">
    <div class="filter-search-row__left">
      <button mat-button (click)="openFilter()" class="filter-button" #filterButton
              [class.filter-button--active]="isFilterOpen || hasActiveFilters()"
              [attr.aria-expanded]="isFilterOpen"
              aria-label="Filter templates">
        <span class="filter-icon" aria-hidden="true"></span>
        FILTER
      </button>

      <app-filter-chips
        *ngIf="hasActiveFilters()"
        [chips]="filterChips"
        [maxVisible]="3"
        (removeChip)="onRemoveFilterChip($event)"
        (clearAll)="clearAllFilters()">
      </app-filter-chips>
    </div>

    <app-search-bar [config]="searchConfig" (search)="onSearch($event)" />
  </div>

  <!-- Data Table -->
  <div class="table-container">
    <app-data-table
      [config]="tableConfig"
      [data]="dataSource"
      [loading]="isLoading"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (rowAction)="onRowAction($event)">
    </app-data-table>
  </div>
</div>
