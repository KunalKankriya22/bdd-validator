<div class="detail-dialog" role="dialog" aria-labelledby="detail-dialog-title">
  <div class="detail-dialog__header">
    <h2 id="detail-dialog-title" mat-dialog-title>
      Unit ID: {{ data.displayIdValue || data.idValue || '-' }}
    </h2>
    <button mat-icon-button (click)="onClose()" aria-label="Close dialog">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <div class="detail-dialog__fields">
      <div class="detail-dialog__field">
        <span class="detail-dialog__label">Collection Date:</span>
        <span class="detail-dialog__value">{{ formatDate(data.collDate) }}</span>
      </div>
      <div class="detail-dialog__field">
        <span class="detail-dialog__label">Donor ID:</span>
        <span class="detail-dialog__value">{{ data.donorId || '-' }}</span>
      </div>
      <div class="detail-dialog__field">
        <span class="detail-dialog__label">Drive ID:</span>
        <span class="detail-dialog__value">{{ data.driveId || '-' }}</span>
      </div>
      <div class="detail-dialog__field">
        <span class="detail-dialog__label">Status:</span>
        <span class="detail-dialog__value" [class.status-hold]="data.status === 'HOLD'">
          {{ data.status || '-' }}
        </span>
      </div>
    </div>

    @if (data.reason) {
      <div class="detail-dialog__reason">
        <h3 class="detail-dialog__reason-title">Reason:</h3>
        <p class="detail-dialog__reason-text">{{ data.reason }}</p>
      </div>
    }
  </mat-dialog-content>
</div>
