<div class="dialog-header">
  <h2 mat-dialog-title>Manual/Automatic Holds</h2>
  <button mat-icon-button mat-dialog-close aria-label="Close dialog" class="close-button" tabindex="-1">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <div class="search-row">
    <mat-form-field appearance="fill" class="search-input">
      <mat-select [formControl]="searchControl" placeholder="Find%">
        <mat-option value="">Find%</mat-option>
        @for (code of allCodes(); track code.interCode) {
          <mat-option [value]="code.interCode">{{ code.interCode }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="filteredCodes()" class="holds-table">
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let row">{{ row.interCode }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let row">{{ row.interDesc ?? '--' }}</td>
      </ng-container>

      <ng-container matColumnDef="interType">
        <th mat-header-cell *matHeaderCellDef>Inter Type</th>
        <td mat-cell *matCellDef="let row">{{ row.interType ?? '--' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          [class.selected]="isSelected(row)"
          (click)="toggleRow(row)"></tr>
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button type="button" (click)="onCancel()" class="cancel-button">CANCEL</button>
  <button mat-stroked-button type="button" (click)="onFind()" class="find-button">FIND</button>
  <button mat-raised-button type="button" (click)="onOk()" class="ok-button">OK</button>
</mat-dialog-actions>
