<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-header">
    <h2 id="filter-title" class="filter-title">
      Filters
    </h2>

    <button
      mat-icon-button
      type="button"
      class="close-button"
      [attr.aria-label]="'Close filter panel'"
      (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-content">

    <!-- Holds Filter -->
    <mat-form-field appearance="fill" class="filter-field">
      <mat-label>Holds</mat-label>
      <mat-select formControlName="holds">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="holdSearchControl"
            placeholderLabel="Search holds..."
            noEntriesFoundLabel="No matching holds">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredHoldOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Entry Date Section -->
    <div class="date-filter-group" role="group" [attr.aria-label]="'Entry date filter'">
      <div class="period-wrapper">
        <mat-form-field appearance="fill" class="period-field"
          [class.period-field--error]="entryDatePeriodError">
          <mat-label>
            Period
          </mat-label>
          <mat-select formControlName="entryDatePeriod"
            [attr.aria-label]="'Entry date period'"
            [attr.aria-invalid]="entryDatePeriodError ? true : null"
            [attr.aria-describedby]="entryDatePeriodError ? 'entry-period-error' : null">
            <mat-option *ngFor="let option of periodOptions" [value]="option.value">
              {{ option.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <div id="entry-period-error" class="filter-error" role="alert" *ngIf="entryDatePeriodError">
          {{ entryDatePeriodError }}
        </div>
      </div>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Entry Date</mat-label>
        <input
          matInput
          #entryDateInput
          [matDatepicker]="entryDatePicker"
          formControlName="entryDate"
          [errorStateMatcher]="entryDateErrorMatcher"
          (input)="onEntryDateInput($event)"
          (blur)="onEntryDateBlur()"
          (keydown.enter)="$event.target.blur()"
          autocomplete="off"
        />
        <mat-datepicker-toggle matSuffix [for]="entryDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #entryDatePicker></mat-datepicker>
        <mat-error *ngIf="getEntryDateError()">
          {{ getEntryDateError() }}
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Termination Date Section -->
    <div class="date-filter-group" role="group" [attr.aria-label]="'Termination date filter'">
      <div class="period-wrapper">
        <mat-form-field appearance="fill" class="period-field"
          [class.period-field--error]="terminationDatePeriodError">
          <mat-label>
            Period
          </mat-label>
          <mat-select formControlName="terminationDatePeriod"
            [attr.aria-label]="'Termination date period'"
            [attr.aria-invalid]="terminationDatePeriodError ? true : null"
            [attr.aria-describedby]="terminationDatePeriodError ? 'term-period-error' : null">
            <mat-option *ngFor="let option of periodOptions" [value]="option.value">
              {{ option.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <div id="term-period-error" class="filter-error" role="alert" *ngIf="terminationDatePeriodError">
          {{ terminationDatePeriodError }}
        </div>
      </div>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Termination Date</mat-label>
        <input
          matInput
          #terminationDateInput
          [matDatepicker]="terminationDatePicker"
          formControlName="terminationDate"
          [min]="minTerminationDate"
          [errorStateMatcher]="terminationDateErrorMatcher"
          (input)="onTerminationDateInput($event)"
          (blur)="onTerminationDateBlur()"
          (keydown.enter)="$event.target.blur()"
          autocomplete="off"
        />
        <mat-datepicker-toggle matSuffix [for]="terminationDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #terminationDatePicker></mat-datepicker>
        <mat-error *ngIf="getTerminationDateError()">
          {{ getTerminationDateError() }}
        </mat-error>
      </mat-form-field>
    </div>

  </form>

  <!-- Footer -->
  <footer class="filter-footer">
    <button
      mat-stroked-button
      type="button"
      class="clear-button"
      (click)="onClear()">
      CLEAR ALL
    </button>

    <button
      mat-raised-button
      color="primary"
      type="button"
      class="apply-button"
      [disabled]="isApplyDisabled"
      (click)="onApply()">
      APPLY
    </button>
  </footer>

</section>
