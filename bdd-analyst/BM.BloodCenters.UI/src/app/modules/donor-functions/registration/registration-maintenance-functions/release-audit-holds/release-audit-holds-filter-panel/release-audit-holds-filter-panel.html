<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <mat-form-field appearance="fill">
      <mat-label>Donation Type</mat-label>
      <mat-select formControlName="donationType">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="donationTypeSearchControl"
            placeholderLabel="Search donation types..."
            noEntriesFoundLabel="No matching types"></ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredDonationTypeOptions" [value]="option.value">
          {{ option.value }} - {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Donation Procedure</mat-label>
      <mat-select formControlName="donationProcedure">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="donationProcedureSearchControl"
            placeholderLabel="Search donation procedures..."
            noEntriesFoundLabel="No matching procedures"></ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredDonationProcedureOptions" [value]="option.value">
          {{ option.value }} - {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Audit Hold Type</mat-label>
      <mat-select formControlName="auditHoldType">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="auditHoldTypeSearchControl"
            placeholderLabel="Search audit hold types..."
            noEntriesFoundLabel="No matching hold types"></ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredAuditHoldTypeOptions" [value]="option.value">
          {{ option.value }} - {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Collection Date</mat-label>
      <input matInput
             [matDatepicker]="picker"
             formControlName="collectionDate"
             #collectionDateInput
             [errorStateMatcher]="collectionDateErrorMatcher"
             (input)="onCollectionDateInput($event)"
             (blur)="onDateInputBlur()"
             (keydown.enter)="$event.target.blur()">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="getCollectionDateError()">
        {{ getCollectionDateError() }}
      </mat-error>
    </mat-form-field>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
