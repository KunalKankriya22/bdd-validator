<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<mat-drawer-container class="release-audit-holds-container" autosize>
  <mat-drawer-content>
    <!-- Main Content Area -->
    <main class="release-audit-holds"
          aria-label="Release Audit Holds content"
          role="main">

  <!-- Page Header with Breadcrumb -->
  <app-page-header-with-breadcrumb [config]="headerConfig" />

  <!-- Custom Template for Removed Column -->
  <ng-template #removedCellTemplate let-row>
    <mat-icon *ngIf="row.removed" class="removed-icon" aria-label="Hold removed">close</mat-icon>
  </ng-template>

  <!-- Search Criteria Card -->
  <div class="release-audit-holds__search-card">
    <form [formGroup]="searchForm" class="search-criteria">
      <div class="search-criteria__row">
        <mat-form-field appearance="fill" class="search-criteria__field">
          <mat-label>From Collection Date</mat-label>
          <input matInput
                 [matDatepicker]="fromDatePicker"
                 formControlName="fromCollectionDate"
                 #fromDateInput
                 [errorStateMatcher]="fromDateErrorMatcher"
                 (blur)="onDateInputBlur('fromCollectionDate')"
                 (keydown.enter)="$event.target.blur()"
                 required>
          <mat-datepicker-toggle matSuffix [for]="fromDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #fromDatePicker></mat-datepicker>
          <mat-error *ngIf="getFromDateError()">
            {{ getFromDateError() }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="search-criteria__field">
          <mat-label>To Collection Date</mat-label>
          <input matInput
                 [matDatepicker]="toDatePicker"
                 [min]="minToDate"
                 formControlName="toCollectionDate"
                 #toDateInput
                 [errorStateMatcher]="toDateErrorMatcher"
                 (blur)="onDateInputBlur('toCollectionDate')"
                 (keydown.enter)="$event.target.blur()"
                 required>
          <mat-datepicker-toggle matSuffix [for]="toDatePicker"></mat-datepicker-toggle>
          <mat-datepicker #toDatePicker></mat-datepicker>
          <mat-error *ngIf="getToDateError()">
            {{ getToDateError() }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="search-criteria__field">
          <mat-label>Enter Unit ID</mat-label>
          <input matInput
                 formControlName="unitId"
                 placeholder="Enter unit ID"
                 maxlength="50">
        </mat-form-field>

        <button type="button"
                mat-raised-button
                color="primary"
                class="retrieve-button"
                (click)="onRetrieve()"
                [disabled]="!searchForm.valid || isLoading">
          RETRIEVE
        </button>
      </div>
    </form>
  </div>

  <!-- Table Card Container -->
  <div class="release-audit-holds__card" #tableCard>

    <!-- Table Controls with Inline Filter Chips - Only show after search -->
    <div class="release-audit-holds__controls" *ngIf="hasSearched && !hasError">
      <!-- Left section: Filter text and chips -->
      <div class="release-audit-holds__controls-left">
        <!-- FILTER (LEFT) -->
        <button
          #filterBtn
          type="button"
          mat-button
          class="filter-button"
          [class.filter-button--active]="isFilterOpen"
          aria-label="Open filter options"
          (click)="openFilter()">
          <mat-icon aria-hidden="true">filter_list</mat-icon>
          FILTER
        </button>

        <!-- Inline Filter Chips -->
        <app-filter-chips
          *ngIf="hasActiveFilters()"
          [chips]="filterChips"
          [maxVisible]="3"
          (removeChip)="onRemoveFilterChip($event)"
          (clearAll)="clearAllFilters()">
        </app-filter-chips>
      </div>

      <!-- Right section: Search by Donor ID or Name -->
      <div class="release-audit-holds__controls-right">
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)"
          (cleared)="onSearchCleared()">
        </app-search-bar>
      </div>
    </div>

    <!-- No Search State -->
    <div
      *ngIf="!hasSearched && !isLoading"
      class="release-audit-holds__no-search"
      role="status"
      aria-label="No search criteria selected">
      <mat-icon class="search-icon" aria-hidden="true">search</mat-icon>
      <p class="no-search-message">No Search Criteria Selected</p>
      <p class="no-search-submessage">Select a date range or enter a Unit ID then click retrieve to view audit holds.</p>
    </div>

    <!-- Error State -->
    <div
      *ngIf="hasError && !isLoading"
      class="release-audit-holds__error"
      role="alert"
      aria-label="Error loading data">
      <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
      <p class="error-message">{{ errorMessage }}</p>
      <button type="button" mat-raised-button color="primary" (click)="onRetrieve()">
        Retry
      </button>
    </div>

    <!-- Data Table -->
    <div class="release-audit-holds__table-wrapper" *ngIf="hasSearched && !hasError">
      <app-data-table
        [config]="tableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)" />
    </div>
  </div>
    </main>
  </mat-drawer-content>

  <!-- Side Panels -->
  <mat-drawer #sidePanel mode="over" position="end" [opened]="activeSidePanel !== null" [disableClose]="true"
    [attr.aria-label]="activeSidePanel === 'remove-ok' ? 'Remove hold with OK panel' : activeSidePanel === 'remove-nft' ? 'Remove hold with NFT panel' : activeSidePanel === 'hold-details' ? 'Hold details panel' : null">
    <!-- Remove Hold with OK Panel -->
    <app-remove-hold-panel
      *ngIf="activeSidePanel === 'remove-ok' && selectedRecord"
      [record]="selectedRecord"
      [mode]="'ok'"
      [isSubmitting]="isSubmittingRemoveHold"
      (closePanel)="closeSidePanel()"
      (submit)="onRemoveHoldSubmit($event)">
    </app-remove-hold-panel>

    <!-- Remove Hold with NFT Panel -->
    <app-remove-hold-panel
      *ngIf="activeSidePanel === 'remove-nft' && selectedRecord"
      [record]="selectedRecord"
      [mode]="'nft'"
      [isSubmitting]="isSubmittingRemoveHold"
      (closePanel)="closeSidePanel()"
      (submit)="onRemoveHoldSubmit($event)">
    </app-remove-hold-panel>

    <!-- Hold Details Panel -->
    <app-hold-details-panel
      *ngIf="activeSidePanel === 'hold-details' && selectedRecord"
      [record]="selectedRecord"
      (closePanel)="closeSidePanel()">
    </app-hold-details-panel>
  </mat-drawer>
</mat-drawer-container>
