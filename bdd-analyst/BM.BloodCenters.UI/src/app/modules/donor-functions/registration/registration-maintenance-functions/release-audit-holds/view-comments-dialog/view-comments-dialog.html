<div class="view-comments-dialog">
  <div class="dialog-header">
    <h2 mat-dialog-title class="dialog-title">Hold Reason</h2>
    <button
      mat-icon-button
      class="close-button"
      (click)="onClose()"
      aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading-container" role="status" aria-live="polite">
      <mat-spinner diameter="32" aria-label="Loading comments"></mat-spinner>
    </div>

    <!-- Error State -->
    <div *ngIf="hasError" class="error-container" role="alert">
      <mat-icon aria-hidden="true">error_outline</mat-icon>
      <p>{{ errorMessage }}</p>
    </div>

    <!-- Comments Content -->
    <div *ngIf="!isLoading && !hasError" class="comments-content">
      <p>{{ comments }}</p>
    </div>
  </div>

  <div class="dialog-footer">
    <button
      mat-flat-button
      color="primary"
      class="close-button-primary"
      (click)="onClose()">
      CLOSE
    </button>
  </div>
</div>
