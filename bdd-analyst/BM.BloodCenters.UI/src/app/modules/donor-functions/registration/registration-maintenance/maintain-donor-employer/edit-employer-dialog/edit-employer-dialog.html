<div class="edit-employer-dialog">
  <div class="dialog-header">
    <h2 class="dialog-title">Edit Employer Details</h2>
    <button
      mat-icon-button
      class="close-btn"
      (click)="onCancel()"
      [attr.aria-label]="'Close dialog'">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <!-- Read-only Fields -->
    <div class="readonly-fields">
      <div class="readonly-field">
        <span class="field-label">Employer</span>
        <span class="field-value">{{ employer?.employerId || '-' }}</span>
      </div>

      <div class="readonly-field">
        <span class="field-label">Name</span>
        <span class="field-value">{{ employer?.employerName || '-' }}</span>
      </div>

      <div class="readonly-field">
        <span class="field-label">Address</span>
        <span class="field-value">{{ displayAddress }}</span>
      </div>
    </div>

    <!-- Editable Form -->
    <form [formGroup]="form" class="edit-form">
      <div class="date-fields">
        <!-- Effective Date - Editable if >= current date -->
        <mat-form-field *ngIf="isEffectiveDateEditable" appearance="fill" class="date-field" [class.has-error]="getEffectiveDateError()">
          <mat-label>Effective Date</mat-label>
          <input
            matInput
            [matDatepicker]="effDatePicker"
            formControlName="effDate"
            [min]="minDate"
            [errorStateMatcher]="effDateErrorMatcher"
            (input)="onEffectiveDateInput($event)"
            (dateChange)="onEffectiveDateChange()"
            placeholder="DD-MMM-YYYY"
            aria-required="true">
          <mat-datepicker-toggle matIconSuffix [for]="effDatePicker" [attr.aria-label]="'Open effective date calendar'"></mat-datepicker-toggle>
          <mat-datepicker #effDatePicker [startAt]="minDate"></mat-datepicker>
          <mat-error *ngIf="getEffectiveDateError()">{{ getEffectiveDateError() }}</mat-error>
        </mat-form-field>

        <div *ngIf="!isEffectiveDateEditable" class="field-display-card">
          <div class="field-label">Effective Date</div>
          <div class="field-value">{{ editModeValues.effectiveDate || '-' }}</div>
        </div>

        <!-- Termination Date -->
        <mat-form-field appearance="fill" class="date-field" [class.has-error]="getTerminationDateError()">
          <mat-label>Termination Date</mat-label>
          <input
            matInput
            [matDatepicker]="termDatePicker"
            formControlName="termDate"
            [min]="terminationMinDate"
            [errorStateMatcher]="termDateErrorMatcher"
            (input)="onTerminationDateInput($event)"
            (dateChange)="onTerminationDateChange()"
            placeholder="DD-MMM-YYYY">
          <mat-datepicker-toggle matIconSuffix [for]="termDatePicker" [attr.aria-label]="'Open termination date calendar'"></mat-datepicker-toggle>
          <mat-datepicker #termDatePicker [startAt]="terminationMinDate"></mat-datepicker>
          <mat-error *ngIf="getTerminationDateError()">{{ getTerminationDateError() }}</mat-error>
        </mat-form-field>
      </div>
    </form>
  </div>

  <div class="dialog-actions">
    <button
      mat-button
      type="button"
      (click)="onCancel()"
      [disabled]="isSaving">
      CANCEL
    </button>
    <button
      mat-flat-button
      color="accent"
      type="submit"
      (click)="onSubmit()"
      [disabled]="!isFormValid || isSaving">
      @if (isSaving) {
        Saving...
      } @else {
        SAVE
      }
    </button>
  </div>
</div>
