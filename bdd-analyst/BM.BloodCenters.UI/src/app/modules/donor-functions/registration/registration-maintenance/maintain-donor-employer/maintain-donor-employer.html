<ng-template #statusCellTemplate let-row>
  <span [ngClass]="getStatusClass(row.status)" class="status-badge">
    <mat-icon aria-hidden="true">{{ row.status === 'Active' ? 'check_circle' : 'cancel' }}</mat-icon>
    {{ row.status }}
  </span>
</ng-template>

<div class="layout-wrapper">
  <main class="maintain-donor-employer main-content" aria-label="Maintain Donor Employer content" role="main">
    <app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>

    <div class="main-content-wrapper">
      <div class="maintain-donor-employer__card">
        <!-- Action Bar -->
        <div class="maintain-donor-employer__action-bar">
          <div class="search-controls">
            <mat-form-field appearance="fill" class="search-option-field">
              <mat-label>Option</mat-label>
              <mat-select [(ngModel)]="selectedSearchOption">
                @for (option of searchOptions; track option.value) {
                  <mat-option [value]="option.value">{{ option.label }}</mat-option>
                }
              </mat-select>
            </mat-form-field>

            <mat-form-field appearance="fill" class="search-text-field">
              <mat-label>Search</mat-label>
              <mat-icon matPrefix aria-hidden="true">search</mat-icon>
              <input
                matInput
                [formControl]="employerSearchControl"
                placeholder="Search by ..."
                autocomplete="off" />
              @if (employerSearchControl.value) {
                <button matSuffix mat-icon-button [attr.aria-label]="'Clear search'" (click)="employerSearchControl.setValue('')">
                  <mat-icon aria-hidden="true">close</mat-icon>
                </button>
              }
            </mat-form-field>

            <button
              mat-raised-button
              type="button"
              class="btn-retrieve"
              [disabled]="isRetrieveDisabled"
              (click)="onRetrieve()"
              [attr.aria-label]="'Retrieve search results'">
              RETRIEVE
            </button>
          </div>

          <button
            mat-flat-button
            color="accent"
            class="add-new-btn"
            (click)="addNewEmployer()"
            [attr.aria-label]="'Add new employer'">
            <mat-icon aria-hidden="true">add</mat-icon>
            ADD NEW EMPLOYER
          </button>
        </div>

        <!-- Data Table -->
        <div class="maintain-donor-employer__table-wrapper">
          <app-data-table
            [config]="tableConfig"
            [data]="dataSource"
            [loading]="isLoading"
            (sortChange)="onSortChange($event)"
            (pageChange)="onPageChange($event)"
            (rowAction)="onRowAction($event)">
          </app-data-table>
        </div>
      </div>
    </div>
  </main>

  <!-- Side Panel -->
  @if (sidePanelOpen) {
    <div class="side-panel-overlay" (click)="closeSidePanel()" aria-hidden="true"></div>
    <div class="side-panel-container" role="dialog" aria-modal="true" [attr.aria-label]="sidePanelMode === 'add' ? 'Add New Employer' : 'Edit Employer Details'">
      @if (sidePanelMode === 'add') {
        <app-add-employer-dialog
          (save)="onSaveSuccess($event)"
          (close)="closeSidePanel()">
        </app-add-employer-dialog>
      } @else {
        <app-edit-employer-dialog
          [employer]="employerToEdit"
          (save)="onSaveSuccess($event)"
          (close)="closeSidePanel()">
        </app-edit-employer-dialog>
      }
    </div>
  }
</div>
