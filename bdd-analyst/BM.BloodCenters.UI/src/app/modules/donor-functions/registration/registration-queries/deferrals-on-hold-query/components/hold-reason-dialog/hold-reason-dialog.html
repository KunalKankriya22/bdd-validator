<div class="hold-reason-dialog">
  <div class="hold-reason-dialog__header">
    <h2 class="hold-reason-dialog__title">Donor Holds & Automatic/Manual Holds</h2>
    <button mat-icon-button class="hold-reason-dialog__close" (click)="onClose()" [attr.aria-label]="'Close dialog'">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <div class="hold-reason-dialog__content" *ngIf="!isLoading && !errorMessage">
    <!-- Section 1: Manual/Automatic Holds -->
    <div class="hold-reason-dialog__section">
      <div class="hold-reason-dialog__section-header">
        <span class="hold-reason-dialog__section-label">Manual/Automatic Holds</span>
        <div class="hold-reason-dialog__fields">
          <div class="hold-reason-dialog__field">
            <label class="hold-reason-dialog__field-label">Deferral ID</label>
            <span class="hold-reason-dialog__field-value">{{ data.deferralId }}</span>
          </div>
          <div class="hold-reason-dialog__field">
            <label class="hold-reason-dialog__field-label">Transaction ID</label>
            <span class="hold-reason-dialog__field-value">{{ data.transactionId }}</span>
          </div>
          <div class="hold-reason-dialog__field">
            <label class="hold-reason-dialog__field-label">Selection</label>
            <mat-form-field appearance="fill" class="hold-reason-dialog__select">
              <mat-label>Selection</mat-label>
              <mat-select [(value)]="donationSelectionFilter" (selectionChange)="onDonationSelectionChange()">
                <mat-option *ngFor="let opt of selectionOptions" [value]="opt.value">
                  {{ opt.label }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
      </div>

      <div class="hold-reason-dialog__table-wrapper">
        <app-data-table
          [config]="donationInterdictionsTableConfig"
          [data]="filteredDonationInterdictions"
          (sortChange)="onDonationSortChange($event)">
        </app-data-table>
      </div>

    </div>

    <!-- Section 2: Donor Holds -->
    <div class="hold-reason-dialog__section">
      <div class="hold-reason-dialog__section-header">
        <span class="hold-reason-dialog__section-label">Donor Holds</span>
        <div class="hold-reason-dialog__fields">
          <div class="hold-reason-dialog__field">
            <label class="hold-reason-dialog__field-label">Donor ID</label>
            <span class="hold-reason-dialog__field-value">{{ data.donorId }}</span>
          </div>
          <div class="hold-reason-dialog__field">
            <label class="hold-reason-dialog__field-label">Donor Name</label>
            <span class="hold-reason-dialog__field-value">{{ data.donorName || '--' }}</span>
          </div>
          <div class="hold-reason-dialog__field">
            <label class="hold-reason-dialog__field-label">Selection</label>
            <mat-form-field appearance="fill" class="hold-reason-dialog__select">
              <mat-label>Selection</mat-label>
              <mat-select [(value)]="donorSelectionFilter" (selectionChange)="onDonorSelectionChange()">
                <mat-option *ngFor="let opt of selectionOptions" [value]="opt.value">
                  {{ opt.label }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
      </div>

      <div class="hold-reason-dialog__table-wrapper">
        <app-data-table
          [config]="donorInterdictionsTableConfig"
          [data]="filteredDonorInterdictions"
          (sortChange)="onDonorSortChange($event)">
        </app-data-table>
      </div>
    </div>
  </div>

  <div class="hold-reason-dialog__error" *ngIf="!isLoading && errorMessage">
    <mat-icon aria-hidden="true">error_outline</mat-icon>
    <span>{{ errorMessage }}</span>
  </div>

  <div class="hold-reason-dialog__loading" *ngIf="isLoading" role="status" aria-live="polite">
    <mat-spinner diameter="40" [attr.aria-label]="'Loading hold reason data'"></mat-spinner>
    <span class="cdk-visually-hidden">Loading, please wait...</span>
  </div>
</div>
