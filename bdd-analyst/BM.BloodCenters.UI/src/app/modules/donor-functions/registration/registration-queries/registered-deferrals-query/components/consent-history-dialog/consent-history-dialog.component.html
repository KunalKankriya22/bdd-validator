<div class="consent-history-dialog">
  <!-- Header -->
  <div class="dialog-header">
    <h2 class="dialog-title">Consent History for Donor {{ donorId }}</h2>
    <button
      mat-icon-button
      class="close-button"
      (click)="onClose()"
      [attr.aria-label]="'Close consent history dialog'">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <!-- Loading State -->
  @if (isLoading()) {
    <div class="loading-container" role="status" aria-live="polite" aria-atomic="true">
      <mat-spinner diameter="50"></mat-spinner>
      <p class="loading-text">Loading consent history...</p>
    </div>
  }

  <!-- Error State -->
  @if (error() && !isLoading()) {
    <div class="error-container">
      <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
      <p class="error-text">{{ error() }}</p>
      <button
        mat-raised-button
        color="primary"
        (click)="retryLoad()">
        Retry
      </button>
    </div>
  }

  <!-- Content -->
  @if (!isLoading() && !error()) {
    <div class="dialog-content">
      @if (hasData()) {
        <app-data-table
          [config]="tableConfig"
          [data]="consentRecords()"
          (rowAction)="onRowAction($event)">
        </app-data-table>
      } @else {
        <div class="empty-state">
          <mat-icon class="empty-icon" aria-hidden="true">info_outline</mat-icon>
          <p class="empty-text">No consent records found for this donor</p>
        </div>
      }
    </div>
  }

  <!-- Footer -->
  <div class="dialog-footer">
    <button mat-button (click)="onClose()">Close</button>
  </div>
</div>
