<div class="link-unit-warning-dialog" role="dialog" [attr.aria-labelledby]="elementId('title')">
  <div class="dialog-content">
    <!-- Warning Icon and Title -->
    <div class="warning-header">
      <mat-icon class="warning-icon" aria-hidden="true">warning</mat-icon>
      <h2 [id]="elementId('title')" class="dialog-title">
        Warning
      </h2>
    </div>

    <!-- Warning Messages -->
    <div class="warning-messages">
      @for (warning of data.warnings; track warning.warningCode) {
        <div class="warning-message" role="alert">
          <p>
            <strong>{{ getWarningLabel(warning.warningCode) }}:</strong>
            {{ warning.message }}
          </p>
        </div>
      }
    </div>

    <!-- Confirmation Text -->
    <div class="confirmation-text">
      <p>Do you want to continue?</p>
    </div>

    <!-- Action Buttons -->
    <div class="dialog-actions" role="group" [attr.aria-label]="'Warning actions'">
      <button
        mat-button
        type="button"
        (click)="onNo()"
        [id]="elementId('no-btn')"
        class="no-button">
        No
      </button>
      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="onYes()"
        [id]="elementId('yes-btn')"
        class="yes-button">
        Yes
      </button>
    </div>
  </div>
</div>
