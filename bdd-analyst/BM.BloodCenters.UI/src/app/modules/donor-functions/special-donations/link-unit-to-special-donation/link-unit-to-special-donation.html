<!-- Status Badge Template -->
<ng-template #statusTemplate let-row>
  <span class="status-badge" [ngClass]="row.status === 'Active' ? 'status-active' : 'status-closed'">
    <mat-icon class="status-icon">{{ row.status === 'Active' ? 'notifications' : 'check_circle' }}</mat-icon>
    {{ row.status }}
  </span>
</ng-template>

<!-- Main Page Container -->
<main class="link-unit-special-donation" role="main" aria-label="Link Unit to Special Donation content">
  <!-- Page Header -->
  <app-page-header-with-breadcrumb [config]="headerConfig" />
  <!-- Card Container -->
  <div class="link-unit-special-donation__card">

    <!-- Controls (Filter + Search) -->
    <div class="link-unit-special-donation__controls">
      <div class="link-unit-special-donation__controls-left">
        <!-- Filter Button -->
        <button mat-button
                class="filter-button"
                [class.filter-button--active]="isFilterOpen"
                (click)="toggleFilter()"
                cdkOverlayOrigin
                #filterBtnOrigin="cdkOverlayOrigin"
                type="button">
          <span class="filter-icon" aria-hidden="true"></span>
          FILTER
        </button>

        <!-- Filter Chips -->
        <app-filter-chips *ngIf="filterChips.length > 0"
                          [chips]="filterChips"
                          (removeChip)="onRemoveFilterChip($event)"
                          (clearAll)="onClearAllFilters()"></app-filter-chips>
      </div>

      <!-- Search Bar -->
      <app-search-bar [config]="searchConfig"
                      (search)="onSearch($event)"
                      [attr.aria-label]="searchConfig.ariaLabel" />
    </div>

    <!-- Filter Panel Overlay -->
    <ng-template cdkConnectedOverlay
                 [cdkConnectedOverlayOrigin]="filterBtnOrigin"
                 [cdkConnectedOverlayOpen]="isFilterOpen"
                 [cdkConnectedOverlayHasBackdrop]="true"
                 [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
                 (backdropClick)="toggleFilter()">
      <app-patient-filter-panel
        [id]="elementId('filter-panel')"
        [currentFilters]="appliedFilters"
        (apply)="onApplyFilters($event)"
        (close)="toggleFilter()">
      </app-patient-filter-panel>
    </ng-template>

    <!-- Empty State (Initial State) -->
    <div *ngIf="showEmptyState" class="empty-state-container">
      <div class="empty-state" role="status">
        <div class="empty-state-icon" aria-hidden="true">
          <mat-icon>search</mat-icon>
        </div>
        <h3 class="empty-state-title">Get Started</h3>
        <p class="empty-state-message">Use the Search bar or Filters above to find patients.</p>
      </div>
    </div>

    <!-- No Results State (After search/filter with no data) -->
    <div *ngIf="showNoResultsState" class="empty-state-container">
      <div class="empty-state" role="status">
        <div class="empty-state-icon" aria-hidden="true">
          <mat-icon>edit</mat-icon>
        </div>
        <p class="empty-state-message">No patients available to display.</p>
      </div>
    </div>

    <!-- Error State -->
    <div *ngIf="hasError && !isLoading" class="link-unit-special-donation__error" role="alert" aria-label="Error loading data">
      <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
      <p class="error-message">{{ errorMessage }}</p>
      <button type="button" mat-raised-button color="primary" (click)="loadData()">
        Retry
      </button>
    </div>

    <!-- Data Table -->
    <div class="link-unit-special-donation__table-wrapper">
      <app-data-table
        *ngIf="!hasError && !showEmptyState && !showNoResultsState"
        [config]="tableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)" />
    </div>
  </div>
</main>
