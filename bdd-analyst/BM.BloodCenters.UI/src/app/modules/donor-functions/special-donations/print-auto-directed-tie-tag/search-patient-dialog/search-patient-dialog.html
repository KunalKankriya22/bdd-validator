<div class="dialog-header" mat-dialog-title>
  <span class="dialog-title">Search for Patient</span>
  <button mat-icon-button class="close-btn" aria-label="Close dialog" (click)="onCancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-body">
  <p class="dialog-subtitle">Select one patient whose information you want to import to tie tag.</p>

  <app-data-table
    [config]="dataTableConfig"
    [data]="patients"
    [loading]="false"
    (selectionChange)="onSelectionChange($event)"
    (sortChange)="onSortChange($event)">
  </app-data-table>
</mat-dialog-content>

<div class="dialog-footer">
  <div class="dialog-footer-actions">
    <button mat-stroked-button type="button" (click)="onCancel()" class="cancel-btn">
      CANCEL
    </button>
    <button mat-raised-button color="primary" type="button" class="select-btn"
      [disabled]="isSelectDisabled"
      (click)="onSelect()"
      aria-label="Select patient">
      SELECT
    </button>
  </div>
</div>
