<main class="register-special-donation-request" aria-label="Register Special Donation Request content">
  <app-page-header-with-breadcrumb [config]="headerConfig" />

  <div class="register-special-donation-request__card">
    <div class="register-special-donation-request__controls">
      <div class="register-special-donation-request__controls-left">
        <button mat-button
                class="filter-button"
                [class.filter-button--active]="isFilterOpen"
                (click)="toggleFilter()"
                [attr.aria-expanded]="isFilterOpen"
                aria-controls="filter-panel-overlay"
                cdkOverlayOrigin
                #filterBtnOrigin="cdkOverlayOrigin"
                type="button">
          <mat-icon aria-hidden="true">filter_list</mat-icon> FILTER
        </button>

        <app-filter-chips
          *ngIf="hasActiveFilters()"
          [chips]="filterChips"
          [maxVisible]="3"
          (removeChip)="onRemoveFilterChip($event)"
          (clearAll)="clearAllFilters()">
        </app-filter-chips>
      </div>
      <app-search-bar [config]="searchConfig" (search)="onSearch($event)" />
    </div>

    <!-- Filter Panel Overlay -->
    <ng-template cdkConnectedOverlay
                 [cdkConnectedOverlayOrigin]="filterBtnOrigin"
                 [cdkConnectedOverlayOpen]="isFilterOpen"
                 [cdkConnectedOverlayHasBackdrop]="true"
                 [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
                 (backdropClick)="toggleFilter()">
      <div id="filter-panel-overlay" role="dialog" aria-label="Filter options">
        <app-special-donation-filter-panel
          [currentFilters]="appliedFilters"
          (apply)="onApplyFilters($event)"
          (close)="toggleFilter()">
        </app-special-donation-filter-panel>
      </div>
    </ng-template>

    <div aria-live="polite" class="sr-only">
      {{ patients().length }} patients found.
    </div>

    <div class="table-section">
      <div class="table-with-data">
        <app-data-table
          [config]="tableConfig"
          [data]="patients()"
          [loading]="isLoading()"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)"
          (rowClick)="navigateToDetail($any($event).patId)">
        </app-data-table>
      </div>
    </div>
  </div>

  <ng-template #patientNameCellTemplate let-row>
    <a class="patient-link"
       href="javascript:void(0)"
       role="link"
       (click)="navigateToDetail(row.patId); $event.stopPropagation()"
       (keydown.enter)="navigateToDetail(row.patId)"
       tabindex="0">
      {{ getPatientName(row) }}
    </a>
  </ng-template>

  <ng-template #statusCellTemplate let-row>
    <span class="status-badge"
          [class.status-active]="row.status === 'A'"
          [class.status-closed]="row.status !== 'A'"
          [attr.aria-label]="row.status === 'A' ? 'Status: Active' : 'Status: Closed'">
      <mat-icon class="status-icon" aria-hidden="true">{{ row.status === 'A' ? 'notifications' : 'check_circle' }}</mat-icon>
      {{ row.status === 'A' ? 'Active' : 'Closed' }}
    </span>
  </ng-template>
</main>
