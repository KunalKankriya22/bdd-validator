<h2 mat-dialog-title class="dialog-title">Multiple Sample Type Selection</h2>

<mat-dialog-content class="dialog-content">
  <div class="unit-info">
    <div class="info-row" role="group" aria-label="Unit ID">
      <span class="info-label" aria-hidden="true">Unit ID:</span>
      <span class="info-value">{{ data.unitId }}</span>
    </div>
    <div class="info-row" role="group" aria-label="Test ID">
      <span class="info-label" aria-hidden="true">Test ID:</span>
      <span class="info-value">{{ data.testId }}</span>
    </div>
  </div>

  <p class="instruction" id="sample-type-instruction">Select one sample type for this test:</p>

  <mat-radio-group
    class="sample-type-group"
    aria-labelledby="sample-type-instruction"
    [value]="selectedSampleType()"
    (change)="onSelect($event.value)">
    @for (type of data.availableSampleTypes; track type) {
      <mat-radio-button [value]="type" class="sample-type-option">
        {{ type }}
      </mat-radio-button>
    }
  </mat-radio-group>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-flat-button
    color="primary"
    [disabled]="!selectedSampleType()"
    (click)="onConfirm()">
    Confirm
  </button>
</mat-dialog-actions>
