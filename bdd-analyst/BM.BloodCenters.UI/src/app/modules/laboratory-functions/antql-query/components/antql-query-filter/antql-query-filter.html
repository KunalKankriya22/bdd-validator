<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="closeDialog()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <div class="filter-panel__content">
    <mat-form-field appearance="fill" class="filter-panel__field">
      <mat-label>Test ID</mat-label>
      <mat-select [(value)]="pendingTestId" aria-label="Filter by Test ID">
        <mat-option [value]="null">-- All --</mat-option>
        @for (id of data.testIds; track id) {
          <mat-option [value]="id">{{ id }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <div class="footer-actions">
      <button mat-stroked-button type="button" class="clear-btn" (click)="onClear()">CLEAR ALL</button>
      <button mat-raised-button type="button" class="apply-btn" (click)="onApply()">APPLY</button>
    </div>
  </footer>

</section>
