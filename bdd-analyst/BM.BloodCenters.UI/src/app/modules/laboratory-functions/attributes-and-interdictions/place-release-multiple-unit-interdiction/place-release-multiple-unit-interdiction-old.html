<div class="place-release-container">
  <!-- Page Header -->
  <app-page-header-with-breadcrumb [config]="pageHeaderConfig()" />

  <!-- Main Content -->
  <div class="content-wrapper">
    <!-- Action Selection Form -->
    <form [formGroup]="actionForm" class="action-form">
      <mat-form-field appearance="fill" class="action-field">
        <mat-label [id]="labelId('action')">Action</mat-label>
        <mat-select
          [id]="elementId('action')"
          formControlName="action"
          placeholder="Select action"
          [attr.aria-invalid]="f['action'].invalid && f['action'].touched"
          [attr.aria-describedby]="f['action'].invalid && f['action'].touched ? errorId('action') : null">
          @for (action of actionOptions; track action) {
            <mat-option [value]="action">{{ action }}</mat-option>
          }
        </mat-select>
        @if (f['action'].invalid && f['action'].touched) {
          <mat-error [id]="errorId('action')">Action is required</mat-error>
        }
      </mat-form-field>
    </form>

    <!-- Empty State -->
    @if (isEmpty()) {
      <div class="empty-state" role="status">
        <div class="empty-icon">
          <mat-icon>search</mat-icon>
        </div>
        <h3>No Results to Display</h3>
        <p>Scan or enter a Unit ID to begin.</p>
      </div>
    }

    <!-- Two-Table Layout -->
    @if (hasData()) {
      <div class="tables-container">
        <!-- Left Table: Interdiction Codes -->
        <div class="table-section left-table">
          <div class="table-toolbar">
            <button
              mat-stroked-button
              type="button"
              class="add-new-row-btn"
              (click)="onAddInterdiction()">
              <mat-icon>add</mat-icon>
              ADD NEW ROW
            </button>
          </div>

          <!-- Interdiction Table -->
          <app-data-table
            [config]="interdictionTableConfig"
            [data]="interdictions()"
            [loading]="loadingInterdictions()"
            (rowAction)="onInterdictionRowAction($event)">
          </app-data-table>
        </div>

        <!-- Right Table: Units -->
        <div class="table-section right-table">
          <!-- Unit ID Entry Field (using shared component) -->
          <div class="unit-entry-section">
            <app-unit-id-field
              [validateFfValue]="'N'"
              [required]="false"
              [showBarcodeIcon]="true"
              [hintDefault]="'Scan or type Unit ID'"
              [disabled]="scanningUnit() || selectedAction() === 'RELEASE'"
              (validated)="onUnitValidated($event)"
              (cleared)="onUnitCleared()"
            />
          </div>

          <!-- Unit Table -->
          <app-data-table
            [config]="unitTableConfig"
            [data]="units()"
            [loading]="loadingUnits()"
            (rowAction)="onUnitRowAction($event)">
          </app-data-table>
        </div>
      </div>

      <!-- Footer Actions -->
      <div class="footer-actions">
        <button
          mat-stroked-button
          type="button"
          class="clear-all-btn"
          (click)="onClearAll()"
          [disabled]="loading()">
          CLEAR ALL
        </button>
        <button
          mat-raised-button
          type="button"
          class="commit-btn"
          (click)="onCommit()"
          [disabled]="!canCommit() || loading()">
          @if (loading()) {
            <mat-spinner diameter="20" class="button-spinner"></mat-spinner>
          }
          {{ selectedAction() === 'PLACE' ? 'PLACE INTERDICTIONS' : 'RELEASE INTERDICTIONS' }}
        </button>
      </div>
    }
  </div>
</div>
