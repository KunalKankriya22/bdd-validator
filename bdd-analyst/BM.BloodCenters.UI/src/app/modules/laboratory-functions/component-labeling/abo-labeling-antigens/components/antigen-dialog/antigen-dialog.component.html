<div class="antigen-panel" role="region" aria-label="Select Antigens for Printing">
  <div class="panel-header">
    <h2>Select Antigens for Printing</h2>
    <button mat-icon-button (click)="onClose()" aria-label="Close antigen panel" class="close-btn">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="panel-content">
    <app-data-table
      [config]="tableConfig"
      [data]="antigenRows"
      [loading]="false" />
  </div>

  <div class="panel-footer">
    <button mat-flat-button class="save-action" (click)="onSave()">SAVE</button>
  </div>
</div>

<!-- Cell Templates (always in DOM for ViewChild resolution) -->
<ng-template #resultCellTemplate let-row>
  <span class="result-badge" [class.pos]="row.antigenResult === 'POS'" [class.neg]="row.antigenResult === 'NEG'"
        [attr.aria-label]="row.antigenResult === 'POS' ? 'Positive' : 'Negative'">
    {{ row.antigenResult }}
    <mat-icon class="result-icon" aria-hidden="true">
      {{ row.antigenResult === 'POS' ? 'add_circle_outline' : 'remove_circle_outline' }}
    </mat-icon>
  </span>
</ng-template>

<ng-template #printCellTemplate let-row>
  <mat-form-field appearance="fill" class="print-field" subscriptSizing="dynamic">
    <mat-select [(value)]="row.printValue" [attr.aria-label]="'Print selection for antigen ' + row.antigenCode">
      <mat-option value="Y">Yes</mat-option>
      <mat-option value="N">No</mat-option>
    </mat-select>
  </mat-form-field>
</ng-template>
