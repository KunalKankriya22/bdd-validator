<div class="warning-dialog">
  <div class="dialog-content">
    <div class="warning-header">
      <mat-icon class="warning-icon" aria-hidden="true">warning</mat-icon>
      <h2 class="dialog-title" mat-dialog-title>{{ data.title }}</h2>
    </div>

    <mat-dialog-content class="warning-message">
      <p><strong>WARNING:</strong> The following warnings were found:</p>

      <div class="warning-list" role="alert">
        @for (warning of data.warnings; track warning.code) {
          <div class="warning-item">
            <span class="warning-code">[{{ warning.code }}]</span>
            <span class="warning-text">{{ warning.message }}</span>
          </div>
        }
      </div>

      <p class="override-question">Do you want to continue?</p>
    </mat-dialog-content>

    <mat-dialog-actions class="dialog-actions" align="end">
      <button type="button" mat-button (click)="onCancel()" cdkFocusInitial aria-label="No, cancel">
        No
      </button>
      @if (data.allowOverride) {
        <button type="button" mat-raised-button color="primary" (click)="onOverride()" aria-label="Yes, continue with override">
          Yes
        </button>
      }
    </mat-dialog-actions>
  </div>
</div>
