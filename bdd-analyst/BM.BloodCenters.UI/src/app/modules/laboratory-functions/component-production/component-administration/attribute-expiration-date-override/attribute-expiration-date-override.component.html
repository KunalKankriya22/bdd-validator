<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="attribute-expiration-date-override main-content"
        aria-label="Attribute Expiration Date Override content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="attribute-expiration-date-override__card" #tableCard>

      <!-- Table Controls -->
      <div class="attribute-expiration-date-override__controls">
        <!-- Left: Filter button and chips -->
        <div class="attribute-expiration-date-override__controls-left">
          <button
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            aria-label="Open filter options"
            (click)="openFilter()">
            <mat-icon aria-hidden="true">filter_list</mat-icon>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips
            *ngIf="hasActiveFilters()"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right: Search bar -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)" />
      </div>

      <!-- Error State -->
      <div
        *ngIf="hasError && !isLoading"
        class="attribute-expiration-date-override__error"
        role="alert"
        aria-label="Error loading data">
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <p class="error-message">{{ errorMessage }}</p>
        <button type="button" mat-raised-button color="primary" (click)="loadData()">
          Retry
        </button>
      </div>

      <!-- Data Table -->
      <div class="attribute-expiration-date-override__table-wrapper">
        <app-data-table
          *ngIf="!hasError"
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>

    </div>
  </main>

  <!-- Side Panel -->
  @if (sidePanelOpen) {
    <div class="side-panel">
      <app-add-edit-attribute-expiration-date-override
        #sideDrawer
        [mode]="sidePanelMode"
        [data]="sidePanelData"
        [attributeCodeOptions]="attributeCodeOptions"
        [overrideAttributeOptions]="overrideAttributeOptions"
        (save)="onSave($event)"
        (saveAndCreateAnother)="onSaveAndCreateAnother($event)"
        (close)="closeSideDrawer()">
      </app-add-edit-attribute-expiration-date-override>
    </div>
  }

</div>
