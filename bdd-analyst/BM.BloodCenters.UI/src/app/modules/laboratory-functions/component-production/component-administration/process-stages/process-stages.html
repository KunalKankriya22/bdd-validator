<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="process-stages main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Process Stages content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="process-stages__card">

      <!-- Table Controls -->
      <div class="process-stages__controls">
        <!-- Left section (empty for now - no filter) -->
        <div class="process-stages__controls-left"></div>

        <!-- Right section: Search bar -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)" />
      </div>

      <!-- Error State -->
      <div
        *ngIf="hasError && !isLoading"
        class="process-stages__error"
        role="alert"
        aria-label="Error loading data">
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <p class="error-message">{{ errorMessage }}</p>
        <button type="button" mat-raised-button color="primary" (click)="loadData()">
          Retry
        </button>
      </div>

      <!-- Data Table -->
      <div class="process-stages__table-wrapper">
        <app-data-table
          *ngIf="!hasError"
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-add-edit-process-stage
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()"
      (modeChange)="onModeChange($event)">
    </app-add-edit-process-stage>
  </div>

</div>
