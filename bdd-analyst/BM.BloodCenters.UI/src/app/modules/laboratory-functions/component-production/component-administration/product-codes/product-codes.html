<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Backdrop Overlay -->
  <div class="drawer-backdrop" [class.active]="sidePanelOpen" (click)="sidePanelOpen = false"></div>

  <!-- Main Content Area -->
  <main class="product-codes main-content" [class.side-panel-active]="sidePanelOpen"
        aria-label="Product Codes content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>

    <!-- Cards Container -->
    <div class="product-codes__container">

      <!-- Results Card -->
      <div class="product-codes__results-card">

        <!-- Search Bar and Filter -->
        @if (hasLoadedData) {
          <div class="product-codes__controls">
            <!-- Left section: Filter button and chips -->
            <div class="product-codes__controls-left">
              <button
                #filterBtn
                type="button"
                mat-button
                class="filter-button"
                [class.filter-button--active]="isFilterOpen"
                [disabled]="isSearchAndFilterDisabled"
                aria-label="Open filter options"
                cdkOverlayOrigin
                #trigger="cdkOverlayOrigin"
                (click)="toggleFilter()">
                <mat-icon aria-hidden="true">filter_list</mat-icon>
                FILTER
              </button>

              <!-- Filter Chips -->
              @if (filterChips.length > 0) {
                <app-filter-chips
                  [chips]="filterChips"
                  (removeChip)="onRemoveFilterChip($event)"
                  (clearAll)="onClearAllFilters()">
                </app-filter-chips>
              }
            </div>

            <!-- Right section: Search bar -->
            <div class="product-codes__controls-right" [class.disabled]="isSearchAndFilterDisabled">
              <app-search-bar
                [config]="searchConfig"
                (search)="onSearch($event)" />
            </div>
          </div>

          <!-- Filter Panel Overlay -->
          <ng-template
            cdkConnectedOverlay
            [cdkConnectedOverlayOrigin]="trigger"
            [cdkConnectedOverlayOpen]="isFilterOpen"
            [cdkConnectedOverlayHasBackdrop]="true"
            [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
            [cdkConnectedOverlayOffsetY]="4"
            cdkConnectedOverlayPanelClass="filter-overlay-panel"
            (backdropClick)="toggleFilter()"
            (detach)="isFilterOpen = false">
            <app-product-codes-filter-panel
              [currentFilters]="appliedFilters"
              (apply)="onApplyFilters($event)"
              (close)="toggleFilter()">
            </app-product-codes-filter-panel>
          </ng-template>
        }

        <!-- Error State -->
        @if (hasError && !isLoading) {
          <div
            class="product-codes__error"
            role="alert"
            aria-label="Error loading data">
            <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
            <p class="error-message">Unable to load product codes. Please try again.</p>
            <button type="button" mat-raised-button color="primary" (click)="loadData()">
              Retry
            </button>
          </div>
        }

        <!-- Data Table or Empty State -->
        <div class="product-codes__table-wrapper">
          @if (!hasError) {
            <app-data-table
              [config]="tableConfig"
              [data]="dataSource"
              [loading]="isLoading"
              (pageChange)="onPageChange($event)"
              (sortChange)="onSortChange($event)"
              (rowAction)="onRowAction($event)" />
          }
        </div>

      </div>
    </div>

  </main>

  <!-- Side Panel for Add/Edit/View -->
  @if (sidePanelOpen) {
    <aside class="side-panel-container"
           role="complementary"
           aria-label="Product code details panel">
      <app-add-edit-product-dialog
        [mode]="sidePanelMode"
        [product]="sidePanelData"
        (close)="onDialogClosed($event)" />
    </aside>
  }

</div>
