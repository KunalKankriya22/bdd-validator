<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">{{ isLoading ? 'Loading data, please wait.' : (hasError ? errorMessage : '') }}</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="valid-attributes-matrix main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Valid Attributes Matrix content">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="valid-attributes-matrix__card" #tableCard>

      <!-- Table Controls -->
      <div class="valid-attributes-matrix__controls">
        <!-- Left section: Filter button and chips -->
        <div class="valid-attributes-matrix__controls-left">
          <button
            #filterBtn
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            [attr.aria-expanded]="isFilterOpen"
            (click)="openFilter()">
            <mat-icon aria-hidden="true">filter_list</mat-icon>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          @if (hasActiveFilters()) {
            <app-filter-chips
              [chips]="filterChips"
              [maxVisible]="3"
              (removeChip)="onRemoveFilterChip($event)"
              (clearAll)="clearAllFilters()">
            </app-filter-chips>
          }
        </div>

        <!-- Right section: Search bar -->
        <div class="valid-attributes-matrix__controls-right">
          <app-search-bar
            [config]="searchConfig"
            (search)="onSearch($event)" />
        </div>
      </div>

      <!-- Error State -->
      @if (hasError && !isLoading) {
        <div class="valid-attributes-matrix__error">
          <mat-icon class="empty-icon" aria-hidden="true">inbox</mat-icon>
          <p class="error-message">{{ errorMessage }}</p>
        </div>
      }

      <!-- Data Table -->
      <div class="valid-attributes-matrix__table-wrapper">
        @if (!hasError) {
          <app-data-table
            [config]="tableConfig"
            [data]="dataSource"
            [loading]="isLoading"
            [highlightedRow]="sidePanelMode === 'edit' ? sidePanelData : null"
            (pageChange)="onPageChange($event)"
            (sortChange)="onSortChange($event)"
            (rowAction)="onRowAction($event)" />
        }
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  @if (sidePanelOpen) {
  <div class="side-panel-container">
    <app-add-edit-valid-attributes-matrix
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()"
      (modeChange)="onModeChange($event)">
    </app-add-edit-valid-attributes-matrix>
  </div>
  }

</div>
