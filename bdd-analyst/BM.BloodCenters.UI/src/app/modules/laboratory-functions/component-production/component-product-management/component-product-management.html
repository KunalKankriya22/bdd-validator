<app-page-header-with-breadcrumb [config]="pageHeaderConfig" />

<div class="tab-header-container">
  <mat-tab-group
    class="cpm-tabs"
    [selectedIndex]="selectedTabIndex()"
    (selectedTabChange)="onTabChange($event)"
    animationDuration="200ms"
    aria-label="Component Product Management tabs">

    @for (tab of tabs; track tab.id) {
      <mat-tab>
        <ng-template mat-tab-label>
          <span class="tab-label">{{ tab.label }}</span>
        </ng-template>
      </mat-tab>
    }
  </mat-tab-group>
</div>

<div class="tab-content-area">
  @switch (tabs[selectedTabIndex()].id) {
    @case ('valid-catalog') {
      <div class="tab-content">
        <app-valid-catalog-numbers></app-valid-catalog-numbers>
      </div>
    }
    @case ('lot-details') {
      <div class="tab-content">
        <app-lot-details-for-bags></app-lot-details-for-bags>
      </div>
    }
  }
</div>
