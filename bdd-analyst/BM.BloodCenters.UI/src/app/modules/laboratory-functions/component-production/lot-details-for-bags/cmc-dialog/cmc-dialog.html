<div class="cmc-dialog" role="dialog" aria-labelledby="cmc-dialog-title" aria-modal="true">
  <h2 id="cmc-dialog-title" class="cmc-dialog__title">{{ data.title }}</h2>

  <div class="cmc-dialog__content">
    <div class="cmc-dialog__chips">
      @for (cmc of data.cmcCodes; track cmc.code) {
        <div class="cmc-dialog__chip">
          {{ cmc.code }} - {{ cmc.description }}
        </div>
      }
    </div>
  </div>

  <div class="cmc-dialog__actions">
    <button mat-flat-button class="ok-btn" (click)="onClose()">
      OK
    </button>
  </div>
</div>
