<section class="filter-panel" role="region" aria-labelledby="filter-title" aria-label="Filter options">

  <!-- Header -->
  <header class="filter-panel__header">
    <h3 id="filter-title">Filters</h3>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Show Expired Lot? -->
    <mat-form-field appearance="fill">
      <mat-label>Show Expired Lot?</mat-label>
      <mat-select formControlName="showExpired">
        <mat-option *ngFor="let option of showExpiredOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Effective Date Period Row -->
    <div class="filter-panel__period-row">
      <div class="period-wrapper">
        <mat-form-field appearance="fill" class="filter-panel__period-type">
          <mat-label [ngStyle]="{ color: effectivePeriodRequired ? '#b02828' : 'inherit' }">
            Period @if (effectivePeriodRequired) {<mat-icon class="error-icon" aria-hidden="true">error</mat-icon>}
          </mat-label>
          <mat-select formControlName="effDatePeriod">
            <mat-option *ngFor="let period of periodOptions" [value]="period.value">
              {{ period.display }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <div class="filter-error" *ngIf="effectivePeriodRequired" role="alert" aria-live="polite">
          <mat-icon aria-hidden="true">error</mat-icon>
          Period is required
        </div>
      </div>

      <mat-form-field appearance="fill" class="filter-panel__period-date">
        <mat-label>Effective Date</mat-label>
        <input
          #effectiveDateInput
          matInput
          [matDatepicker]="effDatePicker"
          formControlName="effDate"
          placeholder="Select date"
          aria-label="Effective date"
          (input)="onEffectiveDateInput($event)"
          (blur)="onEffectiveDateBlur(effectiveDateInput)">
        <mat-datepicker-toggle matIconSuffix [for]="effDatePicker" aria-label="Open effective date calendar"></mat-datepicker-toggle>
        <mat-datepicker #effDatePicker></mat-datepicker>
        <mat-error *ngIf="filterForm.get('effDate')?.hasError('invalidDateFormat') || filterForm.get('effDate')?.hasError('matDatepickerParse')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Termination Date Period Row -->
    <div class="filter-panel__period-row">
      <div class="period-wrapper">
        <mat-form-field appearance="fill" class="filter-panel__period-type">
          <mat-label [ngStyle]="{ color: terminationPeriodRequired ? '#b02828' : 'inherit' }">
            Period @if (terminationPeriodRequired) {<mat-icon class="error-icon" aria-hidden="true">error</mat-icon>}
          </mat-label>
          <mat-select formControlName="termDatePeriod">
            <mat-option *ngFor="let period of periodOptions" [value]="period.value">
              {{ period.display }}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <div class="filter-error" *ngIf="terminationPeriodRequired" role="alert" aria-live="polite">
          <mat-icon aria-hidden="true">error</mat-icon>
          Period is required
        </div>
      </div>

      <mat-form-field appearance="fill" class="filter-panel__period-date">
        <mat-label>Termination Date</mat-label>
        <input
          #terminationDateInput
          matInput
          [matDatepicker]="termDatePicker"
          formControlName="termDate"
          placeholder="Select date"
          aria-label="Termination date"
          (input)="onTerminationDateInput($event)"
          (blur)="onTerminationDateBlur(terminationDateInput)">
        <mat-datepicker-toggle matIconSuffix [for]="termDatePicker" aria-label="Open termination date calendar"></mat-datepicker-toggle>
        <mat-datepicker #termDatePicker></mat-datepicker>
        <mat-error *ngIf="filterForm.get('termDate')?.hasError('invalidDateFormat') || filterForm.get('termDate')?.hasError('matDatepickerParse')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>
    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
