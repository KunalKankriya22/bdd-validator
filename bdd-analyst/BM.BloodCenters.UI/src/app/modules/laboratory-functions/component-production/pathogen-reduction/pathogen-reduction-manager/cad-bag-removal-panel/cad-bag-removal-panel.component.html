<div class="cad-panel-container">
  <!-- Header -->
  <div class="panel-header">
    <h2 class="panel-title">CAD Bag Removal</h2>
    <button mat-icon-button (click)="onCancel()" class="close-button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Content -->
  <div class="panel-content">
    <form [formGroup]="cadRemovalForm">
      <!-- Row 1: Unit ID, Process, Weld Machine -->
      <div class="form-row">
        <!-- Unit ID (Read-only display) -->
        <div class="form-field-wrapper">
          <div class="field-display-card">
            <div class="field-label">Unit ID</div>
            <div class="field-value">{{ unitIdDisplay || '-' }}</div>
          </div>
        </div>

        <!-- Process (Read-only display) -->
        <div class="form-field-wrapper">
          <div class="field-display-card">
            <div class="field-label">Process</div>
            <div class="field-value">{{ processDisplay || '-' }}</div>
          </div>
        </div>

        <!-- Weld Machine (Read-only display) -->
        <div class="form-field-wrapper">
          <div class="field-display-card">
            <div class="field-label">Weld Machine</div>
            <div class="field-value">{{ weldMachineDisplay || '-' }}</div>
          </div>
        </div>
      </div>

      <!-- Row 2: Wafer Lot, Set Lot#, Weld/Seal OK -->
      <div class="form-row">
        <!-- Wafer Lot (Read-only display) -->
        <div class="form-field-wrapper">
          <div class="field-display-card">
            <div class="field-label">Wafer Lot</div>
            <div class="field-value">{{ waferLotDisplay || '-' }}</div>
          </div>
        </div>

        <!-- Set Lot# (Read-only display) -->
        <div class="form-field-wrapper">
          <div class="field-display-card">
            <div class="field-label">Set Lot#</div>
            <div class="field-value">{{ setLotDisplay || '-' }}</div>
          </div>
        </div>

        <!-- Weld/Seal OK (Editable dropdown) -->
        <div class="form-field-wrapper">
          <mat-form-field class="form-field" appearance="fill">
            <mat-label>Weld/Seal OK</mat-label>
            <mat-select formControlName="weldSealOK">
              <mat-option value="Yes">Yes</mat-option>
              <mat-option value="No">No</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <div class="panel-footer">
    <button mat-button (click)="onCancel()" class="action-btn cancel-btn" [disabled]="isSaving">
      CANCEL
    </button>
    <button mat-raised-button color="primary" (click)="onSave()" class="action-btn save-btn" [disabled]="isSaving">
      {{ isSaving ? 'SAVING...' : 'SAVE' }}
    </button>
  </div>
</div>
