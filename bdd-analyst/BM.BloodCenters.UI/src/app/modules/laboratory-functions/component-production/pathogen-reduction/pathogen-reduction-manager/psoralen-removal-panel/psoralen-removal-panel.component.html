<!-- Dialog Container -->
<div class="psoralen-removal-dialog">

  <!-- Dialog Header -->
  <div class="dialog-header">
    <h2 mat-dialog-title class="dialog-title">Psoralen Removal</h2>
    <button
      type="button"
      mat-icon-button
      class="close-button"
      aria-label="Close dialog"
      (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Loading Spinner Overlay -->
  <div *ngIf="isSaving" class="loading-overlay">
    <mat-spinner diameter="50"></mat-spinner>
  </div>

  <!-- Dialog Content -->
  <mat-dialog-content class="dialog-content" [class.loading]="isSaving">
    <form [formGroup]="form" class="psoralen-removal-form">

      <!-- First Row: Unit ID, Process, Weld Machine -->
      <div class="form-row">
        <!-- Unit ID (Read-only) -->
        <div class="form-field-wrapper">
          <div class="field-display-card">
            <div class="field-label">Unit ID</div>
            <div class="field-value">{{ unitIdDisplay || '-' }}</div>
          </div>
        </div>

        <!-- Process (Read-only display) -->
        <div class="form-field-wrapper">
          <div class="field-display-card">
            <div class="field-label">Process</div>
            <div class="field-value">{{ processDisplay || '-' }}</div>
          </div>
        </div>

        <!-- Weld Machine (Read-only) -->
        <div class="form-field-wrapper">
          <div class="field-display-card">
            <div class="field-label">Weld Machine</div>
            <div class="field-value">{{ weldMachineDisplay || '-' }}</div>
          </div>
        </div>
      </div>

      <!-- Second Row: Wafer Lot, Set Lot#, Weld/Seal OK -->
      <div class="form-row">
        <!-- Wafer Lot (Read-only) -->
        <div class="form-field-wrapper">
          <div class="field-display-card">
            <div class="field-label">Wafer Lot</div>
            <div class="field-value">{{ waferLotDisplay || '-' }}</div>
          </div>
        </div>

        <!-- Set Lot# (Read-only) -->
        <div class="form-field-wrapper">
          <div class="field-display-card">
            <div class="field-label">Set Lot#</div>
            <div class="field-value">{{ setLotDisplay || '-' }}</div>
          </div>
        </div>

        <!-- Weld/Seal OK (Editable dropdown) -->
        <div class="form-field-wrapper">
          <mat-form-field class="form-field" appearance="fill">
            <mat-label>Weld/Seal OK</mat-label>
            <mat-select formControlName="weldSealOk">
              <mat-option value="Yes">Yes</mat-option>
              <mat-option value="No">No</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>

    </form>
  </mat-dialog-content>

  <!-- Dialog Actions -->
  <mat-dialog-actions class="dialog-actions">
    <button
      type="button"
      mat-button
      class="cancel-button"
      (click)="onCancel()"
      [disabled]="isSaving">
      CANCEL
    </button>
    <button
      type="button"
      mat-raised-button
      class="save-button"
      (click)="onSave()"
      [disabled]="isSaving">
      <mat-spinner *ngIf="isSaving" diameter="20" class="button-spinner"></mat-spinner>
      <span *ngIf="!isSaving">SAVE</span>
    </button>
  </mat-dialog-actions>

</div>
