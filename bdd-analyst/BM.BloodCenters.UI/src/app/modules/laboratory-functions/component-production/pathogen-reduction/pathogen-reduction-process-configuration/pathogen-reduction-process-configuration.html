<div class="page-container">
  <div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">
    <!-- Main Content -->
    <div class="main-content">
      <app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>
      <div class="table-card">
        <div class="table-header">
          <div class="table-header-left"></div>
          <app-search-bar
            [config]="searchConfig"
            (search)="onSearch($event)">
          </app-search-bar>
        </div>

        <div class="table-wrapper">
          <app-data-table
            [config]="tableConfig"
            [data]="dataSource"
            [loading]="isLoading"
            [keepActiveRow]="sidePanelOpen"
            (pageChange)="onPageChange($event)"
            (sortChange)="onSortChange($event)"
            (rowAction)="onRowAction($event)">
          </app-data-table>
        </div>
      </div>
    </div>

    <!-- Side Panel -->
    @if (sidePanelOpen) {
      <div class="side-panel">
        <app-add-edit-pathogen-reduction-process-configuration
          [mode]="sidePanelMode"
          [data]="sidePanelData"
          (saved)="onSaved()"
          (close)="closeSidePanel()">
        </app-add-edit-pathogen-reduction-process-configuration>
      </div>
    }
  </div>
</div>
