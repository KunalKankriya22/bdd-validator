<div class="products-dialog">
  <header class="dialog-header">
    <h2 class="dialog-title">Products & Descriptions</h2>
    <button mat-icon-button (click)="onClose()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="dialog-content">
    <mat-radio-group [value]="selectedCode()" (change)="selectProduct($event.value)">
      <div class="product-table">
        <div class="table-header-row">
          <div class="table-header-cell radio-cell"></div>
          <div class="table-header-cell">Product Code</div>
          <div class="table-header-cell">Product Description</div>
        </div>

        @for (option of options; track option.productCode) {
          <div class="table-row" [class.selected]="selectedCode() === option.productCode">
            <div class="table-cell radio-cell">
              <mat-radio-button
                [value]="option.productCode"
                [attr.aria-label]="'Select product code ' + option.productCode" />
            </div>
            <div class="table-cell product-code-cell">{{ option.productCode }}</div>
            <div class="table-cell description-cell">{{ option.productDesc }}</div>
          </div>
        }
      </div>
    </mat-radio-group>
  </div>

  <footer class="dialog-footer">
    <button
      mat-raised-button
      color="primary"
      class="commit-btn"
      [disabled]="!selectedCode()"
      (click)="onCommit()"
      aria-label="Commit selected product">
      COMMIT
    </button>
  </footer>
</div>
