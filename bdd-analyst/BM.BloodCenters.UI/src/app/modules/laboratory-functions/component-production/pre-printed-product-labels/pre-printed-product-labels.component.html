<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="pre-printed-product-labels main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Pre-Printed Product Labels content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="pre-printed-product-labels__card" #tableCard>

      <!-- Table Controls -->
      <div class="pre-printed-product-labels__controls">
        <!-- Left: Filter button and chips -->
        <div class="pre-printed-product-labels__controls-left">
          <button
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            aria-label="Open filter options"
            (click)="openFilter()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips
            *ngIf="hasActiveFilters()"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right: Search bar -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)" />
      </div>

      <!-- Error State -->
      <div
        *ngIf="hasError && !isLoading"
        class="pre-printed-product-labels__error"
        role="alert"
        aria-label="Error loading data">
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <p class="error-message">{{ errorMessage }}</p>
        <button type="button" mat-raised-button color="primary" (click)="loadData()">
          Retry
        </button>
      </div>

      <!-- Data Table -->
      <div class="pre-printed-product-labels__table-wrapper">
        <app-data-table
          *ngIf="!hasError"
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          [highlightedRow]="sidePanelMode === 'edit' ? sidePanelData : null"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>

    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen"
       role="dialog"
       [attr.aria-label]="sidePanelMode === 'add' ? 'Add new pre-printed product label' : 'Edit pre-printed product label'">
    <app-add-edit-pre-printed-product-label
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      [catalogNumberOptions]="catalogNumberOptions"
      [productTypeOptions]="productTypeOptions"
      [bagCodeOptions]="bagCodeOptions"
      (save)="onPanelSave($event)"
      (saveAndCreateAnother)="onPanelSaveAndCreateAnother($event)"
      (close)="closeSidePanel()">
    </app-add-edit-pre-printed-product-label>
  </div>

</div>
