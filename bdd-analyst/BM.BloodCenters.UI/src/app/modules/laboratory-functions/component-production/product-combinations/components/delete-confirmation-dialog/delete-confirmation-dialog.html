<div class="delete-dialog" role="alertdialog" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-message">
  <h2 mat-dialog-title class="delete-dialog__title" id="delete-dialog-title">Delete Product Combination</h2>

  <mat-dialog-content>
    <p class="delete-dialog__message" id="delete-dialog-message">
      Do you want to delete set {{ data.setId }}? This action cannot be undone.
    </p>
  </mat-dialog-content>

  <mat-dialog-actions class="delete-dialog__actions" align="end">
    <button
      mat-button
      class="delete-dialog__no-btn"
      aria-label="No, cancel deletion"
      (click)="onNo()">
      NO
    </button>

    <button
      mat-raised-button
      class="delete-dialog__yes-btn"
      aria-label="Yes, delete this product combination"
      (click)="onYes()">
      YES
    </button>
  </mat-dialog-actions>
</div>
