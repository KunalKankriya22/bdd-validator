<div class="filter-panel">
  <div class="filter-header">
    <h3>Filter Product Combinations</h3>
    <button mat-icon-button (click)="onClose()" aria-label="Close filter panel">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="filterForm" class="filter-body">
    <mat-form-field appearance="fill" class="filter-field">
      <mat-label>Bag Count</mat-label>
      <mat-select formControlName="bagCount">
        <mat-option [value]="null">All</mat-option>
        @for (count of bagCountOptions; track count) {
          <mat-option [value]="count">{{ count }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill" class="filter-field">
      <mat-label>Product Type</mat-label>
      <mat-select formControlName="productType">
        <mat-option [value]="null">All</mat-option>
        @for (productType of productTypeOptions; track productType.productTypeCode) {
          <mat-option [value]="productType.productTypeCode">
            {{ productType.productTypeCode }} - {{ productType.productTypeDesc }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>

  <div class="filter-actions">
    <button mat-button (click)="onClear()" [disabled]="!hasActiveFilters()">
      CLEAR
    </button>
    <button mat-raised-button color="primary" (click)="onApply()">
      APPLY
    </button>
  </div>
</div>
