<div class="warning-dialog" role="dialog" [attr.aria-labelledby]="elementId('title')">
  <div class="dialog-content">
    <!-- Warning Icon and Title -->
    <div class="warning-header">
      <mat-icon class="warning-icon" aria-hidden="true">warning</mat-icon>
      <h2 [id]="elementId('title')" class="dialog-title">
        Warning
      </h2>
    </div>

    <!-- Warning Messages -->
    <div class="warning-messages" role="alert">
      @for (warning of data.warnings; track warning.code) {
        <div class="warning-message-item">
          <div class="warning-message-content">
            <strong>{{ warning.code }}:</strong> {{ warning.message }}
          </div>
        </div>
      }
    </div>

    <!-- Informational Message -->
    <div class="info-message">
      <p>Do you want to continue?</p>
    </div>

    <!-- Action Buttons -->
    <div class="dialog-actions">
      <button
        mat-button
        type="button"
        (click)="onCancel()"
        [id]="elementId('cancel-btn')"
        class="cancel-button">
        NO
      </button>
      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="onOverride()"
        [id]="elementId('override-btn')"
        class="override-button">
        YES
      </button>
    </div>
  </div>
</div>
