<div class="product-code-dialog">
  <!-- Header -->
  <header class="dialog-header">
    <h2 class="dialog-title">Product Code</h2>
    <button mat-icon-button (click)="onClose()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </header>
  <!-- Content -->
  <div class="dialog-content">
    <mat-radio-group
      [value]="selectedProductCode()"
      (change)="selectedProductCode.set($event.value)"
      aria-label="Select a product code"
    >
      <table class="product-table" role="grid" aria-label="Available product codes">
        <thead>
          <tr class="table-header-row">
            <th class="table-header-cell radio-cell"></th>
            <th class="table-header-cell">Product Code</th>
            <th class="table-header-cell">Description</th>
          </tr>
        </thead>
        <tbody>
          @for (option of options; track option.productCode) {
            <tr class="table-row" [class.selected]="selectedProductCode() === option.productCode">
              <td class="table-cell radio-cell">
                <mat-radio-button
                  [value]="option.productCode"
                  [attr.aria-label]="'Select product code ' + option.productCode"
                />
              </td>
              <td class="table-cell product-code-cell">{{ option.productCode }}</td>
              <td class="table-cell description-cell">{{ option.productDesc }}</td>
            </tr>
          }
        </tbody>
      </table>
    </mat-radio-group>
  </div>

  <!-- Footer -->
  <footer class="dialog-footer">
    <button
      mat-stroked-button
      (click)="onSave()"
      aria-label="Save selected product code"
    >
      SAVE
    </button>
  </footer>
</div>
