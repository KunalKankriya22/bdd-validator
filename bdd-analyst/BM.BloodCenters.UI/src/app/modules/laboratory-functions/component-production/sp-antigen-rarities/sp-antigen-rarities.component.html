<!-- SP' Antigen Rarities Tab Content -->
<div class="sp-antigen-rarities-container">
  <!-- Table Card Container -->
  <div class="sp-antigen-rarities__card">

    <!-- Header with Add Button -->
    <div class="sp-antigen-rarities__header">
      <button
        mat-raised-button
        color="accent"
        class="add-button"
        (click)="createRecord()"
        aria-label="Add new antigen rarity">
        <mat-icon>add</mat-icon>
        ADD NEW
      </button>
    </div>

    <!-- Error State -->
    <div
      *ngIf="hasError && !isLoading"
      class="sp-antigen-rarities__error"
      role="status"
      aria-label="No data available">
      <mat-icon class="empty-icon" aria-hidden="true">inbox</mat-icon>
      <p class="error-message">{{ errorMessage }}</p>
    </div>

    <!-- Data Table -->
    <div class="sp-antigen-rarities__table-wrapper">
      <app-data-table
        *ngIf="!hasError"
        [config]="tableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)" />
    </div>
  </div>
</div>
