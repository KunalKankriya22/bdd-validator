<div class="process-list-container">
  <div class="process-loading" *ngIf="isLoading">
    <p>Loading processes...</p>
  </div>

  <div class="process-empty" *ngIf="!isLoading && processes.length === 0">
    <p>No processes available</p>
  </div>

  <mat-nav-list class="process-list" *ngIf="!isLoading && processes.length > 0">
    <mat-list-item
      *ngFor="let process of processes"
      [class.selected]="isSelected(process)"
      (click)="onProcessClick(process)"
      class="process-item"
    >
      <div class="process-content">
        <div class="process-code">{{ process.code }}</div>
        <div class="process-name">{{ process.description }}</div>
      </div>
    </mat-list-item>
  </mat-nav-list>
</div>
