<div class="sp-processes-stages-container">
  <div class="sp-processes-stages-content">
    <!-- LEFT PANEL (400px fixed width) -->
    <aside class="sp-processes-sidebar">
      <div class="sidebar-header">
        <!-- Search Bar -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)">
        </app-search-bar>
      </div>

      <!-- Process List -->
      <app-process-list
        [processes]="processes()"
        [selectedProcessCode]="selectedProcess()?.code || null"
        [isLoading]="isLoading()"
        (processSelected)="onProcessSelected($event)">
      </app-process-list>
    </aside>

    <!-- RIGHT PANEL (flex: 1) -->
    <main class="sp-processes-main">
      <div *ngIf="selectedProcess()" class="main-content">
        <app-stage-configuration
          [stages]="stages()"
          [processName]="selectedProcess()?.description || ''"
          (stagesChange)="onStagesChange($event)">
        </app-stage-configuration>

        <!-- Action Buttons -->
        <div class="action-bar">
          <button mat-stroked-button
                  (click)="onCancel()"
                  [disabled]="isSaving()">
            CANCEL
          </button>
          <button mat-stroked-button
                  (click)="onClearAll()"
                  [disabled]="isSaving() || !isFormDirty()">
            CLEAR ALL
          </button>
          <button mat-flat-button
                  color="primary"
                  (click)="onSave()"
                  [disabled]="isSaving() || !isFormDirty()">
            {{ isSaving() ? 'SAVING...' : 'SAVE' }}
          </button>
        </div>
      </div>

      <div *ngIf="!selectedProcess() && processes().length > 0" class="empty-state">
        <p>Select a process from the list to manage stages</p>
      </div>

      <!-- Empty white card when no processes exist -->
      <div *ngIf="processes().length === 0" class="empty-right-panel"></div>
    </main>
  </div>
</div>
