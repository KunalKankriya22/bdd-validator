<div class="products-list-container">
  <div class="products-loading" *ngIf="isLoading">
    <p>Loading product types...</p>
  </div>

  <div class="products-empty" *ngIf="!isLoading && productTypes.length === 0">
    <p>No product types available</p>
  </div>

  <mat-nav-list class="products-list" *ngIf="!isLoading && productTypes.length > 0">
    <mat-list-item
      *ngFor="let productType of productTypes"
      [class.selected]="isSelected(productType)"
      (click)="onProductTypeClick(productType)"
      class="product-item"
    >
      <div class="product-content">
        <div class="product-code">{{ productType.code }}</div>
        <div class="product-name">{{ productType.description }}</div>
      </div>
    </mat-list-item>
  </mat-nav-list>
</div>
