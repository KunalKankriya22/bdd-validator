<div class="products-table-container" *ngIf="selectedProductType">
  <!-- Header with Title and Add Button -->
  <div class="products-header">
    <div class="header-title">
      <h3 class="products-title">Product Types - {{ selectedProductType.description }}</h3>
    </div>
    <div class="header-actions">
      <button
        mat-stroked-button
        (click)="onAddProduct()"
        class="add-btn"
        aria-label="Add new product">
        <mat-icon>add</mat-icon>
        ADD NEW PRODUCT
      </button>
      <app-search-bar
        [config]="searchConfig"
        (search)="onProductSearch($event)">
      </app-search-bar>
    </div>
  </div>

  <!-- Products Data Table -->
  <div class="table-wrapper">
    <div class="table-card">
      <app-data-table
        [config]="tableConfig"
        [data]="products"
        [loading]="isLoading"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)">
      </app-data-table>
    </div>

    <!-- Error Message -->
    <div class="error-message" *ngIf="hasError">
      <mat-icon>error</mat-icon>
      <p>{{ errorMessage }}</p>
    </div>
  </div>
</div>

<!-- Empty State: No Product Type Selected -->
<div class="no-stage-selected" *ngIf="!selectedProductType && !isLoading">
  <mat-icon class="no-stage-icon">info</mat-icon>
  <p class="no-stage-text">Select a product type from the left panel to view details</p>
</div>
