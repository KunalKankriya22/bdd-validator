<div class="sp-products-container">
  <!-- Main Content Area -->
  <div class="content-wrapper">
    <!-- Left Panel: Product Types List -->
    <div class="products-list-panel">
      <div class="products-list-header">
        <app-search-bar
          [config]="searchConfig"
          (search)="onProductTypeSearch($event)">
        </app-search-bar>
      </div>

      <div class="products-list-wrapper">
        <app-sp-product-list
          [productTypes]="productTypes"
          [selectedProductTypeCode]="selectedProductType?.code || null"
          [isLoading]="isLoadingProcessCodes"
          (productTypeSelected)="onProductTypeSelected($event)">
        </app-sp-product-list>
      </div>
    </div>

    <!-- Right Panel: Product Details -->
    <div class="product-details-panel">
      <app-sp-products-table
        [products]="filteredProducts"
        [isLoading]="isLoadingProducts"
        [hasError]="hasError"
        [errorMessage]="errorMessage"
        [selectedProductType]="selectedProductType"
        (productSearch)="onProductSearch($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)"
        (addProduct)="onAddProduct()">
      </app-sp-products-table>
    </div>
  </div>
</div>
