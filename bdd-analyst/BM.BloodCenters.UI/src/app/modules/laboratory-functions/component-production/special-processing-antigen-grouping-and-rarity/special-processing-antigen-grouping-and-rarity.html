<app-page-header-with-breadcrumb [config]="pageHeaderConfig" />

<div class="tab-header-container">
  <mat-tab-group
    class="spagr-tabs"
    [selectedIndex]="selectedTabIndex()"
    (selectedTabChange)="onTabChange($event)"
    animationDuration="200ms"
    aria-label="Special Processing Antigen Grouping and Rarity tabs">

    @for (tab of tabs; track tab.id) {
      <mat-tab>
        <ng-template mat-tab-label>
          <span class="tab-label">{{ tab.label }}</span>
        </ng-template>
      </mat-tab>
    }
  </mat-tab-group>
</div>

<div class="tab-content-area">
  @switch (tabs[selectedTabIndex()].id) {
    @case ('groups') {
      <div class="tab-content">
        <app-sp-antigen-groups></app-sp-antigen-groups>
      </div>
    }
    @case ('rarities') {
      <div class="tab-content">
        <app-sp-antigen-rarities></app-sp-antigen-rarities>
      </div>
    }
  }
</div>
