<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Effective Date -->
    <div class="date-row">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label [ngStyle]="{ color: effectivePeriodRequired ? '#b02828' : 'inherit' }">Effective Period</mat-label>
        <mat-select formControlName="effDatePeriod"
                    [attr.aria-describedby]="effectivePeriodRequired ? 'eff-period-error' : null">
          <mat-option *ngFor="let period of periodOptions" [value]="period.value">
            {{ period.display }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Effective Date</mat-label>
        <input
          #effectiveDateInput
          matInput
          [matDatepicker]="effDatePicker"
          formControlName="effDate"
          (input)="onEffectiveDateInput($event)"
          (blur)="onEffectiveDateBlur(effectiveDateInput)">
        <mat-datepicker-toggle matIconSuffix [for]="effDatePicker"
                               aria-label="Open effective date calendar"></mat-datepicker-toggle>
        <mat-datepicker #effDatePicker></mat-datepicker>
        <mat-error *ngIf="filterForm.get('effDate')?.hasError('invalidDateFormat')">
          Invalid date
        </mat-error>
        <mat-error *ngIf="filterForm.get('effDate')?.hasError('matDatepickerParse')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>
    <div class="error-message" id="eff-period-error" role="alert" *ngIf="effectivePeriodRequired">Period is required</div>

    <!-- Termination Date -->
    <div class="date-row">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label [ngStyle]="{ color: terminationPeriodRequired ? '#b02828' : 'inherit' }">Termination Period</mat-label>
        <mat-select formControlName="termDatePeriod"
                    [attr.aria-describedby]="terminationPeriodRequired ? 'term-period-error' : null">
          <mat-option *ngFor="let period of periodOptions" [value]="period.value">
            {{ period.display }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Termination Date</mat-label>
        <input
          #terminationDateInput
          matInput
          [matDatepicker]="termDatePicker"
          formControlName="termDate"
          (input)="onTerminationDateInput($event)"
          (blur)="onTerminationDateBlur(terminationDateInput)">
        <mat-datepicker-toggle matIconSuffix [for]="termDatePicker"
                               aria-label="Open termination date calendar"></mat-datepicker-toggle>
        <mat-datepicker #termDatePicker></mat-datepicker>
        <mat-error *ngIf="filterForm.get('termDate')?.hasError('invalidDateFormat')">
          Invalid date
        </mat-error>
        <mat-error *ngIf="filterForm.get('termDate')?.hasError('matDatepickerParse')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>
    <div class="error-message" id="term-period-error" role="alert" *ngIf="terminationPeriodRequired">Period is required</div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()" aria-label="Clear all filters">
      CLEAR ALL
    </button>
    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled"
            aria-label="Apply filters">
      APPLY
    </button>
  </footer>

</section>
