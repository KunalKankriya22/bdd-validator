<app-page-header-with-breadcrumb [config]="pageHeaderConfig" />

<main class="layout-wrapper">
  <!-- Main Content -->
  <div class="main-content">
    <div class="card">
      <!-- Controls Section -->
      <div class="controls">
        <!-- Left Section: Filter Button + Filter Chips -->
        <div class="controls-left">
          <button
            #filterButton
            mat-stroked-button
            type="button"
            class="filter-btn"
            [class.active]="isFilterActive"
            (click)="openFilterPanel()"
            aria-label="Open filter panel">
            <mat-icon>filter_list</mat-icon>
            <span class="filter-label">FILTER</span>
          </button>

          @if (activeFilterChips.length > 0) {
            <app-filter-chips
              [chips]="activeFilterChips"
              [maxVisible]="3"
              (removeChip)="onRemoveFilterChip($event)"
              (clearAll)="onClearAllFilters()">
            </app-filter-chips>
          }
        </div>

        <!-- Right Section -->
        <div class="controls-right">
          @if (currentView === 'master') {
            <app-search-bar
              [config]="masterSearchConfig"
              (search)="onMasterSearch($event)">
            </app-search-bar>
          } @else {
            <app-search-bar
              [config]="detailSearchConfig"
              (search)="onDetailSearch($event)">
            </app-search-bar>
          }
        </div>
      </div>

      <!-- Data Table -->
      <div class="table-wrapper">
        @if (currentView === 'master') {
          <app-data-table
            [config]="masterTableConfig"
            [data]="masterDataSource"
            [loading]="masterIsLoading"
            (pageChange)="onMasterPageChange($event)"
            (sortChange)="onMasterSortChange($event)"
            (rowAction)="onMasterRowAction($event)">
          </app-data-table>
        } @else {
          <app-data-table
            [config]="detailTableConfig"
            [data]="detailDataSource"
            [loading]="detailIsLoading"
            [highlightedRow]="sidePanelData"
            (pageChange)="onDetailPageChange($event)"
            (sortChange)="onDetailSortChange($event)"
            (rowAction)="onDetailRowAction($event)">
          </app-data-table>
        }
      </div>
    </div>
  </div>
</main>

<span class="sr-only" aria-live="polite" role="status">{{ statusMessage }}</span>

<!-- Side Panel Overlay -->
@if (sidePanelOpen && selectedCodeType) {
  <div class="side-panel-backdrop"></div>
  <div class="side-panel" role="dialog" aria-modal="true"
       [attr.aria-label]="sidePanelMode === 'add' ? 'Add New Code' : 'Edit Code'">
    <app-add-edit-special-processing
      #sideDrawer
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      [codeType]="selectedCodeType"
      [codeTypeDescription]="selectedCodeTypeDesc"
      (save)="onSave($event)"
      (saveAndCreateAnother)="onSaveAndCreateAnother($event)"
      (close)="closeSideDrawer()">
    </app-add-edit-special-processing>
  </div>
}
