<app-page-header-with-breadcrumb [config]="pageHeaderConfig" />

<div class="tab-header-container">
  <mat-tab-group
    class="spw-tabs"
    [selectedIndex]="selectedTabIndex()"
    (selectedTabChange)="onTabChange($event)"
    animationDuration="200ms"
    aria-label="Special Processing Workflows tabs">

    @for (tab of tabs; track tab.id) {
      <mat-tab>
        <ng-template mat-tab-label>
          <span class="tab-label">{{ tab.label }}</span>
        </ng-template>
      </mat-tab>
    }
  </mat-tab-group>
</div>

<div class="tab-content-area">
  @switch (tabs[selectedTabIndex()].id) {
    @case ('stages') {
      <div class="tab-content">
        <app-sp-processes-stages></app-sp-processes-stages>
      </div>
    }
    @case ('products') {
      <div class="tab-content">
        <app-sp-products-special-processes></app-sp-products-special-processes>
      </div>
    }
  }
</div>
