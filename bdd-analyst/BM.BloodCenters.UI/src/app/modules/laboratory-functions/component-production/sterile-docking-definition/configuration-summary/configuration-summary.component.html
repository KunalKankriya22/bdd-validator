<div class="configuration-summary">
  <!-- Row 1: Docking Type, Description, Machine Code, Wafer Lot -->
  <div class="form-row">
    <mat-form-field appearance="fill">
      <mat-label>Docking Type</mat-label>
      <input matInput [value]="configuration?.itemInd || ''" readonly />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Description</mat-label>
      <input matInput [value]="configuration?.description || ''" readonly />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Machine Code</mat-label>
      <input matInput [value]="configuration?.sterileMachine || ''" readonly />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Wafer Lot</mat-label>
      <input matInput [value]="configuration?.waferLotNumber || ''" readonly />
    </mat-form-field>
  </div>

  <!-- Row 2: Number of Units, Bag Catalog, Bag Lot, Filter Type (conditional), Filter Lot (conditional) -->
  <div class="form-row">
    <mat-form-field appearance="fill">
      <mat-label>Number of Units</mat-label>
      <input matInput [value]="configuration?.numberOfItems || ''" readonly />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Bag Catalog No</mat-label>
      <input matInput [value]="configuration?.bagCatalogNumber || ''" readonly />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Bag Lot Number</mat-label>
      <input matInput [value]="configuration?.lotNumber || ''" readonly />
    </mat-form-field>

    <mat-form-field appearance="fill" *ngIf="showFilterFields()">
      <mat-label>Filter Type</mat-label>
      <input matInput [value]="configuration?.filterType || ''" readonly />
    </mat-form-field>

    <mat-form-field appearance="fill" *ngIf="showFilterFields()">
      <mat-label>Filter Lot Number</mat-label>
      <input matInput [value]="configuration?.filterLotNumber || ''" readonly />
    </mat-form-field>
  </div>

  <!-- Row 2b: Segment Fields (SE docking type only) -->
  <div class="form-row" *ngIf="showSegmentFields()">
    <mat-form-field appearance="fill">
      <mat-label>Segment Fully Removed?</mat-label>
      <input matInput [value]="configuration?.segmentRemFlag || ''" readonly />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Segment Number</mat-label>
      <input matInput [value]="configuration?.segmentNumber || ''" readonly />
    </mat-form-field>
  </div>

  <!-- Row 3: Number of Components, Attribute Code, Attribute Description, Process Date -->
  <div class="form-row">
    <mat-form-field appearance="fill">
      <mat-label>Number of Components</mat-label>
      <input matInput [value]="configuration?.numberOfComponents || ''" readonly />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Attribute Code</mat-label>
      <input matInput [value]="configuration?.attributeCode || ''" readonly />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Attribute Description</mat-label>
      <input matInput [value]="configuration?.attributeDescription || ''" readonly />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Process Date</mat-label>
      <input matInput [value]="configuration?.processDateDisplay || ''" readonly />
    </mat-form-field>
  </div>
</div>
