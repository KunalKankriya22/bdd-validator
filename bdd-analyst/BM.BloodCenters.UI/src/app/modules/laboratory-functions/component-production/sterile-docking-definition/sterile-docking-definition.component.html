<app-page-header-with-breadcrumb [config]="headerConfig" />

<div class="sdd-container">
  <!-- Phase 1: Configuration Form -->
  <app-configuration-form
    *ngIf="currentPhase() === 'configuration'"
    [initialData]="null"
    (submit)="onConfigurationComplete($event)"
    (cancel)="onCancel()"
  />

  <!-- Phase 2 & 3: Unit Entry + Results -->
  <div *ngIf="currentPhase() !== 'configuration'" class="sdd-workflow">
    <!-- Configuration Summary (read-only display of saved configuration) -->
    <app-configuration-summary [configuration]="configuration()" />

    <!-- Unit Entry Form -->
    <app-unit-entry-form
      [configuration]="configuration()"
      [maxUnits]="configuration()?.numberOfItems || 0"
      [currentUnitCount]="enteredUnits().length"
      [existingUnitIds]="existingUnitIds()"
      [expectedDerivedProduct]="lastDerivedProduct()"
      (unitAdded)="onUnitAdded($event)"
      (reprintEligibleChange)="onReprintEligibleChange($event)"
      (derivedProductErrorChange)="onDerivedProductErrorChange($event)"
    />

    <!-- Derived Products Table (always visible after configuration) -->
    <app-derived-products-table
      [products]="derivedProducts()"
      (removeProduct)="onRemoveProduct($event)"
    />

    <!-- Actions -->
    <div class="panel-footer">
      <div class="footer-actions">
        <button mat-button class="cancel-btn" (click)="onCancel()">CANCEL</button>
        <button mat-button class="cancel-btn" (click)="onClearAll()" [disabled]="enteredUnits().length === 0">
          CLEAR ALL
        </button>
        <button
          *ngIf="showReprintLabel()"
          mat-raised-button
          color="primary"
          class="primary-btn"
          (click)="onReprintLabels()"
          [disabled]="!reprintEligible() || isLoading()"
        >
          RE PRINT LABEL
        </button>
      </div>
    </div>
  </div>

  <!-- Loading Indicator -->
  <div *ngIf="isLoading()" class="loading-overlay" role="status" aria-live="polite" aria-atomic="true">
    <mat-spinner aria-hidden="true"></mat-spinner>
    <span class="cdk-visually-hidden">Loading, please wait...</span>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage()" class="error-banner" role="alert">
    <mat-icon aria-hidden="true">error</mat-icon>
    <span>{{ errorMessage() }}</span>
  </div>
</div>
