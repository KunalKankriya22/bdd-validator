<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">
  <div class="drawer-backdrop" [class.active]="sidePanelOpen"></div>

  <div class="main-content">
    <div class="card">
      <div class="controls">
        <div class="controls-left">
          <button
            #filterButton
            mat-stroked-button
            type="button"
            class="filter-btn"
            [class.active]="!!filterOverlayRef"
            (click)="openFilterPanel()"
            aria-label="Open filter panel">
            <mat-icon>filter_list</mat-icon>
            <span class="filter-label">FILTER</span>
          </button>

          @if (filterChips.length > 0) {
            <app-filter-chips
              [chips]="filterChips"
              [maxVisible]="3"
              (removeChip)="onRemoveFilterChip($event)"
              (clearAll)="onClearAllFilters()">
            </app-filter-chips>
          }
        </div>

        <div class="controls-right">
          <button
            mat-flat-button
            type="button"
            class="add-btn"
            (click)="openAddDrawer()"
            aria-label="Add new catalog">
            <mat-icon>add</mat-icon>
            ADD NEW CATALOG
          </button>

          <app-search-bar
            [config]="searchBarConfig"
            (search)="onSearch($event)">
          </app-search-bar>
        </div>
      </div>

      <div class="table-wrapper">
        <app-data-table
          [config]="dataTableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          [highlightedRow]="editingRow"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)">
        </app-data-table>
      </div>
    </div>
  </div>

  @if (sidePanelOpen) {
    <div class="side-panel">
      <app-add-edit-catalog
        #sideDrawer
        [mode]="sidePanelMode"
        [data]="sidePanelData"
        [manufacturers]="manufacturers"
        [anticoagulants]="anticoagulants"
        [additives]="additives"
        (save)="onSave($event)"
        (saveAndCreateAnother)="onSaveAndCreateAnother($event)"
        (close)="closeSideDrawer()">
      </app-add-edit-catalog>
    </div>
  }
</div>
