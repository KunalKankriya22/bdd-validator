<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Catalog No -->
    <mat-form-field appearance="fill">
      <mat-label>Catalog No</mat-label>
      <mat-select formControlName="catalogNumber">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="containerIdSearchCtrl"
            placeholderLabel="Search catalog number..."
            noEntriesFoundLabel="No matching catalog numbers">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let container of filteredContainerIds" [value]="container.code">
          {{ container.code }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Show Terminated -->
    <mat-form-field appearance="fill">
      <mat-label>Show Terminated</mat-label>
      <mat-select formControlName="showTerminated">
        <mat-option *ngFor="let option of showTerminatedOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>
    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
