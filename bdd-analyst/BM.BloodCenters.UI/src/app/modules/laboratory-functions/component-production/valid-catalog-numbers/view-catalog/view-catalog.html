<div class="view-catalog-container">
  <!-- Backdrop Overlay -->
  <div class="drawer-backdrop" [class.active]="sidePanelOpen"></div>

  <!-- Combined Header Section -->
  <div class="header-section">
    <app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>

    <div class="back-button-wrapper">
      <button mat-icon-button (click)="goBack()" aria-label="Go back">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h1 class="catalog-title">{{ catalogNumber }}</h1>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Search & Filter -->
    <div class="table-controls">
      <!-- Filter Button + Filter Chips (LEFT) -->
      <div class="table-controls-left">
        <button
          #filterButton
          mat-stroked-button
          type="button"
          class="filter-btn"
          [class.active]="!!filterOverlayRef"
          [disabled]="isControlsDisabled"
          (click)="openFilterPanel()"
          aria-label="Open filter panel">
          <mat-icon>filter_list</mat-icon>
          <span class="filter-label">FILTER</span>
        </button>

        <app-filter-chips
          *ngIf="filterChips.length > 0"
          [chips]="filterChips"
          [maxVisible]="3"
          (removeChip)="removeFilterChip($event)"
          (clearAll)="clearAllFiltersChips()">
        </app-filter-chips>
      </div>

      <!-- Add Button + Search (RIGHT) -->
      <div class="table-controls-right">
        <button
          mat-flat-button
          type="button"
          class="add-btn"
          (click)="openAddDrawer()"
          aria-label="Add new container">
          <mat-icon>add</mat-icon>
          ADD NEW CONTAINER
        </button>

        <app-search-bar
          [config]="searchConfig"
          [class.search-disabled]="isControlsDisabled"
          (search)="onSearch($event)" />
      </div>
    </div>

    <!-- Data Table Wrapper -->
    <div class="data-table-wrapper">
      <app-data-table
        [config]="dataTableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        [highlightedRow]="editingRow"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)">
      </app-data-table>
    </div>
  </div>
</div>

<!-- Side Drawer -->
<app-add-edit-container
  *ngIf="sidePanelOpen"
  #sideDrawer
  [mode]="sidePanelMode"
  [data]="sidePanelData"
  [catalogNumber]="catalogNumber"
  [productTypes]="productTypes"
  [containerIds]="containerIds"
  (save)="onSave($event)"
  (saveAndCreateAnother)="onSaveAndCreateAnother($event)"
  (close)="closeSideDrawer()"
  class="side-panel">
</app-add-edit-container>
