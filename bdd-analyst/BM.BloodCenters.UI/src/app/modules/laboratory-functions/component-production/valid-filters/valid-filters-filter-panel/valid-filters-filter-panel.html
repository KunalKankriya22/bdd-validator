<section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" [attr.aria-label]="'Close filter panel'" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Catalog | Product Type -->
    <div class="filter-row">
      <mat-form-field appearance="fill">
        <mat-label>Catalog</mat-label>
        <mat-select formControlName="catalogNumber">
          <mat-option>
            <ngx-mat-select-search
              [formControl]="catalogSearchControl"
              placeholderLabel="Search Catalog..."
              noEntriesFoundLabel="">
            </ngx-mat-select-search>
          </mat-option>
          <mat-option *ngFor="let option of filteredCatalogOptions" [value]="option.code">
            {{ option.code }}
          </mat-option>
          @if (filteredCatalogOptions.length === 0) {
            <mat-option disabled class="filter-panel__panel-option--status">
              No data available
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Product Type | Days -->
    <div class="filter-row">
      <mat-form-field appearance="fill">
        <mat-label>Product Type</mat-label>
        <mat-select formControlName="productType">
          <mat-option>
            <ngx-mat-select-search
              [formControl]="productTypeSearchControl"
              placeholderLabel="Search Product Type..."
              noEntriesFoundLabel="">
            </ngx-mat-select-search>
          </mat-option>
          <mat-option *ngFor="let option of filteredProductTypeOptions" [value]="option.code">
            {{ option.code }} - {{ option.description }}
          </mat-option>
          @if (filteredProductTypeOptions.length === 0) {
            <mat-option disabled class="filter-panel__panel-option--status">
              No data available
            </mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Days</mat-label>
        <input matInput type="text" formControlName="days" maxlength="4"
               (keydown)="onDaysKeyDown($event)"
               (paste)="onDaysPaste($event)" />
      </mat-form-field>
    </div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>
    <button mat-raised-button color="primary" type="button" [disabled]="isApplyDisabled" (click)="onApply()">
      APPLY
    </button>
  </footer>

</section>
