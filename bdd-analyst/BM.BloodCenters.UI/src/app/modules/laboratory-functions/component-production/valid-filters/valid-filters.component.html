<div class="page-container">
  <div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">
    <!-- Main Content -->
    <div class="main-content">
      <app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>
      <div class="table-card" #tableCard>
        <div class="table-header">
          <!-- Left: Filter + Chips -->
          <div class="table-header-left">
            <button
              type="button"
              mat-button
              class="filter-button"
              [class.filter-button--active]="isFilterOpen || hasActiveFilters()"
              [attr.aria-label]="isFilterOpen ? 'Close filter panel' : 'Open filter panel'"
              [attr.aria-expanded]="isFilterOpen"
              (click)="openFilter()">
              <mat-icon aria-hidden="true">filter_list</mat-icon>
              FILTER
            </button>

            <!-- Inline Filter Chips -->
            <app-filter-chips
              *ngIf="hasActiveFilters()"
              [chips]="filterChips"
              [maxVisible]="3"
              (removeChip)="onRemoveFilterChip($event)"
              (clearAll)="clearAllFilters()">
            </app-filter-chips>
          </div>

          <!-- Right: Search -->
          <app-search-bar
            [config]="searchConfig"
            (search)="onSearch($event)">
          </app-search-bar>
        </div>

        <div class="table-wrapper">
          <app-data-table
            [config]="tableConfig"
            [data]="dataSource"
            [loading]="isLoading"
            [keepActiveRow]="sidePanelOpen"
            (pageChange)="onPageChange($event)"
            (sortChange)="onSortChange($event)"
            (rowAction)="onRowAction($event)">
          </app-data-table>
        </div>
      </div>
    </div>

    <!-- Side Panel -->
    @if (sidePanelOpen) {
      <div class="side-panel">
        <app-add-edit-valid-filter
          [mode]="sidePanelMode"
          [data]="sidePanelData"
          [catalogOptions]="addCatalogs"
          [productTypeOptions]="addProductTypes"
          (save)="onSidePanelSave($event)"
          (saveAndCreateAnother)="onSidePanelSaveAndCreateAnother($event)"
          (close)="closeSidePanel()">
        </app-add-edit-valid-filter>
      </div>
    }
  </div>
</div>
