<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Valid Pool ABO Values content"
        role="main">

    <app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>

    <div class="table-card" #tableCard>
      <div class="table-header">
        <!-- Left: Filter + Chips -->
        <div class="table-header-left">
          <button
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen || hasActiveFilters()"
            aria-label="Open filter panel"
            [attr.aria-expanded]="isFilterOpen"
            (click)="openFilter()">
            <mat-icon aria-hidden="true">filter_list</mat-icon>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips
            *ngIf="hasActiveFilters()"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right: Search -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)">
        </app-search-bar>
      </div>

      <app-data-table
        [config]="tableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        [highlightedRow]="sidePanelMode === 'edit' ? sidePanelData : null"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)">
      </app-data-table>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-add-edit-pool-abo-value
      #addEditComponent
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      [poolSldOptions]="poolSldOptions"
      (close)="closeSidePanel()"
      (save)="onSave($event)"
      (saveAndCreateAnother)="onSaveAndCreateAnother($event)">
    </app-add-edit-pool-abo-value>
  </div>

</div>
