<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <main class="main-content" [class.side-panel-active]="sidePanelOpen">
    <div class="configure-interdiction-placement-container">
      <!-- Page Header -->
      <app-page-header-with-breadcrumb [config]="headerConfig()" />

      <!-- Function Name Filter (own section above table card) -->
      <section class="function-filter-section">
        <form [formGroup]="functionForm">
          <mat-form-field appearance="fill" class="function-select">
            <mat-label>Function Name</mat-label>
            <mat-select
              formControlName="functionName"
              [id]="elementId('function-name')"
              placeholder="Select Function">
              <mat-option>
                <ngx-mat-select-search
                  [formControl]="functionNameSearchCtrl"
                  placeholderLabel="Search..."
                  noEntriesFoundLabel="No results found">
                </ngx-mat-select-search>
              </mat-option>
              @for (fn of filteredFunctionNames(); track fn.code) {
                <mat-option [value]="fn.code">{{ fn.code }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </form>
      </section>

      <!-- Table Card Container -->
      <div class="table-card" #tableCard>
        <!-- Controls Row: Filter + Chips + Search -->
        <div class="table-header">
          <div class="table-header-left">
            <!-- Filter Button -->
            <button
              mat-button
              (click)="openFilter()"
              [id]="elementId('filter-btn')"
              class="filter-button"
              [class.filter-button--active]="isFilterOpen || hasActiveFilters()"
              [attr.aria-pressed]="isFilterOpen"
              [attr.aria-label]="hasActiveFilters() ? 'Filter (active filters applied)' : 'Open filter panel'">
              <mat-icon aria-hidden="true">filter_list</mat-icon>
              FILTER
            </button>

            <!-- Inline Filter Chips -->
            <app-filter-chips
              *ngIf="hasActiveFilters()"
              [chips]="filterChips"
              [maxVisible]="3"
              (removeChip)="onRemoveFilterChip($event)"
              (clearAll)="clearAllFilters()">
            </app-filter-chips>
          </div>

          <!-- Search Bar -->
          <app-search-bar [config]="searchConfig" (search)="onSearch($event)" />
        </div>

        <!-- Data Table -->
        <app-data-table
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="loading()"
          [highlightedRow]="sidePanelData"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)">
        </app-data-table>
      </div>
    </div>
  </main>

  <!-- Side Panel Container (pushes main content left, like IPT) -->
  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-interdiction-placement-side-panel
      [mode]="sidePanelMode"
      [record]="sidePanelData"
      [selectedFunction]="selectedFunction()"
      [lookupsLoading]="sidePanelLookupsLoading()"
      [actionFunctionNamesLookup]="actionFunctionNames()"
      [actionCodesLookup]="sidePanelActionCodes()"
      [productCodesLookup]="sidePanelProductCodes()"
      [interdictionCodesLookup]="sidePanelInterdictionCodes()"
      [productTypesLookup]="sidePanelProductTypes()"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess($event)"
      (saveAndCreateAnother)="onSaveAndCreateAnother($event)">
    </app-interdiction-placement-side-panel>
  </div>

</div>
