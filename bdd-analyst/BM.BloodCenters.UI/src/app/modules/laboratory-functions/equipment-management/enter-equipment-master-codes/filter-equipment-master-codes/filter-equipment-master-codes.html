<section class="filter-panel" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">
      Filters
    </h2>

    <button mat-icon-button type="button" [attr.aria-label]="'Close filter panel'" (click)="closeDialog()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- User Group -->
    <mat-form-field appearance="fill" class="full-width-field">
      <mat-label>User Group</mat-label>
      <mat-select formControlName="userGroup">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="userGroupSearchCtrl"
            placeholderLabel="Search user groups..."
            noEntriesFoundLabel="No matching user groups">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option [value]="null">None</mat-option>
        <mat-option *ngFor="let grp of filteredUserGroupOptions" [value]="grp.value">
          {{ grp.value }} - {{ grp.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Effective Date -->
    <div class="filter-panel__date-row">
      <div class="period-wrapper">
        <mat-form-field appearance="fill" class="period-field" [class.has-error]="effectiveDatePeriodError">
          <mat-label [ngStyle]="{ color: effectiveDatePeriodError ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="effectiveDatePeriod"
                      [attr.aria-describedby]="effectiveDatePeriodError ? 'eff-period-error' : null">
            <mat-option value="AFTER">After</mat-option>
            <mat-option value="BEFORE">Before</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="period-error" *ngIf="effectiveDatePeriodError"
             id="eff-period-error" role="alert">
          {{ effectiveDatePeriodError }}
        </div>
      </div>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Effective Date</mat-label>
        <input
          #effectiveDateInput
          matInput
          [matDatepicker]="effectiveDatePicker"
          formControlName="effectiveDate"
          (input)="onEffectiveDateInput($event)"
          (blur)="onEffectiveDateBlur(effectiveDateInput)"
          (keydown.enter)="$event.target.blur()">
        <mat-datepicker-toggle matIconSuffix [for]="effectiveDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #effectiveDatePicker></mat-datepicker>
        <mat-error *ngIf="filterForm.get('effectiveDate')?.hasError('invalidDateFormat') || filterForm.get('effectiveDate')?.hasError('matDatepickerParse') || filterForm.get('effectiveDate')?.hasError('invalidDate')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>

    <!-- Termination Date -->
    <div class="filter-panel__date-row">
      <div class="period-wrapper">
        <mat-form-field appearance="fill" class="period-field" [class.has-error]="terminationDatePeriodError">
          <mat-label [ngStyle]="{ color: terminationDatePeriodError ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="terminationDatePeriod"
                      [attr.aria-describedby]="terminationDatePeriodError ? 'term-period-error' : null">
            <mat-option value="AFTER">After</mat-option>
            <mat-option value="BEFORE">Before</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="period-error" *ngIf="terminationDatePeriodError"
             id="term-period-error" role="alert">
          {{ terminationDatePeriodError }}
        </div>
      </div>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Termination Date</mat-label>
        <input
          #terminationDateInput
          matInput
          [matDatepicker]="terminationDatePicker"
          formControlName="terminationDate"
          (input)="onTerminationDateInput($event)"
          (blur)="onTerminationDateBlur(terminationDateInput)"
          (keydown.enter)="$event.target.blur()">
        <mat-datepicker-toggle matIconSuffix [for]="terminationDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #terminationDatePicker></mat-datepicker>
        <mat-error *ngIf="filterForm.get('terminationDate')?.hasError('invalidDateFormat') || filterForm.get('terminationDate')?.hasError('matDatepickerParse') || filterForm.get('terminationDate')?.hasError('invalidDate')">
          Invalid date
        </mat-error>
      </mat-form-field>
    </div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <div class="footer-actions">
      <button mat-stroked-button type="button" class="clear-btn" (click)="onClear()">CLEAR ALL</button>
      <button mat-raised-button type="button" class="apply-btn" (click)="onApply()" [disabled]="isApplyDisabled">APPLY</button>
    </div>
  </footer>

</section>
