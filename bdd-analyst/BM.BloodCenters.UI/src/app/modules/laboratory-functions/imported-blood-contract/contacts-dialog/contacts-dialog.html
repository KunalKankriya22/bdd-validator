<div class="contacts-dialog">
  <div class="dialog-header">
    <h2>Contacts Information</h2>
    <button mat-icon-button (click)="onCancel()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <div class="contacts-actions">
      <button mat-stroked-button class="btn-add" (click)="onAddRow()">
        <mat-icon>add</mat-icon> ADD NEW CONTACT
      </button>
    </div>

    <div class="contacts-table-wrapper" *ngIf="editableRows.length > 0">
      <table class="contacts-table">
        <thead>
          <tr>
            <th>Contact Type</th>
            <th>Last Name</th>
            <th>First Name</th>
            <th>Title</th>
            <th>Phone</th>
            <th>Fax</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of editableRows; let i = index"
              [class.dirty-row]="dirtyRowIds.has(i)">

            <td>
              <mat-form-field appearance="outline" class="table-field">
                <mat-select [(value)]="row.contactType"
                            (selectionChange)="onFieldChange(i, 'contactType', $event.value)">
                  @for (opt of contactTypeOptions; track opt.code) {
                    <mat-option [value]="opt.code">{{ opt.code }} - {{ opt.description }}</mat-option>
                  }
                </mat-select>
              </mat-form-field>
            </td>

            <td>
              <mat-form-field appearance="outline" class="table-field">
                <input matInput [(ngModel)]="row.contactLastName"
                       (ngModelChange)="onFieldChange(i, 'contactLastName', $event)"
                       maxlength="50"
                       (keydown)="$event.key === ' ' && $any($event.target).selectionStart === 0 ? $event.preventDefault() : null">
              </mat-form-field>
            </td>

            <td>
              <mat-form-field appearance="outline" class="table-field">
                <input matInput [(ngModel)]="row.contactFirstName"
                       (ngModelChange)="onFieldChange(i, 'contactFirstName', $event)"
                       maxlength="50"
                       (keydown)="$event.key === ' ' && $any($event.target).selectionStart === 0 ? $event.preventDefault() : null">
              </mat-form-field>
            </td>

            <td>
              <mat-form-field appearance="outline" class="table-field">
                <input matInput [(ngModel)]="row.contactTitle"
                       (ngModelChange)="onFieldChange(i, 'contactTitle', $event)"
                       maxlength="30">
              </mat-form-field>
            </td>

            <td>
              <mat-form-field appearance="outline" class="table-field">
                <input matInput [(ngModel)]="row.phoneNumber"
                       (ngModelChange)="onFieldChange(i, 'phoneNumber', $event)"
                       maxlength="10">
              </mat-form-field>
            </td>

            <td>
              <mat-form-field appearance="outline" class="table-field">
                <input matInput [(ngModel)]="row.faxNumber"
                       (ngModelChange)="onFieldChange(i, 'faxNumber', $event)"
                       maxlength="10">
              </mat-form-field>
            </td>

            <td>
              <button mat-icon-button class="delete-row-btn" (click)="onDeleteRow(i)"
                      [attr.aria-label]="'Delete contact ' + row.contactLastName">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="empty-state" *ngIf="editableRows.length === 0 && !isLoading">
      <span>No contacts. Click ADD NEW CONTACT to add one.</span>
    </div>
  </div>

  <div class="dialog-footer">
    <button mat-button class="btn-cancel" (click)="onReset()"
            [disabled]="dirtyRowIds.size === 0 || isSaving">
      CLEAR
    </button>
    <button mat-raised-button class="btn-save" (click)="onSave()"
            [disabled]="dirtyRowIds.size === 0 || isSaving">
      SAVE
    </button>
  </div>
</div>
