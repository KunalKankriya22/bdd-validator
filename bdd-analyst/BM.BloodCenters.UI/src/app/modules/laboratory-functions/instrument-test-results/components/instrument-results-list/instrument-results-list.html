<!-- ARIA Live Region -->
<div class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Layout Wrapper -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content -->
  <main class="instr-results main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Instrument Results content">

    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Card: action bar + table -->
    <div class="instr-results__card">

      <!-- Action Bar -->
      <div class="instr-results__action-bar">
        <div class="action-bar-left">
          <button
            type="button"
            class="filter-wrapper"
            [class.filter-wrapper--active]="isFilterPanelOpen"
            (click)="openFilter($event)"
            aria-label="Open filter panel">
            <mat-icon class="filter-icon" aria-hidden="true">filter_list</mat-icon>
            <span class="filter-text">FILTER</span>
          </button>
          @if (filterChips.length > 0) {
            <app-filter-chips
              [chips]="filterChips"
              [maxVisible]="3"
              (removeChip)="onRemoveFilterChip($event)"
              (clearAll)="clearAllFilters()">
            </app-filter-chips>
          }
        </div>
        <div class="action-bar-right">
          <button
            mat-raised-button
            color="primary"
            (click)="createRecord()"
            type="button"
            class="add-btn"
            aria-label="Add new instrument result">
            <mat-icon>add</mat-icon>
            ADD NEW RESULT
          </button>

          <app-search-bar
            [config]="searchConfig"
            [searchText]="searchText"
            (search)="onSearch($event)" />
        </div>
      </div>

      <!-- Error State -->
      @if (hasError && !isLoading) {
        <div class="instr-results__error" role="alert" aria-label="Error loading data">
          <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
          <p class="error-message">{{ errorMessage }}</p>
          <button type="button" mat-raised-button color="primary" (click)="loadData()">
            Retry
          </button>
        </div>
      }

      <!-- Data Table -->
      <div class="instr-results__table-wrapper">
        @if (!hasError) {
          <app-data-table
            [config]="tableConfig"
            [data]="dataSource"
            [loading]="isLoading"
            (sortChange)="onSortChange($event)"
            (rowAction)="onRowAction($event)"
            [keepActiveRow]="sidePanelOpen" />
        }
      </div>

    </div>
  </main>

  <!-- Side Panel -->
  @if (sidePanelOpen) {
    <div class="side-panel-container">
      @if (sidePanelMode === 'add') {
        <app-add-result-panel
          [machineId]="machineId"
          [testId]="testId"
          (saveSuccess)="onSaveSuccess()"
          (closePanel)="closeSidePanel()" />
      }
      @if (sidePanelMode === 'edit' && sidePanelData) {
        <app-edit-result-panel
          [resultData]="sidePanelData"
          (saveSuccess)="onSaveSuccess()"
          (closePanel)="closeSidePanel()" />
      }
    </div>
  }

</div>
