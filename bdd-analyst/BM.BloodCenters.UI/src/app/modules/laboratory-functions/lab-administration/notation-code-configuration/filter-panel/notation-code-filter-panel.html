<section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content" aria-label="Notation code filter form">

    <!-- Notation Code -->
    <mat-form-field appearance="fill">
      <mat-label>Notation Code</mat-label>
      <input
        matInput
        formControlName="notationCode"
        placeholder="Enter notation code..."
        maxlength="10">
    </mat-form-field>

    <!-- Type of Code -->
    <mat-form-field appearance="fill">
      <mat-label>Type of Code</mat-label>
      <mat-select formControlName="notationType">
        @for (option of notationTypeOptions; track option.key) {
          <mat-option [value]="option.key">{{ option.value }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-button type="button" (click)="onClear()">
      CLEAR
    </button>
    <button mat-raised-button color="primary" type="button" (click)="onApply()">
      APPLY
    </button>
  </footer>

</section>
