<div class="association-warning-dialog">
  <div class="dialog-header">
    <mat-icon class="warning-icon" aria-hidden="true">warning</mat-icon>
    <h1 mat-dialog-title [id]="elementId('title')" style="font-size: 18px; font-weight: 600; margin: 0;">
      This Collection ID (FIN) is associated to other contracts.
    </h1>
  </div>

  <mat-dialog-content>
    <div class="associations-table-container">
      <table
        mat-table
        [dataSource]="data.associations"
        class="associations-table"
        [attr.aria-label]="'Contracts associated with Collection ID ' + data.collId">

        <!-- Contract Column -->
        <ng-container matColumnDef="contract">
          <th mat-header-cell *matHeaderCellDef [id]="labelId('contract-header')">Contract</th>
          <td mat-cell *matCellDef="let association">{{ association.contractId }}</td>
        </ng-container>

        <!-- Company Name Column -->
        <ng-container matColumnDef="companyName">
          <th mat-header-cell *matHeaderCellDef [id]="labelId('company-header')">Company Name</th>
          <td mat-cell *matCellDef="let association">{{ association.companyName }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <p class="dialog-message" [id]="elementId('message')">
      Allow the same Collection ID (FIN) to be assigned to the contract.
    </p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-button
      (click)="onNoAssign()"
      [id]="elementId('no-btn')"
      class="no-assign-btn">
      NO, DON'T ASSIGN
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="onYesAssign()"
      [id]="elementId('yes-btn')"
      class="yes-assign-btn">
      YES, ASSIGN IT
    </button>
  </mat-dialog-actions>
</div>
