<div class="comments-dialog-container" role="dialog" [attr.aria-labelledby]="elementId('title')">
  <!-- Dialog Header -->
  <div class="dialog-header">
    <h2 mat-dialog-title [id]="elementId('title')">Comments</h2>
    <button
      mat-icon-button
      class="close-button"
      (click)="onCancel()"
      [id]="elementId('close-btn')"
      aria-label="Close comments dialog"
      type="button">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <!-- Dialog Content -->
  <mat-dialog-content>
    <form [formGroup]="form" [id]="elementId('form')">
      <mat-form-field appearance="outline" class="comments-field">
        <mat-label [id]="elementId('comments-label')">Comments</mat-label>
        <textarea
          matInput
          formControlName="comments"
          [id]="elementId('comments')"
          rows="8"
          [maxlength]="maxLength"
          placeholder="This is a note to be placed"
          [attr.aria-labelledby]="elementId('comments-label')"
          [attr.aria-describedby]="f['comments'].invalid ? errorId('comments') : elementId('char-count')"
          [attr.aria-invalid]="f['comments'].invalid"></textarea>
        <mat-hint align="end" [id]="elementId('char-count')">
          Characters Remaining: {{ charactersRemaining() }}/{{ maxLength }}
        </mat-hint>
        @if (f['comments'].invalid && f['comments'].touched) {
          <mat-error [id]="errorId('comments')">
            @if (f['comments'].errors?.['maxlength']) {
              Comments cannot exceed {{ maxLength }} characters
            }
          </mat-error>
        }
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <!-- Dialog Actions -->
  <mat-dialog-actions align="end">
    <button
      mat-button
      type="button"
      (click)="onCancel()"
      [id]="elementId('cancel-btn')"
      class="cancel-button">
      CANCEL
    </button>
    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="onSave()"
      [id]="elementId('save-btn')"
      [disabled]="form.invalid"
      class="save-button">
      SAVE
    </button>
  </mat-dialog-actions>
</div>
