<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">
  <!-- Main Content -->
  <div class="main-content">
    <!-- Page Header -->
    <app-page-header-with-breadcrumb [config]="pageHeaderConfig" />

    <!-- Card Container -->
    <div class="card" #tableCard>
      <!-- Controls Section -->
      <div class="controls">
        <!-- Left Section: Filter Button + Filter Chips -->
        <div class="controls-left">
          <button
            #filterButton
            mat-stroked-button
            type="button"
            class="filter-btn"
            [class.active]="filterChips.length > 0"
            (click)="openFilterPanel()">
            <mat-icon>filter_list</mat-icon>
            <span class="filter-label">FILTER</span>
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips
            *ngIf="filterChips.length > 0"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="onClearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right Section: Search Bar -->
        <div class="controls-right">
          <app-search-bar
            [config]="searchBarConfig"
            (search)="onSearch($event)">
          </app-search-bar>
        </div>
      </div>

      <!-- Data Table -->
      <div class="table-wrapper">
        <app-data-table
          [config]="dataTableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)">
        </app-data-table>
      </div>
    </div>
  </div>

  <!-- Side Panel -->
  <div class="side-panel" *ngIf="sidePanelOpen">
    <app-add-edit-day-status
      #sideDrawer
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      [resourceCodes]="resourceCodes"
      [statusCodes]="statusCodes"
      (save)="onSave($event)"
      (saveAndCreateAnother)="onSaveAndCreateAnother($event)"
      (close)="closeSideDrawer()">
    </app-add-edit-day-status>
  </div>
</div>
