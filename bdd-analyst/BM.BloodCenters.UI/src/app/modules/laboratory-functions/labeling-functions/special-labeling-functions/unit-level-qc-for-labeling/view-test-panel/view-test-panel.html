<div class="view-test-panel">
  <!-- Header -->
  <div class="panel-header">
    <h2 class="panel-heading">Scheduled and Unscheduled Tests for (Unit ID {{ unitId() }})</h2>
    <button
      mat-icon-button
      type="button"
      aria-label="Close panel"
      class="panel-close-btn"
      (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Scrollable Content -->
  <div class="panel-body">
    <!-- Unit Tests Scheduled -->
    <div class="table-section">
      <h3 class="section-title">Unit Tests Scheduled</h3>
      <div class="table-container">
        <app-data-table
          [config]="scheduledTableConfig"
          [data]="scheduledTests()"
          [loading]="false">
        </app-data-table>
      </div>
    </div>

    <!-- Unit Test Not Scheduled -->
    <div class="table-section">
      <h3 class="section-title">Unit Test Not Scheduled</h3>
      <div class="table-container">
        <app-data-table
          [config]="unscheduledTableConfig"
          [data]="unscheduledTests()"
          [loading]="false">
        </app-data-table>
      </div>
    </div>
  </div>
</div>
