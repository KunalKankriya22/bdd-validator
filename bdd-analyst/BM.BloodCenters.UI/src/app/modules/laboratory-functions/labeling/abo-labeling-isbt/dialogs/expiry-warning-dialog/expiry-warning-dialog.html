<div class="expiry-warning-dialog" role="alertdialog" [attr.aria-labelledby]="elementId('title')">
  <h2 mat-dialog-title [id]="elementId('title')">Warning</h2>

  <mat-dialog-content>
    <p [id]="elementId('message')">Product has already expired. Do you want to continue?</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-button
      type="button"
      [id]="elementId('no-btn')"
      (click)="onNo()"
      cdkFocusInitial>
      No
    </button>
    <button
      mat-raised-button
      color="primary"
      type="button"
      [id]="elementId('yes-btn')"
      (click)="onYes()">
      Yes
    </button>
  </mat-dialog-actions>
</div>
