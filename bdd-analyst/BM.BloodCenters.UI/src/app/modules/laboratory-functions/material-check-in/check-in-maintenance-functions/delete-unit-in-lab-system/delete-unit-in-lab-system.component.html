<!-- Layout Wrapper -->
<div class="layout-wrapper">

  <!-- Main Content Area -->
  <main class="delete-unit-in-lab-system main-content" [attr.aria-label]="'Delete Unit in Lab System content'">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Single Card Container -->
    <div class="delete-unit-in-lab-system__card" #tableCard>

      <!-- Search Section - Always visible at top -->
      <div class="delete-unit-in-lab-system__search-card">
        <div class="unit-id-field-wrapper">
          <app-unit-id-field
            [validateFfValue]="'Y'"
            [label]="unitIdLabel"
            [required]="true"
            [skipDoubleEntry]="false"
            [hintDefault]="''"
            (validated)="onUnitValidated($event)"
            (cleared)="onUnitCleared()"
            class="unit-id-field"
          />
          <svg class="barcode-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M10.9456 0V8.96" stroke="#3D5463" stroke-width="1.33333"/>
            <path d="M12.8655 0V8.96" stroke="#3D5463" stroke-width="0.64"/>

3206 13.1639 14.205 13.2951 14.1113C13.4264 14.0154 13.5889 13.9435 13.7826 13.8956C13.9785 13.8456 14.2024 13.8206 14.4545 13.8206H15.0107Z" fill="#3D5463"/>

        </div>
      </div>

      <!-- Empty State (shown initially below search) -->
      @if (!unitFound() && !searching()) {
        <div class="delete-unit-in-lab-system__empty" role="status" aria-live="polite">
          <svg class="empty-icon" width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M0 32C0 14.3269 14.3269 0 32 0C49.6731 0 64 14.3269 64 32C64 49.6731 49.6731 64 32 64C14.3269 64 0 49.6731 0 32Z" fill="#E4E7E9"/>

          </svg>
          <p class="empty-title">No Results to Display</p>
          <p class="empty-message">Please enter search criteria to view results</p>
        </div>
      }

      <!-- Searching State -->
      @if (searching()) {
        <div class="delete-unit-in-lab-system__loading" role="status" aria-live="polite">
          <mat-spinner diameter="40" [attr.aria-label]="'Searching for unit'"></mat-spinner>
          <p>Searching...</p>
        </div>
      }

      <!-- Unit Found - Show Table with Actions -->
      @if (unitFound() && unitData() && !deleting()) {
        <div class="delete-unit-in-lab-system__results">
          <div class="results-actions">
            <button
              type="button"
              class="delete-button-svg"
              (click)="onDelete()"
              [disabled]="!canDelete()"
              aria-label="Delete unit">
              <svg width="100" height="36" viewBox="0 0 100 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="0.5" y="0.5" width="99" height="35" rx="3.5" stroke="#1a6269"/>
                <path d="M28 10H24.5L23.5 9H18.5L17.5 10H14V12H28V10ZM15 25C15 25.5304 15.2107 26.0391 15.5858 26.4142C15.9609 26.7893 16.4696 27 17 27H25C25.5304 27 26.0391 26.7893 26.4142 26.4142C26.7893 26.0391 27 25.5304 27 25V13H15V25Z" fill="#1a6269"/>
                <path d="M41.9033 23H39.7773L39.791 21.6396H41.9033C42.5186 21.6396 43.0335 21.5052 43.4482 21.2363C43.8675 20.9674 44.182 20.5824 44.3916 20.0811C44.6058 19.5798 44.7129 18.9827 44.7129 18.29V17.75C44.7129 17.2122 44.6514 16.736 44.5283 16.3213C44.4098 15.9066 44.2321 15.5579 43.9951 15.2754C43.7627 14.9928 43.4756 14.7786 43.1338 14.6328C42.7965 14.487 42.4069 14.4141 41.9648 14.4141H39.7363V13.0469H41.9648C42.6257 13.0469 43.2295 13.1585 43.7764 13.3818C44.3232 13.6006 44.7949 13.9173 45.1914 14.332C45.5924 14.7467 45.9001 15.2435 46.1143 15.8223C46.3285 16.401 46.4355 17.0482 46.4355 17.7637V18.29C46.4355 19.0055 46.3285 19.6527 46.1143 20.2314C45.9001 20.8102 45.5924 21.307 45.1914 21.7217C44.7904 22.1318 44.3118 22.4486 43.7559 22.6719C43.2044 22.8906 42.5869 23 41.9033 23ZM40.7275 13.0469V23H39.0117V13.0469H40.7275ZM54.6729 21.6396V23H49.3887V21.6396H54.6729ZM49.874 13.0469V23H48.1582V13.0469H49.874ZM53.9824 17.2031V18.543H49.3887V17.2031H53.9824ZM54.6387 13.0469V14.4141H49.3887V13.0469H54.6387ZM62.3086 21.6396V23H57.3115V21.6396H62.3086ZM57.79 13.0469V23H56.0742V13.0469H57.79ZM70.1494 21.6396V23H64.8652V21.6396H70.1494ZM65.3506 13.0469V23H63.6348V13.0469H65.3506ZM69.459 17.2031V18.543H64.8652V17.2031H69.459ZM70.1152 13.0469V14.4141H64.8652V13.0469H70.1152ZM75.7822 13.0469V23H74.0801V13.0469H75.7822ZM78.9062 13.0469V14.4141H70.9834V13.0469H78.9062ZM86.7334 21.6396V23H81.4492V21.6396H86.7334ZM81.9346 13.0469V23H80.2188V13.0469H81.9346ZM86.043 17.2031V18.543H81.4492V17.2031H86.043ZM86.6992 13.0469V14.4141H81.4492V13.0469H86.6992Z" fill="#1a6269"/>
              </svg>
            </button>
            <app-search-bar
              [config]="tableSearchConfig"
              (search)="onTableSearch($event)" />
          </div>

          <app-data-table
            [data]="filteredTableData()"
            [config]="tableConfig"
            [loading]="searching()">
          </app-data-table>
        </div>
      }

      <!-- Deleting State -->
      @if (deleting()) {
        <div class="delete-unit-in-lab-system__deleting" role="status" aria-live="polite">
          <mat-spinner diameter="48" [attr.aria-label]="'Deleting unit'"></mat-spinner>
          <p>Deleting unit data...</p>
        </div>
      }

    </div>
  </main>

</div>
