<div class="page-container">
  <div class="content-wrapper">
    <!-- Page Header -->
    <app-page-header-with-breadcrumb [config]="pageHeaderConfig"></app-page-header-with-breadcrumb>

    <!-- Table Card -->
    <div class="table-card" #tableCard>
      <!-- Table Header (Filter + Search) -->
      <div class="table-header">
        <!-- Left: Filter + Chips -->
        <div class="table-header-left">
          <button
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterActive"
            aria-label="Open filter panel"
            [attr.aria-expanded]="isFilterOpen"
            (click)="openFilterPanel()">
            <mat-icon aria-hidden="true">filter_list</mat-icon>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips
            *ngIf="filterChips.length > 0"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="onClearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right: Search -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)">
        </app-search-bar>
      </div>

      <!-- Data Table -->
      <app-data-table
        [config]="tableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)">
      </app-data-table>
    </div>
  </div>
</div>
