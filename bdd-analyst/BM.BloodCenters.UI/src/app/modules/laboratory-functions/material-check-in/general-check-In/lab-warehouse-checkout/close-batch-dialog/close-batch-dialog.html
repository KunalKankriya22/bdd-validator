<div class="close-batch-dialog" role="alertdialog" aria-modal="true" [attr.aria-labelledby]="'close-batch-title'">

  <h2 id="close-batch-title" class="close-batch-dialog__title">{{ data.title }}</h2>

  <div class="close-batch-dialog__content">
    <p>{{ data.message }}</p>
  </div>

  <div class="close-batch-dialog__actions">
    <button
      mat-button
      type="button"
      class="close-batch-dialog__cancel-btn"
      (click)="onCancel()"
      [attr.aria-label]="data.cancelText">
      {{ data.cancelText }}
    </button>

    <button
      mat-raised-button
      type="button"
      class="close-batch-dialog__confirm-btn primary-btn"
      (click)="onConfirm()"
      [attr.aria-label]="data.confirmText">
      {{ data.confirmText }}
    </button>
  </div>

</div>
