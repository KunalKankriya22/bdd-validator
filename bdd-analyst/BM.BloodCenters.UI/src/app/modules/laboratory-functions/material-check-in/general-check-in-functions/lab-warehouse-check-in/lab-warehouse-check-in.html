<div class="layout-wrapper">

  <div class="main-content">
    <h1 class="cdk-visually-hidden">{{ headerConfig?.title || 'Lab Warehouse Check-In' }}</h1>
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <main class="page-main">

      <div class="cdk-visually-hidden" aria-live="polite" aria-atomic="true">
        @if (isLoading()) {
          Processing, please wait...
        }
      </div>

      <!-- Card 1: Temperature + CLEAR Button -->
      <div class="filter-card" [formGroup]="filterForm" role="group" aria-label="Temperature entry">
        <mat-form-field appearance="fill">
          <mat-label>Temperature (Celsius)</mat-label>
          <input
            #temperatureInput
            matInput
            type="text"
            formControlName="temperature"
            (keypress)="onlyNumbers($event)"
            (blur)="formatTemperature()"
            placeholder="0.00"
            required
            aria-required="true"
            inputmode="decimal"
          />
          @if (getTemperatureError(); as error) {
            <mat-error>{{ error }}</mat-error>
          }
        </mat-form-field>

        <button type="button" mat-button class="btn-clear" (click)="clearAll()">
          CLEAR
        </button>
      </div>

      <!-- Card 2: Unit ID + Collection Date + Product Code -->
      <div class="filter-card" role="group" aria-label="Unit identification">
        <app-unit-id-field
          #unitIdField
          [required]="true"
          [label]="'Unit ID'"
          [placeholder]="'Scan or type Unit ID'"
          [showBarcodeIcon]="true"
          [validateFfValue]="'N'"
          [scanPatterns]="SCAN_PATTERNS_UNIT_ID"
          (postValidate)="onPostValidate($event)"
          (cleared)="currentUnitId.set(null)"
        ></app-unit-id-field>

        <mat-form-field appearance="fill" floatLabel="always" class="readonly-field">
          <mat-label>Collection Date</mat-label>
          <input matInput [value]="formatDate(collectionDate()) || ''" placeholder="—" readonly tabindex="-1"
                 [attr.aria-label]="'Collection Date: ' + (formatDate(collectionDate()) || 'not yet populated')" />
        </mat-form-field>

        <app-scan-select-field
          #productCodeField
          [label]="'Product Code'"
          [placeholder]="'Scan or select product code'"
          [showBarcodeIcon]="true"
          [disabled]="productCodeDisabled()"
          [scanPatterns]="SCAN_PATTERNS_PRODUCT"
          [options]="productCodeScanOptions()"
          [parseFn]="parseProductCode"
          (valueChanged)="onProductCodeChanged($event)"
          (cleared)="onProductCodeCleared()"
        />
      </div>

      <!-- Card 3: Warehouse Section & History Table -->
      <div class="table-container-card">
        <div aria-live="polite">
          @if (warehouseLocation()) {
            <div class="warehouse-section" role="status" aria-label="Current warehouse location">
              <mat-icon aria-hidden="true">format_list_bulleted</mat-icon>
              <span>{{ warehouseLocation() }}</span>
            </div>
          }
        </div>

        <div class="content-card">
          <app-data-table
            [config]="tableConfig"
            [data]="sessionCheckins()"
            [loading]="isLoading()"
            (pageChange)="onPageChange($event)"
            (sortChange)="onSortChange($event)">
          </app-data-table>
        </div>
      </div>

    </main>
  </div>

</div>
