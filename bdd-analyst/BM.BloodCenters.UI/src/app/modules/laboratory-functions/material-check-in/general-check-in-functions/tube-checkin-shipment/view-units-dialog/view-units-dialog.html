<div class="side-panel-wrapper">
  <!-- Header -->
  <div class="panel-header">
    <h2 id="view-units-dialog-title" class="panel-title">View Units in the box</h2>
    <button
      type="button"
      mat-icon-button
      class="close-btn"
      aria-label="Close panel"
      (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Content -->
  <div class="panel-body">
    <!-- Shared Data Table -->
    <app-data-table
      [config]="tableConfig"
      [data]="tableData"
      [loading]="false">
    </app-data-table>

    <!-- Counts - Below Table, Above Footer -->
    <dl class="counts-section">
      <div class="count-item">
        <dt class="count-label">Total Unit Count</dt>
        <dd class="count-value">{{ data.unitCount }}</dd>
      </div>
      <div class="count-item">
        <dt class="count-label">Total Tube Count</dt>
        <dd class="count-value">{{ data.tubeCount }}</dd>
      </div>
    </dl>
  </div>

  <!-- Footer -->
  <div class="panel-footer">
    <button
      type="button"
      mat-raised-button
      class="primary-btn"
      (click)="onClose()"
      aria-label="Close view units panel">
      CLOSE
    </button>
  </div>
</div>
