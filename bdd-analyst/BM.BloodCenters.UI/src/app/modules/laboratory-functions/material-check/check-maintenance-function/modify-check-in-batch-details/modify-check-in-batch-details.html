<div class="page-container">
  <div class="content-wrapper">
    <!-- Page Header -->
    <app-page-header-with-breadcrumb [config]="pageHeaderConfig"></app-page-header-with-breadcrumb>

    <!-- Table Card -->
    <div class="table-card" #tableCard>
      <!-- Table Header (Filter + Search) -->
      <div class="table-header">
        <!-- Left: Filter + Chips -->
        <div class="table-header-left">
          <button
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterActive"
            aria-label="Open filter panel"
            [attr.aria-expanded]="isFilterOpen"
            (click)="openFilterPanel()">
            <mat-icon aria-hidden="true">filter_list</mat-icon>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips
            *ngIf="filterChips.length > 0"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="onClearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right: Search -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)">
        </app-search-bar>
      </div>

      <!-- Data Table -->
      <app-data-table
        [config]="tableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)">
      </app-data-table>
    </div>
  </div>

  <!-- Edit Panel (Side Drawer) -->
  <div class="side-panel-overlay" *ngIf="editPanelOpen" (click)="closeEditPanel()"></div>
  <div class="side-panel side-panel--edit" *ngIf="editPanelOpen">
    <div class="side-panel__header">
      <h2>Edit Batch Details - {{ selectedBatch?.batchId }}</h2>
      <button mat-icon-button (click)="closeEditPanel()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div class="side-panel__content">
      <app-edit-batch-form
        *ngIf="selectedBatch"
        [batch]="selectedBatch"
        [productTypeOptions]="productTypeOptions"
        (save)="onSaveBatch($event)"
        (cancel)="closeEditPanel()">
      </app-edit-batch-form>
    </div>
  </div>

  <!-- Comments Panel (Side Drawer) - Placeholder -->
  <div class="side-panel-overlay" *ngIf="commentsPanelOpen" (click)="closeCommentsPanel()"></div>
  <div class="side-panel side-panel--comments" *ngIf="commentsPanelOpen">
    <div class="side-panel__header">
      <h2>Comments</h2>
      <button mat-icon-button (click)="closeCommentsPanel()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div class="side-panel__content">
      <div class="comments-input">
        <label>Comment</label>
        <div class="textarea-wrapper">
          <textarea placeholder="Enter comment..."></textarea>
        </div>
        <button mat-raised-button>ADD</button>
      </div>
      <div class="comments-list">
        <p class="placeholder-text">
          Comments list will be displayed here.<br><br>
          Batch ID: {{ selectedBatch?.batchId }}
        </p>
      </div>
    </div>
    <div class="side-panel__footer">
      <button mat-stroked-button (click)="closeCommentsPanel()">CLOSE</button>
    </div>
  </div>
</div>
