<div class="page-container">
  <div class="content-wrapper">
    <!-- Page Header -->
    <app-page-header-with-breadcrumb [config]="pageHeaderConfig"></app-page-header-with-breadcrumb>

    <!-- Table Card -->
    <div class="table-card" #tableCard>
      <!-- Table Header (Filter + Search) -->
      <div class="table-header">
        <!-- Left: Filter + Chips -->
        <div class="table-header-left">
          <button
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterActive"
            aria-label="Open filter panel"
            [attr.aria-expanded]="isFilterOpen"
            (click)="openFilterPanel()">
            <mat-icon aria-hidden="true">filter_list</mat-icon>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips
            *ngIf="filterChips.length > 0"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="onClearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right: Search -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)">
        </app-search-bar>
      </div>

      <!-- Error State -->
      <div
        *ngIf="hasError && !isLoading"
        class="modify-check-in-batch__error"
        role="alert"
        aria-label="Error loading data">
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <p class="error-message">Unable to load data. Please try again.</p>
        <button type="button" mat-raised-button color="primary" (click)="loadData()">
          Retry
        </button>
      </div>

      <!-- Data Table -->
      <app-data-table
        *ngIf="!hasError"
        [config]="tableConfig"
        [data]="dataSource"
        [loading]="isLoading"
        [highlightedRow]="selectedBatch"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSortChange($event)"
        (rowAction)="onRowAction($event)">
      </app-data-table>
    </div>
  </div>

  <!-- Edit Panel (Side Drawer) -->
  <div class="side-panel-overlay" *ngIf="editPanelOpen"></div>
  <div class="side-panel side-panel--edit" *ngIf="editPanelOpen">
    <div class="side-panel__header">
      <h2>Edit Batch Details - {{ selectedBatch?.batchId }}</h2>
      <button mat-icon-button (click)="closeEditPanel()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div class="side-panel__content">
      <app-edit-batch-form
        *ngIf="selectedBatch"
        [batch]="selectedBatch"
        [productTypeOptions]="productTypeOptions"
        (save)="onSaveBatch($event)"
        (cancel)="closeEditPanel()">
      </app-edit-batch-form>
    </div>
  </div>

  <!-- Comments Panel (Side Drawer) -->
  <div class="side-panel-overlay" *ngIf="commentsPanelOpen"></div>
  <div class="side-panel side-panel--comments" *ngIf="commentsPanelOpen">
    <app-batch-comments-panel
      [batchId]="selectedBatch?.batchId ?? null"
      (closePanel)="closeCommentsPanel()"
      (dataChanged)="loadData()">
    </app-batch-comments-panel>
  </div>
</div>
