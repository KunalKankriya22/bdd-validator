<div class="filter-panel" role="dialog" aria-modal="true" [attr.aria-labelledby]="'filter-panel-heading'">
  <div class="filter-panel__header">
    <h2 id="filter-panel-heading">Filters</h2>
    <button mat-icon-button (click)="onClose()" [attr.aria-label]="'Close filter panel'" class="filter-panel__close-btn">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <form [formGroup]="filterForm" class="filter-panel__content" novalidate>
    <!-- Interdiction Type -->
    <mat-form-field appearance="fill" class="filter-field">
      <mat-label id="filter-interType-label">Type</mat-label>
      <mat-select formControlName="interType" placeholder="Select Type" [attr.aria-labelledby]="'filter-interType-label'">
        <mat-option *ngFor="let option of interTypeOptions" [value]="option.value">
          {{ option.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Interdiction Code -->
    <mat-form-field appearance="fill" class="filter-field">
      <mat-label id="filter-interCode-label">Interdiction Code</mat-label>
      <mat-select formControlName="interCode" placeholder="Select Interdiction Code" [attr.aria-labelledby]="'filter-interCode-label'">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="interCodeSearchControl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No matches found"
            [attr.aria-label]="'Search interdiction codes'">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let option of filteredInterCodeOptions" [value]="option.interCode">
          {{ getInterCodeDisplay(option) }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </form>

  <div class="filter-panel__footer">
    <button
      mat-stroked-button
      type="button"
      (click)="onClear()">
      CLEAR ALL
    </button>
    <button
      mat-raised-button
      type="button"
      (click)="onApply()"
      [disabled]="isApplyDisabled">
      APPLY
    </button>
  </div>
</div>
