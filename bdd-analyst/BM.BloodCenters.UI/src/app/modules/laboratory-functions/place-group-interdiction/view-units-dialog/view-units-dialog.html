<div class="panel-container" role="region" [attr.aria-labelledby]="elementId('heading')">
  <!-- Panel Header -->
  <div class="panel-header">
    <h2 [id]="elementId('heading')">View Units in this Group</h2>
    <button
      mat-icon-button
      class="close-btn"
      (click)="onCancel()"
      [id]="elementId('close-btn')"
      [attr.aria-label]="'Close view units panel'">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <!-- Panel Content -->
  <div class="panel-content">
    <!-- Error State -->
    @if (error()) {
      <div class="error-container" role="alert" aria-live="assertive">
        <mat-icon aria-hidden="true">error</mat-icon>
        <p>{{ error() }}</p>
        <button mat-button color="primary" (click)="loadAffectedUnits()">
          Retry
        </button>
      </div>
    }

    <!-- Units Data Table -->
    @if (!error()) {
      <app-data-table
        [config]="tableConfig"
        [data]="tableData"
        [loading]="loading()" />
    }
  </div>

  <!-- Panel Footer -->
  <div class="panel-footer">
    @if (hasUnits()) {
      <button
        mat-button
        type="button"
        class="clear-btn"
        (click)="onClearAll()"
        [id]="elementId('clear-all-btn')"
        [attr.aria-label]="'Clear units preview'">
        CLEAR ALL
      </button>
    }

    <button
      mat-stroked-button
      type="button"
      class="cancel-btn"
      (click)="onCancel()"
      [id]="elementId('cancel-btn')">
      CANCEL
    </button>
  </div>
</div>
