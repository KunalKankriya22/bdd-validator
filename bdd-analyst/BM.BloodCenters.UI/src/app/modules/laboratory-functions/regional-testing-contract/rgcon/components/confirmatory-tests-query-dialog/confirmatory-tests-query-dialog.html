<div class="dialog-container">
  <!-- Header -->
  <div class="dialog-header">
    <h2 mat-dialog-title>Customer Override of Confirmatory Tests Query</h2>
    <button type="button" mat-icon-button (click)="onClose()" class="close-button" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Content -->
  <mat-dialog-content class="dialog-content">
    <!-- Loading State -->
    @if (loading()) {
      <div class="loading-container" role="status" aria-live="polite">
        <mat-spinner diameter="40" aria-label="Loading confirmatory tests"></mat-spinner>
        <p>Loading confirmatory tests...</p>
      </div>
    }

    @if (!loading()) {
      <div class="query-layout">
        <!-- Reactive Tests Section -->
        <div class="reactive-tests-section">
          <h3 class="section-title">Reactive Tests</h3>
          <app-data-table
            [config]="reactiveTestsTableConfig"
            [data]="reactiveTests()"
            [loading]="false">
          </app-data-table>
        </div>

        <!-- Confirmatory Tests Section -->
        <div class="confirmatory-tests-section">
          <h3 class="section-title">Confirmatory Tests</h3>
          <app-data-table
            [config]="confirmatoryTestsTableConfig"
            [data]="confirmatoryTests()"
            [loading]="false">
          </app-data-table>
        </div>
      </div>
    }
  </mat-dialog-content>

  <!-- Actions -->
  <mat-dialog-actions class="dialog-actions">
    <button type="button" mat-raised-button (click)="onClose()">CLOSE</button>
  </mat-dialog-actions>
</div>
