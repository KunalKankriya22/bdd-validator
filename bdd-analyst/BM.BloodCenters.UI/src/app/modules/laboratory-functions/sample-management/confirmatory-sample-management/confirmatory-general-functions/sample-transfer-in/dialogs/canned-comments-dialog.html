<div class="canned-comments-dialog">
  <div class="dialog-header">
    <div class="header-left">
      <button mat-icon-button class="back-button" (click)="onExit()" aria-label="Go back">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h2>Multi Select List of Canned Comments</h2>
    </div>
    <button mat-icon-button class="close-button" (click)="onExit()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <div class="search-row">
      <mat-form-field appearance="fill" class="search-field">
        <mat-label>Find</mat-label>
        <input matInput [formControl]="searchCtrl" (keyup.enter)="onSearch()" autocomplete="off">
        <mat-icon matSuffix class="search-icon">arrow_drop_down</mat-icon>
      </mat-form-field>
    </div>

    <div class="comments-table">
      <div class="table-header">
        <div class="col col--check"></div>
        <div class="col col--code">Code</div>
        <div class="col col--desc">Description</div>
      </div>
      <div class="table-body">
        @for (item of filteredItems(); track item.code) {
          <div class="table-row" (click)="toggleItem(item.code)">
            <div class="col col--check">
              <mat-checkbox
                [checked]="isChecked(item.code)"
                (change)="toggleItem(item.code)"
                (click)="$event.stopPropagation()"
                color="primary">
              </mat-checkbox>
            </div>
            <div class="col col--code">{{ item.code }}</div>
            <div class="col col--desc">{{ item.codeDesc }}</div>
          </div>
        }
        @if (filteredItems().length === 0) {
          <div class="table-empty">No comments found.</div>
        }
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <div class="dialog-footer">
      <button mat-stroked-button class="exit-btn" (click)="onExit()">EXIT</button>
      <button mat-raised-button color="primary" class="select-btn" (click)="onSelect()">SELECT</button>
    </div>
  </mat-dialog-actions>
</div>
