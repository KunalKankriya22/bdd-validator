<div class="sample-warning-dialog" role="dialog" [attr.aria-label]="dialogTitle">
  <h2 class="dialog-title">{{ dialogTitle }}</h2>

  <div class="dialog-body" role="alert">
    <p class="dialog-message">{{ displayMessage }}</p>
  </div>

  <div class="dialog-actions" role="group" aria-label="Dialog actions">
    <button
      type="button"
      mat-button
      (click)="onNo()"
      cdkFocusInitial
      class="no-button">
      No
    </button>
    <button
      type="button"
      mat-raised-button
      color="primary"
      (click)="onYes()"
      class="yes-button">
      Yes
    </button>
  </div>
</div>
