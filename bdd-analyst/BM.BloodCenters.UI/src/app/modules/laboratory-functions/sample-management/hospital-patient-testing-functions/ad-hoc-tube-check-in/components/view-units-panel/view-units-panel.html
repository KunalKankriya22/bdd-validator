<app-side-panel-base
  [title]="'View Units in the Batch'"
  [width]="'754px'"
  [footerButtons]="footerButtons"
  (closePanel)="onClosePanel()"
  (buttonClick)="onButtonClick($event)">

  <ng-container panelContent>
    @if (isLoading()) {
      <div class="loading-container" role="status" aria-label="Loading batch units">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    } @else {
      <app-data-table
        [config]="tableConfig"
        [data]="units()"
        [loading]="isLoading()"
        aria-label="Units in the batch">
      </app-data-table>
    }
  </ng-container>
</app-side-panel-base>
