@if (isOpen) {
  <div class="dialog-backdrop" aria-hidden="true" (click)="close()"></div>
}

<div class="dialog-modal" [class.open]="isOpen"
     [attr.role]="isOpen ? 'dialog' : null"
     [attr.aria-modal]="isOpen ? 'true' : null"
     [attr.aria-labelledby]="isOpen ? 'batch-panel-title' : null"
     [attr.inert]="isOpen ? null : ''"
     (keydown.escape)="close()">
  <div class="dialog-container" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">

    <!-- HEADER -->
    <div class="dialog-header">
      <h2 id="batch-panel-title" class="dialog-title">Test Batch Details</h2>
      <button mat-icon-button class="close-button" (click)="close()" aria-label="Close batch details panel">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- SUBTITLE -->
    <div class="dialog-subtitle">
      <div class="info-item">
        <span class="info-item__label">Test Kit ID</span>
        <span class="info-item__value">{{ testKitId || '-' }}</span>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="dialog-content">
      @if (loading()) {
        <div class="panel-loading" role="status" aria-live="polite" aria-busy="true">
          <mat-spinner diameter="32" aria-label="Loading batch details"></mat-spinner>
        </div>
      } @else if (error()) {
        <div class="panel-error" role="alert" aria-live="assertive">
          <mat-icon aria-hidden="true">error</mat-icon>
          <p>{{ error() }}</p>
        </div>
      } @else {
        <app-data-table
          [data]="dataSource()"
          [config]="tableConfig"
          [loading]="loading()">
        </app-data-table>
      }
    </div>

    <!-- FOOTER -->
    <div class="dialog-footer">
      <button mat-stroked-button class="dialog-footer__btn" (click)="close()" aria-label="Close batch details panel">Close</button>
    </div>

  </div>
</div>
