<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen()">

  <main class="trr-main-content main-content"
        [class.side-panel-active]="sidePanelOpen()"
        role="main"
        [attr.aria-labelledby]="elementId('main-heading')">

    <app-page-header-with-breadcrumb
      [config]="headerConfig"
      [id]="elementId('page-header')">
    </app-page-header-with-breadcrumb>

    <div class="trr-card">

      <div class="trr-controls">
        <app-search-bar
          [config]="searchConfig"
          (searchTextChange)="onSearch($event)"
          [id]="elementId('search-bar')">
        </app-search-bar>
      </div>

      <div class="trr-table-wrapper">
        @if (loading()) {
          <div class="loading-container" role="status" aria-live="polite" aria-busy="true">
            <mat-icon class="loading-spinner">refresh</mat-icon>
            <span>{{ tableConfig.loadingMessage }}</span>
          </div>
        } @else if (error()) {
          <div class="error-container" role="alert" aria-live="assertive">
            <mat-icon aria-hidden="true">error</mat-icon>
            <p>{{ error() }}</p>
            <button mat-raised-button color="primary" (click)="loadOpenBatches()">
              Retry
            </button>
          </div>
        } @else {
          <app-data-table
            [config]="tableConfig"
            [data]="paginatedData()"
            (pageChange)="onPageChange($event)"
            (rowAction)="onRowAction($event)"
            [id]="elementId('data-table')">
          </app-data-table>
        }
      </div>
    </div>
  </main>

  @if (sidePanelOpen()) {
    <div class="side-panel-container">
      <app-override-test-result-panel
        [tbId]="selectedBatch() || ''"
        [testId]="selectedTest() || ''"
        [testDesc]="getCurrentTestDesc()"
        [unit]="getCurrentUnit()!"
        [validResults]="validResults()"
        (closePanel)="onCloseSidePanel()"
        (confirmReconciliation)="onConfirmReconciliation($event)">
      </app-override-test-result-panel>
    </div>
  }

</div>
