<div class="dialog-container" role="dialog" aria-modal="true" aria-labelledby="edit-dialog-title">
  <!-- Header -->
  <div class="dialog-header">
    <div class="dialog-header-text">
      <h2 id="edit-dialog-title" class="dialog-title">Edit</h2>
    </div>
    <button mat-icon-button class="close-button" aria-label="Close edit dialog" (click)="cancel()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <!-- Content -->
  <div class="dialog-content">
    <!-- Read-only fields -->
    <div class="read-only-fields">
      <div class="field-display-card">
        <dt class="field-label">Test ID</dt>
        <dd class="field-value">{{ testId }}</dd>
      </div>
      <div class="field-display-card">
        <dt class="field-label">Description</dt>
        <dd class="field-value">{{ testDesc || '-' }}</dd>
      </div>
    </div>

    <!-- Editable form -->
    <form [formGroup]="form" class="edit-form">
      <mat-form-field class="form-field" appearance="fill">
        <mat-label>Test Kit</mat-label>
        <mat-select
          formControlName="testKitId"
          required
          aria-required="true"
          (openedChange)="onTestKitDropdownOpened($event)">
          <mat-option>
            <ngx-mat-select-search
              [formControl]="testKitSearchControl"
              placeholderLabel="Search test kits..."
              noEntriesFoundLabel="No matching test kits">
            </ngx-mat-select-search>
          </mat-option>
          <mat-option *ngIf="isLoadingTestKits" disabled>
            Loading...
          </mat-option>
          <mat-option *ngFor="let kit of filteredTestKitOptions" [value]="kit.testKitId">
            {{ kit.displayName }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('testKitId')?.hasError('required')">Test Kit is required</mat-error>
      </mat-form-field>
    </form>
  </div>

  <!-- Footer -->
  <div class="dialog-actions">
    <button mat-button class="cancel-button" (click)="cancel()">CANCEL</button>
    <button
      mat-raised-button
      color="primary"
      [disabled]="!isFormValid || isSubmitting"
      (click)="onSave()"
      [attr.aria-busy]="isSubmitting"
      [attr.aria-label]="isSubmitting ? 'Saving changes, please wait' : 'Save changes'">
      <mat-spinner *ngIf="isSubmitting" diameter="20" aria-hidden="true"></mat-spinner>
      <span *ngIf="!isSubmitting">SAVE</span>
      <span *ngIf="isSubmitting" class="cdk-visually-hidden">Processing...</span>
    </button>
  </div>
</div>
