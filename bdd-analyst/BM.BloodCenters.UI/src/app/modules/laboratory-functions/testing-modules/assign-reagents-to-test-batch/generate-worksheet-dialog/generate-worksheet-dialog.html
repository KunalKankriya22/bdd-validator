<div class="dialog-container" role="dialog" aria-modal="true" aria-labelledby="worksheet-dialog-title">
  <!-- Header -->
  <div class="dialog-header">
    <div class="dialog-header-text">
      <h2 id="worksheet-dialog-title" class="dialog-title">Generate Worksheets</h2>
      <p class="dialog-subtitle">Select tests and printer to generate worksheets</p>
    </div>
    <button mat-icon-button class="close-button" aria-label="Close dialog" (click)="cancel()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <!-- Content -->
  <div class="dialog-content">
    <!-- Printer Selection -->
    <div class="printer-section" *ngIf="printers.length > 0">
      <mat-form-field appearance="fill" class="printer-field">
        <mat-label>Printer</mat-label>
        <mat-select [formControl]="printerControl" required aria-required="true">
          <mat-option *ngFor="let printer of printers" [value]="printer.printerId">
            {{ printer.printerDescription || printer.printerId }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Test Selection -->
    <div class="select-all-row" *ngIf="tests.length > 0">
      <mat-checkbox
        [(ngModel)]="selectAll"
        (change)="onSelectAllChange()"
        color="primary"
        aria-label="Select all tests">
        Select All ({{ selectedCount }}/{{ tests.length }})
      </mat-checkbox>
    </div>

    <div class="tests-list" *ngIf="tests.length > 0">
      <div class="test-item" *ngFor="let test of tests">
        <mat-checkbox
          [(ngModel)]="test.selected"
          (change)="onItemSelectionChange()"
          color="primary"
          [attr.aria-label]="'Select ' + (test.testDesc || test.testId)">
          <div class="test-item-content">
            <span class="test-id">{{ test.testId }}</span>
            <span class="test-desc" *ngIf="test.testDesc"> - {{ test.testDesc }}</span>
            <span class="antigen-badge" *ngIf="test.isAntigen">ANTIGEN</span>
          </div>
        </mat-checkbox>
      </div>
    </div>

    <div class="empty-state" *ngIf="tests.length === 0">
      <p>No printable tests available for this batch.</p>
    </div>
  </div>

  <!-- Footer -->
  <div class="dialog-actions">
    <button mat-button class="cancel-button" (click)="cancel()">CANCEL</button>
    <button
      mat-raised-button
      color="primary"
      [disabled]="!canGenerate || isSubmitting"
      (click)="onGenerate()"
      [attr.aria-busy]="isSubmitting"
      [attr.aria-label]="isSubmitting ? 'Generating worksheets, please wait' : 'Generate worksheets'">
      <mat-spinner *ngIf="isSubmitting" diameter="20" aria-hidden="true"></mat-spinner>
      <span *ngIf="!isSubmitting">GENERATE</span>
      <span *ngIf="isSubmitting" class="cdk-visually-hidden">Processing...</span>
    </button>
  </div>
</div>
