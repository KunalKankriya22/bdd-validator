<div class="dialog-container" role="dialog" aria-modal="true" aria-labelledby="units-dialog-title">
  <div class="dialog-header">
    <h2 id="units-dialog-title" class="dialog-title">Units in Batch</h2>
    <button mat-icon-button class="close-button" (click)="closeDialog()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <ng-container *ngIf="isLoading">
      <div class="loading-state">
        <mat-spinner diameter="36"></mat-spinner>
      </div>
    </ng-container>

    <ng-container *ngIf="!isLoading && units.length === 0">
      <div class="empty-state">
        <p>No units found in this batch.</p>
      </div>
    </ng-container>

    <ng-container *ngIf="!isLoading && units.length > 0">
      <div class="table-wrapper">
        <table mat-table [dataSource]="units" class="units-table">
          <ng-container matColumnDef="tbSeqNo">
            <th mat-header-cell *matHeaderCellDef>
              <div class="header-cell">Sequence</div>
            </th>
            <td mat-cell *matCellDef="let element">{{ element.tbSeqNo }}</td>
          </ng-container>

          <ng-container matColumnDef="unitId">
            <th mat-header-cell *matHeaderCellDef>
              <div class="header-cell">Unit ID</div>
            </th>
            <td mat-cell *matCellDef="let element">{{ element.unitId }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </ng-container>
  </div>

  <div class="dialog-footer">
    <button mat-stroked-button class="close-btn" (click)="closeDialog()">CLOSE</button>
  </div>
</div>
