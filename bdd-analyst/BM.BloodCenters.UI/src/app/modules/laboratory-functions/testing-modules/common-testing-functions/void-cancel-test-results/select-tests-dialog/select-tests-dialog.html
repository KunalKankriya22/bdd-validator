<div class="select-test-panel">
  <div class="panel-title-row">
    <h2 class="panel-title">Select Test</h2>
    <button mat-icon-button (click)="onClose()" aria-label="Close panel">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="panel-content">
    <!-- Group ID Filter -->
    <div class="group-filter-row">
      <mat-form-field appearance="fill" class="group-field">
        <mat-label>Group ID</mat-label>
        <mat-select [formControl]="selectedGroupCtrl">
          <mat-option>
            <ngx-mat-select-search [formControl]="groupSearchCtrl"
              placeholderLabel="Search..." noEntriesFoundLabel="No results found" />
          </mat-option>
          <mat-option [value]="null">All Groups</mat-option>
          @for (group of filteredGroups(); track group.code) {
            <mat-option [value]="group.code">{{ group.code }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <div class="group-description">
        <span class="group-desc-label">Group Description</span>
        <span class="group-desc-value">{{ selectedGroupDescription() }}</span>
      </div>
    </div>

    <!-- Tests Table -->
    <app-data-table
      [config]="tableConfig"
      [data]="filteredTests()"
      (selectionChange)="onSelectionChange($event)"
      (sortChange)="onSortChange($event)" />
  </div>

  <div class="panel-actions">
    <button mat-button type="button" (click)="onClose()" class="close-button">
      CLOSE
    </button>
    <button mat-raised-button color="primary" type="button" (click)="onProceed()"
      [disabled]="selectedCount() === 0">
      PROCEED
    </button>
  </div>
</div>
