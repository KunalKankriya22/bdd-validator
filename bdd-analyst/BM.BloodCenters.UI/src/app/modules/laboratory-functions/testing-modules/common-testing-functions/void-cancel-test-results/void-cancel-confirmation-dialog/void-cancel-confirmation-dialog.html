<div class="dialog-container" role="dialog" aria-labelledby="dialog-title" aria-modal="true">
  <h2 id="dialog-title" mat-dialog-title class="dialog-title">
    Are you sure you want to {{ data.actionDescription }} selected test results?
  </h2>

  <mat-dialog-content>
    <p class="dialog-subtitle">Please select a reason to proceed</p>
    <div class="dialog-form">
      <!-- Reason Code -->
      <mat-form-field appearance="fill" class="reason-field">
        <mat-label>Reason</mat-label>
        <mat-select [formControl]="reasonCodeCtrl">
          <mat-option>
            <ngx-mat-select-search [formControl]="reasonSearchCtrl"
              placeholderLabel="Search..." noEntriesFoundLabel="No results found" />
          </mat-option>
          @for (code of filteredReasonCodes(); track code.code) {
            <mat-option [value]="code.code">{{ code.code }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <!-- Description (Read-only) -->
      <div class="description-field">
        <label class="description-label">Description</label>
        <span class="description-value">{{ selectedDescription() }}</span>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions" align="end">
    <button mat-button type="button" (click)="onCancel()" class="cancel-button">
      CANCEL
    </button>
    <button mat-raised-button color="primary" type="button" (click)="onConfirm()"
      class="confirm-button" cdkFocusInitial>
      {{ data.actionDescription }} SELECTION
    </button>
  </mat-dialog-actions>
</div>
