<div class="dialog-container" [attr.aria-labelledby]="elementId('dialog-title')" role="dialog">

  <!-- Dialog Header -->
  <div class="dialog-header">
    <h2 [id]="elementId('dialog-title')">Additional Bands</h2>
    <button
      mat-icon-button
      type="button"
      [mat-dialog-close]="{ action: 'cancel' }"
      aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Dialog Content -->
  <div class="dialog-content">

    <!-- Unit ID Display -->
    <div class="unit-id-display">
      <span class="unit-id-label">Unit ID</span>
      <span class="unit-id-value">{{ unitId() }}</span>
    </div>

    <!-- Bands Table -->
    <div class="bands-table-wrapper">
      <table class="bands-table">
        <thead>
          <tr>
            <th colspan="2">Band(s) detected between</th>
          </tr>
        </thead>
        <tbody>
          <!-- Saved bands (read-only) -->
          @for (band of savedBands(); track $index) {
            <tr>
              <td><span class="saved-band-value">{{ band.band1 }}</span></td>
              <td><span class="saved-band-value">{{ band.band2 }}</span></td>
            </tr>
          }
          <!-- New band rows (editable inputs) -->
          @for (band of newBands(); track $index) {
            <tr>
              <td>
                <input
                  type="text"
                  class="band-input"
                  [ngModel]="band.band1"
                  (ngModelChange)="onNewBandInput($index, 'band1', $event)"
                  maxlength="10">
              </td>
              <td>
                <input
                  type="text"
                  class="band-input"
                  [ngModel]="band.band2"
                  (ngModelChange)="onNewBandInput($index, 'band2', $event)"
                  maxlength="10">
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <!-- Add New link (adds a local empty row) -->
    <button type="button" class="btn-add-new" (click)="onAddNewRow()" [disabled]="saving()">
      <mat-icon>add</mat-icon>
      ADD NEW
    </button>

  </div>

  <!-- Dialog Actions -->
  <div class="dialog-actions">
    <button
      type="button"
      class="btn-dialog-cancel"
      (click)="onCancel()">
      CANCEL
    </button>
    <button
      type="button"
      class="btn-dialog-clear"
      (click)="onClearAll()"
      [disabled]="saving() || (savedBands().length === 0 && newBands().length === 0)">
      CLEAR ALL
    </button>
    <button
      type="button"
      class="btn-dialog-add"
      [disabled]="saving() || !hasNewBandsWithValues()"
      (click)="onSaveNewBands()">
      @if (saving()) {
        <mat-spinner diameter="18"></mat-spinner>
      }
      ADD
    </button>
  </div>

</div>
