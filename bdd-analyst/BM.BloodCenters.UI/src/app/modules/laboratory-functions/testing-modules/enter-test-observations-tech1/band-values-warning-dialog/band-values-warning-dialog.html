<div class="warning-dialog" role="dialog">
  <div class="dialog-content">
    <!-- Warning Icon and Title -->
    <div class="warning-header">
      <mat-icon class="warning-icon" aria-hidden="true">warning</mat-icon>
      <h2 class="dialog-title">{{ data.title }}</h2>
    </div>

    <!-- Warning Message -->
    <div class="warning-message" role="alert">
      <p><strong>WARNING:</strong> The following warnings were found:</p>

      <div class="warning-list">
        @for (warning of data.warnings; track warning.code) {
          <div class="warning-item">
            <span class="warning-code">[{{ warning.code }}]</span>
            <span class="warning-text">{{ warning.message }}</span>
          </div>
        }
      </div>

      <p class="override-question">Do you want to continue?</p>
    </div>

    <!-- Action Buttons -->
    <div class="dialog-actions" role="group" aria-label="Warning actions">
      <button
        type="button"
        mat-button
        (click)="onCancel()"
        cdkFocusInitial
        class="cancel-button">
        No
      </button>
      <button
        type="button"
        mat-raised-button
        color="primary"
        (click)="onOverride()"
        class="override-button">
        Yes
      </button>
    </div>
  </div>
</div>
