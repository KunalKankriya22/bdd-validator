<div class="additional-bands-dialog">
  <div class="dialog-header">
    <h2 mat-dialog-title>Additional Bands</h2>
    <button mat-icon-button mat-dialog-close aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <div class="unit-id-display">
      <span class="label">Unit ID</span>
      <span class="value">{{ data.unitId }}</span>
    </div>

    <table class="other-bands-table" role="grid" aria-label="Additional Bands">
      <thead>
        <tr>
          <th>Tech 1</th>
          <th>Tech 2</th>
          <th class="supervisor-header">Supervisor</th>
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track $index) {
          <tr [formGroup]="row.formGroup">
            <td class="readonly-cell">{{ row.tech1 }}</td>
            <td class="readonly-cell">{{ row.tech2 }}</td>
            <td class="supervisor-cell">
              <mat-form-field appearance="fill" class="supervisor-select">
                <mat-select formControlName="supervisor">
                  <mat-option value="">--</mat-option>
                  @for (option of supervisorOptions(); track option.value) {
                    <mat-option [value]="option.value">{{ option.label }}</mat-option>
                  }
                </mat-select>
              </mat-form-field>
            </td>
          </tr>
        }
      </tbody>
    </table>

    <button
      mat-stroked-button
      color="primary"
      type="button"
      (click)="onAddNew()"
      class="add-new-btn">
      <mat-icon>add</mat-icon>
      ADD NEW
    </button>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">CANCEL</button>
    <button mat-raised-button color="primary" (click)="onSave()">SAVE</button>
  </mat-dialog-actions>
</div>
