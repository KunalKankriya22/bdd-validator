<div class="filter-panel"
     role="dialog"
     aria-labelledby="filter-panel-heading"
     aria-modal="true">
  <div class="filter-panel-header">
    <h3 id="filter-panel-heading">Filter Result Matrix</h3>
    <button
      type="button"
      mat-icon-button
      aria-label="Close filter panel"
      (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="form" class="filter-panel-content" (ngSubmit)="onApply()">
    <!-- Test ID -->
    <mat-form-field appearance="fill" class="filter-field">
      <mat-label>Test ID</mat-label>
      <input
        matInput
        formControlName="testId"
        maxlength="15"
        placeholder="Enter Test ID"
        aria-label="Filter by Test ID">
    </mat-form-field>

    <!-- Test Type -->
    <mat-form-field appearance="fill" class="filter-field">
      <mat-label>Test Type</mat-label>
      <input
        matInput
        formControlName="testType"
        maxlength="5"
        placeholder="Enter Test Type"
        aria-label="Filter by Test Type">
    </mat-form-field>

    <!-- Test Interpretation -->
    <mat-form-field appearance="fill" class="filter-field">
      <mat-label>Test Interpretation</mat-label>
      <input
        matInput
        formControlName="testIntp"
        maxlength="4"
        placeholder="Enter Test Interpretation"
        aria-label="Filter by Test Interpretation">
    </mat-form-field>

    <!-- Include Inactive -->
    <div class="checkbox-field">
      <mat-checkbox formControlName="includeInactive"
                    aria-label="Include inactive records in filter results">
        Include Inactive Records
      </mat-checkbox>
    </div>

    <div class="filter-panel-actions">
      <button
        type="button"
        mat-button
        (click)="onClear()">
        Clear
      </button>
      <button
        type="submit"
        mat-raised-button
        color="primary">
        Apply
      </button>
    </div>
  </form>
</div>
