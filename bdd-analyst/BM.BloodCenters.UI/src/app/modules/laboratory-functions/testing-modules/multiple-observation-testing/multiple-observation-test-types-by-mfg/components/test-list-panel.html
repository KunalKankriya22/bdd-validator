<section class="test-list-panel" role="region" aria-label="Test list">

  <!-- Search Bar -->
  <div class="search-container">
    <app-search-bar
      [config]="searchConfig"
      (search)="onSearch($event)">
    </app-search-bar>
  </div>

  <!-- Loading State -->
  @if (loading()) {
    <div class="loading-container" role="status" aria-live="polite" aria-busy="true">
      <mat-spinner diameter="40" aria-label="Loading tests"></mat-spinner>
    </div>
  }

  <!-- Error State -->
  @if (error()) {
    <div class="error-container" role="alert" aria-live="assertive">
      <mat-icon aria-hidden="true">error</mat-icon>
      <p>{{ error() }}</p>
      <button class="retry-btn" (click)="retry()">Retry</button>
    </div>
  }

  <!-- Empty State -->
  @if (isEmpty()) {
    <div class="empty-container" role="status" aria-live="polite">
      <mat-icon aria-hidden="true">info</mat-icon>
      <p>No tests found</p>
    </div>
  }

  <!-- Test List -->
  @if (hasTests() && !loading() && !error()) {
    <mat-list class="test-list" role="listbox" aria-label="Test selection list">
      @for (test of filteredTests(); track test.testId) {
        <mat-list-item
          class="test-item"
          [class.active]="isSelected(test)"
          (click)="onTestSelected(test)"
          [attr.aria-selected]="isSelected(test)"
          role="option">
          <div class="test-item-content">
            <span class="test-desc">{{ test.testDesc }}</span>
            <span class="test-id">{{ test.testId }}</span>
          </div>
        </mat-list-item>
      }
    </mat-list>
  }
</section>
