<!-- PAGE HEADER WITH BREADCRUMB -->
<app-page-header-with-breadcrumb [config]="pageHeaderConfig"></app-page-header-with-breadcrumb>

<div class="page-container" role="main">
  <!-- Master-Detail Layout -->
  <div class="master-detail-container">
    <!-- Left Panel: Test List (Master) -->
    <aside class="master-panel" role="complementary" [attr.aria-label]="'Test selection panel'">
      <app-test-list-panel
        [selectedTestId]="selectedTestId()"
        (testSelected)="onTestSelected($event)">
      </app-test-list-panel>
    </aside>

    <!-- Right Panel: Test Types Grid (Detail) -->
    <section class="detail-panel" role="region" [attr.aria-label]="'Test types detail panel'">
      @if (!hasSelection()) {
        <div class="no-selection-message" role="status" aria-live="polite">
          <mat-icon aria-hidden="true">arrow_back</mat-icon>
          <p>Select a test from the list to view and edit test types</p>
        </div>
      }

      @if (hasSelection()) {
        <app-test-types-grid
          [testId]="selectedTestId()"
          [testDesc]="selectedTestDesc()"
          [testTypes]="testTypes()"
          [controlValues]="controlValues()"
          [loading]="loading() || saving()"
          (save)="onSave($event)"
          (cancel)="onCancel()"
          (clearAll)="onClearAll()">
        </app-test-types-grid>
      }
    </section>
  </div>

  <!-- Global Loading Overlay (for initial load) -->
  @if (saving()) {
    <div class="loading-overlay" role="status" aria-live="polite" aria-busy="true">
      <mat-spinner diameter="60" aria-label="Saving changes"></mat-spinner>
      <span class="loading-text">Saving changes...</span>
    </div>
  }
</div>
