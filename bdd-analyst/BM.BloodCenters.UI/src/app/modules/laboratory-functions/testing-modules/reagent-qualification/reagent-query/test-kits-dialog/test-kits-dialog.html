<div class="test-kits-dialog" [attr.aria-labelledby]="elementId('title')">
  <!-- Dialog Header -->
  <div class="dialog-header">
    <h2 mat-dialog-title [id]="elementId('title')">
      TEST KITS PREPARED USING {{ reagentId() }}
    </h2>
    <button
      mat-icon-button
      [id]="elementId('close-icon-btn')"
      (click)="onClose()"
      aria-label="Close dialog"
      class="close-button">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Dialog Content -->
  <mat-dialog-content>
    @if (loading()) {
      <div class="loading-container" role="status" aria-live="polite" aria-busy="true">
        <mat-spinner diameter="40" aria-label="Loading test kits"></mat-spinner>
      </div>
    }

    @if (error()) {
      <div class="error-container" role="alert" aria-live="assertive">
        <mat-icon aria-hidden="true">error</mat-icon>
        <p>{{ error() }}</p>
      </div>
    }

    @if (!loading() && !error()) {
      <app-data-table
        [data]="testKits()"
        [config]="tableConfig"
        [loading]="loading()"
        (rowClick)="onKitRowClick($event)">
      </app-data-table>
    }
  </mat-dialog-content>

  <!-- Dialog Actions -->
  <mat-dialog-actions align="end">
    <button
      mat-button
      color="primary"
      [id]="elementId('kit-details-btn')"
      class="kit-details-btn"
      [disabled]="!selectedKit()"
      (click)="onKitDetails()">
      KIT DETAILS
    </button>
    <button
      mat-stroked-button
      [id]="elementId('close-btn')"
      (click)="onClose()"
      class="close-btn">
      CLOSE
    </button>
  </mat-dialog-actions>
</div>
