<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="valid-reagent-supplier-codes main-content"
        [class.side-panel-active]="sidePanelOpen"
        aria-label="Valid Reagent Supplier Codes content"
        role="main">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="valid-reagent-supplier-codes__card">

      <!-- Table Controls -->
      <div class="valid-reagent-supplier-codes__controls">
        <!-- Left section: Filter button and chips -->
        <div class="valid-reagent-supplier-codes__controls-left">
          <button
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            aria-label="Open filter options"
            cdkOverlayOrigin
            #trigger="cdkOverlayOrigin"
            (click)="toggleFilter()">
            <mat-icon aria-hidden="true">filter_list</mat-icon>
            FILTER
          </button>

          <!-- Filter Chips -->
          @if (filterChips.length > 0) {
            <app-filter-chips
              [chips]="filterChips"
              (removeChip)="onRemoveFilterChip($event)"
              (clearAll)="onClearAllFilters()">
            </app-filter-chips>
          }
        </div>

        <!-- Right section: Search bar -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)" />
      </div>

      <!-- Filter Panel Overlay -->
      <ng-template
        cdkConnectedOverlay
        [cdkConnectedOverlayOrigin]="trigger"
        [cdkConnectedOverlayOpen]="isFilterOpen"
        [cdkConnectedOverlayHasBackdrop]="true"
        [cdkConnectedOverlayBackdropClass]="'cdk-overlay-transparent-backdrop'"
        [cdkConnectedOverlayOffsetY]="4"
        cdkConnectedOverlayPanelClass="filter-overlay-panel"
        (backdropClick)="toggleFilter()"
        (detach)="isFilterOpen = false">
        <app-valid-reagent-supplier-code-filter-panel
          [currentFilters]="appliedFilters"
          (apply)="onApplyFilters($event)"
          (close)="toggleFilter()">
        </app-valid-reagent-supplier-code-filter-panel>
      </ng-template>

      <!-- Error State -->
      <div
        *ngIf="hasError && !isLoading"
        class="valid-reagent-supplier-codes__error"
        role="alert"
        aria-label="Error loading data">
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <p class="error-message">{{ errorMessage }}</p>
        <button type="button" mat-raised-button color="primary" (click)="loadData()">
          Retry
        </button>
      </div>

      <!-- Data Table -->
      <div class="valid-reagent-supplier-codes__table-wrapper">
        <app-data-table
          *ngIf="!hasError"
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>
    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-add-edit-valid-reagent-supplier-code-dialog
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      (close)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess($event)"
      (modeChange)="onModeChange($event)">
    </app-add-edit-valid-reagent-supplier-code-dialog>
  </div>

</div>
