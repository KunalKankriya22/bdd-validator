<div class="view-reagents-dialog">
  <div class="dialog-header">
    <h2 mat-dialog-title>Reagents in Kit{{ kitId() ? ' ' + kitId() : '' }}</h2>
    <button mat-icon-button (click)="close()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="dialog-content">
    @if (reagents().length > 0) {
      <app-data-table
        [config]="tableConfig"
        [data]="reagents()"
        [loading]="loading()"
        (sortChange)="onSortChange($event)">
      </app-data-table>
    } @else {
      <div class="no-reagents">
        <mat-icon class="no-reagents-icon">science</mat-icon>
        <p>No reagents found for this kit</p>
      </div>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button color="primary" (click)="close()">CANCEL</button>
  </mat-dialog-actions>
</div>
