<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" [attr.aria-label]="'Close filter panel'" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Test ID -->
    <mat-form-field appearance="fill">
      <mat-label>Test ID</mat-label>
      <mat-select formControlName="testId">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="testIdSearchCtrl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No matching test ID">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let id of filteredTestIds()" [value]="id">{{ id }}</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Absorbance -->
    <mat-form-field appearance="fill">
      <mat-label>Absorbance</mat-label>
      <mat-select formControlName="absorbance">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="absorbanceSearchCtrl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No match found">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let val of filteredAbsorbances()" [value]="val">{{ val }}</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Ratio -->
    <mat-form-field appearance="fill">
      <mat-label>Ratio</mat-label>
      <mat-select formControlName="ratio">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="ratioSearchCtrl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No match found">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let val of filteredRatios()" [value]="val">{{ val }}</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Result Value -->
    <mat-form-field appearance="fill">
      <mat-label>Result Value</mat-label>
      <mat-select formControlName="resultValue">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="resultValueSearchCtrl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No match found">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let val of filteredResultValues()" [value]="val">{{ val }}</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Status -->
    <mat-form-field appearance="fill">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="statusSearchCtrl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No match found">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let val of filteredStatuses()" [value]="val">{{ val }}</mat-option>
      </mat-select>
    </mat-form-field>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" class="clear-btn" (click)="onClear()">
      CLEAR ALL
    </button>
    <button mat-raised-button type="button" class="apply-btn" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
