<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="utq-filter-title">

  <!-- Header -->
  <header class="filter-header">
    <h2 class="title" id="utq-filter-title">Filters</h2>
    <button mat-icon-button type="button" class="close-btn" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Body -->
  <div class="filter-body">
    <form [formGroup]="form">

      <mat-form-field appearance="fill" class="panel-field">
        <mat-label>Reactive?</mat-label>
        <mat-select formControlName="reactive">
          @for (opt of reactiveOptions; track opt.value) {
            <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="panel-field">
        <mat-label>Ignore NT</mat-label>
        <mat-select formControlName="ntsFlag">
          @for (opt of ntsFlagOptions; track opt.value) {
            <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="panel-field">
        <mat-label>Show Cancel?</mat-label>
        <mat-select formControlName="showCancel">
          @for (opt of showCancelOptions; track opt.value) {
            <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

    </form>
  </div>

  <!-- Footer -->
  <div class="filter-footer">
    <button mat-stroked-button type="button" class="clear-btn" (click)="onClear()">CLEAR ALL</button>
    <button mat-raised-button type="button" class="apply-btn" (click)="onApply()" [disabled]="isApplyDisabled">APPLY</button>
  </div>

</section>
