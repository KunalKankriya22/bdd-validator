<div class="side-panel-wrapper">

  <!-- Header -->
  <div class="panel-header">
    <div class="header-content">
      <h2 class="panel-title">{{ panelTitle }}</h2>
    </div>

    <button type="button" mat-icon-button class="close-btn" (click)="onCancel()" aria-label="Close panel">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="panel-body">
    <form [formGroup]="form" class="htf-form">

      <div class="form-grid">

        <!-- Sequence (always read-only label) -->
        <div class="field-display-card" role="group" aria-label="Sequence">
          <div class="field-label" id="seq-label">Sequence</div>
          <div class="field-value" aria-labelledby="seq-label">{{ sequenceDisplay }}</div>
        </div>

        <!-- Test ID: searchable dropdown -->
        <mat-form-field appearance="fill">
          <mat-label>Test ID <span class="required-marker" aria-hidden="true"></span></mat-label>
          <mat-select formControlName="headerName" (closed)="onTestIdDropdownClosed()"
                     [errorStateMatcher]="headerNameErrorMatcher"
                     [attr.aria-required]="true">
            <mat-select-trigger>{{ form.get('headerName')?.value }}</mat-select-trigger>
            <mat-option>
              <ngx-mat-select-search
                [formControl]="testIdSearchControl"
                placeholderLabel="Search..."
                noEntriesFoundLabel="No matching tests">
              </ngx-mat-select-search>
            </mat-option>
            <mat-option *ngFor="let test of filteredTestIdOptions" [value]="test.testId">
              {{ test.testId }} — {{ test.testDesc }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="getHeaderNameError()">{{ getHeaderNameError() }}</mat-error>
        </mat-form-field>

        <!-- Start Position -->
        <mat-form-field appearance="fill" [class.has-error]="getStartPosError()">
          <mat-label>Start Position <span class="required-marker" aria-hidden="true"></span></mat-label>
          <input matInput formControlName="startPos" maxlength="2"
                 aria-label="Start Position"
                 [attr.aria-required]="true"
                 [errorStateMatcher]="startPosErrorMatcher"
                 (keypress)="onlyNumbersWithMinus($event)"
                 (paste)="onPasteNumbersWithMinus($event)">
          <mat-error *ngIf="getStartPosError()">{{ getStartPosError() }}</mat-error>
        </mat-form-field>

        <!-- End Position -->
        <mat-form-field appearance="fill" [class.has-error]="getEndPosError()">
          <mat-label>End Position <span class="required-marker" aria-hidden="true"></span></mat-label>
          <input matInput formControlName="endPos" maxlength="2"
                 aria-label="End Position"
                 [attr.aria-required]="true"
                 [errorStateMatcher]="endPosErrorMatcher"
                 (keypress)="onlyNumbersWithMinus($event)"
                 (paste)="onPasteNumbersWithMinus($event)">
          <mat-error *ngIf="getEndPosError()">{{ getEndPosError() }}</mat-error>
        </mat-form-field>

      </div>

    </form>
  </div>

  <!-- Footer -->
  <div class="panel-footer">
    <div class="footer-actions">

      <button type="button" mat-button class="cancel-btn" (click)="onCancel()" [disabled]="isSaving">
        CANCEL
      </button>

      <button *ngIf="mode === 'add'" type="button" mat-stroked-button class="add-create-btn"
              (click)="onSaveAndCreateAnother()"
              [disabled]="!isFormValid || isSaving">
        {{ isSaving ? 'SAVING...' : 'ADD AND CREATE ANOTHER' }}
      </button>

      <button type="button" mat-raised-button class="primary-btn"
              (click)="onSave()"
              [disabled]="!isFormValid || isSaving || (mode === 'edit' && !form.dirty)">
        {{ isSaving ? 'SAVING...' : (mode === 'add' ? 'ADD' : 'SAVE') }}
      </button>

    </div>
  </div>

</div>
