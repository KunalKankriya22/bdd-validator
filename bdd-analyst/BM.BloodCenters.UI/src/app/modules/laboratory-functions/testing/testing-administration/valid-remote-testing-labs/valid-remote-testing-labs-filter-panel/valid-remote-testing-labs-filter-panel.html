<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Effective Date Filter -->
    <div class="filter-row">
      <div class="period-field" [class.error-state]="effDatePeriodRequired">
        <mat-form-field appearance="fill">
          <mat-label [ngStyle]="{ color: effDatePeriodRequired ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="effectiveDatePeriod">
            <mat-option value="AFTER">After</mat-option>
            <mat-option value="BEFORE">Before</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="period-error" role="alert" *ngIf="effDatePeriodRequired">Period is required</div>
      </div>

      <div class="date-field">
        <mat-form-field appearance="fill">
          <mat-label>Effective Date</mat-label>
          <input matInput [matDatepicker]="effectivePicker" formControlName="effectiveDate"
                 #effDateNativeInput placeholder="DD-MMM-YYYY"
                 [errorStateMatcher]="effDateErrorMatcher">
          <mat-datepicker-toggle matIconSuffix [for]="effectivePicker"></mat-datepicker-toggle>
          <mat-datepicker #effectivePicker></mat-datepicker>
        </mat-form-field>
        <div class="period-error" role="alert" *ngIf="getEffectiveDateError()">{{ getEffectiveDateError() }}</div>
      </div>
    </div>

    <div class="filter-panel__error" *ngIf="effectivePeriodRequired">
      Period is required
    </div>

    <!-- Termination Date Filter -->
    <div class="filter-row">
      <div class="period-field" [class.error-state]="termDatePeriodRequired">
        <mat-form-field appearance="fill">
          <mat-label [ngStyle]="{ color: termDatePeriodRequired ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="terminationDatePeriod">
            <mat-option value="AFTER">After</mat-option>
            <mat-option value="BEFORE">Before</mat-option>
          </mat-select>
        </mat-form-field>
        <div class="period-error" role="alert" *ngIf="termDatePeriodRequired">Period is required</div>
      </div>

      <div class="date-field">
        <mat-form-field appearance="fill">
          <mat-label>Termination Date</mat-label>
          <input matInput [matDatepicker]="terminationPicker" formControlName="terminationDate"
                 #termDateNativeInput placeholder="DD-MMM-YYYY"
                 [errorStateMatcher]="termDateErrorMatcher">
          <mat-datepicker-toggle matIconSuffix [for]="terminationPicker"></mat-datepicker-toggle>
          <mat-datepicker #terminationPicker></mat-datepicker>
        </mat-form-field>
        <div class="period-error" role="alert" *ngIf="getTerminationDateError()">{{ getTerminationDateError() }}</div>
      </div>
    </div>

    <div class="filter-panel__error" *ngIf="terminationPeriodRequired">
      Period is required
    </div>
  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>
    <button mat-raised-button color="primary" type="button" (click)="onApply()" [disabled]="isApplyDisabled">
      APPLY
    </button>
  </footer>

</section>
