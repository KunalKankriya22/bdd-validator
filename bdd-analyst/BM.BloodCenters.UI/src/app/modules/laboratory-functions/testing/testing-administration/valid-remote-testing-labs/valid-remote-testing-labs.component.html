<app-page-header-with-breadcrumb [config]="headerConfig" />

<div class="layout-wrapper">
  <div class="main-content">
    <div class="card" #tableCard>
      <!-- Controls Section -->
      <div class="controls">
        <!-- Left: Filter Button + Chips -->
        <div class="controls-left">
          <button
            #filterButton
            type="button"
            class="filter-button"
            [class.filter-button--active]="isFilterPanelOpen"
            (click)="openFilterPanel()"
            aria-label="Open filter panel">
            <mat-icon class="filter-icon" aria-hidden="true">tune</mat-icon>
            <span>FILTER</span>
          </button>

          <app-filter-chips
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="onClearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right: Search Bar -->
        <div class="controls-right">
          <app-search-bar
            [config]="searchConfig"
            (search)="onSearch($event)">
          </app-search-bar>
        </div>
      </div>

      <!-- Error State -->
      @if (hasError && !isLoading) {
        <div class="state-container error" aria-live="assertive">
          <mat-icon aria-hidden="true">error_outline</mat-icon>
          <p>{{ errorMessage }}</p>
          <button type="button" mat-stroked-button (click)="loadTableData()">
            RETRY
          </button>
        </div>
      }

      <!-- Data Table -->
      @if (!hasError) {
        <div class="table-wrapper">
          <app-data-table
            [config]="tableConfig"
            [data]="dataSource"
            [loading]="isLoading"
            (pageChange)="onPageChange($event)"
            (sortChange)="onSortChange($event)"
            (rowAction)="onRowAction($event)">
          </app-data-table>
        </div>
      }
    </div>
  </div>
</div>
