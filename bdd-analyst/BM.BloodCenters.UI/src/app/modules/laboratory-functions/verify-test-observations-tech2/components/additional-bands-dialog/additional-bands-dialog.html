<div class="dialog-title-bar">
  <h2 mat-dialog-title>Additional Bands</h2>
  <button type="button" class="close-btn" (click)="onCancel()" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content>
  <div class="unit-id-container">
    <label>Unit ID</label>
    <div class="unit-id-value">{{ unitId() }}</div>
  </div>

  <form [formGroup]="form">
    <div class="bands-table">
      <div class="table-header">
        <span>Band(s) detected between</span>
      </div>

      <div formArrayName="bands">
        @for (bandGroup of bandsArray.controls; track $index; let i = $index) {
          <div class="band-row" [formGroupName]="i">
            <mat-form-field appearance="fill" subscriptSizing="dynamic" class="band-field">
              <mat-select formControlName="band1" [attr.aria-label]="'Band 1 selection for row ' + (i + 1)">
                @for (band of testBands(); track band.bandSeq) {
                  <mat-option [value]="band.bandName">{{ band.bandName }}</mat-option>
                }
              </mat-select>
            </mat-form-field>

            <mat-form-field appearance="fill" subscriptSizing="dynamic" class="band-field">
              <input matInput formControlName="band2" [readonly]="true" [attr.aria-label]="'Band 2 value for row ' + (i + 1)">
            </mat-form-field>
          </div>
        }
      </div>
    </div>

    <button
      type="button"
      class="add-new-btn"
      [disabled]="saving()"
      (click)="onAddNew()">
      <mat-icon>add</mat-icon>
      ADD NEW
    </button>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" class="dialog-btn dialog-btn--text" [disabled]="saving()" (click)="onCancel()">CANCEL</button>
  <button type="button" class="dialog-btn dialog-btn--text" [disabled]="saving()" (click)="onClearAll()">CLEAR ALL</button>
  <button type="button" class="dialog-btn dialog-btn--primary" [disabled]="saving()" (click)="onAdd()">ADD</button>
</mat-dialog-actions>
