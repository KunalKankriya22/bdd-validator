<div class="dialog-container" aria-labelledby="dialog-title">
  <h2 id="dialog-title" mat-dialog-title class="dialog-title">
    Are you sure you want to VOID selected test batch?
  </h2>

  @if (data.hasQcUnits) {
    <mat-dialog-content>
      <p class="qc-warning" role="alert">
        Warning: Units in this batch have already been QC-labeled or QC-tested. Voiding will affect these QC records.
      </p>
    </mat-dialog-content>
  }

  <mat-dialog-actions class="dialog-actions" align="end">
    <button mat-button type="button" (click)="onCancel()" class="cancel-button">
      CANCEL
    </button>
    <button mat-raised-button color="primary" type="button" (click)="onConfirm()"
      class="confirm-button" cdkFocusInitial>
      VOID BATCH
    </button>
  </mat-dialog-actions>
</div>
