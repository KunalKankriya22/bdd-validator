<h1 class="cdk-visually-hidden">{{ headerConfig().title }}</h1>
<app-page-header-with-breadcrumb [config]="headerConfig()" />

<main class="voided-tests-by-unit-id-query" aria-label="Voided Tests by Unit ID Query" role="main">
  <div class="main-card">
    <div class="search-card">
      <div class="search-card__fields">
        <app-unit-id-field-with-lov
          #unitIdField
          class="search-card__field search-card__field--unit-id"
          [required]="true"
          [label]="'Unit ID'"
          [placeholder]="'-'"
          [validateFfValue]="'N'"
          [showBarcodeIcon]="true"
          [lovItems]="lovItems()"
          [showLov]="true"
          (postValidate)="onPostValidate($event)"
          (validated)="onValidated($event)"
          (cleared)="onUnitIdCleared()"
          (lovSelected)="onLovSelected($event)"
        />

        <div class="search-card__description" role="group" aria-labelledby="collection-date-label">
          <span class="description-label" id="collection-date-label">Collection Date</span>
          <span class="description-value" aria-labelledby="collection-date-label">{{ (collectionDate | uppercase) || '-' }}</span>
        </div>
      </div>

      <div class="search-card__actions">
        <button
          mat-button
          class="btn-clear"
          [disabled]="isClearDisabled"
          (click)="onClear()"
          aria-label="Clear search fields and results"
        >
          CLEAR
        </button>
      </div>
    </div>

    <div class="table-card">
      @if (!hasSearched && !isLoading) {
        <div class="empty-state-container" role="status" aria-live="polite">
          <div class="empty-state-icon" aria-hidden="true">
            <mat-icon>search</mat-icon>
          </div>
          <h3 class="empty-state-title">No Results to Display</h3>
          <p class="empty-state-message">Scan or choose a Unit ID to begin.</p>
        </div>
      }

      @if (hasSearched && !hasError) {
        <app-data-table
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          (pageChange)="onPageChange($event)"
        />
      }
    </div>
  </div>
</main>
