<app-filter-panel-base
  [title]="'Filters'"
  [maxContentHeight]="380"
  [width]="320"
  [applyDisabled]="isApplyDisabled"
  (apply)="onApply()"
  (clear)="onClear()"
  (close)="onClose()">

  <form [formGroup]="filterForm">

    <mat-form-field appearance="fill">
      <mat-label>Type</mat-label>
      <mat-select formControlName="customerType">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="customerTypeSearchCtrl"
            placeholderLabel="Search types..."
            noEntriesFoundLabel="No types found">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option [value]="null">All</mat-option>
        @for (type of filteredCustomerTypes; track type.code) {
          <mat-option [value]="type.code">{{ type.code }} - {{ type.description }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Effective Date: Period dropdown + Date picker -->
    <div class="filter-panel__date-group" role="group" aria-labelledby="eff-date-group-label">
      <span id="eff-date-group-label" class="cdk-visually-hidden">Effective Date Filter</span>
      <div class="filter-panel__date-row">
        <mat-form-field appearance="fill" class="filter-panel__period-field">
          <mat-label [ngStyle]="{ color: getEffPeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="effPeriod">
            <mat-option value="After">After</mat-option>
            <mat-option value="Before">Before</mat-option>
          </mat-select>
          <mat-error *ngIf="getEffPeriodError()">{{ getEffPeriodError() }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="filter-panel__date-field">
          <mat-label>Effective Date</mat-label>
          <input matInput [matDatepicker]="effPicker" formControlName="effDate">
          <mat-datepicker-toggle matIconSuffix [for]="effPicker"></mat-datepicker-toggle>
          <mat-datepicker #effPicker></mat-datepicker>
        </mat-form-field>
      </div>
    </div>

    <!-- Termination Date: Period dropdown + Date picker -->
    <div class="filter-panel__date-group" role="group" aria-labelledby="term-date-group-label">
      <span id="term-date-group-label" class="cdk-visually-hidden">Termination Date Filter</span>
      <div class="filter-panel__date-row">
        <mat-form-field appearance="fill" class="filter-panel__period-field">
          <mat-label [ngStyle]="{ color: getTermPeriodError() ? '#b02828' : 'inherit' }">Period</mat-label>
          <mat-select formControlName="termPeriod">
            <mat-option value="After">After</mat-option>
            <mat-option value="Before">Before</mat-option>
          </mat-select>
          <mat-error *ngIf="getTermPeriodError()">{{ getTermPeriodError() }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="filter-panel__date-field">
          <mat-label>Termination Date</mat-label>
          <input matInput [matDatepicker]="termPicker" formControlName="termDate">
          <mat-datepicker-toggle matIconSuffix [for]="termPicker"></mat-datepicker-toggle>
          <mat-datepicker #termPicker></mat-datepicker>
        </mat-form-field>
      </div>
    </div>

  </form>

</app-filter-panel-base>
