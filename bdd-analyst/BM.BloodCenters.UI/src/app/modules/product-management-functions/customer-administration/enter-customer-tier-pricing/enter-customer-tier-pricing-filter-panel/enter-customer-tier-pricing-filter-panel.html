<section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title"
         cdkTrapFocus cdkTrapFocusAutoCapture>

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="onCancel()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <div class="filter-panel__content">
    <form [formGroup]="filterForm">

      <!-- Effective Date Row -->
      <div class="filter-panel__date-row">
        <mat-form-field appearance="fill" class="period-field" subscriptSizing="dynamic"
                        [class.has-error]="effectivePeriodRequired">
          <mat-label [ngStyle]="{ color: effectivePeriodRequired ? '#b02828' : 'inherit' }">Effective Date Period</mat-label>
          <mat-select formControlName="effectiveDatePeriod"
                      [attr.aria-describedby]="effectivePeriodRequired ? 'eff-period-error' : null"
                      [attr.aria-invalid]="effectivePeriodRequired">
            <mat-option value="After">After</mat-option>
            <mat-option value="Before">Before</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill" class="date-field" subscriptSizing="dynamic">
          <mat-label>Effective Date</mat-label>
          <input
            #effectiveDateInput
            matInput
            [matDatepicker]="effPicker"
            formControlName="effectiveDate"
            placeholder="DD-MMM-YYYY"
            aria-label="Effective Date filter"
            (input)="onEffectiveDateInput($event)"
            (blur)="onEffectiveDateBlur(effectiveDateInput)">
          <mat-datepicker-toggle matIconSuffix [for]="effPicker"></mat-datepicker-toggle>
          <mat-datepicker #effPicker></mat-datepicker>
          <mat-error *ngIf="filterForm.get('effectiveDate')?.hasError('invalidDateFormat')">
            Invalid date
          </mat-error>
          <mat-error *ngIf="filterForm.get('effectiveDate')?.hasError('matDatepickerParse')">
            Invalid date
          </mat-error>
        </mat-form-field>
      </div>
      <div class="error-message" id="eff-period-error" role="alert"
           *ngIf="effectivePeriodRequired">Period is required</div>

      <!-- Termination Date Row -->
      <div class="filter-panel__date-row">
        <mat-form-field appearance="fill" class="period-field" subscriptSizing="dynamic"
                        [class.has-error]="terminationPeriodRequired">
          <mat-label [ngStyle]="{ color: terminationPeriodRequired ? '#b02828' : 'inherit' }">Termination Date Period</mat-label>
          <mat-select formControlName="terminationDatePeriod"
                      [attr.aria-describedby]="terminationPeriodRequired ? 'term-period-error' : null"
                      [attr.aria-invalid]="terminationPeriodRequired">
            <mat-option value="After">After</mat-option>
            <mat-option value="Before">Before</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="fill" class="date-field" subscriptSizing="dynamic">
          <mat-label>Termination Date</mat-label>
          <input
            #terminationDateInput
            matInput
            [matDatepicker]="termPicker"
            formControlName="terminationDate"
            placeholder="DD-MMM-YYYY"
            aria-label="Termination Date filter"
            (input)="onTerminationDateInput($event)"
            (blur)="onTerminationDateBlur(terminationDateInput)">
          <mat-datepicker-toggle matIconSuffix [for]="termPicker"></mat-datepicker-toggle>
          <mat-datepicker #termPicker></mat-datepicker>
          <mat-error *ngIf="filterForm.get('terminationDate')?.hasError('invalidDateFormat')">
            Invalid date
          </mat-error>
          <mat-error *ngIf="filterForm.get('terminationDate')?.hasError('matDatepickerParse')">
            Invalid date
          </mat-error>
        </mat-form-field>
      </div>
      <div class="error-message" id="term-period-error" role="alert"
           *ngIf="terminationPeriodRequired">Period is required</div>

    </form>
  </div>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()" aria-label="Clear all filters">CLEAR ALL</button>
    <button mat-raised-button type="button" (click)="onApply()" [disabled]="isApplyDisabled" aria-label="Apply filters">APPLY</button>
  </footer>

</section>
