<h2 mat-dialog-title class="dialog-title">Enter Notes</h2>

<mat-dialog-content class="dialog-content">
  <mat-form-field appearance="fill" class="notes-field">
    <mat-label>Notes</mat-label>
    <textarea
      matInput
      [formControl]="noteControl"
      placeholder="Add notes here"
      rows="6"
      maxlength="240"
      cdkTextareaAutosize>
    </textarea>
    @if (noteControl.hasError('maxlength')) {
      <mat-error>Maximum 240 characters allowed</mat-error>
    }
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-stroked-button color="primary" type="button" (click)="onCancel()">CANCEL</button>
  <button
    mat-raised-button
    color="primary"
    type="button"
    [disabled]="isAddDisabled"
    (click)="onAdd()">
    ADD
  </button>
</mat-dialog-actions>
