<div class="dialog-container" role="dialog" aria-labelledby="dialog-title">
  <div class="dialog-header">
    <mat-icon class="warning-icon" aria-hidden="true">warning</mat-icon>
    <h2 id="dialog-title" mat-dialog-title>Do you want to Close the Box?</h2>
  </div>

  <mat-dialog-content class="dialog-content">
    <p class="dialog-message">
      This action declares that all products are properly packed.
    </p>

    <div class="box-info">
      <div class="info-row">
        <span class="info-label">Box ID:</span>
        <span class="info-value">{{ data.boxId }}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Total Products Packed:</span>
        <span class="info-value">{{ data.productCount }}</span>
      </div>
    </div>

    <div class="warning-message">
      <mat-icon aria-hidden="true">info</mat-icon>
      <span>Once closed, no more products can be added to this box.</span>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button
      mat-stroked-button
      (click)="onCancel()"
      class="cancel-button">
      NO, CANCEL
    </button>
    <button
      mat-raised-button
      color="primary"
      (click)="onConfirm()"
      class="confirm-button">
      YES, PACKED
    </button>
  </mat-dialog-actions>
</div>
