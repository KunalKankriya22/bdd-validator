<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
  @if (isLoading) { Loading antigen pricing matrix data, please wait. }
</div>

<!-- Layout Wrapper -->
<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <!-- Main Content Area -->
  <main class="antigen-pricing-matrix main-content"
        [class.side-panel-active]="sidePanelOpen"
        [attr.aria-label]="'Antigen Pricing Matrix'">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

    <!-- Table Card Container -->
    <div class="antigen-pricing-matrix__card" #tableCard>

      <!-- Table Controls -->
      <div class="antigen-pricing-matrix__controls">
        <!-- Left: Filter button and chips -->
        <div class="antigen-pricing-matrix__controls-left">
          <button
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            [attr.aria-label]="isFilterOpen ? 'Close filter options' : 'Open filter options'"
            [attr.aria-expanded]="isFilterOpen"
            (click)="openFilter()">
            <mat-icon aria-hidden="true">filter_list</mat-icon>
            FILTER
          </button>

          <!-- Inline Filter Chips -->
          <app-filter-chips
            *ngIf="hasActiveFilters()"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="clearAllFilters()">
          </app-filter-chips>
        </div>

        <!-- Right: Search bar -->
        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)" />
      </div>

      <!-- Error State -->
      <!-- WCAG 4.1.2: Removed aria-label from role="alert" element; aria-label would override
           the visible errorMessage text read by screen readers. Content is sufficient. -->
      <div
        *ngIf="hasError && !isLoading"
        class="antigen-pricing-matrix__error"
        role="alert">
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <p class="error-message">{{ errorMessage }}</p>
        <button type="button" mat-raised-button color="primary" (click)="loadData()">
          Retry
        </button>
      </div>

      <!-- Data Table -->
      <div class="antigen-pricing-matrix__table-wrapper">
        <app-data-table
          *ngIf="!hasError"
          [config]="tableConfig"
          [data]="dataSource"
          [loading]="isLoading"
          [keepActiveRow]="true"
          (pageChange)="onPageChange($event)"
          (sortChange)="onSortChange($event)"
          (rowAction)="onRowAction($event)" />
      </div>

    </div>
  </main>

  <!-- Side Panel Container -->
  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-add-edit-antigen-pricing-matrix
      [mode]="sidePanelMode"
      [data]="sidePanelData"
      (close)="closeSidePanel()"
      (save)="onSave($event)"
      (saveAndCreateAnother)="onSaveAndCreateAnother($event)">
    </app-add-edit-antigen-pricing-matrix>
  </div>

</div>
