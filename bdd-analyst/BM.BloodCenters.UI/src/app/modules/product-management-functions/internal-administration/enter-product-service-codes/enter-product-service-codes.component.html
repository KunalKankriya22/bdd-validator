<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">

  <main class="enter-product-service-codes-container main-content"
        [class.side-panel-active]="sidePanelOpen"
        [attr.aria-label]="'Enter Product Service Codes content'">
    <app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>

    <div class="content-area">

      <div class="search-filter-section" #controlsSection>
        <div class="search-filter-section__controls-left">
          <button
            #filterBtn
            type="button"
            mat-button
            class="filter-button"
            [class.filter-button--active]="isFilterOpen"
            [attr.aria-label]="'Open filter options'"
            (click)="openFilterPanel()">
            <span class="filter-icon" aria-hidden="true"></span>
            FILTER
          </button>

          <app-filter-chips
            *ngIf="filterChips.length > 0"
            [chips]="filterChips"
            [maxVisible]="3"
            (removeChip)="onRemoveFilterChip($event)"
            (clearAll)="onClearAllFilters()">
          </app-filter-chips>
        </div>

        <app-search-bar
          [config]="searchConfig"
          (search)="onSearch($event)"
          [id]="elementId('search-bar')"
          [attr.aria-label]="'Search by product code or description'">
        </app-search-bar>
      </div>

      <div class="content-card" #tableCard>
        <div *ngIf="hasError && !isLoading" class="enter-product-service-codes__error" role="alert">
          <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
          <p class="error-message">{{ errorMessage }}</p>
          <button type="button" mat-raised-button color="primary" (click)="loadData()">
            Retry
          </button>
        </div>

        <div class="table-wrapper">
          <app-data-table
            *ngIf="!hasError"
            [config]="tableConfig"
            [data]="dataSource"
            [loading]="isLoading"
            [keepActiveRow]="sidePanelOpen"
            [highlightedRow]="sidePanelData"
            (pageChange)="onPageChange($event)"
            (sortChange)="onSortChange($event)"
            (rowAction)="onRowAction($event)"
            [id]="elementId('data-table')"
            [attr.aria-label]="'Product service codes table'">
          </app-data-table>
        </div>
      </div>

    </div>
  </main>

  <div class="side-panel-container" *ngIf="sidePanelOpen">
    <app-edit-product-service-code-panel
      [data]="sidePanelData"
      (closePanel)="closeSidePanel()"
      (saveSuccess)="onSaveSuccess()">
    </app-edit-product-service-code-panel>
  </div>

</div>
