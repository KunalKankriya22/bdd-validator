<section class="filter-panel" role="dialog" aria-modal="true" aria-labelledby="filter-title"
         cdkTrapFocus cdkTrapFocusAutoCapture>

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" [attr.aria-label]="'Close filter panel'" (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content">

    <!-- Attribute Group Code -->
    <mat-form-field appearance="fill">
      <mat-label>Attribute Group Code</mat-label>
      <mat-select formControlName="attributeGroup">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="groupSearchControl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No groups found">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option [value]="null">All</mat-option>
        @for (group of filteredGroups; track group.code) {
          <mat-option [value]="group.code">
            {{ group.code }} - {{ group.description }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Price -->
    <mat-form-field appearance="fill">
      <mat-label>Price</mat-label>
      <mat-select formControlName="price">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="priceSearchControl"
            placeholderLabel="Search prices..."
            noEntriesFoundLabel="No matching prices">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option [value]="null">All</mat-option>
        @for (price of filteredPrices; track price) {
          <mat-option [value]="price">{{ price }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Service Code -->
    <mat-form-field appearance="fill">
      <mat-label>Service Code</mat-label>
      <mat-select formControlName="serviceCode">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="serviceCodeSearchControl"
            placeholderLabel="Search service codes..."
            noEntriesFoundLabel="No matching service codes">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option [value]="null">All</mat-option>
        @for (code of filteredServiceCodes; track code) {
          <mat-option [value]="code">{{ code }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()" [attr.aria-label]="'Clear all filters'">
      CLEAR ALL
    </button>
    <button mat-raised-button color="primary" type="button" (click)="onApply()" [attr.aria-label]="'Apply filters'">
      APPLY
    </button>
  </footer>

</section>
