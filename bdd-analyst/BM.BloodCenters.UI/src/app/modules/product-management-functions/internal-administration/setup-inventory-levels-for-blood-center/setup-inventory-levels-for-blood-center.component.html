<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">
<h1 [id]="elementId('heading')" class="cdk-visually-hidden">Setup Inventory Levels for Blood Center</h1>
<section [attr.aria-labelledby]="elementId('heading')" role="region" class="setup-inventory-levels-container main-content">
  <!-- Page Header -->
  <app-page-header-with-breadcrumb
    [config]="headerConfig"
    [attr.id]="elementId('header')">
  </app-page-header-with-breadcrumb>

  <!-- Live Region for Status Announcements -->
  <span class="cdk-visually-hidden"
        role="status"
        aria-live="polite"
        aria-atomic="true">
    {{ isLoading ? 'Loading inventory levels...' : (hasRetrieved && dataSource.length > 0 ? 'Found ' + dataSource.length + (dataSource.length === 1 ? ' result' : ' results') : '') }}
  </span>

  <!-- Inventory Class Selection Section -->
  <div class="inventory-class-section" [attr.id]="elementId('class-section')">
    <mat-form-field appearance="fill" class="inventory-class-field">
      <mat-label [id]="labelId('inventoryClass')">
        Inventory Class <span class="required-marker">*</span>
      </mat-label>
      <mat-select
        [(ngModel)]="selectedInventoryClass"
        (selectionChange)="onInventoryClassChange()"
        [id]="elementId('inventoryClass')"
        [attr.aria-labelledby]="labelId('inventoryClass')"
        [attr.aria-required]="true"
        placeholder="Select inventory class"
        required>
        <mat-option *ngFor="let option of inventoryClassOptions" [value]="option.code">
          {{ option.code }} - {{ option.codeDesc }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <button
      mat-flat-button
      color="primary"
      (click)="onRetrieve()"
      [disabled]="!selectedInventoryClass"
      [id]="elementId('retrieve-btn')"
      [attr.aria-label]="'Retrieve inventory levels'"
      class="retrieve-btn">
      RETRIEVE
    </button>

    <button
      mat-flat-button
      color="primary"
      (click)="onClearAll()"
      [id]="elementId('clear-btn')"
      [attr.aria-label]="'Clear inventory class selection'"
      class="clear-btn">
      CLEAR ALL
    </button>
  </div>

  <!-- Controls Section (Filter + Search + Add New) -->
  <div class="controls-section" #controlsSection [attr.id]="elementId('controls')" *ngIf="hasRetrieved">
    <div class="filter-search-container">
      <button
        mat-stroked-button
        #filterBtn
        (click)="openFilterPanel()"
        [id]="elementId('filter-btn')"
        [attr.aria-label]="'Open filter panel'"
        [attr.aria-expanded]="isFilterOpen"
        class="filter-btn">
        <mat-icon aria-hidden="true">filter_list</mat-icon>
        FILTER
      </button>

      <app-search-bar
        [config]="searchConfig"
        (search)="onSearch($event)"
        [attr.id]="elementId('search')">
      </app-search-bar>
    </div>

    <button
      mat-flat-button
      color="accent"
      (click)="openAddDialog()"
      [id]="elementId('add-btn')"
      [attr.aria-label]="'Add new inventory level'"
      class="add-btn">
      <mat-icon aria-hidden="true">add</mat-icon>
      ADD NEW INVENTORY
    </button>
  </div>

  <!-- Filter Chips -->
  <app-filter-chips
    *ngIf="filterChips.length > 0"
    [chips]="filterChips"
    (removeChip)="onRemoveFilterChip($event)"
    (clearAll)="onClearAllFilters()"
    [attr.id]="elementId('filter-chips')">
  </app-filter-chips>

  <!-- Data Table -->
  <div class="table-container" #tableCard>
    <app-data-table
      [config]="tableConfig"
      [data]="dataSource"
      [loading]="isLoading"
      [keepActiveRow]="sidePanelOpen"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (rowAction)="onRowAction($event)"
      [attr.id]="elementId('table')"
      [attr.aria-label]="'Inventory levels table for ' + (selectedInventoryClass || 'blood center')">
    </app-data-table>
  </div>

</section>

<!-- Side Panel Container -->
<div class="side-panel-container" *ngIf="sidePanelOpen && selectedInventoryClass"
     role="complementary"
     [attr.aria-label]="sidePanelMode === 'add' ? 'Add new inventory level panel' : 'Edit inventory level panel'">
  <app-add-edit-inventory-dialog
    [mode]="sidePanelMode"
    [inventoryClass]="selectedInventoryClass"
    [data]="sidePanelData"
    (close)="closeSidePanel()"
    (saveSuccess)="onSaveSuccess()">
  </app-add-edit-inventory-dialog>
</div>

</div>
