<div class="view-items-dialog">
  <div class="dialog-header">
    <h2 class="dialog-title">View Items On Pick Slip</h2>
    <button type="button" class="close-button" (click)="onClose()" [attr.aria-label]="'Close dialog'">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <div class="dialog-body">
    <app-data-table
      [config]="tableConfig"
      [data]="products"
      [loading]="loading"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      [attr.aria-label]="'Pick slip products table'">
    </app-data-table>
  </div>

  <div class="dialog-footer">
    <button
      mat-stroked-button
      color="primary"
      (click)="onClose()"
      class="close-btn">
      CLOSE
    </button>
  </div>
</div>
