<app-filter-panel-base
  [title]="'Filters'"
  [maxContentHeight]="280"
  [width]="350"
  [applyDisabled]="isApplyDisabled"
  [clearDisabled]="isClearDisabled"
  (apply)="onApply()"
  (clear)="onClear()"
  (close)="onClose()">

  <form [formGroup]="filterForm">

    <!-- Inventory Class -->
    <mat-form-field appearance="fill">
      <mat-label>Inventory Class</mat-label>
      <mat-select formControlName="inventoryClass">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="inventoryClassSearchControl"
            placeholderLabel="Search inventory classes..."
            noEntriesFoundLabel="No matching classes">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let ic of filteredInventoryClasses" [value]="ic.code">
          {{ ic.code }} - {{ ic.description }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Product Type -->
    <mat-form-field appearance="fill">
      <mat-label>Product Type</mat-label>
      <mat-select formControlName="productType">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="productTypeSearchControl"
            placeholderLabel="Search product types..."
            noEntriesFoundLabel="No matching types">
          </ngx-mat-select-search>
        </mat-option>
        <mat-option *ngFor="let pt of filteredProductTypes" [value]="pt.productType">
          {{ pt.productType }} - {{ pt.description }}
        </mat-option>
      </mat-select>
    </mat-form-field>

  </form>

</app-filter-panel-base>
