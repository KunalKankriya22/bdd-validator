<div class="units-allocated-dialog">
  <div class="dialog-header">
    <h2 mat-dialog-title [id]="elementId('title')">Units Allocated</h2>
    <button
      mat-icon-button
      mat-dialog-close
      [attr.aria-label]="'Close dialog'">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <!-- Error State -->
    @if (error()) {
      <div class="error-container" role="alert" aria-live="assertive">
        <mat-icon>error</mat-icon>
        <p>{{ error() }}</p>
      </div>
    }

    @if (!error()) {
      <app-data-table
        [config]="tableConfig"
        [data]="allocatedUnits()"
        [loading]="loading()">
      </app-data-table>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-stroked-button
      color="primary"
      (click)="onExit()"
      [id]="elementId('exit-btn')">
      EXIT
    </button>
  </mat-dialog-actions>
</div>
