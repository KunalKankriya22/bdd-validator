<app-page-header-with-breadcrumb [config]="pageHeaderConfig" />

<div class="matching-products-container">
  @if (allocating()) {
    <div class="loading-overlay" role="status" aria-live="polite" aria-busy="true">
      <app-loading-spinner size="large" message="Allocating..." color="#228189"></app-loading-spinner>
    </div>
  }
  <!-- Criteria Section -->
  <div class="criteria-section">
    <div class="criteria-row">
      <div class="criteria-checkboxes">
        <span class="criteria-label">Criteria:</span>
        <mat-checkbox
          [(ngModel)]="criteria().abo"
          (change)="onCriteriaChange('abo', $event.checked)"
          [id]="elementId('criteria-abo')">
          ABO
        </mat-checkbox>
        <mat-checkbox
          [(ngModel)]="criteria().product"
          (change)="onCriteriaChange('product', $event.checked)"
          [id]="elementId('criteria-product')">
          Product
        </mat-checkbox>
        <mat-checkbox
          [(ngModel)]="criteria().source"
          (change)="onCriteriaChange('source', $event.checked)"
          [id]="elementId('criteria-source')">
          Source
        </mat-checkbox>
        <mat-checkbox
          [(ngModel)]="criteria().ignoreClass"
          (change)="onCriteriaChange('ignoreClass', $event.checked)"
          [id]="elementId('criteria-ignore-class')">
          Ignore Class
        </mat-checkbox>
      </div>

      <div class="order-info">
        <span class="order-label">Order No. - {{ data.orderNo }}</span>
      </div>

      <!-- Antigen Chips -->
      @if (data.antigenCodes && data.antigenCodes.length > 0) {
        <div class="antigen-chips">
          @for (antigen of data.antigenCodes; track antigen) {
            <mat-chip class="antigen-chip">{{ antigen }}</mat-chip>
          }
        </div>
      }
    </div>
  </div>

  <!-- Error State -->
  @if (error()) {
    <div class="error-container" role="alert" aria-live="assertive">
      <mat-icon>error</mat-icon>
      <p>{{ error() }}</p>
    </div>
  }

  <!-- Products Tables -->
  @if (!error()) {
    <div class="tables-wrapper">
      <!-- LEFT GRID: Inventory -->
      <div class="table-section table-section--inventory">
        <app-data-table
          [config]="inventoryTableConfig"
          [data]="matchingProducts()"
          [loading]="loading()"
          [highlightedRow]="selectedProduct()"
          (rowClick)="onRowClick($event)"
          (selectionChange)="onSelectionChange($event)">
        </app-data-table>
      </div>

      <!-- RIGHT GRID: Antigens & Attributes -->
      <div class="table-section table-section--detail">
        <app-data-table
          [config]="antigenAttributeTableConfig"
          [data]="antigenAttributeRows()"
          [loading]="detailLoading()">
        </app-data-table>
      </div>
    </div>
  }

  <!-- Page Actions -->
  <div class="page-actions">
    <button
      mat-button
      (click)="onCancel()"
      [id]="elementId('cancel-btn')"
      [disabled]="allocating()">
      CANCEL
    </button>
<button
      mat-raised-button
      color="primary"
      (click)="onAllocate()"
      [id]="elementId('allocate-btn')"
      [disabled]="!hasSelection() || allocating()">
      ALLOCATE
    </button>
  </div>
</div>
