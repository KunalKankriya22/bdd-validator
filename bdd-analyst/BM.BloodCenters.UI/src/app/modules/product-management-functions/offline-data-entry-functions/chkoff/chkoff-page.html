<div class="chkoff-page-container">
  <app-page-header-with-breadcrumb [config]="pageHeaderConfig" />

  <app-chkoff-form (checkInSuccess)="onCheckInSuccess($event)" (clearAll)="onProductsCleared()" />

  <section class="table-section" [attr.aria-labelledby]="elementId('table-heading')">
    <h3 [id]="elementId('table-heading')" class="sr-only">Checked-In Products</h3>

    @if (showTable()) {
      <app-data-table
        [config]="tableConfig()"
        [data]="products()"
        [loading]="false"
        (sortChange)="onSortChange($event)" />
    }
  </section>
</div>
