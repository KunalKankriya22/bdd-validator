<div class="side-panel-dialog">
  <div class="panel-header">
    <h2 mat-dialog-title>View Products In Box</h2>
    <button mat-icon-button (click)="onClose()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="panel-content">
    @if (loading()) {
      <div class="loading-container" role="status" aria-live="polite">
        <mat-spinner diameter="40" aria-label="Loading products"></mat-spinner>
      </div>
    } @else if (error()) {
      <div class="error-container" role="alert">
        <mat-icon>error</mat-icon>
        <p>{{ error() }}</p>
      </div>
    } @else {
      <app-data-table
        [config]="tableConfig"
        [data]="sortedProducts()"
        [loading]="loading()"
        (sortChange)="onProductSortChange($event)" />
    }
  </div>

  <div class="panel-actions">
    <button mat-stroked-button class="btn-close" (click)="onClose()">CLOSE</button>
  </div>
</div>
