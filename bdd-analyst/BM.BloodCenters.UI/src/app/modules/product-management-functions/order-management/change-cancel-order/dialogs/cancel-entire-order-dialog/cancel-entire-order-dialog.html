<h2 mat-dialog-title>Cancel Entire Order</h2>
<mat-dialog-content>
  <p class="dialog-message">Are you sure you want to cancel the entire order?<br>Please select a cancellation reason to proceed.</p>
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Cancel Code</mat-label>
    <mat-select [formControl]="cancelCodeCtrl">
      @for (code of cancelCodes(); track code.code) {
        <mat-option [value]="code.code">{{ code.code }} - {{ code.description }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button class="cancel-btn" (click)="onCancel()">NO, GO BACK</button>
  <button mat-raised-button class="confirm-btn" (click)="onConfirm()" [disabled]="!cancelCodeCtrl.value">YES, CANCEL ORDER</button>
</mat-dialog-actions>
