<h2 mat-dialog-title>Confirm Cancellation</h2>
<mat-dialog-content>
  <p class="dialog-message">Are you sure you want to cancel all products in this item?<br>This action will remove all associated products from the item.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button class="cancel-btn" (click)="onCancel()">NO, KEEP PRODUCTS</button>
  <button mat-raised-button class="confirm-btn" (click)="onConfirm()">YES, CANCEL ALL</button>
</mat-dialog-actions>
