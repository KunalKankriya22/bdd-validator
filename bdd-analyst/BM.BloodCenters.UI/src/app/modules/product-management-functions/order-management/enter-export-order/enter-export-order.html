<!-- Loading Overlay -->
@if (saving() || loading()) {
  <div class="loading-overlay" role="status" aria-live="polite">
    <app-loading-spinner size="large" [message]="saving() ? 'Saving...' : 'Loading...'" color="#228189"></app-loading-spinner>
    <span class="visually-hidden">Loading, please wait...</span>
  </div>
}

<!-- Step content -->
<div class="ex-step-content" role="region" [attr.aria-label]="'Step ' + currentStep() + ' of 2'">
  @switch (currentStep()) {
    @case (1) {
      <app-ex-step-order-details
        [savedOrderData]="orderData()"
        (formDataChange)="onStep1FormDataChange($event)"
        (validityChange)="onStep1ValidityChange($event)"
        (priceChangeFlagChange)="onPriceChangeFlagChange($event)"
        (contractSubstituteFlagChange)="onContractSubstituteFlagChange($event)"
        (standingOrderItemsFound)="onStandingOrderItemsFound($event)">
      </app-ex-step-order-details>
    }
    @case (2) {
      <app-ex-step-add-products
        [orderData]="orderData()"
        [orderItems]="orderItems()"
        [customerId]="orderData()?.customerId ?? ''"
        [consigneeId]="orderData()?.consigneeId ?? ''"
        [priceChangeFlag]="priceChangeFlag()"
        [contractSubstituteFlag]="contractSubstituteFlag()"
        (itemAdded)="onItemAdded($event)"
        (itemAddedExtra)="onItemAddedExtra($event)"
        (itemDeleted)="onItemDeleted($event)">
      </app-ex-step-add-products>
    }
  }
</div>

<!-- Footer -->
<div class="wizard-footer">
  <div class="footer-left">
    <button mat-stroked-button class="notes-btn" (click)="onAddNotes()"
            aria-label="Add notes to export order">
      NOTES
    </button>
  </div>
  <div class="footer-right">
    @if (currentStep() === 2) {
      <span class="step-indicator" aria-live="polite" role="status">Step {{ currentStep() }} of 2</span>
      <button mat-stroked-button class="back-btn" (click)="goToStep1()"
              aria-label="Back to order details">
        BACK
      </button>
      <button mat-raised-button color="primary" class="submit-btn"
              (click)="onSubmitOrder()" [disabled]="saving()"
              aria-label="Submit export order for release">
        SUBMIT ORDER
      </button>
    } @else {
      <span class="step-indicator" aria-live="polite" role="status">Step {{ currentStep() }} of 2</span>
      <button mat-raised-button color="primary" class="next-btn"
              (click)="goToStep2()" [disabled]="!isStep1Valid()">
        NEXT: ADD PRODUCTS
      </button>
    }
  </div>
</div>
