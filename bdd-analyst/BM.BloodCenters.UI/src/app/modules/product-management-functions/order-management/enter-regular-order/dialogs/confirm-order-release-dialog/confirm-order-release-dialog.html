<div class="confirm-dialog">
  <h2 mat-dialog-title>Confirm Order Release</h2>
  <mat-dialog-content>
    <p>Are you sure you want to release this order for allocation?</p>
    <p>This action will proceed with assigning the order accordingly.</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">NO, CANCEL</button>
    <button mat-raised-button color="primary" (click)="onConfirm()">YES, RELEASE ORDER</button>
  </mat-dialog-actions>
</div>
