<div class="dialog-container">
  <div class="dialog-header">
    <h2 mat-dialog-title>New Consignee (Ship To)</h2>
    <button mat-icon-button (click)="onCancel()" [attr.aria-label]="'Close dialog'">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    <form [formGroup]="consigneeForm">
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Consignee ID</mat-label>
          <input matInput formControlName="consigneeId" [id]="elementId('consignee-id')"
                 maxlength="10" required>
          <mat-error *ngIf="consigneeForm.get('consigneeId')?.hasError('required')">Consignee ID is required</mat-error>
          <mat-error *ngIf="consigneeForm.get('consigneeId')?.hasError('maxlength')">Max 10 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" [id]="elementId('name')"
                 maxlength="50" required autocomplete="organization">
          <mat-error *ngIf="consigneeForm.get('name')?.hasError('required')">Name is required</mat-error>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Short Name</mat-label>
          <input matInput formControlName="shortName" [id]="elementId('short-name')" maxlength="15">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Address 1</mat-label>
          <input matInput formControlName="address1" [id]="elementId('address1')" maxlength="60" autocomplete="address-line1">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Address 2</mat-label>
          <input matInput formControlName="address2" [id]="elementId('address2')" maxlength="60" autocomplete="address-line2">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>City</mat-label>
          <input matInput formControlName="city" [id]="elementId('city')" maxlength="30" autocomplete="address-level2">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>State</mat-label>
          <input matInput formControlName="state" [id]="elementId('state')" maxlength="2" autocomplete="address-level1">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Zip</mat-label>
          <input matInput formControlName="zip" [id]="elementId('zip')" maxlength="10" autocomplete="postal-code">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Country</mat-label>
          <input matInput formControlName="country" [id]="elementId('country')" maxlength="30" autocomplete="country-name">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput formControlName="phoneNo" [id]="elementId('phone')" maxlength="20" autocomplete="tel">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Fax</mat-label>
          <input matInput formControlName="faxNo" [id]="elementId('fax')" maxlength="20">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Effective Date</mat-label>
          <input matInput [matDatepicker]="effDatePicker" formControlName="effDate"
                 [id]="elementId('eff-date')" required>
          <mat-datepicker-toggle matIconSuffix [for]="effDatePicker" aria-label="Open effective date calendar"></mat-datepicker-toggle>
          <mat-datepicker #effDatePicker></mat-datepicker>
          <mat-error>{{ getEffectiveDateError() }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Termination Date</mat-label>
          <input matInput [matDatepicker]="termDatePicker" formControlName="termDate"
                 [id]="elementId('term-date')">
          <mat-datepicker-toggle matIconSuffix [for]="termDatePicker" aria-label="Open termination date calendar"></mat-datepicker-toggle>
          <mat-datepicker #termDatePicker></mat-datepicker>
          <mat-error>{{ getTerminationDateError() }}</mat-error>
        </mat-form-field>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onSave()"
            [disabled]="consigneeForm.invalid || saving()">
      Save
    </button>
  </mat-dialog-actions>
</div>
