<div class="enter-regular-order-container">
  <app-page-header-with-breadcrumb [config]="headerConfig"></app-page-header-with-breadcrumb>

  <!-- Loading Overlay -->
  @if (saving() || loading()) {
    <div class="loading-overlay" role="alert">
      <app-loading-spinner size="large" [message]="saving() ? 'Saving...' : 'Loading...'" color="#228189"></app-loading-spinner>
    </div>
  }

  <!-- Content area with tabs merged inside -->
  <div class="step-content-wrapper" [attr.aria-busy]="saving() || loading()">
    <div class="step-content-card">
      <!-- Tabs inside the card -->
      <div class="content-tabs">
        <nav class="tab-nav" role="tablist" aria-label="Order type tabs">
          <button class="tab-item" [class.active]="activeTab() === 0"
                  id="tab-regular" aria-controls="tabpanel-order"
                  (click)="activeTab.set(0)" (keydown)="onTabKeydown($event, 0)"
                  role="tab" [attr.aria-selected]="activeTab() === 0"
                  [attr.tabindex]="activeTab() === 0 ? 0 : -1">
            Enter Regular Order
          </button>
          <button class="tab-item" [class.active]="activeTab() === 1"
                  id="tab-special" aria-controls="tabpanel-order"
                  (click)="activeTab.set(1)" (keydown)="onTabKeydown($event, 1)"
                  role="tab" [attr.aria-selected]="activeTab() === 1"
                  [attr.tabindex]="activeTab() === 1 ? 0 : -1">
            Enter Special Order
          </button>
          <button class="tab-item" [class.active]="activeTab() === 2"
                  id="tab-export" aria-controls="tabpanel-order"
                  (click)="activeTab.set(2)" (keydown)="onTabKeydown($event, 2)"
                  role="tab" [attr.aria-selected]="activeTab() === 2"
                  [attr.tabindex]="activeTab() === 2 ? 0 : -1">
            Enter Export Order
          </button>
        </nav>
      </div>

      <!-- Tab content -->
      @switch (activeTab()) {
        @case (0) {
          <!-- Regular Order -->
          <div class="step-content" role="tabpanel" id="tabpanel-order"
               [attr.aria-labelledby]="'tab-' + (activeTab() === 0 ? 'regular' : activeTab() === 1 ? 'special' : 'export')">
            @switch (currentStep()) {
              @case (1) {
                <app-step-order-details
                  [savedOrderData]="orderData()"
                  (formDataChange)="onStep1FormDataChange($event)"
                  (validityChange)="onStep1ValidityChange($event)">
                </app-step-order-details>
              }
              @case (2) {
                <app-step-add-products
                  [orderData]="orderData()"
                  [orderItems]="orderItems()"
                  [customerId]="selectedCustomerId()"
                  [consigneeId]="selectedConsigneeId()"
                  [contractSubstituteFlag]="contractSubstituteFlag()"
                  (itemAdded)="onItemAdded($event)"
                  (itemAddedExtra)="onItemAddedExtra($event)"
                  (itemDeleted)="onItemDeleted($event)">
                </app-step-add-products>
              }
            }
          </div>

          <!-- Regular Order Footer -->
          <div class="wizard-footer">
            <div class="footer-right">
              @if (currentStep() === 2) {
                <span class="step-indicator">Step {{ currentStep() }} of 2</span>
                <button mat-stroked-button class="back-btn" (click)="goToStep1()">
                  BACK
                </button>
                <button mat-raised-button color="primary" class="submit-btn"
                        (click)="onSubmitOrder()" [disabled]="saving()">
                  SUBMIT ORDER
                </button>
              } @else {
                <span class="step-indicator">Step {{ currentStep() }} of 2</span>
                <button mat-raised-button color="primary" class="next-btn"
                        (click)="goToStep2()" [disabled]="!isStep1Valid()">
                  NEXT: ADD PRODUCTS
                </button>
              }
            </div>
          </div>
        }
        @case (1) {
          <!-- Special Order -->
          <div role="tabpanel" id="tabpanel-order" aria-labelledby="tab-special">
            <app-enter-special-order
              (customerChanged)="onSpCustomerChanged($event)"
              (orderCreated)="onSpOrderCreated($event)"
              (itemsChanged)="onItemsChanged()">
            </app-enter-special-order>
          </div>
        }
        @case (2) {
          <!-- Export Order -->
          <div role="tabpanel" id="tabpanel-order" aria-labelledby="tab-export">
            <app-enter-export-order
              (customerChanged)="onExCustomerChanged($event)"
              (orderCreated)="onExOrderCreated($event)"
              (itemsChanged)="onItemsChanged()">
            </app-enter-export-order>
          </div>
        }
      }
    </div>
  </div>
</div>
