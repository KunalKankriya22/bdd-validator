<div class="dialog-container">
  <div class="dialog-header">
    <h1 id="attr-antigens-dialog-title">Attributes & Antigens</h1>
    <button mat-icon-button (click)="onGoBack()" [attr.aria-label]="'Close attributes and antigens dialog'">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <div class="dialog-tables">
      <div class="dialog-tables__section">
        <h2 class="dialog-tables__title">Item Antigens</h2>
        <app-data-table [config]="antigensTableConfig" [data]="data.antigens"></app-data-table>
      </div>

      <div class="dialog-tables__section">
        <h2 class="dialog-tables__title">Item Attributes</h2>
        <app-data-table [config]="attributesTableConfig" [data]="data.attributes"></app-data-table>
      </div>
    </div>
  </div>

  <div class="dialog-footer">
    <button mat-stroked-button (click)="onGoBack()">GO BACK</button>
  </div>
</div>
