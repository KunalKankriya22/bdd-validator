<div class="dialog-container">
  <div class="dialog-header">
    <h1 id="order-items-dialog-title">Order Items</h1>
    <button mat-icon-button (click)="onCancel()" [attr.aria-label]="'Close order items dialog'">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <app-data-table [config]="itemsTableConfig" [data]="data.items"></app-data-table>
  </div>

  <div class="dialog-footer">
    <button mat-button (click)="onCancel()">CANCEL</button>
    <button mat-raised-button
            color="primary"
            [disabled]="data.items.length === 0"
            [attr.aria-label]="data.items.length === 0 ? 'View attributes and antigens (no items available)' : 'View attributes and antigens'"
            (click)="onAttributesAntigens()">
      ATTRIBUTES & ANTIGENS
    </button>
  </div>
</div>
