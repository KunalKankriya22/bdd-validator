<div class="confirm-dialog">
  <h2 mat-dialog-title class="confirm-dialog__title">Print the Transfer Slip?</h2>
  <p class="confirm-dialog__message">This action will generate a transfer slip number.</p>
  <div class="confirm-dialog__actions">
    <button mat-button (click)="onNo()">NO</button>
    <button mat-raised-button color="primary" (click)="onYes()">YES</button>
  </div>
</div>
