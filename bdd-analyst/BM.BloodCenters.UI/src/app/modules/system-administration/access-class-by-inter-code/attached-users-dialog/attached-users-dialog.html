<div class="side-panel-wrapper" role="dialog" aria-modal="true" aria-labelledby="attached-users-title" cdkTrapFocus>

  <!-- Header -->
  <div class="panel-header">
    <div class="header-content">
      <h2 class="panel-title" id="attached-users-title">Attached Users List</h2>
      <p class="panel-subtitle">{{ data.accessClass }} <span class="separator"></span> {{ data.description }}</p>
    </div>

    <button type="button" mat-icon-button class="close-btn" (click)="close()" aria-label="Close panel">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="panel-body">
    <!-- Loading State -->
    <div class="loading-container" *ngIf="isLoading">
      <mat-spinner diameter="50"></mat-spinner>
      <p class="loading-text">Loading users...</p>
    </div>

    <!-- Users Table -->
    <div class="users-table-container" *ngIf="!isLoading && users.length > 0">
      <table class="users-table">
        <thead>
          <tr>
            <th>
              <button type="button" class="sort-button" (click)="toggleSort('userId')" [attr.aria-label]="'Sort by User ID, currently ' + (sortDirection === 'ASC' ? 'ascending' : 'descending')">
                <span>User ID</span>
                <mat-icon class="sort-icon">{{ getSortIcon('userId') }}</mat-icon>
              </button>
            </th>
            <th>
              <span>User Name</span>
            </th>
            <th>
              <span>Access Level</span>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td>{{ user.userId?.trim() || '-' }}</td>
            <td>{{ user.name?.trim() || '-' }}</td>
            <td>{{ user.level?.trim() || '-' }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="!isLoading && users.length === 0" role="status" aria-live="polite">
      <div class="empty-state-icon" aria-hidden="true">
        <mat-icon>edit</mat-icon>
      </div>
      <p class="empty-message">No users found for this access class</p>
    </div>
  </div>

</div>
