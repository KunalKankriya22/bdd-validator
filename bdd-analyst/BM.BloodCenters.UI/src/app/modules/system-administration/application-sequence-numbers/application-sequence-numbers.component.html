<!-- Screen reader announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite"></div>

<div class="layout-wrapper" [class.side-panel-active]="sidePanelOpen">
  <!-- Main Content -->
  <div class="main-content" [class.side-panel-active]="sidePanelOpen" role="main" aria-label="Application Sequence Numbers">

    <div class="app-seq">
      <!-- Page Header with Breadcrumb -->
      <app-page-header-with-breadcrumb [config]="headerConfig" />

      <!-- Card (Controls + Table) -->
      <div class="app-seq__card" #tableCard>
        <!-- Controls (Filter + Search) -->
        <div class="app-seq__controls">
          <div class="app-seq__controls-start">
            <button
              #filterBtn
              mat-button
              class="filter-button"
              [class.filter-button--active]="isFilterOpen"
              (click)="openFilterModal($event)"
              aria-label="Open filter dialog"
              type="button">
              <span class="filter-icon" aria-hidden="true"></span>
              FILTER
            </button>

            <!-- Inline Filter Chips -->
            @if (hasActiveFilters()) {
              <app-filter-chips
                [chips]="filterChips"
                (removeChip)="onRemoveFilterChip($event)"
                (clearAll)="clearAllFilters()">
              </app-filter-chips>
            }
          </div>

          <app-search-bar
            [config]="searchConfig"
            (search)="onSearch($event)">
          </app-search-bar>
        </div>

        <!-- Table Wrapper -->
        <div class="app-seq__table-wrapper" role="region" aria-label="Application sequence numbers data" tabindex="0">
          <!-- Error State -->
          @if (hasError) {
            <div class="app-seq__error" role="alert">
              <mat-icon aria-hidden="true">error_outline</mat-icon>
              <p>{{ errorMessage }}</p>
              <button mat-button (click)="loadData()">Retry</button>
            </div>
          }

          <!-- Data Table -->
          @if (!hasError) {
            <app-data-table
              [config]="tableConfig"
              [data]="dataSource"
              [loading]="isLoading"
              [highlightedRow]="sidePanelMode === 'edit' ? sidePanelData : null"
              (sortChange)="onSortChange($event)"
              (pageChange)="onPageChange($event)"
              (rowAction)="onRowAction($event)">
            </app-data-table>
          }
        </div>
      </div>
    </div>

  </div>

  <!-- Side Panel Container -->
  @if (sidePanelOpen) {
    <div class="side-panel-container">
      <app-sequence-form-panel
        [mode]="sidePanelMode"
        [data]="sidePanelData"
        (close)="closeSidePanel()"
        (save)="onSaveSuccess()"
      ></app-sequence-form-panel>
    </div>
  }
</div>
