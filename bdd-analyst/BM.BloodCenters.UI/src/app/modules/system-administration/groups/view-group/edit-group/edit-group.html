<div class="edit-group-container">
  <!-- Dialog header -->
  <div class="dialog-header">
    <h2 class="dialog-title">Edit - {{group().groupId}}</h2>
    <button mat-icon-button (click)="cancelChanges()" aria-label="Close dialog" tabindex="-1">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Dialog content -->
  <div class="dialog-content">
    <div class="form-field">
      <mat-form-field appearance="fill">
        <mat-label>Description</mat-label>
        <input
          matInput
          [value]="group().description"
          (input)="handleDescriptionChange($event)"
          aria-label="Group description"
          maxlength="40"
        >
        <mat-error *ngIf="!group().description?.trim()">Description is required</mat-error>
      </mat-form-field>
      <div class="field-error" *ngIf="(group().description?.length ?? 0) > 40">
        Description can be maximum 40 characters
      </div>
    </div>
  </div>

  <!-- Dialog footer -->
  <div class="dialog-footer">
    <button 
      mat-button 
      (click)="cancelChanges()" 
      aria-label="Cancel changes"
    >
      CANCEL
    </button>
    <button
      mat-raised-button
      color="primary"
      class="savebtn"
      (click)="confirmChanges()"
      [disabled]="!group().description?.trim() || (group().description?.length ?? 0) > 40 || !isChanged() || isSubmitting()"
      aria-label="Save changes"
    >
      SAVE
    </button>
  </div>
</div>
