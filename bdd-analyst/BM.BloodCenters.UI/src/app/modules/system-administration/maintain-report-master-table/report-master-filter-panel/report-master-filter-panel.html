<app-filter-panel-base
  [title]="'Filters'"
  [maxContentHeight]="500"
  [width]="350"
  [applyDisabled]="isApplyDisabled"
  (apply)="onApply()"
  (clear)="onClear()"
  (close)="onClose()">

  <!-- Filter Form Content with Focus Trap -->
  <div cdkTrapFocus>
    <form [formGroup]="filterForm">
      <mat-form-field appearance="fill">
        <mat-label>Type</mat-label>
        <mat-select formControlName="type">
          <!-- Search Option -->
          <mat-option>
            <ngx-mat-select-search
              [formControl]="typeSearchControl"
              placeholderLabel="Search types..."
              noEntriesFoundLabel="No matching types">
            </ngx-mat-select-search>
          </mat-option>

          <!-- Filtered Options -->
          <mat-option *ngFor="let type of filteredTypeOptions" [value]="type">
            {{ type }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Chapter ID</mat-label>
        <mat-select formControlName="chapterId">
          <!-- Search Option -->
          <mat-option>
            <ngx-mat-select-search
              [formControl]="chapterSearchControl"
              placeholderLabel="Search chapter IDs..."
              noEntriesFoundLabel="No matching chapters">
            </ngx-mat-select-search>
          </mat-option>

          <!-- Filtered Options -->
          <mat-option *ngFor="let chapter of filteredChapterOptions" [value]="chapter">
            {{ chapter }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Warehouse</mat-label>
        <mat-select formControlName="warehouse">
          <!-- Search Option -->
          <mat-option>
            <ngx-mat-select-search
              [formControl]="warehouseSearchControl"
              placeholderLabel="Search warehouses..."
              noEntriesFoundLabel="No matching warehouses">
            </ngx-mat-select-search>
          </mat-option>

          <!-- Filtered Options -->
          <mat-option *ngFor="let wh of filteredWarehouseOptions" [value]="wh.code">
            {{ wh.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </form>
  </div>

</app-filter-panel-base>
