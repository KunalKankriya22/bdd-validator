<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="isDialogOpen">

  <!-- Backdrop Overlay -->
  <div class="drawer-backdrop" [class.active]="isDialogOpen"></div>

  <!-- Main Container -->
  <main class="report-master-table main-content" [class.side-panel-active]="isDialogOpen" aria-label="Report Master Table content">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

  <!-- Table Card Container -->
  <div class="report-master-table__card" #tableCard>

    <!-- Table Controls with Inline Filter Chips -->
    <div class="report-master-table__controls">
      <!-- Left section: Filter button and chips -->
      <div class="report-master-table__controls-left">
        <button #filterBtn mat-button class="filter-button" [class.filter-button--active]="isFilterOpen" [attr.aria-label]="'Open filter options'" aria-keyshortcuts="Alt+F" (click)="openFilter()">
          <span class="filter-icon" aria-hidden="true"></span>
          FILTER
        </button>

        <!-- Inline Filter Chips -->
        <app-filter-chips *ngIf="hasActiveFilters()" [chips]="filterChips" [maxVisible]="3"
          (removeChip)="onRemoveFilterChip($event)" (clearAll)="clearAllFilters()">
        </app-filter-chips>
      </div>

      <!-- Right section: Search bar -->
      <app-search-bar
        [config]="searchConfig"
        [(searchText)]="searchTerm"
        (search)="onSearch()">
      </app-search-bar>
    </div>

    <!-- Error State -->
    <div *ngIf="hasError && !isLoading" class="report-master-table__error" role="alert" aria-label="Error loading data">
      <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
      <p class="error-message">{{ errorMessage }}</p>
      <button mat-raised-button color="primary" (click)="loadReportData()">
        Retry
      </button>
    </div>

    <!-- Data Table -->
    <div class="report-master-table__table-wrapper">
      <app-data-table *ngIf="!hasError" [config]="tableConfig" [data]="dataSource" [loading]="isLoading"
        (pageChange)="onPageChange($event)" (sortChange)="onSortChange($event)" (rowAction)="onRowAction($event)" />
    </div>
  </div>
  </main>

</div>
