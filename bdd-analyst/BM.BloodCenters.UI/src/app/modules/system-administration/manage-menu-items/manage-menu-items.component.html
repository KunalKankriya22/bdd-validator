<div class="page-container">

  <div class="header-card">

    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a [routerLink]="ROUTES.HOME" class="breadcrumb-link">
        Home
      </a>
      <mat-icon class="breadcrumb-separator">chevron_right</mat-icon>
      <span class="breadcrumb-current">
        {{ pageTitle() }}
      </span>
    </nav>

    <div class="page-header">
      <div>
        <h1 class="page-title">{{ pageTitle() }}</h1>
        @if (pageSubtitle()) {
          <p class="page-subtitle">{{ pageSubtitle() }}</p>
        }
      </div>
      <button
        mat-flat-button
        color="primary"
        class="add-menu-item-button"
        (click)="onAddMenuItem()"
        aria-label="Add new menu item"
        type="button">
        <mat-icon>add</mat-icon>
        <span>ADD NEW MENU ITEM</span>
      </button>
    </div>

    <mat-tab-group
      class="menu-item-tabs"
      [selectedIndex]="selectedTabIndex"
      (selectedTabChange)="onTabChange($event)"
      animationDuration="0ms"
      aria-label="Menu item type tabs">

      <mat-tab aria-label="Web menu items" [disabled]="isTabSwitchPending">
        <ng-template mat-tab-label>
          <div (click)="onTabClick($event, 0)">
            <mat-icon class="tab-icon">language</mat-icon>
            <span>Web</span>
          </div>
        </ng-template>
      </mat-tab>

      <mat-tab aria-label="On-site menu items" [disabled]="isTabSwitchPending">
        <ng-template mat-tab-label>
          <div (click)="onTabClick($event, 1)">
            <img src="assets/images/icons/server-network-off.svg" class="tab-icon" alt="" aria-hidden="true" />
            <span>On-Site</span>
          </div>
        </ng-template>
      </mat-tab>

    </mat-tab-group>
  </div>

  <div class="cards-grid">

    <app-groups-list
      [checkBeforeSelect]="hasUnsavedChanges()"
      [forceSelectedGroupId]="forceGroupSelection()"
      [activeTabIndex]="selectedTabIndex"
      (requestSelectionChange)="onRequestGroupChange($event)"
      (groupSelected)="onGroupSelected($event)"
      (loadingStateChange)="onGroupsLoadingChange($event)"
      class="card">
    </app-groups-list>

    <app-menu-tree
      [treeData]="menuTreeData()"
      [groupId]="selectedGroup()?.groupId || null"
      [applId]="selectedTabIndex === 0 ? 'DON' : 'WEB'"
      [isLoading]="isLoadingContent()"
      (nodeSelected)="onMenuNodeSelected($event)"
      (hasUnsavedChangesEvent)="onTreeHasUnsavedChanges($event)"
      class="card">
    </app-menu-tree>

    <app-menu-details
      [menuNode]="selectedMenuNode()"
      [isLoading]="isLoadingContent()"
      [allMenuItems]="menuTreeData()"
      [groupId]="selectedGroup()?.groupId || ''"
      (menuMoved)="onMenuMoved()"
      (menuItemEdit)="onEditMenuItem($event)"
      class="card">
    </app-menu-details>

  </div>

</div>
