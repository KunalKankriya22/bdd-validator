<div class="dialog-container">

  <div class="dialog-body">
    <h2 class="dialog-title">Are you sure you want to leave?</h2>
    <p class="dialog-message">You have unsaved changes. Are you sure you want to leave this page?</p>
    <p class="dialog-subtitle">Unsaved changes will be lost</p>
  </div>

  <div class="dialog-actions">
    <button
      mat-button
      class="cancel-button"
      (click)="onCancel()"
      type="button">
      STAY ON THIS PAGE
    </button>

    <button
      mat-raised-button
      color="primary"
      class="confirm-button"
      (click)="onConfirm()"
      type="button">
      DISCARD CHANGES AND LEAVE
    </button>
  </div>

</div>
