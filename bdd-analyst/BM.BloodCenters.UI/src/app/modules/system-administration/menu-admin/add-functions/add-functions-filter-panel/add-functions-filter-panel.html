<app-filter-panel-base
  [title]="'Filters'"
  [maxContentHeight]="500"
  [width]="350"
  [applyDisabled]="isApplyDisabled"
  (apply)="onApply()"
  (clear)="onClear()"
  (close)="onClose()">

  <!-- Filter Form Content with Focus Trap -->
  <div cdkTrapFocus>
    <form [formGroup]="filterForm">
      <mat-form-field appearance="fill">
        <mat-label>Function Type</mat-label>
        <mat-select formControlName="functionType">
          <mat-option *ngFor="let type of functionTypeOptions" [value]="type">
            {{ type | titlecase }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Scope</mat-label>
        <mat-select formControlName="scope">
          <!-- Search Option -->
          <mat-option>
            <ngx-mat-select-search
              [formControl]="scopeSearchControl"
              placeholderLabel="Search scopes..."
              noEntriesFoundLabel="No matching scopes">
            </ngx-mat-select-search>
          </mat-option>

          <!-- Filtered Options -->
          <mat-option *ngFor="let scope of filteredScopeOptions" [value]="scope">
            {{ scope }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </form>
  </div>

</app-filter-panel-base>
