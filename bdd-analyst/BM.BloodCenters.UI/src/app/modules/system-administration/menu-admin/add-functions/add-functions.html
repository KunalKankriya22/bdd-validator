<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Layout Wrapper for Side Panel Management -->
<div class="layout-wrapper" [class.side-panel-active]="isDialogOpen">

  <!-- Backdrop Overlay -->
  <div class="drawer-backdrop" [class.active]="isDialogOpen"></div>

  <!-- Main Container -->
  <main class="add-functions main-content" [class.side-panel-active]="isDialogOpen" aria-label="Add Functions content">

    <!-- Page Header with Breadcrumb -->
    <app-page-header-with-breadcrumb [config]="headerConfig" />

  <!-- Table Card Container -->
  <div class="add-functions__card" #tableCard>

    <!-- Table Controls with Inline Filter Chips -->
    <div class="add-functions__controls">
      <!-- Left section: Filter button and chips -->
      <div class="add-functions__controls-left">
        <button mat-button class="filter-button" [class.filter-button--active]="isFilterOpen" [attr.aria-label]="'Open filter options'" (click)="openFilter()">
          <span class="filter-icon" aria-hidden="true"></span>
          FILTER
        </button>

        <!-- Inline Filter Chips -->
        <app-filter-chips *ngIf="hasActiveFilters()" [chips]="filterChips" [maxVisible]="3"
          (removeChip)="onRemoveFilterChip($event)" (clearAll)="onClearAllFilters()">
        </app-filter-chips>
      </div>

      <!-- Right section: Search bar -->
      <app-search-bar
        [config]="searchConfig"
        [(searchText)]="searchTerm"
        (search)="onSearch()">
      </app-search-bar>
    </div>

    <!-- Error State -->
    <div *ngIf="hasError && !isLoading" class="add-functions__error" role="alert" aria-label="Error loading data">
      <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
      <p class="error-message">{{ errorMessage }}</p>
      <button mat-raised-button color="primary" (click)="loadFunctions()">
        Retry
      </button>
    </div>

    <!-- Data Table -->
    <div class="add-functions__table-wrapper">
      <app-data-table *ngIf="!hasError" [config]="tableConfig" [data]="dataSource" [loading]="isLoading"
        (pageChange)="onPageChange($event)" (sortChange)="onSortChange($event)" (rowAction)="onRowAction($event)" />
    </div>
  </div>
  </main>

</div>

<!-- Cell Templates -->
<ng-template #iconCellTemplate let-row let-column="column">
  <div class="icon-cell">
    <mat-icon *ngIf="row[column.key] && row[column.key].trim()">{{ row[column.key] | lowercase }}</mat-icon>
    <mat-icon *ngIf="!row[column.key] || !row[column.key].trim()">language</mat-icon>
  </div>
</ng-template>

<ng-template #parameterCellTemplate let-row let-column="column">
  <div class="parameter-cell">
    <span
      *ngIf="row[column.key] && row[column.key].trim()"
      class="parameter-badge"
      [matTooltip]="row[column.key].length > 12 ? row[column.key] : ''"
      [matTooltipDisabled]="row[column.key].length <= 12"
      matTooltipPosition="above">
      {{ row[column.key] }}
    </span>
    <span *ngIf="!row[column.key] || !row[column.key].trim()" class="empty-value">-</span>
  </div>
</ng-template>

<ng-template #functionTypeCellTemplate let-row let-column="column">
  <span
    [ngClass]="{
      'function-type-page': row[column.key]?.toLowerCase() === 'page',
      'function-type-menu': row[column.key]?.toLowerCase() === 'menu'
    }">
    {{ row[column.key] | titlecase }}
  </span>
</ng-template>
