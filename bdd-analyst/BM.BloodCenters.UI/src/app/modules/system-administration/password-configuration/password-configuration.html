<div class="page-wrapper">
  <!-- Page Header with Breadcrumb -->
  <app-page-header-with-breadcrumb [config]="headerConfig" />

  <!-- Loading state -->
  <mat-card *ngIf="isLoading" class="loading-card">
    <mat-card-content>
      <div class="loading-content">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Loading password configuration...</p>
      </div>
    </mat-card-content>
  </mat-card>

  <!-- Main form -->
  <form [formGroup]="form" (ngSubmit)="save()" *ngIf="!isLoading && form" class="configuration-form">
    <div class="accordion-section">
      <app-password-requirements formGroupName="passwordRequirements" [parentForm]="form"
        [isStrongPasswordEnabled]="isStrongPasswordEnabled">
      </app-password-requirements>
    </div>

    <div class="accordion-section">
      <app-security-policies formGroupName="securityPolicies" [parentForm]="form"
        [isStrongPasswordEnabled]="isStrongPasswordEnabled">
      </app-security-policies>
    </div>

    <div class="accordion-section">
      <app-expiration-notifications formGroupName="expirationNotifications" [parentForm]="form"
        [isStrongPasswordEnabled]="isStrongPasswordEnabled">
      </app-expiration-notifications>
    </div>
  </form>

  <!-- Footer Actions (Outside form) -->
  <div class="footer-actions" *ngIf="!isLoading && form">
    <button mat-stroked-button color="accent" type="button" (click)="clearAll()" class="btn-cancel" [disabled]="isSaving">
      CANCEL
    </button>
    <button mat-flat-button color="accent" type="button" (click)="save()" [disabled]="form.invalid || isSaving" class="btn-save"
      [attr.aria-busy]="isSaving"
      [attr.aria-label]="isSaving ? 'Saving configurations, please wait' : 'Save configurations'">
      <span *ngIf="!isSaving">SAVE CONFIGURATIONS</span>
      <span *ngIf="isSaving" class="cdk-visually-hidden">Saving...</span>
    </button>
  </div>
</div>
