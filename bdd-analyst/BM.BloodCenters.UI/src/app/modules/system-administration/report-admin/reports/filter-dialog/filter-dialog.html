<div class="filter-dialog">
  <!-- Header -->
  <div class="dialog-header">
    <h2>Filters</h2>
    <button mat-icon-button (click)="closeDialog()" class="close-button" aria-label="Close filter dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Filter Content -->
  <div class="dialog-content">
    <!-- Parameter Type -->
    <mat-form-field appearance="fill" class="filter-field">
      <mat-label>Parameter Type</mat-label>
      <mat-select [(value)]="parameterType">
        <mat-option value="all">All</mat-option>
        <mat-option *ngFor="let type of parameterTypes" [value]="type">{{ type }}</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Upper and List filters in a row -->
    <div class="filter-row">
      <mat-form-field appearance="fill" class="filter-field half-width">
        <mat-label>Upper</mat-label>
        <mat-select [(value)]="upperFilter">
          <mat-option value="all">All</mat-option>
          <mat-option value="no">No</mat-option>
          <mat-option value="yes">Yes</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="filter-field half-width">
        <mat-label>List</mat-label>
        <mat-select [(value)]="listFilter">
          <mat-option value="all">All</mat-option>
          <mat-option value="no">No</mat-option>
          <mat-option value="yes">Yes</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <!-- Footer Actions -->
  <footer class="dialog-footer">
    <button mat-stroked-button type="button" (click)="clearAll()">
      CLEAR ALL
    </button>

    <button mat-raised-button color="primary" type="button" (click)="applyFilters()">
      APPLY
    </button>
  </footer>
</div>
