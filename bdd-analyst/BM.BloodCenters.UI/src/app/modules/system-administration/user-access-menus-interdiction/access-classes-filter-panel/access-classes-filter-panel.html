<app-filter-panel-base
  [title]="'Filters'"
  [maxContentHeight]="280"
  [width]="400"
  [applyDisabled]="isApplyDisabled"
  (apply)="onApply()"
  (clear)="onClear()"
  (close)="onClose()">

  <!-- Filter Form Content -->
  <form [formGroup]="filterForm">
    <!-- Class (searchable) -->
    <mat-form-field appearance="fill">
      <mat-label>Class</mat-label>
      <mat-select formControlName="class">
        <mat-option>
          <ngx-mat-select-search
            [formControl]="classSearchControl"
            placeholderLabel="Search..."
            noEntriesFoundLabel="No results found">
          </ngx-mat-select-search>
        </mat-option>
        @for (classOption of filteredClassOptions(); track classOption) {
          <mat-option [value]="classOption">{{ classOption }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Effective Date -->
    <div class="date-row">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label>Period</mat-label>
        <mat-select formControlName="effectiveDatePeriod">
          <mat-option *ngFor="let period of periodOptions" [value]="period">
            {{ period }}
          </mat-option>
        </mat-select>
        <mat-error>Period is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Effective Date</mat-label>
        <input
          matInput
          [matDatepicker]="effectivePicker"
          formControlName="effectiveDate"
          placeholder="DD-MMM-YYYY"
          (input)="onDateInput($event, 'effectiveDate')"
          aria-label="Effective Date">
        <mat-datepicker-toggle matIconSuffix [for]="effectivePicker"></mat-datepicker-toggle>
        <mat-datepicker #effectivePicker></mat-datepicker>
        <mat-error *ngIf="getEffectiveDateError()">{{ getEffectiveDateError() }}</mat-error>
      </mat-form-field>
    </div>

    <!-- Termination Date -->
    <div class="date-row">
      <mat-form-field appearance="fill" class="period-field">
        <mat-label>Period</mat-label>
        <mat-select formControlName="terminationDatePeriod">
          <mat-option *ngFor="let period of periodOptions" [value]="period">
            {{ period }}
          </mat-option>
        </mat-select>
        <mat-error>Period is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="date-field">
        <mat-label>Termination Date</mat-label>
        <input
          matInput
          [matDatepicker]="terminationPicker"
          formControlName="terminationDate"
          placeholder="DD-MMM-YYYY"
          (input)="onDateInput($event, 'terminationDate')"
          aria-label="Termination Date">
        <mat-datepicker-toggle matIconSuffix [for]="terminationPicker"></mat-datepicker-toggle>
        <mat-datepicker #terminationPicker></mat-datepicker>
        <mat-error *ngIf="getTerminationDateError()">{{ getTerminationDateError() }}</mat-error>
      </mat-form-field>
    </div>
  </form>

</app-filter-panel-base>
