<app-filter-panel-base
  [title]="'Filters'"
  [maxContentHeight]="280"
  [width]="350"
  [applyDisabled]="isApplyDisabled"
  (apply)="onApply()"
  (clear)="onClear()"
  (close)="onClose()">

  <!-- Filter Form Content -->
  <form [formGroup]="filterForm">
    <!-- Interdictions Type -->
    <mat-form-field appearance="fill">
      <mat-label>Interdictions Type</mat-label>
      <mat-select formControlName="interdictionsType">
        <mat-option *ngFor="let type of interdictionsTypeOptions" [value]="type">
          {{ type }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Interdictions Code -->
    <mat-form-field appearance="fill">
      <mat-label>Interdictions Code</mat-label>
      <mat-select formControlName="interdictionsCode">
        <!-- Search Option -->
        <mat-option>
          <ngx-mat-select-search
            [formControl]="interdictionsCodeSearchControl"
            placeholderLabel="Search interdictions codes..."
            noEntriesFoundLabel="No matching codes">
          </ngx-mat-select-search>
        </mat-option>

        <!-- Filtered Options -->
        <mat-option *ngFor="let code of filteredInterdictionsCodeOptions" [value]="code">
          {{ code }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </form>

</app-filter-panel-base>
