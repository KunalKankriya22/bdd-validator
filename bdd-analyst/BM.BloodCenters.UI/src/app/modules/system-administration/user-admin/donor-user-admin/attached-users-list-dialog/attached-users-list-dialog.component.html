<div class="dialog-container">
    <div class="dialog-header">
        <h2 class="dialog-title">{{ dialogTitle }}</h2>
        <button mat-icon-button class="close-button" (click)="closeDialog()" aria-label="Close dialog">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <div class="dialog-subtitle">
        {{ dialogSubtitle }}
    </div>

    <div class="dialog-content">
        <div class="table-wrapper">
            <table mat-table [dataSource]="attachedUsers" class="users-table">

                <!-- User ID Column -->
                <ng-container matColumnDef="userId">
                    <th mat-header-cell *matHeaderCellDef>
                        <div class="header-cell sortable" (click)="onSort('userId')">
                            User ID
                            <mat-icon class="sort-icon">{{ getSortIcon('userId') }}</mat-icon>
                        </div>
                    </th>
                    <td mat-cell *matCellDef="let element">{{ element.userId }}</td>
                </ng-container>

                <!-- Name Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef>
                        <div class="header-cell">
                            Name
                        </div>
                    </th>
                    <td mat-cell *matCellDef="let element">{{ element.name || '' }}</td>
                </ng-container>

                <!-- Level Column -->
                <ng-container matColumnDef="level">
                    <th mat-header-cell *matHeaderCellDef>
                        <div class="header-cell">
                            Level
                        </div>
                    </th>
                    <td mat-cell *matCellDef="let element">{{ element.level }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
    </div>
</div>
