<div class="dialog-container">
  <div class="dialog-header">
    <h2 class="dialog-title">Overlapping Interdictions</h2>
    <button mat-icon-button class="close-button" (click)="closeDialog()" aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-subtitle">
    Interdictions that appear in multiple access classes
  </div>

  <div class="dialog-content">
    <div class="table-wrapper">
      <table mat-table [dataSource]="interdictions" class="interdictions-table">

        <!-- Code Column -->
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef>
            <div class="header-cell sortable" (click)="onSort('code')">
              Code
              <mat-icon class="sort-icon">{{ getSortIcon('code') }}</mat-icon>
            </div>
          </th>
          <td mat-cell *matCellDef="let element">{{ element.code }}</td>
        </ng-container>

        <!-- Description Column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>
            <div class="header-cell">
              Description
            </div>
          </th>
          <td mat-cell *matCellDef="let element">{{ element.description }}</td>
        </ng-container>

        <!-- Access Class Column -->
        <ng-container matColumnDef="accessClasses">
          <th mat-header-cell *matHeaderCellDef>
            <div class="header-cell">
              Access Class
            </div>
          </th>
          <td mat-cell *matCellDef="let element">
            <div class="access-class-chips">
              <span class="access-class-chip" *ngFor="let cls of element.accessClasses">{{ cls }}</span>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <!-- Loading state -->
      <div class="empty-state" *ngIf="isLoading">
        <p>Loading overlapping interdictions...</p>
      </div>

      <!-- Empty state -->
      <div class="empty-state" *ngIf="!isLoading && interdictions.length === 0">
        <p>No overlapping interdictions found.</p>
      </div>
    </div>
  </div>
</div>
