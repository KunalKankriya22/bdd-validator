<div class="delete-document-dialog">
  <div class="dialog-header">
    <h2 mat-dialog-title class="dialog-title">Are you sure you want to delete?</h2>
    <button mat-icon-button type="button" (click)="onCancel()" aria-label="Close dialog" class="close-btn">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content class="dialog-content">
    <p class="warning-message">
      This action cannot be undone. The following document will be permanently removed from the system
    </p>

    <!-- Document Info -->
    <div class="document-info">
      <mat-icon class="file-icon" [class.file-icon-pdf]="isPdf" [class.file-icon-doc]="isDoc" [class.file-icon-xls]="isXls" aria-hidden="true">
        {{ getFileIcon() }}
      </mat-icon>
      <div class="file-details">
        <span class="file-name">{{ data.documentName }}</span>
        @if (data.fileSize) {
          <span class="file-size">{{ data.fileSize }} Successfully uploaded</span>
        }
      </div>
    </div>
  </div>

  <div mat-dialog-actions class="dialog-actions">
    <button mat-button class="btn-cancel" (click)="onCancel()">CANCEL</button>
    <button mat-raised-button class="btn-delete" (click)="onConfirm()">DELETE</button>
  </div>
</div>
