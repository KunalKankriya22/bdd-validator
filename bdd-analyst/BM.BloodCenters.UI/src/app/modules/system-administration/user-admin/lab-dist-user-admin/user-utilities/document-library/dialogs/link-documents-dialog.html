<div class="link-documents-dialog" role="dialog" aria-labelledby="link-documents-title">
  <div class="dialog-header">
    <div class="header-left">
      <h2 class="dialog-title" id="link-documents-title">Link Documents</h2>
      <p class="dialog-subtitle">View collection goals by day and compare to previous year's drives</p>
    </div>
    <button mat-icon-button type="button" (click)="onClose()" aria-label="Close dialog" class="close-btn">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content class="dialog-content">
    <!-- Table Section -->
    <div class="table-container">
      <!-- Search Bar -->
      <div class="search-wrapper">
        <app-search-bar
          [config]="searchConfig"
          [(searchText)]="searchText"
          (search)="onSearch($event)">
        </app-search-bar>
      </div>

      <!-- Data Table -->
      <app-data-table
        [config]="tableConfig"
        [data]="filteredLinks"
        [loading]="isLoading"
        (rowClick)="onSelectLink($event)">
      </app-data-table>
    </div>
  </div>

  <div mat-dialog-actions class="dialog-actions">
    <button mat-button type="button" class="btn-cancel" (click)="onClose()">
      CANCEL
    </button>
    <button mat-raised-button type="button" class="btn-link"
            [disabled]="!selectedLink"
            (click)="onLink()">
      LINK
    </button>
  </div>
</div>
