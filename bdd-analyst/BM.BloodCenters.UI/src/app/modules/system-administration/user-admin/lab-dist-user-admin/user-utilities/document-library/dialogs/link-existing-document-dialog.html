<div class="link-existing-document-dialog">
  <div class="dialog-header">
    <h2 mat-dialog-title class="dialog-title">Link Document</h2>
    <button mat-icon-button type="button" (click)="onClose()" aria-label="Close dialog" class="close-btn">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </div>

  <div mat-dialog-content class="dialog-content">
    <!-- Document Name Dropdown -->
    <mat-form-field appearance="fill" class="document-select-field">
      <mat-label>Document Name</mat-label>
      <mat-select [(value)]="selectedDocument" (selectionChange)="onDocumentChange()" required aria-label="Select document">
        @for (doc of availableDocuments; track doc.sessionId) {
          <mat-option [value]="doc">{{ doc.docName }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Select Link Table -->
    <div class="link-table-section">
      <h3 class="section-title">Select Link Table</h3>

      <div class="link-table-bordered">
        <!-- Search Bar -->
        <div class="search-wrapper">
          <app-search-bar
            [config]="searchConfig"
            [(searchText)]="searchText"
            (search)="onSearch($event)">
          </app-search-bar>
        </div>

        <!-- Link Table -->
        <app-data-table #linkTable
          [config]="linkTableConfig"
          [data]="filteredLinks"
          [loading]="isLoadingLinks"
          (rowClick)="onSelectLink($event)"
          (selectionChange)="onLinkSelectionChange($event)"
          (sortChange)="onSortChange($event)">
        </app-data-table>
      </div>
    </div>

    <!-- Select Link Values (Shared Component) -->
    <div class="link-values-section">
      <h3 class="section-title">Select Link Value(s)</h3>
      <div (focusout)="onValueFieldBlur()">
        <app-value-chips-input #valueChipsInput
          label="Value"
          [required]="true"
          [disabled]="!selectedLink"
          [(values)]="selectedValues"
          (validateValue)="onValidateValue($event)"
          (valueAdded)="onValueAdded()"
          (valueRemoved)="onValueRemoved()">
        </app-value-chips-input>
      </div>
      @if (valuesRequiredError && selectedValues.length === 0) {
        <div class="required-error" role="alert" aria-live="polite">At least one value is required</div>
      }
    </div>
  </div>

  <div mat-dialog-actions class="dialog-actions">
    <button mat-button type="button" class="btn-cancel" (click)="onClose()" [disabled]="isUploading">CANCEL</button>
    <button mat-raised-button type="button" class="btn-upload-link"
            [disabled]="!canUploadAndLink()"
            [attr.aria-busy]="isUploading"
            [attr.aria-label]="isUploading ? 'Uploading document, please wait' : 'Upload and link document'"
            (click)="onUploadAndLink()">
      <mat-spinner *ngIf="isUploading" diameter="20" aria-hidden="true"></mat-spinner>
      <span>{{ isUploading ? 'UPLOAD AND LINK' : 'UPLOAD AND LINK' }}</span>
    </button>
  </div>
</div>
