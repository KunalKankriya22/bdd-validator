<div class="upload-progress-dialog" role="dialog" aria-labelledby="upload-dialog-title">
  <h2 mat-dialog-title id="upload-dialog-title">Upload Document</h2>

  <div mat-dialog-content class="dialog-content" role="status" aria-live="polite">
    <div class="file-info-row">
      <mat-icon class="file-icon" aria-hidden="true">insert_drive_file</mat-icon>
      <div class="file-details">
        <span class="file-name">{{ data.fileName }}</span>
        <span class="progress-text">{{ data.progress }}% uploaded</span>
      </div>
    </div>

    <mat-progress-bar mode="determinate" [value]="data.progress"
      aria-label="Upload progress"
      [attr.aria-valuenow]="data.progress"
      aria-valuemin="0"
      aria-valuemax="100"></mat-progress-bar>
  </div>
</div>
