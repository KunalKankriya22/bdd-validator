<!-- ARIA Live Region for Screen Reader Announcements -->
<div id="aria-live-announcer" class="cdk-visually-hidden" role="status" aria-live="polite" aria-atomic="true">
</div>

<!-- Main Content Area -->
<main class="report-actions-table" aria-label="Report Actions content">

  <!-- Page Header with Breadcrumb -->
  <app-page-header-with-breadcrumb [config]="headerConfig" />

  <!-- Table Card Container -->
  <div class="report-actions-table__card" #tableCard>

    <!-- Status Cell Template -->
    <ng-template #statusCellTemplate let-row>
      <span class="data-table__cell-content" [attr.aria-label]="row.displayStatus">
        {{ row.displayStatus }}
      </span>
    </ng-template>

    <!-- Table Controls with Inline Filter Chips -->
    <div class="report-actions-table__controls">
      <!-- Left section: Filter button and chips -->
      <div class="report-actions-table__controls-left">
        <button mat-button class="filter-button" [class.filter-button--active]="isFilterOpen()"
                [attr.aria-expanded]="isFilterOpen()" [attr.aria-label]="isFilterOpen() ? 'Close filter options' : 'Open filter options'" (click)="openFilterPanel()">
          <span class="filter-icon" aria-hidden="true"></span>
          FILTER
        </button>

        <!-- Inline Filter Chips -->
        <app-filter-chips *ngIf="hasActiveFilters()" [chips]="filterChips()" [maxVisible]="3"
          (removeChip)="onRemoveFilterChip($event)" (clearAll)="clearAllFilters()">
        </app-filter-chips>
      </div>

      <!-- Right section: Refresh button and Search bar -->
      <div class="report-actions-table__controls-right">
        <button
          type="button"
          mat-stroked-button
          color="accent"
          (click)="loadReports()"
          [disabled]="isLoading()"
          aria-label="Refresh reports">
          <mat-icon aria-hidden="true">refresh</mat-icon>
          REFRESH
        </button>
        <app-search-bar [config]="searchConfig" (search)="onSearch($event)" />
      </div>
    </div>

    <!-- Error State -->
    <div *ngIf="hasError() && !isLoading()" class="report-actions-table__error" role="alert" aria-label="Error loading data">
      <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
      <p class="error-message">{{ errorMessage() }}</p>
      <button mat-raised-button color="primary" (click)="loadReports()">
        Retry
      </button>
    </div>

    <!-- Data Table -->
    <div class="report-actions-table__table-wrapper">
      <app-data-table *ngIf="!hasError()" [config]="tableConfig()" [data]="reports()" [loading]="isLoading()"
        (pageChange)="onPageChange($event)" (sortChange)="onSortChange($event)" (rowAction)="onRowAction($event)" />
    </div>
  </div>
</main>
