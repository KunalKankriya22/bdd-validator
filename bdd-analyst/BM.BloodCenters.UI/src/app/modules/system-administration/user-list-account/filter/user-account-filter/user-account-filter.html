<section class="filter-panel" role="dialog" aria-modal="false" aria-labelledby="filter-title">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-title">Filters</h2>
    <button mat-icon-button type="button" aria-label="Close filter panel" (click)="closeDialog()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <!-- Content -->
  <form [formGroup]="filterForm" class="filter-panel__content" aria-describedby="filter-desc">

    <!-- Effective Date Filter -->
    <div class="filter-panel__date-row">
      <div class="filter-panel__period-field-wrapper">
        <mat-form-field appearance="fill" class="filter-panel__period-field">
          <mat-label>Period</mat-label>
          <mat-select formControlName="effectiveDatePeriod">
            <mat-option value="AFTER">After</mat-option>
            <mat-option value="BEFORE">Before</mat-option>
          </mat-select>
          <mat-error *ngIf="hasEffectiveDatePeriodError">Period is required</mat-error>
        </mat-form-field>
      </div>

      <div class="filter-panel__date-field-wrapper">
        <mat-form-field appearance="fill" class="filter-panel__date-field">
          <mat-label>Effective Date</mat-label>
          <input
            matInput
            [matDatepicker]="effPicker"
            formControlName="effectiveDate"
            (input)="onEffectiveDateInput($event)"
            (blur)="onEffectiveDateBlur()"
          >
          <mat-datepicker-toggle matSuffix [for]="effPicker"></mat-datepicker-toggle>
          <mat-datepicker #effPicker></mat-datepicker>
          <mat-error *ngIf="hasEffectiveDateError">{{ getEffectiveDateErrorMessage() }}</mat-error>
        </mat-form-field>
      </div>
    </div>

    <!-- Termination Date Filter -->
    <div class="filter-panel__date-row">
      <div class="filter-panel__period-field-wrapper">
        <mat-form-field appearance="fill" class="filter-panel__period-field">
          <mat-label>Period</mat-label>
          <mat-select formControlName="terminationDatePeriod">
            <mat-option value="AFTER">After</mat-option>
            <mat-option value="BEFORE">Before</mat-option>
          </mat-select>
          <mat-error *ngIf="hasTerminationDatePeriodError">Period is required</mat-error>
        </mat-form-field>
      </div>

      <div class="filter-panel__date-field-wrapper">
        <mat-form-field appearance="fill" class="filter-panel__date-field">
          <mat-label>Termination Date</mat-label>
          <input
            matInput
            [matDatepicker]="termPicker"
            formControlName="terminationDate"
            (input)="onTerminationDateInput($event)"
            (blur)="onTerminationDateBlur()"
          >
          <mat-datepicker-toggle matSuffix [for]="termPicker"></mat-datepicker-toggle>
          <mat-datepicker #termPicker></mat-datepicker>
          <mat-error *ngIf="hasTerminationDateError">{{ getTerminationDateErrorMessage() }}</mat-error>
        </mat-form-field>
      </div>
    </div>

    <!-- Account Status Filter -->
    <div class="filter-panel__field-wrapper">
      <mat-form-field appearance="fill" class="filter-panel__account-status-field">
        <mat-label>Account Status</mat-label>
        <mat-select formControlName="accountStatus">
          <mat-option value="ACTIVE">Unlocked</mat-option>
          <mat-option value="LOCKED">Locked</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

  </form>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button mat-stroked-button type="button" (click)="onClear()">
      CLEAR ALL
    </button>

    <button
      mat-raised-button
      color="primary"
      type="button"
      [disabled]="isApplyDisabled"
      (click)="onApply()"
    >
      APPLY
    </button>
  </footer>

</section>
