<div class="dialog-backdrop" *ngIf="isOpen" (click)="close()"></div>

<div class="dialog-modal" [class.open]="isOpen">
  <div class="dialog-container">
    <!-- HEADER -->
    <div class="dialog-header">
      <h2 class="dialog-title">Associated Interdictions</h2>
      <button mat-icon-button class="close-button" (click)="close()" aria-label="Close panel">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="dialog-subtitle">
      {{ accessClassCode }} | {{ accessClassDescription }}
    </div>

    <!-- TABLE -->
    <div class="dialog-content">
      <div class="table-wrapper">
        <table mat-table [dataSource]="interdictions" class="users-table">

          <!-- Code Column -->
          <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef>
              <div class="header-cell sortable" (click)="toggleCodeSort()">
                Code
                <mat-icon class="sort-icon">{{ getSortIcon() }}</mat-icon>
              </div>
            </th>
            <td mat-cell *matCellDef="let element">{{ element.code }}</td>
          </ng-container>

          <!-- Type Column -->
          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef>
              <div class="header-cell">
                Type
              </div>
            </th>
            <td mat-cell *matCellDef="let element">{{ element.type }}</td>
          </ng-container>

          <!-- Description Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>
              <div class="header-cell">
                Description
              </div>
            </th>
            <td mat-cell *matCellDef="let element">{{ element.description }}</td>
          </ng-container>

          <!-- Level Column -->
          <ng-container matColumnDef="level">
            <th mat-header-cell *matHeaderCellDef>
              <div class="header-cell">
                Level
              </div>
            </th>
            <td mat-cell *matCellDef="let element">{{ element.level }}</td>
          </ng-container>

          <!-- Effective Date Column -->
          <ng-container matColumnDef="effectiveDate">
            <th mat-header-cell *matHeaderCellDef>
              <div class="header-cell">
                Effective Date
              </div>
            </th>
            <td mat-cell *matCellDef="let element">{{ element.effectiveDate }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </div>
  </div>
</div>
