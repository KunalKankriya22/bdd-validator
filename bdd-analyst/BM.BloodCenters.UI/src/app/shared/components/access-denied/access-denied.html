<div class="access-denied-container">
  <!-- Header with only logo section -->
  <mat-toolbar class="header-toolbar">
    <div class="header-content">
      <div class="header-left">
        <a [routerLink]="['/home']" class="logo-link" aria-label="Go to home page">
          <img
            *ngIf="headerService.headerConfig().logoUrl"
            [src]="headerService.headerConfig().logoUrl"
            [alt]="headerService.headerConfig().title + ' logo'"
            class="header-logo"
          />
        </a>
        <div class="header-title-section">
          <img
            *ngIf="headerService.institutionLogoUrl()"
            [src]="headerService.institutionLogoUrl()"
            alt="Institution logo"
            class="institution-logo"
          />
        </div>
      </div>
    </div>
  </mat-toolbar>

  <!-- Content section -->
  <section class="content">
    <h1>Access Denied</h1>
    <p>You do not have access to this application.</p>
    <p class="contact-text">Please contact the administrator.</p>
    <button mat-raised-button class="logout-button" (click)="onLogout($event)">
      Logout
    </button>
  </section>
</div>
