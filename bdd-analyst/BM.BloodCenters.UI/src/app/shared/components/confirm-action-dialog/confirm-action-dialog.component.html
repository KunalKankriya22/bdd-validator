@if (data.title) {
  <h2 mat-dialog-title class="dialog-title">{{ data.title }}</h2>
}

@if (data.message) {
  <mat-dialog-content class="dialog-content">
    <p class="message">{{ data.message }}</p>
    @if (data.detail) {
      <p class="detail">{{ data.detail }}</p>
    }
  </mat-dialog-content>
}

<mat-dialog-actions align="end" class="dialog-actions">
  @if (data.threeButton) {
    <button mat-button (click)="onCancel()" class="cancel-button">
      {{ data.cancelText || 'Cancel' }}
    </button>
    <button mat-button (click)="onNo()" class="no-button">
      {{ data.noButtonText || 'No' }}
    </button>
    <button mat-raised-button color="primary" (click)="onConfirm()" cdkFocusInitial class="confirm-button">
      {{ data.confirmText || 'Yes' }}
    </button>
  } @else {
    <!-- Two-button mode: Cancel (optional), Confirm -->
    @if (data.cancelText) {
      <button mat-button (click)="onCancel()" class="cancel-button">
        {{ data.cancelText }}
      </button>
    }
    <button mat-raised-button color="primary" (click)="onConfirm()" cdkFocusInitial class="confirm-button">
      {{ data.confirmText || 'OK' }}
    </button>
  }
</mat-dialog-actions>
