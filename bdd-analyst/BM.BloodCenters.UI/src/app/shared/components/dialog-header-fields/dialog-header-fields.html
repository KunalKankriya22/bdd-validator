<div
  class="dialog-header-fields"
  [class.dialog-header-fields--row]="layout === 'row'"
  [class.dialog-header-fields--grid]="layout === 'grid'"
  [ngStyle]="getGridStyle()">

  @for (field of fields; track trackByField($index, field)) {
    <div class="dialog-header-fields__field" [style.width]="field.width">
      <span class="dialog-header-fields__label">{{ field.label }}</span>
      <span class="dialog-header-fields__value">{{ getDisplayValue(field) }}</span>
    </div>
  }

</div>
