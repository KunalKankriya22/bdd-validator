<div class="dialog-tabs" role="tablist">
  @for (tab of tabs; track trackByTab($index, tab); let i = $index) {
    <button
      class="dialog-tabs__tab"
      [class.dialog-tabs__tab--active]="isActive(tab)"
      [class.dialog-tabs__tab--disabled]="tab.disabled"
      role="tab"
      type="button"
      [attr.aria-selected]="isActive(tab)"
      [attr.aria-disabled]="tab.disabled"
      [attr.aria-label]="tab.ariaLabel || tab.label"
      [attr.tabindex]="isActive(tab) ? 0 : -1"
      [disabled]="tab.disabled"
      (click)="onTabClick(tab)"
      (keydown)="onKeyDown($event, tab, i)">
      {{ tab.label }}
    </button>
  }
</div>
