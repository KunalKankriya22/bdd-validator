<div *ngIf="shouldShow" class="filter-chips" #chipsContainer>
  <!-- Chips Container -->
  <div class="filter-chips__list">
    <!-- Visible Chips -->
    <div
      *ngFor="let chip of visibleChips"
      class="filter-chip"
      role="status"
      [attr.aria-label]="chip.label + ' filter applied'">
      <span class="filter-chip__label">{{ chip.label }}</span>
      <button
        type="button"
        class="filter-chip__remove"
        [attr.aria-label]="'Remove ' + chip.label + ' filter'"
        (click)="onRemove(chip.key); $event.stopPropagation()">
        <mat-icon class="filter-chip__remove-icon" aria-hidden="true">cancel</mat-icon>
      </button>
    </div>

    <!-- Count Badge (when has hidden chips) -->
    <div
      *ngIf="hiddenCount > 0 && !isExpanded"
      class="filter-chips__count"
      [matTooltip]="hiddenChipsTooltip"
      matTooltipPosition="above"
      matTooltipClass="filter-chips-tooltip"
      [attr.aria-label]="hiddenCount + ' more filters'"
      role="status">
      +{{ hiddenCount }}
    </div>

    <!-- Collapse Button (when expanded) -->
    <button
      *ngIf="isExpanded && chips.length > maxVisible"
      type="button"
      class="filter-chips__collapse"
      [attr.aria-label]="'Collapse filters to show fewer'"
      (click)="toggleExpand()">
      <mat-icon aria-hidden="true">unfold_less</mat-icon>
    </button>

    <!-- Clear All Button -->
    <button
      type="button"
      class="filter-chips__clear-all"
      aria-label="Clear all applied filters"
      (click)="onClear()">
      CLEAR ALL
    </button>
  </div>
</div>
