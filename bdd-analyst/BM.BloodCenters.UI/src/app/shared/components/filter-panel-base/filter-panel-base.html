<section
  class="filter-panel"
  role="dialog"
  aria-modal="true"
  aria-labelledby="filter-panel-title"
  [style.width]="panelWidth">

  <!-- Header -->
  <header class="filter-panel__header">
    <h2 id="filter-panel-title">{{ title }}</h2>
    <button
      type="button"
      mat-icon-button
      class="filter-panel__close-btn"
      [attr.aria-label]="'Close filter panel'"
      (click)="onClose()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>
  </header>

  <!-- Content - Projects filter form fields -->
  <div
    class="filter-panel__content"
    [style.max-height]="contentMaxHeight">
    <ng-content></ng-content>
  </div>

  <!-- Footer -->
  <footer class="filter-panel__footer">
    <button
      *ngIf="showClearButton"
      type="button"
      mat-stroked-button
      [disabled]="clearDisabled"
      (click)="onClear()">
      {{ clearButtonLabel }}
    </button>
    <button
      type="button"
      mat-raised-button
      color="primary"
      [disabled]="applyDisabled"
      (click)="onApply()">
      {{ applyButtonLabel }}
    </button>
  </footer>

</section>
