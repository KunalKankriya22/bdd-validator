<mat-toolbar class="header-toolbar">
  <div class="header-content">
    <!-- Logo and Title Section -->
    <div class="header-left">
      <a [routerLink]="['/home']" (click)="onLogoClick($event)" class="logo-link" aria-label="Go to home page">
        <img
          *ngIf="headerService.headerConfig().logoUrl"
          [src]="headerService.headerConfig().logoUrl"
          [alt]="headerService.headerConfig().title + ' logo'"
          class="header-logo"
        />
      </a>
      <div class="header-title-section">
        <img
          *ngIf="headerService.institutionLogoUrl()"
          [src]="headerService.institutionLogoUrl()"
          alt="Institution logo"
          class="institution-logo"
        />
      </div>
    </div>

    <!-- Right Section with Icons and User -->
    <div class="header-right">
      <!-- Date/Time Display -->
      <div class="datetime-display" role="status" aria-label="Current date and time">
        <mat-icon class="datetime-icon" aria-hidden="true">schedule</mat-icon>
        <span class="datetime-text">{{ currentDateTime }}</span>
      </div>

      <!-- Icon Buttons with Labels (populated from API) -->
      <button mat-button
              [attr.aria-label]="'Database: ' + headerService.databaseName()"
              class="icon-button-with-label"
              [matTooltip]="headerService.databaseName()"
              matTooltipPosition="below">
        <span class="material-symbols-outlined" aria-hidden="true">database</span>
        <span class="icon-label">{{ headerService.databasePrefix() }}</span>
      </button>

      <button mat-button
              [attr.aria-label]="'Chapter: ' + headerService.chapterPrintHdr()"
              class="icon-button-with-label"
              [matTooltip]="headerService.chapterPrintHdr()"
              matTooltipPosition="below">
        <span class="material-symbols-outlined" aria-hidden="true">group_work</span>
        <span class="icon-label">{{ headerService.chapterId() }}</span>
      </button>

      <button mat-button
              [attr.aria-label]="'Warehouse: ' + headerService.warehouseId()"
              class="icon-button-with-label"
              [matTooltip]="headerService.warehouseId() + ' Warehouse'"
              matTooltipPosition="below">
        <mat-icon aria-hidden="true">storage</mat-icon>
        <span class="icon-label">{{ headerService.warehouseId() }}</span>
      </button>

      <!-- User Profile Menu -->
      <div class="user-section" *ngIf="headerService.headerConfig().user">
        <button mat-button
                [matMenuTriggerFor]="userMenu"
                class="user-button"
                [attr.aria-label]="headerService.headerConfig().user?.name + ' user menu'"
                aria-haspopup="menu">
          <span class="user-name">{{ headerService.headerConfig().user?.name }}</span>
          <mat-icon class="dropdown-icon" aria-hidden="true">arrow_drop_down</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu" class="user-dropdown-menu" xPosition="before" [overlapTrigger]="false">
          <div class="user-menu-header" role="group" aria-label="User information">
            <div class="user-menu-name">{{ headerService.headerConfig().user?.name }}</div>
            <div class="user-menu-id">{{ headerService.headerConfig().user?.id }}</div>
          </div>
          <mat-divider aria-hidden="true"></mat-divider>
          <button mat-menu-item class="user-menu-item" (click)="onChangeChapter($event)">
            <span>Change Chapter</span>
          </button>
          <button mat-menu-item class="user-menu-item" (click)="onChangePassword($event)" *ngIf="canChangePassword()">
            <span>Change Password</span>
          </button>
          <button mat-menu-item class="user-menu-item" (click)="onVersionClick($event)">
            <span>Version</span>
          </button>
          <button mat-menu-item class="user-menu-item" (click)="onLogout($event)">
            <span>Log Out</span>
          </button>
        </mat-menu>
      </div>
    </div>
  </div>
</mat-toolbar>
