<!-- PASSWORD EXPIRY WARNING -->
@if (loginService.showPasswordWarning()) {
  <div class="home-warning">
    <app-alert
      type="warning"
      ariaLive="assertive"
      [dismissible]="true"
      (dismissed)="loginService.clearPasswordWarning()">
      <div class="password-warning">
        <div class="password-warning__title">{{ 'AUTH.LOGIN.PASSWORD_WARNING.TITLE' | translate }}</div>
        <div class="password-warning__message">{{ 'AUTH.LOGIN.PASSWORD_WARNING.MESSAGE' | translate: { days: loginService.passwordExpiryDays() } }}</div>
        <a
          [routerLink]="['/forgot-password']"
          class="password-warning__link"
          (click)="loginService.clearPasswordWarning()">
          {{ 'AUTH.LOGIN.PASSWORD_WARNING.RESET_NOW' | translate }}
        </a>
      </div>
    </app-alert>
  </div>
}

<h1>Home</h1>
