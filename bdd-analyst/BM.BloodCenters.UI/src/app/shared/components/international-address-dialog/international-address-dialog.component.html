<div class="side-panel-wrapper">

  <!-- Header -->
  <div class="panel-header">
    <div class="header-content">
      <h2 class="panel-title">International Address</h2>
    </div>
    <button type="button" class="close-btn" (click)="onCancelled()" aria-label="Close panel">
      <mat-icon>close</mat-icon>
    </button>

  </div>

  <!-- Body -->
  <div class="panel-body">
    <app-international-address-form
      [existingAddress]="data.existingAddress ?? null"
      [showActions]="false"
      [targetTable]="data.targetTable ?? null"
      [recordKeyValues]="data.recordKeyValues ?? []"
      [chapterId]="data.chapterId ?? ''"
      [existingAddressId]="data.existingAddressId ?? null"
      (applied)="onApplied($event)"
      (saved)="onSaved($event)"
      (cancelled)="onCancelled()"
      (cleared)="onCleared()"
      #addressForm>
    </app-international-address-form>
  </div>

  <!-- Footer -->
  <div class="panel-footer">
    <div class="footer-actions">
      <button type="button" mat-button class="cancel-btn" id="btnCancel" (click)="onCancelled()">
        CANCEL
      </button>
      <button type="button" mat-stroked-button class="secondary-btn" id="btnClear" (click)="addressForm.onClear()"
        [disabled]="!addressForm.isClearEnabled">
        CLEAR
      </button>
      <button type="button" mat-raised-button class="primary-btn" id="btnApply" (click)="addressForm.onSubmit()"
        [disabled]="!addressForm.isApplyEnabled">
        {{ data.targetTable ? 'SAVE' : 'APPLY' }}
      </button>
    </div>
  </div>

</div>
