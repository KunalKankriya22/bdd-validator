<app-header></app-header>
<div class="app-container">
  <app-left-sidenav class="sidebar"></app-left-sidenav>
  <div class="content-area">
    <main class="main-content">
      <!-- Navigation Loading Spinner -->
      <span class="cdk-visually-hidden" role="status" aria-live="polite" aria-atomic="true">
        {{ isNavigationLoading() ? 'Loading page content, please wait' : '' }}
      </span>
      @if (isNavigationLoading()) {
        <div class="navigation-loader-overlay">
          <app-loading-spinner [size]="'large'" [message]="'Loading...'" [color]="'#1a6269'"></app-loading-spinner>
        </div>
      }
      <!-- Router Outlet -->
      <div class="router-outlet-wrapper" [class.content-loading]="isNavigationLoading()">
        <router-outlet></router-outlet>
      </div>
    </main>
    <app-footer></app-footer>
  </div>
</div>
