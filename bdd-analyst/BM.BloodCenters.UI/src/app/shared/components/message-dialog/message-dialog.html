<div
  class="message-dialog"
  role="alertdialog"
  aria-modal="true"
  aria-labelledby="message-dialog-title"
  tabindex="-1"
>

  <div class="message-dialog__header">
    @if (data.icon) {
      <mat-icon
        class="message-dialog__icon"
        aria-hidden="true">
        {{ iconName }}
      </mat-icon>
    }

    <h2 class="message-dialog__title">
      {{ data.title | translate:data.params}}
    </h2>
  </div>

  <div class="message-dialog__content">
      @if (data.message) {
        <p>
          {{ data.message | translate:data.params }}
        </p>
      }

       @if (data.contentTemplate) {
      <ng-container
        *ngTemplateOutlet="data.contentTemplate; context: data.params">
      </ng-container>
    }
  </div>

  <div class="message-dialog__actions" [class.single-button]="!data.secondaryAction">
    @if (data.secondaryAction) {
      <button
        mat-button
        type="button"
        class="message-dialog__secondary-btn"
        (click)="onAction(data.secondaryAction.action)">
        {{ data.secondaryAction.label | translate }}
      </button>
    }

    @if (data.primaryAction) {
      <button
        mat-raised-button
        color="primary"
        type="button"
        class="message-dialog__primary-btn"
        (click)="onAction(data.primaryAction.action)">
        {{ data.primaryAction.label | translate }}
      </button>
    }
  </div>
</div>
