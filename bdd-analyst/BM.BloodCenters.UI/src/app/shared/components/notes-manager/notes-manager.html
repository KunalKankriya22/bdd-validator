<!-- Input Section -->
<div class="notes-input-section">
  <h3 class="section-title">Notes</h3>
  <textarea
    class="notes-textarea"
    [(ngModel)]="newNoteText"
    (input)="onNoteInput()"
    [rows]="effectiveConfig.textareaRows"
    [maxLength]="effectiveConfig.maxLength"
    [placeholder]="effectiveConfig.placeholder"
    [disabled]="readonly || loading"
    [class.has-error]="errorMessage"
    aria-label="Note input">
  </textarea>

  <!-- Error message display -->
  <div class="note-error" *ngIf="errorMessage">
    <mat-icon>error</mat-icon>
    <span>{{ errorMessage }}</span>
  </div>
</div>

<!-- Action Buttons -->
<div class="notes-actions">
  <button
    type="button"
    mat-stroked-button
    class="add-button"
    (click)="addNote()"
    [disabled]="!newNoteText.trim() || readonly || loading">
    {{ getButtonText() }}
  </button>
  <button
    type="button"
    mat-stroked-button
    class="cancel-button"
    (click)="cancelEdit()"
    *ngIf="editingNoteId">
    CANCEL
  </button>
</div>

<!-- Notes Display Section -->
<div class="notes-list" *ngIf="notes.length > 0; else emptyState">
  <div class="note-card" *ngFor="let note of notes; let i = index">
    <div class="note-header" *ngIf="effectiveConfig.showUserInfo">
      <div class="user-info">
        <div class="user-avatar">
          <mat-icon>account_circle</mat-icon>
        </div>
        <div class="user-details">
          <div class="user-name">{{ note.userName }}</div>
          <div class="note-metadata">{{ note.version || note.timestamp }}</div>
        </div>
      </div>
      <div class="note-actions" *ngIf="!readonly">
        <button
          type="button"
          mat-button
          class="action-button"
          (click)="editNote(note)"
          *ngIf="effectiveConfig.allowEdit"
          [disabled]="loading"
          aria-label="Edit note">
          Edit
        </button>
        <button
          type="button"
          mat-button
          class="action-button delete-button"
          (click)="deleteNote(note)"
          *ngIf="effectiveConfig.allowDelete"
          [disabled]="loading"
          aria-label="Delete note">
          Delete
        </button>
      </div>
    </div>
    <div class="note-text">{{ note.text }}</div>
  </div>
</div>

<!-- Empty State -->
<ng-template #emptyState>
  <div class="empty-state">
    <mat-icon class="empty-icon">note_add</mat-icon>
    <p>{{ effectiveConfig.emptyStateMessage }}</p>
  </div>
</ng-template>

<!-- Loading Overlay -->
<div class="loading-overlay" *ngIf="loading">
  <mat-spinner diameter="40"></mat-spinner>
</div>
