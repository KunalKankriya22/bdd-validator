<div class="page-header-with-breadcrumb">
  <!-- Breadcrumb Navigation -->
  <nav class="page-header-with-breadcrumb__breadcrumb" aria-label="Breadcrumb navigation">
    <ol class="breadcrumb">
      <li *ngFor="let item of config().breadcrumbs; trackBy: trackByLabel; let last = last" class="breadcrumb__item"
        [class.breadcrumb__item--active]="last" [attr.aria-current]="last ? 'page' : null">

        <a *ngIf="item.link && !last" [routerLink]="item.link" class="breadcrumb__link"
          [attr.aria-label]="item.ariaLabel || item.label">
          {{ item.label }}
        </a>
        <mat-icon *ngIf="item.link && !last" aria-hidden="true">chevron_right</mat-icon>
        <span *ngIf="!item.link || last">
          {{ item.label }}
        </span>
      </li>
    </ol>
  </nav>

  <!-- Page Header -->
  <header class="page-header-with-breadcrumb__header">
    <div class="page-header">
      <div class="page-header__info">
        <div class="page-header__title-wrapper">
          <button
            *ngIf="config().showBackButton"
            type="button"
            class="page-header__back-button"
            [attr.aria-label]="'Go back'"
            (click)="onBackButtonClick()"
          >
            <mat-icon aria-hidden="true">arrow_back</mat-icon>
          </button>
          <h1 class="page-header__title" id="page-title">
            {{ displayTitle() }}
          </h1>
        </div>
        <p *ngIf="displaySubtitle()" class="page-header__subtitle">
          {{ displaySubtitle() }}
        </p>
      </div>

      <div class="page-header__right">
        <p *ngIf="config().metadata" class="page-header__metadata">
          {{ config().metadata }}
        </p>
        <div *ngIf="config().actions && config().actions!.length > 0" class="page-header__actions">
        <ng-container *ngFor="let action of config().actions; trackBy: trackByLabel">
          <button
            *ngIf="action.matButton === 'stroked'"
            mat-stroked-button
            type="button"
            class="page-header__mat-button"
            [color]="action.color || 'primary'"
            [disabled]="action.disabled"
            [attr.aria-label]="action.ariaLabel || action.label"
            (click)="onActionClick(action)"
          >
            <mat-icon *ngIf="action.icon" class="button-icon" aria-hidden="true">{{ action.icon }}</mat-icon>
            <span class="button-label">{{ action.label }}</span>
          </button>
          <button
            *ngIf="action.matButton === 'raised'"
            mat-raised-button
            type="button"
            class="page-header__mat-button"
            [color]="action.color || 'primary'"
            [disabled]="action.disabled"
            [attr.aria-label]="action.ariaLabel || action.label"
            (click)="onActionClick(action)"
          >
            <mat-icon *ngIf="action.icon" class="button-icon" aria-hidden="true">{{ action.icon }}</mat-icon>
            <span class="button-label">{{ action.label }}</span>
          </button>
          <button
            *ngIf="!action.matButton"
            type="button"
            class="page-header__button"
            [class.page-header__button--filled]="!action.variant || action.variant === 'filled'"
            [class.page-header__button--outlined]="action.variant === 'outlined'"
            [class.page-header__button--text]="action.variant === 'text'"
            [disabled]="action.disabled"
            [attr.aria-label]="action.ariaLabel || action.label"
            (click)="onActionClick(action)"
          >
            <mat-icon *ngIf="action.icon" class="button-icon" aria-hidden="true">{{ action.icon }}</mat-icon>
            <span class="button-label">{{ action.label }}</span>
          </button>
        </ng-container>
        </div>
      </div>
    </div>
  </header>
</div>
