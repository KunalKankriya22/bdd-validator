<div class="side-panel-wrapper">
  <!-- Panel Header -->
  <div class="panel-header">
    <div class="header-content">
      <h2 class="panel-title" [id]="dialogTitleId">Profile Tests</h2>
    </div>
    <button mat-icon-button class="close-btn" (click)="onClose()" aria-label="Close panel">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Panel Body -->
  <div class="panel-body">
    <div class="table-container">
      <app-data-table
        [config]="tableConfig"
        [data]="tableData()" />
    </div>
  </div>

  <!-- Panel Footer -->
  <div class="panel-footer">
    <div class="footer-actions">
      <button mat-stroked-button class="close-btn-footer" (click)="onClose()">
        CLOSE
      </button>
    </div>
  </div>
</div>
