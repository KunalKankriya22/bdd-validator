<div class="quick-links">
  @if (title) {
    <h4 class="quick-links__title">{{ title }}</h4>
  }

  <ul class="quick-links__list" role="list">
    @for (link of links; track trackByLink($index, link)) {
      <li class="quick-links__item" role="listitem">
        <a
          class="quick-links__link"
          [class.quick-links__link--disabled]="isLinkDisabled(link)"
          [attr.aria-label]="link.ariaLabel || link.label"
          [attr.aria-disabled]="isLinkDisabled(link)"
          [matTooltip]="getTooltip(link)"
          [matTooltipDisabled]="!getTooltip(link)"
          href="#"
          (click)="onLinkClick(link, $event)"
          (keydown.enter)="onLinkClick(link, $event)"
          (keydown.space)="onLinkClick(link, $event)">
          {{ link.label }}
          @if (link.count != null && link.count > 0) {
            <span class="quick-links__count">{{ link.count }}</span>
          }
        </a>
      </li>
    }
  </ul>
</div>
