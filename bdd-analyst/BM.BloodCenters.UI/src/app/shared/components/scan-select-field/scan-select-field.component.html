<mat-form-field appearance="fill" [class.preserve-case]="uppercase === false">
  <mat-label>{{ label }}</mat-label>
  <input
    #fieldInput
    matInput
    [formControl]="inputControl"
    [placeholder]="placeholder"
    autocomplete="off"
    [attr.aria-required]="required"
    [matAutocomplete]="optionsAuto"
    [matAutocompleteDisabled]="true"
    (blur)="onBlur()"
    (keydown.enter)="onEnter(); $event.preventDefault()"
  />

  <mat-autocomplete
    #optionsAuto="matAutocomplete"
    [displayWith]="displayFn"
    panelClass="ellipsis-panel"
    (optionSelected)="onOptionSelected($event.option.value)">
    @for (opt of filteredOptions; track opt.code) {
      <mat-option [value]="opt">{{ opt.description ? opt.code + ' - ' + opt.description : opt.code }}</mat-option>
    }
    @if (filteredOptions.length === 0) {
      <mat-option disabled class="no-data-option">No data available</mat-option>
    }
  </mat-autocomplete>

  <span matSuffix class="suffix-icons">
    @if (showBarcodeIcon) {
      <img src="assets/images/icons/Scan.svg" alt="" aria-hidden="true" class="scan-icon" [class.scan-icon--disabled]="disabled" />
    }
    @if (showDropdown) {
      <button type="button" class="dropdown-trigger" [class.dropdown-trigger--disabled]="disabled"
              [disabled]="disabled"
              [attr.aria-label]="'Show ' + label + ' options'"
              [attr.aria-expanded]="autoTrigger?.panelOpen ?? false"
              (click)="togglePanel()">
        <svg viewBox="0 0 24 24" width="24px" height="24px" aria-hidden="true" focusable="false">
          <path d="M7 10l5 5 5-5z" fill="#3D5463"></path>
        </svg>
      </button>
    }
  </span>
</mat-form-field>
