<mat-form-field
  class="search-bar"
  appearance="fill"
  [matTooltip]="showTooltip ? (config.tooltip || config.placeholder) : ''"
  [matTooltipDisabled]="!showTooltip"
  [matTooltipClass]="config.tooltipClass || ''"
  matTooltipPosition="below">
  <img matPrefix src="assets/images/icons/search.svg" alt="" aria-hidden="true" class="search-icon" />
  <input
    #searchInput
    matInput
    type="search"
    [placeholder]="config.placeholder"
    [attr.aria-label]="config.ariaLabel || config.placeholder"
    [value]="searchText"
    (input)="onInputChange($event)"
    (blur)="onBlur()"
    (keydown.enter)="onSearchSubmit(); $event.preventDefault()"
    (keydown)="onKeyDown($event)"
    (search)="$event.preventDefault(); $event.stopPropagation()"
    autocomplete="off"
  />
  <button
    *ngIf="searchText"
    matSuffix
    type="button"
    class="clear-btn"
    aria-label="Clear search"
    (click)="clearSearch()">
    <mat-icon class="clear-icon">close</mat-icon>
  </button>
</mat-form-field>
