<div class="select-chapters-dialog">
  <!-- Header -->
  <div class="dialog-header">
    <h2 class="dialog-title">Select Chapters</h2>
    <button
      mat-icon-button
      type="button"
      class="close-btn"
      (click)="cancel()"
      aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Content -->
  <div class="dialog-content">
    <table class="chapters-table">
      <thead>
        <tr>
          <th class="checkbox-col"></th>
          <th class="chapter-id-col">Chapter ID</th>
          <th class="chapter-name-col">Chapter Name</th>
        </tr>
      </thead>
      <tbody>
        @for (chapter of chapters(); track chapter.chapterId) {
          <tr
            class="chapter-row"
            [class.selected]="chapter.selected"
            (click)="toggleChapter(chapter)">
            <td class="checkbox-col">
              <mat-checkbox
                [(ngModel)]="chapter.selected"
                (click)="$event.stopPropagation()"
                (change)="toggleChapter(chapter)">
              </mat-checkbox>
            </td>
            <td class="chapter-id-col">{{ chapter.chapterId }}</td>
            <td class="chapter-name-col">{{ chapter.chapterName }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <!-- Footer Actions -->
  <div class="dialog-footer">
    <button
      mat-button
      type="button"
      class="clear-all-btn"
      (click)="clearAll()">
      CLEAR ALL
    </button>
    <div class="footer-actions-right">
      <button
        mat-button
        type="button"
        (click)="cancel()">
        CANCEL
      </button>
      <button
        mat-raised-button
        color="primary"
        type="button"
        (click)="saveAndClose()">
        SAVE AND CLOSE
      </button>
    </div>
  </div>
</div>
