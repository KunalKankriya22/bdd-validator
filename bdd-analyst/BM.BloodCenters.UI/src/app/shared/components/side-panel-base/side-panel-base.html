<div
  class="side-panel-wrapper"
  [style.width]="width"
  [style.max-width]="'100vw'"
  tabindex="-1">

  <!-- Header -->
  <div class="side-panel__header">
    <h2 id="side-panel-title" class="side-panel__title">
      {{ title }}
    </h2>
    <button
      mat-icon-button
      class="side-panel__close-btn"
      type="button"
      [attr.aria-label]="closeButtonAriaLabel"
      (click)="onCloseClick()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Slot: Header Fields (optional) -->
  <ng-content select="[panelHeaderFields]"></ng-content>

  <!-- Slot: Tabs (optional) -->
  <ng-content select="[panelTabs]"></ng-content>

  <!-- Body with scrollable content -->
  <div class="side-panel__body">
    <ng-content select="[panelContent]"></ng-content>
  </div>

  <!-- Footer (optional) -->
  @if (showFooter && footerButtons.length) {
    <div class="side-panel__footer">
      @for (btn of footerButtons; track trackByButton($index, btn)) {
        @switch (btn.variant) {
          @case ('primary') {
            <button
              mat-flat-button
              type="button"
              class="side-panel__btn side-panel__btn--primary"
              [disabled]="btn.disabled"
              [attr.aria-label]="btn.ariaLabel || btn.label"
              (click)="onButtonClick(btn.action)">
              @if (btn.icon) {
                <mat-icon>{{ btn.icon }}</mat-icon>
              }
              {{ btn.label }}
            </button>
          }
          @case ('secondary') {
            <button
              mat-stroked-button
              type="button"
              class="side-panel__btn side-panel__btn--secondary"
              [disabled]="btn.disabled"
              [attr.aria-label]="btn.ariaLabel || btn.label"
              (click)="onButtonClick(btn.action)">
              @if (btn.icon) {
                <mat-icon>{{ btn.icon }}</mat-icon>
              }
              {{ btn.label }}
            </button>
          }
          @case ('text') {
            <button
              mat-button
              type="button"
              class="side-panel__btn side-panel__btn--text"
              [disabled]="btn.disabled"
              [attr.aria-label]="btn.ariaLabel || btn.label"
              (click)="onButtonClick(btn.action)">
              @if (btn.icon) {
                <mat-icon>{{ btn.icon }}</mat-icon>
              }
              {{ btn.label }}
            </button>
          }
        }
      }
    </div>
  }
</div>
