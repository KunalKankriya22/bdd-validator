<div class="value-chips-input">
  <!-- Input container -->
  <div class="input-container">
    <mat-form-field appearance="fill" class="value-field">
      <mat-label>{{ label }}<span *ngIf="required" class="required-asterisk">*</span></mat-label>
      <input matInput
             [(ngModel)]="currentValue"
             [placeholder]="getPlaceholder()"
             [maxlength]="maxLength"
             [disabled]="disabled"
             (keyup.enter)="onAdd()"
             (blur)="onBlur()"
             aria-label="Value input">
      @if (errorMessage) {
        <mat-error>{{ errorMessage }}</mat-error>
      }
    </mat-form-field>
    <button mat-raised-button
            type="button"
            class="btn-add"
            [disabled]="!canAdd()"
            (click)="onAdd()">
      {{ addButtonText }}
    </button>
  </div>

  <!-- Chips display -->
  @if (values.length > 0) {
    <div class="chips-container">
      @for (value of values; track $index) {
        <mat-chip class="value-chip" [removable]="!disabled" (removed)="onRemove($index)">
          {{ value }}
          <button matChipRemove [disabled]="disabled" aria-label="Remove value">
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip>
      }
    </div>
  }
</div>
