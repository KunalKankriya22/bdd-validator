<div class="version-info-dialog">
  <div class="dialog-header">
    <h2 class="dialog-title">About Blood Centers</h2>
    <button
      mat-icon-button
      class="close-button"
      (click)="onClose()"
      aria-label="Close dialog">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content>
    @if (isLoading) {
      <div class="loading-container">
        <mat-spinner diameter="40"></mat-spinner>
        <p class="loading-text">Loading version information...</p>
      </div>
    } @else {
      <div class="version-info">
        <span class="version-label">Release version:</span>
        <span class="version-value">{{ releaseVersion }}</span>
      </div>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-raised-button
      color="primary"
      (click)="onClose()"
      cdkFocusInitial
      class="close-btn">
      CLOSE
    </button>
  </mat-dialog-actions>
</div>
