<html>
<head>
<title>Start KnowledgeTrak</title>
<SCRIPT type="text/javascript" >
function goKTWin() {
    var width = screen.width;
    var height = screen.height;

	//Setup my future size & location
    var mywidth = 650;
    var myheight = 550;
    var myleftPos = (width-mywidth)/2;
    var mytopPos = (height-myheight)/2;

    if (width >= 1024){
        popW = 1012;
    }else{
        popW = width;
    }
        
    if (height >= 768){
        popH = 650;
    }else{
        popH = height;
    } 
    
    var leftPos = (width-popW)/2;
	var topPos = (height-popH)/2;
	var attrs    = 'menubar=no,location=no,status=no,toolbar=no,resizable=yes,scrollbars=no,width=' + popW + ',height=' + popH  + ',top=' + topPos + ',left=' + leftPos;
	var thisUrl = document.location.toString();
	//var thisUrl = 'http://172.16.12.171:9001/forms/java/KT.html?http://www.google.com';
	var KT_URL = thisUrl.substring(thisUrl.indexOf("?",0)+1);
    var KTMainWindow = window.open(KT_URL,'_blank',attrs);   
    KTMainWindow.focus();
}
</SCRIPT>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
</head>
<body onload="goKTWin()">
</body>
