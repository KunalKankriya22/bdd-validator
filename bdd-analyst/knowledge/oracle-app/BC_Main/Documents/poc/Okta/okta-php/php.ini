; PHP Configuration for Okta PHP Application

; Enable OCI8 extension
extension=oci8_12c
extension=oci8

; General settings
display_errors = Off
log_errors = On
error_log = logs/php_errors.log
max_execution_time = 30
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 2M
date.timezone = "UTC"

; Security settings
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
session.cookie_httponly = 1
session.use_only_cookies = 1
session.cookie_secure = 1
