#
# LDAP Client Configuration for Stony Brook LDAPS
# Production Configuration
#
# Location:
#   Linux:   /etc/ldap/ldap.conf or /etc/openldap/ldap.conf
#   Windows: C:\OpenLDAP\sysconf\ldap.conf
#   User:    ~/.ldaprc
#

# LDAP Server URI
URI ldaps://ldaps.uhmc.sbuh.stonybrook.edu:636

# Base DN for searches
BASE OU=Users-ServiceAccounts,DC=uhmc,DC=sbuh,DC=stonybrook,DC=edu

# TLS/SSL Certificate Configuration
# Update the path below to point to your extracted CA certificate
TLS_CACERT /path/to/certificates/stonybrook-ldap-ca.pem

# Require certificate validation (PRODUCTION)
TLS_REQCERT demand

# TLS Protocol Version (uncomment if needed)
# TLS_PROTOCOL_MIN 3.3

# Connection timeout (seconds)
NETWORK_TIMEOUT 10

# Follow referrals
REFERRALS off

# SASL options (if needed)
# SASL_SECPROPS noanonymous,minssf=56

# Debug level (remove in production, 0 = no debug)
# -1 = all debug messages
# 0 = no debugging
# 1 = trace
# 2 = packets
# 4 = args
# 8 = conns
# 16 = BER
# 32 = filter
# 64 = config
# 128 = ACL
# 256 = stats
# 512 = stats2
# 1024 = shell
# 2048 = parse
# DEBUG 0
